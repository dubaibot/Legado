  private fun runJsonPath(html: String, rule: String): List<String> {\n        val elements = JsonPath.selectText(html, rule)\n        if (elements.isEmpty()) return emptyList()\n        return JsonPath.toStrings(elements).filter { it.isNotEmpty() }\n    }\n\n    /**\n     * XPath 求值：先翻译成 CSS，再复用选择器取值。\n     *\n     * 不支持的结构（轴 / and / or / 未知函数）会抛明确的规则错误，\n     * 让用户知道是规则写法问题，而不是静默返回空。\n     */\n    private suspend fun runXPath(\n        html: String,\n        rule: String,\n        ctx: RuleContext,\n        needsRealDom: Boolean\n    ): List<String> {\n        val converted = XPathLite.toCss(rule) ?: throw EngineException(\n            EngineErrorCode.SCRIPT_EXCEPTION,\n            \"unsupported xpath: \" + rule\n        )\n        val doc = parseDomOrThrow(html, ctx, needsRealDom)\n        val directive = converted.directive\n        val composed = if (directive == null) converted.css else converted.css + \"@\" + directive\n        return selectCss(doc, composed, ctx.baseUrl)\n    }\n\n    /**\n     * CSS 选择器求值。支持 class./tag./id. 前缀与 @attr、@text、@html 后缀。\n     */\n    private fun selectCss(doc: Document, rawRule: String, baseUrl: String? = null): List<String> {\n        val parts = rawRule.split(\"@\").filter { it.isNotBlank() }\n        if (parts.isEmpty()) return emptyList()\n\n        val lastIsDirective = isExtractDirective(parts.last())\n        val selectorParts = if (lastIsDirective) parts.dropLast(1) else parts\n        val directive = if (lastIsDirective) parts.last().lowercase() else null\n\n        if (selectorParts.isEmpty()) return emptyList()\n\n        var els: Elements = Elements()\n        selectorParts.forEachIndexed { index, raw ->\n            val (sel, pickAt) = splitIndexSuffix(raw)\n            els = if (index == 0) {\n                doc.select(sel)\n            } else {\n                val nested = Elements()\n                els.forEach { el -> nested.addAll(el.select(sel)) }\n                nested\n            }\n            // 尾部 .N 表示只取第 N 个（负数代表倒数），越界则判空，不静默取到错的元素\n            if (pickAt != null) {\n                val idx = if (pickAt < 0) els.size + pickAt else pickAt\n                val picked = els.getOrNull(idx)\n                els = if (picked == null) Elements() else Elements(picked)\n            }\n        }\n\n        return els.map { extract(it, directive, baseUrl) }.filter { it.isNotEmpty() }\n    }\n\n    /**\n     * 判定 `@` 之后那一段是不是取值指令。\n     *\n     * Legado 里 `class.a@href` 是最常见写法，早期实现只认 text/html/attr:，\n     * 于是 \"href\" 被当成第二段 CSS 选择器（找 <href> 标签），永远取不到值。\n     * 这里补齐常见属性名，并支持 @attr: 与 @abs: 两种前缀。\n     */\n    private fun isExtractDirective(part: String): Boolean {\n        val lower = part.lowercase()\n        if (lower in EXPLICIT_DIRECTIVES) return true\n        if (lower.startsWith(\"attr:\") || lower.startsWith(\"abs:\")) return true\n        if (lower in COMMON_ATTRS) return true\n        // data-* / aria-* 是自定义属性，按指令处理\n        if (lower.startsWith(\"data-\") || lower.startsWith(\"aria-\")) return true\n        return false\n    }\n\n    /**\n     * 从元素取值。\n     *\n     * 属性不存在时返回空串（由上层过滤掉），不回落到文本——\n     * 回落会把\"取不到 href\"变成\"取到一段标题文字\"，产生看起来对但实际错的数据。\n     */\n    private fun extract(el: Element, directive: String?, baseUrl: String?): String {\n        if (directive == null) return el.text()\n        return when {\n            directive == \"text\" || directive == \"textnodes\" ->\n                el.text()\n            directive == \"html\" || directive == \"ownhtml\" || directive == \"all\" ->\n                el.html()\n            directive == \"content\" ->\n                if (el.hasAttr(\"content\")) el.attr(\"content\") else el.text()\n            directive.startsWith(\"abs:\") ->\n                absolutize(el.attr(directive.removePrefix(\"abs:\")), baseUrl)\n            directive.startsWith(\"attr:\") ->\n                el.attr(directive.removePrefix(\"attr:\"))\n            else ->\n                el.attr(directive)\n        }\n    }\n\n    /**\n     * 把相对地址补成绝对地址（@abs:href 用）。\n     *\n     * 只做常见形态，不引入 URI 解析开销：\n     *   //host/a   -> 继承 baseUrl 的 scheme\n     *   /a         -> 继承 origin\n     *   a/b        -> 拼在 baseUrl 目录后\n     *   已是绝对地址则原样返回\n     */\n    private fun absolutize(value: String, baseUrl: String?): String {\n        val v = value.trim()\n        if (v.isEmpty()) return \"\"\n        if (v.startsWith(\"http://\") || v.startsWith(\"https://\")) return v\n        val base = baseUrl?.trim().orEmpty()\n        if (base.isEmpty()) return v\n        val schemeEnd = base.indexOf(\"://\")\n        val scheme = if (schemeEnd > 0) base.substring(0, schemeEnd) else \"https\"\n        if (v.startsWith(\"//\")) return scheme + \":\" + v\n        val originEnd = base.indexOf('/', schemeEnd + 3)\n        val origin = if (originEnd > 0) base.substring(0, originEnd) else base\n        if (v.startsWith(\"/\")) return origin + v\n        val dir = if (originEnd > 0) base.substring(0, base.lastIndexOf('/') + 1) else base + \"/\"\n        return dir + v\n    }\n\n    /**\n     * 拆出 `class.item.1` 这类尾部索引。\n     *\n     * 返回 (去索引后的选择器, 索引或 null)。\n     * 只认最后一段是纯整数的情况，避免把 `.col-2` 之类的类名误当索引。\n     */\n    private fun splitIndexSuffix(raw: String): Pair<String, Int?> {\n        val t = raw.trim()\n        val dot = t.lastIndexOf('.')\n        if (dot <= 0 || dot == t.lastIndex) return normalizeSelector(t) to null\n        val tail = t.substring(dot + 1)\n        val num = tail.toIntOrNull() ?: return normalizeSelector(t) to null\n        val head = t.substring(0, dot)\n        // head 为空（如 \".1\"）时无法构成选择器，按索引无选择器处理\n        if (head.isBlank()) return normalizeSelector(t) to null\n        return normalizeSelector(head) to num\n    }\n\n    /** class.xxx -> .xxx；tag.a -> a；id.x -> #x。 */\n    private fun normalizeSelector(raw: String): String {\n        val t = raw.trim()\n        return when {\n            t.startsWith(\"class.\") -> \".\" + t.removePrefix(\"class.\")\n            t.startsWith(\"id.\") -> \"#\" + t.removePrefix(\"id.\")\n            t.startsWith(\"tag.\") -> t.removePrefix(\"tag.\")\n            else -> t\n        }\n    }\n\n    /** 规则尾部 @js: / <js> 拆出。 */\n    private fun splitJsTail(rule: String): Pair<String, String?> {\n        val jsIndex = rule.indexOf(\"@js:\")\n        if (jsIndex >= 0) {\n            return rule.substring(0, jsIndex) to rule.substring(jsIndex + 4)\n        }\n        return rule to null\n    }\n\n    fun isJsRule(rule: String): Boolean {\n        val t = rule.trimStart()\n        if (t.startsWith(\"<js>\")) return true\n        if (t.startsWith(\"@js:\")) return true\n        return false\n    }\n\n    private fun unwrapJs(rule: String): String {\n        val t = rule.trim()\n        return when {\n            t.startsWith(\"<js>\") -> t.removePrefix(\"<js>\").substringBefore(\"</js>\")\n            t.startsWith(\"@js:\") -> t.removePrefix(\"@js:\")\n            else -> t\n        }\n    }\n\n    private suspend fun runJsList(script: String, html: String, ctx: RuleContext): List<String> {\n        val wrapped = buildJsWithContext(script, html, ctx)\n        val raw = js.eval(\n            script = wrapped,\n            mode = JsExecMode.MAIN,\n            tier = PoolTier.NORMAL,\n            traceId = ctx.traceId\n        ) { _, _ -> true }\n        // JS 结果可能是 JSON 数组，也可能是单值\n        val asArray = runCatching {\n            JsonParser.parseString(raw).asJsonArray.map { it.asString }\n        }.getOrNull()\n        return (asArray ?: listOf(raw)).filter { it.isNotEmpty() }\n    }\n\n    private suspend fun runJsString(script: String, input: String, ctx: RuleContext): String {\n        val wrapped = buildJsWithContext(script, input, ctx)\n        return js.eval(wrapped, JsExecMode.MAIN, PoolTier.NORMAL, ctx.traceId) { _, _ -> true }\n    }\n\n    /** 注入 result / baseUrl / variables（Legado 惯例变量名）。 */\n    private fun buildJsWithContext(script: String, result: String, ctx: RuleContext): String {\n        val vars = ctx.variables.entries.joinToString(\",\") { (k, v) ->\n            quoteLiteral(k) + \":\" + quoteLiteral(v)\n        }\n        val sb = StringBuilder()\n        sb.append(\"(function(){\\n\")\n        sb.append(\"  var result = \").append(quoteLiteral(result)).append(\";\\n\")\n        sb.append(\"  var baseUrl = \").append(quoteLiteral(ctx.baseUrl)).append(\";\\n\")\n        sb.append(\"  var sourceId = \").append(quoteLiteral(ctx.sourceId)).append(\";\\n\")\n        sb.append(\"  var variables = {\").append(vars).append(\"};\\n\")\n        sb.append(\"  try {\\n\")\n        sb.append(\"    var out = (function(){ \").append(script).append(\" })();\\n\")\n        sb.append(\"    if (out === undefined || out === null) return '';\\n\")\n        sb.append(\"    return typeof out === 'string' ? out : JSON.stringify(out);\\n\")\n        sb.append(\"  } catch (e) {\\n\")\n        sb.append(\"    return '__JS_ERROR__' + e;\\n\")\n        sb.append(\"  }\\n\")\n        sb.append(\"})()\")\n        return sb.toString()\n    }\n\n    /** JSON 安全字符串字面量。 */\n    private fun quoteLiteral(raw: String): String {\n        val sb = StringBuilder(\"\\\"\")\n        for (ch in raw) {\n            when (ch) {\n                '\\\\' -> sb.append(\"\\\\\\\\\")\n                '\"' -> sb.append(\"\\\\\\\"\")\n                '\\n' -> sb.append(\"\\\\n\")\n                '\\r' -> sb.append(\"\\\\r\")\n                '\\t' -> sb.append(\"\\\\t\")\n                else -> sb.append(ch)\n            }\n        }\n        sb.append(\"\\\"\")\n        return sb.toString()\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rule/RuleSyntax.kt","lang":"kt","lines":206,"content":"package com.lanyue.reader.source.rule\n\n/**\n * 7.1 规则语法层（纯函数，无 Android / 无 IO，可直接单测）。\n *\n * 只做「文本层面」的拆解，不做任何取数据动作：\n * - 顶层分隔符切分（`||` 备选、`&&` 合并）\n * - `##正则##替换` 提取\n * - `@put:{k:v}` / `@get:{k}` 变量指令提取\n * - `{{ 表达式 }}` 模板定位与替换\n *\n * 这样做的好处：解析规则的正确性可以用 JVM 单测覆盖，\n * 不必依赖 WebView / jsoup，避免「语法错了但看起来能跑」。\n */\nobject RuleSyntax {\n\n    private const val REGEX_SEP = \"##\"\n\n    // ---------------- 顶层切分 ----------------\n\n    /**\n     * 按分隔符切分，但忽略 `{}` 内部与引号内部的同名字符。\n     *\n     * 例：`$.a||$.b`          -> [\"$.a\", \"$.b\"]\n     *     `@js:a||b == 1`     -> 不切（引号内）\n     *     `@put:{k:a||b}`     -> 不切（花括号内）\n     */\n    fun splitTopLevel(rule: String, sep: String): List<String> {\n        require(sep.isNotEmpty()) { \"separator must not be empty\" }\n        val out = ArrayList<String>()\n        val sb = StringBuilder()\n        var brace = 0\n        var quote = 0.toChar()\n        var i = 0\n        while (i < rule.length) {\n            val c = rule[i]\n            when {\n                quote != 0.toChar() -> {\n                    sb.append(c)\n                    if (c == quote && (i == 0 || rule[i - 1] != '\\\\')) quote = 0.toChar()\n                    i++\n                }\n                c == '\"' || c == '\\'' || c == '`' -> {\n                    quote = c\n                    sb.append(c)\n                    i++\n                }\n                c == '{' -> {\n                    brace++\n                    sb.append(c)\n                    i++\n                }\n                c == '}' -> {\n                    if (brace > 0) brace--\n                    sb.append(c)\n                    i++\n                }\n                brace == 0 && rule.startsWith(sep, i) -> {\n                    out.add(sb.toString())\n                    sb.setLength(0)\n                    i += sep.length\n                }\n                else -> {\n                    sb.append(c)\n                    i++\n                }\n            }\n        }\n        out.add(sb.toString())\n        return out\n    }\n\n    // ---------------- ## 正则替换 ----------------\n\n    /** 一条已编译的正则替换。 */\n    data class RegexReplacement(val pattern: Regex, val replacement: String)\n\n    /**\n     * 拆出 `##正则##替换`。\n     *\n     * - 返回 first 为去掉替换段后的规则，second 为替换描述（无则 null）\n     * - 正则编译失败时整体按原规则返回，不抛异常（坏规则不能拖垮整条链）\n     */\n    fun parseRegexReplacement(rule: String): Pair<String, RegexReplacement?> {\n        val first = rule.indexOf(REGEX_SEP)\n        if (first < 0) return rule to null\n\n        val patternStart = first + REGEX_SEP.length\n        val second = rule.indexOf(REGEX_SEP, patternStart)\n        if (second < 0) {\n            // 只有 ##正则，没有替换段：视为删除匹配内容\n            val pattern = rule.substring(patternStart)\n            return rule.substring(0, first) to compileOrNull(pattern, \"\")\n        }\n\n        val base = rule.substring(0, first)\n        val pattern = rule.substring(patternStart, second)\n        val replacement = rule.substring(second + REGEX_SEP.length)\n        return base to compileOrNull(pattern, replacement)\n    }\n\n    private fun compileOrNull(pattern: String, replacement: String): RegexReplacement? {\n        if (pattern.isEmpty()) return null\n        return runCatching { RegexReplacement(Regex(pattern), replacement) }.getOrNull()\n    }\n\n    /**\n     * 应用替换。replacement 支持 `$1`、`${name}` 反向引用。\n     * 正则无效（构造时已置空）时调用方不会拿到本对象，故这里可安全执行。\n     */\n    fun applyReplacement(value: String, repl: RegexReplacement): String =\n        runCatching { repl.pattern.replace(value, repl.replacement) }.getOrDefault(value)\n\n    // ---------------- put / get 变量指令 ----------------\n\n    data class VarDirectives(\n        val rule: String,\n        val puts: List<Pair<String, String>>,\n        val gets: List<String>\n    )\n\n    private val PUT_REGEX = Regex(\"\"\"@put:\\{([^}]*)}\"\"\")\n    private val GET_REGEX = Regex(\"\"\"@get:\\{([^}]*)}\"\"\")\n\n    /**\n     * 提取并移除 `@put:{key:rule}`、`@get:{key}`。\n     *\n     * put 的 value 本身可能含 `:`（如 `@css:xxx`），因此只按第一个 `:` 切分。\n     */\n    fun parseVarDirectives(rule: String): VarDirectives {\n        val puts = ArrayList<Pair<String, String>>()\n        PUT_REGEX.findAll(rule).forEach { m ->\n            val body = m.groupValues[1]\n            val idx = body.indexOf(':')\n            if (idx > 0) {\n                val key = body.substring(0, idx).trim()\n                val value = body.substring(idx + 1).trim()\n                if (key.isNotEmpty()) puts.add(key to value)\n            }\n        }\n\n        val gets = ArrayList<String>()\n        GET_REGEX.findAll(rule).forEach { m ->\n            m.groupValues[1].split(',', ';')\n                .map { it.trim() }\n                .filter { it.isNotEmpty() }\n                .forEach { gets.add(it) }\n        }\n\n        val stripped = PUT_REGEX.replace(rule, \"\").let { GET_REGEX.replace(it, \"\") }.trim()\n        return VarDirectives(stripped, puts, gets)\n    }\n\n    // ---------------- {{ }} 模板 ----------------\n\n    private val TEMPLATE_REGEX = Regex(\"\"\"\\{\\{([^}]*)\\}\\}\"\"\")\n\n    /** 列出所有模板表达式内容（去空白），供调用方决定如何求值。 */\n    fun findTemplateExpressions(rule: String): List<String> =\n        TEMPLATE_REGEX.findAll(rule).map { it.groupValues[1].trim() }.toList()\n\n    /**\n     * 替换 `{{ }}`。求值失败时保留原样，避免把规则打穿成空串。\n     */\n    fun resolveTemplate(template: String, resolve: (String) -> String?): String =\n        TEMPLATE_REGEX.replace(template) { m ->\n            val expr = m.groupValues[1].trim()\n            resolve(expr) ?: m.value\n        }\n\n    // ---------------- @ 链索引 ----------------\n\n    /**\n     * Legado 的 `class.item.1@tag.a` 中 `.1` 表示取第 2 个元素。\n     * 独立成函数便于单测覆盖负数 / 越界。\n     */\n    fun isIndexSegment(segment: String): Boolean {\n        val t = segment.trim()\n        if (t.length < 2 || t[0] != '.') return false\n        return t.substring(1).toIntOrNull() != null\n    }\n\n    fun indexOfSegment(segment: String): Int? =\n        if (!isIndexSegment(segment)) null else segment.trim().substring(1).toIntOrNull()\n\n    /** 安全取第 index 个（支持负数代表倒数）。越界返回 null。 */\n    fun pickIndex(values: List<String>, index: Int): String? {\n        if (values.isEmpty()) return null\n        val real = if (index < 0) values.size + index else index\n        return values.getOrNull(real)\n    }\n\n    // ---------------- 规则类型判定 ----------------\n\n    fun isJsRule(rule: String): Boolean {\n        val t = rule.trimStart()\n        return t.startsWith(\"<js>\") || t.startsWith(\"@js:\")\n    }\n\n    fun isJsonPathRule(rule: String): Boolean = rule.trimStart().startsWith(\"$\")\n\n    fun isXPathRule(rule: String): Boolean {\n        val t = rule.trimStart()\n        return t.startsWith(\"//\") || t.startsWith(\"/html\")\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rule/SortUrlParser.kt","lang":"kt","lines":87,"content":"package com.lanyue.reader.source.rule\n\nimport com.lanyue.reader.core.engine.JsExecMode\nimport com.lanyue.reader.core.engine.JsRuntime\nimport com.lanyue.reader.core.engine.PoolTier\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.source.model.SortRule\n\n/**\n * 1.4.4 sortUrl 动态生成。\n *\n * - 静态多行：按「分类名::url」解析，行分隔符支持换行与 &&\n * - 含 @js: / <js></js>：走 JsRuntime 主上下文 IIFE 生成\n * - 失败降级为「无分类」，只显示列表态\n * - 分类数量上限 100，超出截断并埋点\n */\nclass SortUrlParser(\n    private val js: JsRuntime,\n    private val metrics: LocalMetrics\n) {\n\n    companion object {\n        const val MAX_SORTS = 100\n        private const val LINE_SEP = \"\\n\"\n        private const val ALT_SEP = \"&&\"\n    }\n\n    data class Result(\n        val sorts: List<SortRule>,\n        val truncated: Boolean,\n        val degraded: Boolean\n    )\n\n    suspend fun parse(sortUrl: String?, sourceId: String, traceId: String): Result {\n        if (sortUrl.isNullOrBlank()) return Result(emptyList(), truncated = false, degraded = false)\n\n        // 1.4.4 动态生成：@js: 或 <js></js>\n        val isDynamic = sortUrl.contains(\"@js:\") || sortUrl.contains(\"<js>\")\n        if (isDynamic) {\n            val script = if (sortUrl.contains(\"@js:\")) {\n                sortUrl.substringAfter(\"@js:\")\n            } else {\n                sortUrl.substringAfter(\"<js>\").substringBefore(\"</js>\")\n            }\n            val raw = runCatching {\n                js.eval(\n                    script = \"(function(){ \" + script + \" })()\",\n                    mode = JsExecMode.MAIN,\n                    tier = PoolTier.NORMAL,\n                    traceId = traceId\n                ) { _, _ -> true }\n            }.getOrNull()\n\n            if (raw.isNullOrBlank()) {\n                // 1.4.4 失败降级为「无分类」\n                metrics.degradation(traceId, \"sort_url_js_failed\")\n                return Result(emptyList(), truncated = false, degraded = true)\n            }\n            return clamp(parseStatic(raw), traceId)\n        }\n\n        return clamp(parseStatic(sortUrl), traceId)\n    }\n\n    private fun clamp(parsed: List<SortRule>, traceId: String): Result {\n        val truncated = parsed.size > MAX_SORTS\n        if (truncated) {\n            metrics.degradation(traceId, \"sort_url_truncated_at_\" + MAX_SORTS)\n        }\n        return Result(parsed.take(MAX_SORTS), truncated, degraded = false)\n    }\n\n    /** 静态解析：「名::url」，一行一个，也支持 && 串联。 */\n    fun parseStatic(raw: String): List<SortRule> {\n        val lines = raw.split(LINE_SEP, ALT_SEP)\n            .map { it.trim() }\n            .filter { it.isNotEmpty() }\n\n        return lines.mapNotNull { line ->\n            val idx = line.indexOf(\"::\")\n            if (idx <= 0) return@mapNotNull null\n            val name = line.substring(0, idx).trim()\n            val url = line.substring(idx + 2).trim()\n            if (name.isEmpty() || url.isEmpty()) null else SortRule(name, url)\n        }\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rule/UrlTemplate.kt","lang":"kt","lines":32,"content":"package com.lanyue.reader.source.rule\n\n/**\n * 1.4.3 searchUrl 占位符替换。\n *\n * 明确约束：\n * - 支持 {{key}} / {{page}}\n * - 无占位符时默认原样请求，不自动追加 ?q={key}\n *   （Legado AnalyzeUrl 无此行为，自动追加属猜测，见 TODO-DEV-3）\n */\nobject UrlTemplate {\n\n    fun fillKey(template: String, key: String): String {\n        val encoded = java.net.URLEncoder.encode(key, \"UTF-8\")\n        return template.replace(\"{{key}}\", encoded)\n            .replace(\"{{key_raw}}\", key)\n    }\n\n    fun fillPage(template: String, page: Int): String =\n        template.replace(\"{{page}}\", page.toString())\n\n    fun fill(template: String, key: String?, page: Int): String {\n        var out = fillPage(template, page)\n        if (key != null) out = fillKey(out, key)\n        return out\n    }\n\n    /** 是否含占位符。无占位符的 searchUrl 原样请求。 */\n    fun hasKeyPlaceholder(template: String): Boolean = template.contains(\"{{key}}\")\n\n    fun hasPagePlaceholder(template: String): Boolean = template.contains(\"{{page}}\")\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rule/XPathLite.kt","lang":"kt","lines":291,"content":"package com.lanyue.reader.source.rule\n\n/**\n * 7.1 XPath → CSS 转换（纯 Kotlin，无 Android）。\n *\n * Legado 书源大量使用 XPath 风格规则，早期实现把 `//div/a` 直接塞给 jsoup，\n * 必然匹配不到。这里把常见子集翻译成 jsoup 能执行的 CSS：\n *\n *   //div[@class='x']/a/text()      -> div.x > a  + 取文本\n *   //div[@id='y']//span            -> div#y span\n *   //ul/li[2]                      -> ul > li:nth-child(2)\n *   //a[@href]/@href                -> a[href]   + 取属性 href\n *   //div[contains(@class,'box')]   -> div[class*=box]\n *   //p[last()]                     -> p:last-child\n *   /html/body/div[1]              -> html > body > div:nth-child(1)\n *\n * 明确不支持的（返回 null，由调用方降级）：\n *   - 轴（ancestor:: / following-sibling::）\n *   - 函数（text() 之外的 normalize-space 等）\n *   - 复杂布尔表达式（and / or）\n *\n * 取舍理由：宁可在不支持时明确降级，也不要生成一个语义错误的 CSS\n * 把无关节点取回来——后者会造成\"看起来有数据但全是错的\"。\n */\nobject XPathLite {\n\n    /** 转换结果：可执行的 CSS 选择器 + 取值方式。 */\n    data class Converted(val css: String, val directive: String?)\n\n    /**\n     * 判断是否像 XPath。以 `/` 或 `//` 开头，且不是协议相对 URL（`//host/path`）。\n     */\n    fun looksLikeXPath(rule: String): Boolean {\n        val t = rule.trim()\n        if (!t.startsWith(\"/\") && !t.startsWith(\"(//\") && !t.startsWith(\"(./\")) return false\n        // //example.com/a 这种更像 URL 尾巴，不当 XPath\n        if (t.startsWith(\"//\")) {\n            val firstSeg = t.trimStart('/').substringBefore('/')\n            if (firstSeg.contains('.') && !firstSeg.contains('[') && !firstSeg.contains('@')) {\n                return false\n            }\n        }\n        return true\n    }\n\n    /**\n     * 执行转换。无法转换返回 null。\n     *\n     * [xpath] 允许外层带括号，如 `(//div/a)[1]` 会剥离外层括号后处理。\n     */\n    fun toCss(xpath: String): Converted? {\n        var expr = xpath.trim()\n        if (expr.startsWith(\"(\") && expr.endsWith(\")\")) {\n            expr = expr.substring(1, expr.length - 1).trim()\n        }\n        if (!expr.startsWith(\"/\")) return null\n        if (expr.contains(\"::\")) return null\n        // 不支持布尔组合，避免把 a and b 翻成错误的选择器\n        if (Regex(\"\\\\b(and|or)\\\\b\").containsMatchIn(expr)) return null\n\n        var directive: String? = null\n\n        // 尾部 /text() 或 /@attr\n        val textIdx = expr.lastIndexOf(\"/text()\")\n        if (textIdx >= 0 && textIdx == expr.length - \"/text()\".length) {\n            directive = \"text\"\n            expr = expr.substring(0, textIdx)\n        } else {\n            val attrMatch = Regex(\"/@([A-Za-z_:][-A-Za-z0-9_:.]*)$\").find(expr)\n            if (attrMatch != null) {\n                directive = \"attr:\" + attrMatch.groupValues[1].lowercase()\n                expr = expr.substring(0, attrMatch.range.first)\n            }\n        }\n\n        if (!expr.startsWith(\"/\")) return null\n\n        // 切段：'//' 是后代组合，'/' 是直接子元素\n        val tokens = ArrayList<Pair<Boolean, String>>() // (是否后代, 段文本)\n        var i = 0\n        var pendingDescendant = true // 以 '//' 开头时第一段是后代\n        if (expr.startsWith(\"//\")) {\n            i = 2\n            pendingDescendant = true\n        } else {\n            i = 1\n            pendingDescendant = false\n        }\n\n        val sb = StringBuilder()\n        while (i <= expr.length) {\n            val segStart = i\n            var depth = 0\n            var inSingle = false\n            var inDouble = false\n            while (i < expr.length) {\n                val c = expr[i]\n                when {\n                    inSingle -> if (c == '\\'') inSingle = false\n                    inDouble -> if (c == '\"') inDouble = false\n                    c == '\\'' -> inSingle = true\n                    c == '\"' -> inDouble = true\n                    c == '[' -> depth++\n                    c == ']' -> depth--\n                    c == '/' && depth == 0 -> break\n                }\n                i++\n            }\n            val raw = expr.substring(segStart, i).trim()\n            if (raw.isNotEmpty()) tokens.add(pendingDescendant to raw)\n\n            // 看下一个分隔符是 '/' 还是 '//'\n            if (i < expr.length && expr[i] == '/') {\n                if (i + 1 < expr.length && expr[i + 1] == '/') {\n                    pendingDescendant = true\n                    i += 2\n                } else {\n                    pendingDescendant = false\n                    i += 1\n                }\n            } else {\n                break\n            }\n        }\n\n        if (tokens.isEmpty()) return null\n\n        tokens.forEachIndexed { index, (descendant, raw) ->\n            val part = convertSegment(raw) ?: return null\n            if (index == 0) {\n                sb.append(part)\n            } else {\n                sb.append(if (descendant) \" \" else \" > \").append(part)\n            }\n        }\n\n        val css = sb.toString().trim()\n        if (css.isEmpty()) return null\n        return Converted(css, directive)\n    }\n\n    /**\n     * 转换单个路径段，如 `div[@class='x'][2]`。\n     * 返回 css 片段；无法转换返回 null。\n     */\n    private fun convertSegment(raw: String): String? {\n        val t = raw.trim()\n        if (t.isEmpty()) return null\n\n        // 纯通配\n        if (t == \"*\") return \"*\"\n\n        val nameEnd = t.indexOfFirst { it == '[' || it == '*' }\n        var name = if (nameEnd < 0) t else t.substring(0, nameEnd).trim()\n        if (name.isEmpty()) name = \"*\"\n        if (name == \".\" || name == \"..\") return null\n        if (!Regex(\"^[A-Za-z_][-A-Za-z0-9_.:]*$|^\\\\*$\").matches(name)) return null\n\n        val css = StringBuilder(name)\n        var i = if (nameEnd < 0) t.length else nameEnd\n        // 跳过可能紧跟的名字后缀 '*'，如 div*（极少见，直接拒绝更安全）\n        if (nameEnd >= 0 && nameEnd < t.length && t[nameEnd] == '*') return null\n\n        while (i < t.length) {\n            if (t[i] != '[') return null\n            var depth = 0\n            var inSingle = false\n            var inDouble = false\n            val start = i\n            while (i < t.length) {\n                val c = t[i]\n                when {\n                    inSingle -> if (c == '\\'') inSingle = false\n                    inDouble -> if (c == '\"') inDouble = false\n                    c == '\\'' -> inSingle = true\n                    c == '\"' -> inDouble = true\n                    c == '[' -> depth++\n                    c == ']' -> {\n                        depth--\n                        if (depth == 0) {\n                            i++\n                            break\n                        }\n                    }\n                }\n                i++\n            }\n            if (depth != 0) return null\n            val pred = t.substring(start + 1, i - 1).trim()\n            val converted = convertPredicate(pred) ?: return null\n            css.append(converted)\n        }\n\n        return css.toString()\n    }\n\n    /**\n     * 转换谓词，如 `@class='x'`、`2`、`last()`、`contains(@class,'box')`。\n     */\n    private fun convertPredicate(pred: String): String? {\n        if (pred.isEmpty()) return null\n\n        // 位置：[2] -> :nth-child(2)\n        val pos = pred.toIntOrNull()\n        if (pos != null) {\n            if (pos == 0) return null // XPath 位置从 1 开始，0 非法\n            if (pos < 0) return \":nth-last-child(${-pos})\"\n            return \":nth-child($pos)\"\n        }\n        if (pred == \"last()\") return \":last-child\"\n\n        // contains(@attr,'v') -> [attr*=v]\n        val containsCall = Regex(\"^contains\\\\s*\\\\(\").find(pred)\n        if (containsCall != null) {\n            val inner = pred.substring(containsCall.range.last + 1).trimEnd(')').trim()\n            val comma = findTopLevelComma(inner) ?: return null\n            val attrPart = inner.substring(0, comma).trim()\n            val valuePart = inner.substring(comma + 1).trim()\n            val attr = attrPart.removePrefix(\"@\").trim().lowercase()\n            if (!isValidAttr(attr)) return null\n            val value = unquoteValue(valuePart) ?: return null\n            return \"[$attr*=\" + quoteCss(value) + \"]\"\n        }\n\n        // 存在性：[@href] -> [href]\n        val exists = Regex(\"^@([-A-Za-z0-9_:]+)$\").find(pred)\n        if (exists != null) return \"[\" + exists.groupValues[1].lowercase() + \"]\"\n\n        // 相等 / 不等：手工解析，允许值里出现另一种引号（如 'a\"b'）\n        val opIndex = findCompareOp(pred) ?: return null\n        val op = opIndex.second\n        val attr = pred.substring(0, opIndex.first).trim().removePrefix(\"@\").trim().lowercase()\n        if (!isValidAttr(attr)) return null\n        val value = unquoteValue(pred.substring(opIndex.first + op.length).trim()) ?: return null\n        return when (op) {\n            \"=\" -> \"[\" + attr + \"=\" + quoteCss(value) + \"]\"\n            \"!=\" -> \":not([\" + attr + \"=\" + quoteCss(value) + \"])\"\n            else -> null\n        }\n    }\n\n    /** 校验属性名合法，避免把奇怪字符拼进选择器。 */\n    private fun isValidAttr(attr: String): Boolean =\n        attr.isNotEmpty() && Regex(\"^[a-z_][-a-z0-9_:.]*$\").matches(attr)\n\n    /** 找到谓词里的比较运算符（先长后短），返回 (下标, 运算符)。 */\n    private fun findCompareOp(pred: String): Pair<Int, String>? {\n        for (op in listOf(\"!=\", \"=\")) {\n            val at = pred.indexOf(op)\n            if (at > 0) return at to op\n        }\n        return null\n    }\n\n    /** 去掉值的引号；单引号包裹时内部允许双引号，反之亦然。 */\n    private fun unquoteValue(raw: String): String? {\n        if (raw.length < 2) return null\n        val first = raw.first()\n        val last = raw.last()\n        if ((first == '\\'' && last == '\\'') || (first == '\"' && last == '\"')) {\n            val body = raw.substring(1, raw.length - 1)\n            // 内部不能出现同种引号（出现说明表达式畸形）\n            if (body.contains(first)) return null\n            return body\n        }\n        return null\n    }\n\n    /** 找参数里的顶层逗号（不位于引号内）。 */\n    private fun findTopLevelComma(s: String): Int? {\n        var inSingle = false\n        var inDouble = false\n        for (i in s.indices) {\n            val c = s[i]\n            when {\n                inSingle -> if (c == '\\'') inSingle = false\n                inDouble -> if (c == '\"') inDouble = false\n                c == '\\'' -> inSingle = true\n                c == '\"' -> inDouble = true\n                c == ',' -> return i\n            }\n        }\n        return null\n    }\n\n    /** CSS 属性值引号：统一双引号并转义内部双引号与反斜杠。 */\n    private fun quoteCss(value: String): String {\n        val escaped = value.replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\", \"\\\\\\\"\")\n        return \"\\\"\" + escaped + \"\\\"\"\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/video/CmsVideoSource.kt","lang":"kt","lines":191,"content":"package com.lanyue.reader.source.video\n\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\nimport com.lanyue.reader.source.model.CapabilityResolver\nimport com.lanyue.reader.source.model.Category\nimport com.lanyue.reader.source.model.Filter\nimport com.lanyue.reader.source.model.IVideoSource\nimport com.lanyue.reader.source.model.PlayKind\nimport com.lanyue.reader.source.model.PlayResult\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.lanyue.reader.source.model.VideoDetail\nimport com.lanyue.reader.source.model.VideoEpisode\nimport com.lanyue.reader.source.model.VideoItem\nimport com.lanyue.reader.source.model.VideoPlayLine\nimport java.net.URLEncoder\n\n/**\n * 7.3 CMS 影视源（type 0 XML / 1 JSON / 2 JSON 扩展 / 4 JSON 扩展1）。\n *\n * CMS 协议要点：\n * - 分类：api?ac=list\n * - 详情：api?ac=videolist&ids=\n * - 搜索：api?wd=key&pg=n\n * - 筛选：ext.filter\n *\n * 播放解析链：选集 url -> flags 匹配 -> 直链 / parses 分发（见 LocalParseProxy）\n */\nclass CmsVideoSource(\n    private val entity: VideoSiteEntity,\n    private val net: NetworkDispatcher,\n    private val metrics: LocalMetrics,\n    private val parses: List<TvBoxParser.ParseRule>,\n    private val flags: List<String>\n) : IVideoSource {\n\n    override val sourceId: String = entity.configUrl + \"#\" + entity.siteKey\n\n    override val sourceType: SourceType = SourceType.VIDEO\n\n    override val capabilityFlags: Set<SourceCapability> = CapabilityResolver.ofVideoSite(entity)\n\n    override val concurrentRate: RateLimit? = null\n\n    private val apiBase: String get() = entity.api ?: \"\"\n\n    override suspend fun getCategories(): List<Category> {\n        val url = apiBase + \"?ac=list\"\n        val json = fetchJson(url, \"categories\")\n        val classes = json.getAsJsonObject(\"class\")\n            ?.let { runCatching { it.asJsonArray }.getOrNull() }\n            ?: return emptyList()\n\n        return classes.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val id = obj.str(\"type_id\") ?: return@mapNotNull null\n            Category(name = obj.str(\"type_name\") ?: id, id = id)\n        }\n    }\n\n    override suspend fun explore(category: Category, filter: Filter?, page: Int): List<VideoItem> {\n        val sb = StringBuilder(apiBase)\n        sb.append(\"?ac=detail&t=\").append(category.id).append(\"&pg=\").append(page)\n        // 7.3 筛选：ext.filter\n        if (filter != null) {\n            sb.append(\"&f=\").append(URLEncoder.encode(filter.key + \"=\" + filter.value(), \"UTF-8\"))\n        }\n        val json = fetchJson(sb.toString(), \"explore\")\n        return parseVideoList(json)\n    }\n\n    override suspend fun search(key: String, page: Int): List<VideoItem> {\n        val url = apiBase + \"?wd=\" + URLEncoder.encode(key, \"UTF-8\") + \"&pg=\" + page\n        val json = fetchJson(url, \"search\")\n        return parseVideoList(json)\n    }\n\n    override suspend fun getDetail(url: String): VideoDetail {\n        // url 形如 api?ac=detail&ids=xxx\n        val json = fetchJson(url, \"detail\")\n        val list = json.getAsJsonArray(\"list\") ?: return VideoDetail(name = \"\")\n        val obj = runCatching { list.first().asJsonObject }.getOrNull() ?: return VideoDetail(name = \"\")\n\n        return VideoDetail(\n            name = obj.str(\"vod_name\") ?: \"\",\n            cover = obj.str(\"vod_pic\"),\n            intro = obj.str(\"vod_content\")?.let { stripHtml(it) },\n            actor = obj.str(\"vod_actor\"),\n            director = obj.str(\"vod_director\"),\n            year = obj.str(\"vod_year\"),\n            area = obj.str(\"vod_area\"),\n            remark = obj.str(\"vod_remarks\"),\n            lines = parsePlayLines(obj)\n        )\n    }\n\n    override suspend fun getPlay(episode: VideoEpisode): PlayResult {\n        val url = episode.url\n\n        // 7.3 播放解析链第一跳：直链（m3u8/mp4 等）直接播放\n        if (isDirectMedia(url)) {\n            return PlayResult(PlayKind.DIRECT, url)\n        }\n\n        // 命中 flags -> parses 选取\n        val matchedFlag = flags.firstOrNull { url.contains(it, ignoreCase = true) }\n        val parseRule = pickParseRule()\n        return when {\n            parseRule == null -> PlayResult(PlayKind.SNIFF, url)\n            parseRule.type == 3 -> PlayResult(PlayKind.SNIFF, url, flag = matchedFlag)\n            else -> PlayResult(PlayKind.PARSE, url, flag = matchedFlag)\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    private suspend fun fetchJson(url: String, op: String): JsonObject {\n        val traceId = sourceId + \":\" + op\n        val resp = net.execute(\n            HttpRequest(url = url, method = \"GET\", sourceId = sourceId, timeoutMs = entity.timeout.takeIf { it > 0 } ?: 20_000L),\n            limit = concurrentRate,\n            traceId = traceId\n        )\n        if (!resp.isSuccess) {\n            metrics.failure(traceId, \"cms\", \"HTTP_\" + resp.code)\n            throw NetworkException(\"cms http \" + resp.code, resp.code)\n        }\n        return runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: throw NetworkException(\"cms response is not json\")\n    }\n\n    private fun parseVideoList(json: JsonObject): List<VideoItem> {\n        val list = json.getAsJsonArray(\"list\") ?: return emptyList()\n        return list.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val id = obj.str(\"vod_id\") ?: return@mapNotNull null\n            VideoItem(\n                name = obj.str(\"vod_name\") ?: \"\",\n                url = apiBase + \"?ac=detail&ids=\" + id,\n                cover = obj.str(\"vod_pic\"),\n                remark = obj.str(\"vod_remarks\"),\n                siteKey = entity.siteKey,\n                configUrl = entity.configUrl\n            )\n        }\n    }\n\n    /** vod_play_from 与 vod_play_url 按 ### 分隔，多条线路按 $$$ 分隔。 */\n    private fun parsePlayLines(obj: JsonObject): List<VideoPlayLine> {\n        val fromRaw = obj.str(\"vod_play_from\") ?: return emptyList()\n        val urlRaw = obj.str(\"vod_play_url\") ?: return emptyList()\n\n        val names = fromRaw.split(\"$$$\")\n        val groups = urlRaw.split(\"$$$\")\n\n        return names.mapIndexedNotNull { index, lineName ->\n            val group = groups.getOrNull(index) ?: return@mapIndexedNotNull null\n            val episodes = group.split(\"#\").mapNotNull { seg ->\n                val parts = seg.split(\"$\")\n                if (parts.size < 2) null\n                else VideoEpisode(name = parts[0].trim(), url = parts[1].trim())\n            }\n            if (episodes.isEmpty()) null else VideoPlayLine(lineName.trim(), episodes)\n        }\n    }\n\n    private fun pickParseRule(): TvBoxParser.ParseRule? =\n        parses.firstOrNull { it.type in 0..3 }\n\n    private fun isDirectMedia(url: String): Boolean {\n        val lower = url.lowercase()\n        return lower.contains(\".m3u8\") || lower.contains(\".mp4\") ||\n            lower.contains(\".flv\") || lower.contains(\".mpd\") || lower.contains(\".ts\")\n    }\n\n    private fun stripHtml(raw: String): String =\n        raw.replace(Regex(\"<[^>]*>\"), \"\").trim()\n\n    private fun Filter.value(): String =\n        values.firstOrNull()?.value ?: \"\"\n\n    private fun JsonObject.str(key: String): String? =\n        get(key)?.takeIf { !it.isJsonNull }?.asString\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/video/LocalParseProxy.kt","lang":"kt","lines":332,"content":"package com.lanyue.reader.source.video\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.net.HttpRequest\nimport kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport kotlinx.coroutines.channels.Channel\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withTimeoutOrNull\nimport java.io.BufferedInputStream\nimport java.net.InetAddress\nimport java.net.ServerSocket\nimport java.net.Socket\nimport java.net.URLDecoder\nimport java.net.URLEncoder\nimport java.security.SecureRandom\n\n/**\n * 7.3 LocalParseProxy —— 本地 HTTP 解析代理。\n *\n * 硬约束（文档明确）：\n * - 独立模块，本地 HTTP 服务\n * - 启动时随机分配空闲端口；生命周期与应用进程一致；崩溃自恢复重启\n * - Media3 拿到的播放 URL 形如 http://127.0.0.1:{port}/{token}/...\n * - Token 每次播放会话随机生成；会话内 retry/seek 保持有效；播放结束失效\n * - 上游请求统一走 NetworkDispatcher（继承通道、限速、Cookie、SSRF 校验）\n * - 仅绑定 127.0.0.1；token 校验请求来源为应用自身；不接受外部请求\n *\n * 实现要点：\n * - 连接处理走协程而不是「每连接一线程」，在低端机上不会因并发连接打爆线程。\n * - 会话有 TTL 与总量上限，避免播放器异常退出后 token 无限堆积。\n * - 上游解析带超时，且同一 URL 的并发请求会合并，防止播放器频繁 seek 打爆解析接口。\n */\nclass LocalParseProxy(\n    private val net: NetworkDispatcher,\n    private val parses: List<TvBoxParser.ParseRule>,\n    private val sessionTtlMs: Long = DEFAULT_SESSION_TTL_MS,\n    private val maxSessions: Int = DEFAULT_MAX_SESSIONS,\n    private val now: () -> Long = System::currentTimeMillis\n) {\n\n    private var serverSocket: ServerSocket? = null\n    @Volatile private var running = false\n    @Volatile var port: Int = 0\n        private set\n\n    /** 协程作用域：IO 调度执行阻塞读写，Supervisor 保证单连接异常不影响服务。 */\n    private var scope: CoroutineScope? = null\n\n    /** 会话表：token -> 会话。容量有界，超限按最久未用淘汰。 */\n    private val sessions = object : LinkedHashMap<String, Session>(16, 0.75f, true) {\n        override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, Session>?): Boolean =\n            size > maxSessions\n    }\n\n    private class Session(val episodeUrl: String, val createdAt: Long) {\n        @Volatile var lastAccessAt: Long = createdAt\n    }\n\n    /** 同一上游 URL 的在途解析（请求合并，避免 seek 风暴）。 */\n    private val inflight = java.util.concurrent.ConcurrentHashMap<String, kotlinx.coroutines.Deferred<String?>>()\n\n    /** 启动服务；端口随机分配空闲端口。重复调用幂等。 */\n    @Synchronized\n    fun start() {\n        if (running) return\n        val socket = ServerSocket(0, BACKLOG, InetAddress.getByName(LOOPBACK))\n        serverSocket = socket\n        port = socket.localPort\n        running = true\n        val s = CoroutineScope(SupervisorJob() + Dispatchers.IO)\n        scope = s\n        s.launch { acceptLoop(socket, s) }\n    }\n\n    /** 崩溃自恢复重启：先关旧 socket 与协程再重开。 */\n    @Synchronized\n    fun restart() {\n        stop()\n        start()\n    }\n\n    @Synchronized\n    fun stop() {\n        running = false\n        runCatching { serverSocket?.close() }\n        serverSocket = null\n        runCatching { scope?.cancel() }\n        scope = null\n        synchronized(sessions) { sessions.clear() }\n        inflight.clear()\n    }\n\n    /**\n     * 为一次播放会话签发播放地址。\n     * 返回 http://127.0.0.1:{port}/{token}/{encodedUrl}\n     */\n    fun createPlayUrl(episodeUrl: String): String {\n        if (!running) start()\n        evictExpired()\n        val token = randomToken()\n        synchronized(sessions) { sessions[token] = Session(episodeUrl, now()) }\n        val encoded = URLEncoder.encode(episodeUrl, \"UTF-8\")\n        return \"http://$LOOPBACK:$port/$token/$encoded\"\n    }\n\n    /** 播放结束 token 失效。 */\n    fun releasePlayUrl(token: String) {\n        synchronized(sessions) { sessions.remove(token) }\n    }\n\n    /** 当前有效会话数（诊断用）。 */\n    fun sessionCount(): Int = synchronized(sessions) { sessions.size }\n\n    private fun evictExpired() {\n        val deadline = now() - sessionTtlMs\n        synchronized(sessions) {\n            sessions.entries.removeIf { it.value.lastAccessAt < deadline }\n        }\n    }\n\n    private fun randomToken(): String {\n        val bytes = ByteArray(16)\n        SecureRandom().nextBytes(bytes)\n        return bytes.joinToString(\"\") { \"%02x\".format(it) }\n    }\n\n    private suspend fun acceptLoop(socket: ServerSocket, s: CoroutineScope) {\n        // 连接数上限：超出时快速拒绝，而不是无限堆积协程\n        val permits = Channel<Unit>(MAX_CONNECTIONS)\n        repeat(MAX_CONNECTIONS) { permits.trySend(Unit) }\n\n        while (running) {\n            val client = runCatching { socket.accept() }.getOrNull() ?: break\n            permits.tryReceive()\n            s.launch {\n                try {\n                    handle(client)\n                } catch (_: Throwable) {\n                    runCatching { writeSimple(client, 500, \"Internal Error\") }\n                } finally {\n                    runCatching { client.close() }\n                    permits.trySend(Unit)\n                }\n            }\n        }\n    }\n\n    private suspend fun handle(client: Socket) {\n        client.use { conn ->\n            runCatching { conn.soTimeout = SOCKET_TIMEOUT_MS }\n\n            // 7.3 安全：只接受来自本机的连接，外部 IP 一律拒绝（不依赖绑定地址这一层）\n            val remote = runCatching { conn.inetAddress }.getOrNull()\n            if (remote == null || !remote.isLoopbackAddress) {\n                writeSimple(conn, 403, \"Forbidden\")\n                return\n            }\n\n            val input = BufferedInputStream(conn.inputStream)\n            val requestLine = readLine(input) ?: return\n            // 追加读掉请求头，直到空行；否则客户端会因未读完而 RST\n            drainHeaders(input)\n\n            val parts = requestLine.split(\" \")\n            if (parts.size < 2 || parts[0] != \"GET\") {\n                writeSimple(conn, 405, \"Method Not Allowed\")\n                return\n            }\n\n            val path = parts[1].substringBefore('?')\n            val segments = path.trimStart('/').split(\"/\", limit = 2)\n            val token = segments.getOrNull(0).orEmpty()\n            val encoded = segments.getOrNull(1).orEmpty()\n\n            // 7.3 安全：token 校验请求来源为应用自身；未知 token 直接拒绝\n            val session = synchronized(sessions) {\n                sessions[token]?.also { it.lastAccessAt = now() }\n            }\n            if (session == null || isExpired(session)) {\n                writeSimple(conn, 403, \"Forbidden\")\n                return\n            }\n\n            val upstreamUrl = session.episodeUrl.ifBlank {\n                runCatching { URLDecoder.decode(encoded, \"UTF-8\") }.getOrDefault(\"\")\n            }\n            if (upstreamUrl.isBlank()) {\n                writeSimple(conn, 400, \"Bad Request\")\n                return\n            }\n\n            // 7.3 上游统一走 NetworkDispatcher，并带超时\n            val resolved = resolveShared(upstreamUrl)\n            if (resolved.isNullOrBlank()) {\n                writeSimple(conn, 502, \"Parse Failed\")\n                return\n            }\n            writeRedirect(conn, resolved)\n        }\n    }\n\n    private fun isExpired(session: Session): Boolean = now() - session.lastAccessAt > sessionTtlMs\n\n    /**\n     * 合并同一 URL 的在途解析。\n     *\n     * 播放器 seek/重试会在极短时间内重复请求同一集，如果每次都打上游解析接口\n     * 很快会被限流甚至封禁，因此共享同一个 Deferred。\n     */\n    private suspend fun resolveShared(episodeUrl: String): String? {\n        val existing = inflight[episodeUrl]\n        if (existing != null) return runCatching { existing.await() }.getOrNull()\n\n        val s = scope\n        val deferred = if (s != null) {\n            kotlinx.coroutines.CompletableDeferred<String?>()\n        } else {\n            kotlinx.coroutines.CompletableDeferred<String?>()\n        }\n        val prior = inflight.putIfAbsent(episodeUrl, deferred)\n        if (prior != null) return runCatching { prior.await() }.getOrNull()\n\n        val result = runCatching {\n            withTimeoutOrNull(RESOLVE_TIMEOUT_MS) { resolveUpstream(episodeUrl) }\n        }.getOrNull()\n        deferred.complete(result)\n        inflight.remove(episodeUrl, deferred)\n        return result\n    }\n\n    /** 按 parses 配置依次尝试上游解析接口，取第一个可用结果。 */\n    private suspend fun resolveUpstream(episodeUrl: String): String? {\n        for (rule in parses.sortedBy { it.type }) {\n            val candidate = when (rule.type) {\n                0, 1, 2 -> queryJsonParse(rule, episodeUrl)\n                else -> null // type 3 走 Sniffer 池，不在本地代理内\n            }\n            if (!candidate.isNullOrBlank()) return candidate\n        }\n        return null\n    }\n\n    private suspend fun queryJsonParse(rule: TvBoxParser.ParseRule, episodeUrl: String): String? {\n        val url = rule.url + URLEncoder.encode(episodeUrl, \"UTF-8\")\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(url = url, method = \"GET\", sourceId = \"local-parse-proxy\"),\n                traceId = \"local-parse-\" + rule.name\n            )\n        }.getOrNull() ?: return null\n        if (!resp.isSuccess) return null\n        val body = resp.body ?: return null\n        return runCatching {\n            val obj = com.google.gson.JsonParser.parseString(body).asJsonObject\n            obj.get(\"url\")?.takeIf { !it.isJsonNull }?.asString\n        }.getOrNull()\n    }\n\n    /** 读一行（CRLF 或 LF 结尾），超长则截断，避免被恶意长行拖死。 */\n    private fun readLine(input: BufferedInputStream): String? {\n        val sb = StringBuilder()\n        var prev = -1\n        while (true) {\n            val b = input.read()\n            if (b == -1) return if (sb.isEmpty()) null else sb.toString()\n            if (b == '\\n'.code) {\n                if (prev == '\\r'.code) sb.setLength(sb.length - 1)\n                return sb.toString()\n            }\n            sb.append(b.toChar())\n            prev = b\n            if (sb.length > MAX_LINE) return sb.toString()\n        }\n    }\n\n    private fun drainHeaders(input: BufferedInputStream) {\n        var guard = 0\n        while (guard++ < MAX_HEADERS) {\n            val line = readLine(input) ?: return\n            if (line.isEmpty()) return\n        }\n    }\n\n    private fun writeSimple(socket: Socket, code: Int, text: String) {\n        val body = text.toByteArray()\n        val header = \"HTTP/1.1 \" + code + \" \" + text + CRLF +\n            \"Content-Length: \" + body.size + CRLF +\n            \"Content-Type: text/plain; charset=utf-8\" + CRLF +\n            \"Connection: close\" + CRLF + CRLF\n        runCatching {\n            val out = socket.getOutputStream()\n            out.write(header.toByteArray())\n            out.write(body)\n            out.flush()\n        }\n    }\n\n    /**\n     * 标准响应：302 重定向到上游直链，Media3 会自行跟随。\n     *\n     * 上游地址必须过滤 CR/LF，否则可被上游构造出响应头注入。\n     */\n    private fun writeRedirect(socket: Socket, upstream: String) {\n        val safe = upstream.replace(\"\\r\", \"\").replace(\"\\n\", \"\")\n        val header = \"HTTP/1.1 302 Found\" + CRLF +\n            \"Location: \" + safe + CRLF +\n            \"Content-Length: 0\" + CRLF +\n            \"Cache-Control: no-store\" + CRLF +\n            \"Connection: close\" + CRLF + CRLF\n        runCatching {\n            val out = socket.getOutputStream()\n            out.write(header.toByteArray())\n            out.flush()\n        }\n    }\n\n    private companion object {\n        const val LOOPBACK = \"127.0.0.1\"\n        const val CRLF = \"\\r\\n\"\n        const val BACKLOG = 16\n        const val MAX_CONNECTIONS = 8\n        const val SOCKET_TIMEOUT_MS = 15_000\n        const val RESOLVE_TIMEOUT_MS = 12_000L\n        const val MAX_LINE = 8192\n        const val MAX_HEADERS = 64\n        const val DEFAULT_SESSION_TTL_MS = 6L * 60 * 60 * 1000\n        const val DEFAULT_MAX_SESSIONS = 16\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/video/TvBoxParser.kt","lang":"kt","lines":144,"content":"package com.lanyue.reader.source.video\n\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\nimport com.lanyue.reader.data.db.entity.LiveSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoApiEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\n\n/**\n * 7.3 TVBox 配置解析。\n *\n * 关键约束：\n * - 一条配置展开为多站点源\n * - 重新导入按同一接口配置内 site.key 去重合并\n * - hotSearch 字段一期有意裁剪：不解析、不存储（符合零分发红线，属主动裁剪）\n * - type 3 且 api 非 .js（即 spider jar）标记「暂不支持」，不崩溃\n * - lives 解析后持久化，一期不暴露 UI\n */\nclass TvBoxParser {\n\n    data class ParsedConfig(\n        val api: VideoApiEntity,\n        val sites: List<VideoSiteEntity>,\n        val lives: List<LiveSourceEntity>,\n        val dropsJarSites: Int,\n        /** 7.3 / ADR-014：parses 链，供播放解析使用。 */\n        val parses: List<ParseRule>,\n        val flags: List<String>\n    )\n\n    /** 7.3 parses 项。type 0/1 JSON 解析，type 2 聚合，type 3 网页嗅探。 */\n    data class ParseRule(\n        val name: String,\n        val type: Int,\n        val url: String,\n        val ext: String? = null\n    )\n\n    sealed class Result {\n        data class Ok(val config: ParsedConfig) : Result()\n        data class Invalid(val reason: String) : Result()\n    }\n\n    fun parse(configUrl: String, json: String): Result {\n        val root = runCatching { JsonParser.parseString(json).asJsonObject }.getOrNull()\n            ?: return Result.Invalid(\"config is not a JSON object\")\n\n        // 7.3 sites 必须存在，否则这条配置无意义\n        val sitesArray = root.getAsJsonArray(\"sites\") ?: return Result.Invalid(\"missing sites\")\n\n        val spider = root.get(\"spider\")?.takeIf { !it.isJsonNull }?.asString\n        val api = VideoApiEntity(\n            url = configUrl,\n            name = root.get(\"name\")?.takeIf { !it.isJsonNull }?.asString,\n            spider = spider,\n            lastUpdate = System.currentTimeMillis(),\n            rawJson = json\n        )\n\n        var jarDrops = 0\n        val sites = sitesArray.mapNotNull { element ->\n            val obj = runCatching { element.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val key = obj.str(\"key\") ?: return@mapNotNull null\n            val siteApi = obj.str(\"api\")\n            val type = obj.int(\"type\", 1)\n\n            // 7.3 type 3：api 以 .js 结尾是 drpy（一期支持）；否则是 spider jar（二期）\n            val isDrpy = type == 3 && siteApi?.endsWith(\".js\") == true\n            val unsupported = type == 3 && !isDrpy\n\n            if (unsupported) jarDrops += 1\n\n            VideoSiteEntity(\n                configUrl = configUrl,\n                siteKey = key,\n                name = obj.str(\"name\") ?: key,\n                type = type,\n                api = siteApi,\n                searchable = obj.bool(\"searchable\", true),\n                quickSearch = obj.bool(\"quickSearch\", true),\n                filterable = obj.bool(\"filterable\", false),\n                ext = obj.get(\"ext\")?.takeIf { !it.isJsonNull }?.toString(),\n                jar = obj.str(\"jar\"),\n                timeout = obj.long(\"timeout\", 0L),\n                enabled = !unsupported,\n                unsupported = unsupported\n            )\n        }\n\n        // 7.3 parses 解析链\n        val parses = root.getAsJsonArray(\"parses\")?.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val url = obj.str(\"url\") ?: return@mapNotNull null\n            ParseRule(\n                name = obj.str(\"name\") ?: \"\",\n                type = obj.int(\"type\", 0),\n                url = url,\n                ext = obj.get(\"ext\")?.takeIf { !it.isJsonNull }?.toString()\n            )\n        }.orEmpty()\n\n        val flags = root.getAsJsonArray(\"flags\")?.mapNotNull { it.asString }.orEmpty()\n\n        // 4.12 live_sources：一期解析并持久化，UI 不暴露\n        val lives = root.getAsJsonArray(\"lives\")?.mapIndexedNotNull { index, el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapIndexedNotNull null\n            val url = obj.str(\"url\") ?: return@mapIndexedNotNull null\n            LiveSourceEntity(\n                id = configUrl + \"#live#\" + index,\n                apiUrl = configUrl,\n                name = obj.str(\"name\") ?: \"\",\n                type = obj.str(\"type\") ?: \"txt\",\n                url = url,\n                epg = obj.str(\"epg\"),\n                logo = obj.str(\"logo\")\n            )\n        }.orEmpty()\n\n        // hotSearch 有意裁剪：此处不读取、不写入（见 6.3 / ADR-014）\n\n        return Result.Ok(\n            ParsedConfig(\n                api = api,\n                sites = sites,\n                lives = lives,\n                dropsJarSites = jarDrops,\n                parses = parses,\n                flags = flags\n            )\n        )\n    }\n\n    private fun JsonObject.str(key: String): String? =\n        get(key)?.takeIf { !it.isJsonNull }?.asString\n\n    private fun JsonObject.int(key: String, default: Int): Int =\n        runCatching { get(key)?.asInt ?: default }.getOrDefault(default)\n\n    private fun JsonObject.long(key: String, default: Long): Long =\n        runCatching { get(key)?.asLong ?: default }.getOrDefault(default)\n\n    private fun JsonObject.bool(key: String, default: Boolean): Boolean =\n        runCatching { get(key)?.asBoolean ?: default }.getOrDefault(default)\n}\n"},{"path":"app/src/main/res/values/strings.xml","lang":"xml","lines":36,"content":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">览阅</string>\n\n    <!-- 6.2.5 首次导入免责声明（原文，CI 校验存在性） -->\n    <string name=\"disclaimer_import\">本产品不提供任何源，源由用户自行导入，内容合规性由使用者自行负责</string>\n\n    <!-- 首启引导：只讲「如何导入」，不出现任何源或接口指引 -->\n    <string name=\"onboarding_title\">开始使用</string>\n    <string name=\"onboarding_step_1\">1. 在任一源 Tab 点击「导入」</string>\n    <string name=\"onboarding_step_2\">2. 选择本地文件、剪贴板或 URL Scheme 粘贴源</string>\n    <string name=\"onboarding_step_3\">3. 导入后在发现页浏览内容</string>\n    <string name=\"onboarding_note\">本应用不含任何内置源与内容入口。</string>\n\n    <!-- 4.3 内核错误码用户提示 -->\n    <string name=\"err_parse_failed_generic\">网页解析失败，可能是不支持的网页类型，请检查网页或稍后重试</string>\n    <string name=\"err_timeout\">加载超时，请检查网络后重试</string>\n    <string name=\"err_busy\">系统繁忙，请稍后重试</string>\n    <string name=\"err_render_gone\">页面已崩溃，已自动恢复</string>\n    <string name=\"err_shutdown\">应用正在关闭，请稍后重试</string>\n    <string name=\"err_sandbox_timeout\">页面解析超时，请重试</string>\n\n    <!-- 产品级错误码 -->\n    <string name=\"err_content_empty\">内容为空，源可能已失效，可尝试换源</string>\n    <string name=\"err_parse_failed\">影片解析失败，请切换线路或稍后重试</string>\n    <string name=\"err_decode\">视频解码失败，请尝试切换解码器</string>\n    <string name=\"err_danmaku_not_matched\">未匹配到弹幕，点击手动选择</string>\n    <string name=\"err_login_required\">该源需要登录后使用</string>\n    <string name=\"err_source_invalid\">源格式不合法，导入失败</string>\n\n    <!-- 合规门禁：免责声明与版权声明（tools/check_disclaimer.py 校验） -->\n    <string name=\"disclaimer_title\">免责声明</string>\n    <string name=\"disclaimer_body\">本应用不提供、不存储、不分发任何内容，所有内容均来自用户自行导入的第三方源；内容的合法性与准确性由第三方源及使用者自行负责，使用风险由用户自行承担。</string>\n    <string name=\"disclaimer_copyright\">本应用的解析结果均来自第三方源，版权归原作者及原站点所有；本应用不存储任何内容副本，仅供个人学习与阅读使用。如权利人认为内容侵权，可通过下方通道反馈，我们将在核实后提供源屏蔽指引。</string>\n    <string name=\"disclaimer_report\">侵权/违规内容举报：请在「设置 - 关于 - 反馈」提交具体源地址与条目链接，我们会记录并协助屏蔽。</string>\n</resources>\n"},{"path":"app/src/main/res/values/themes.xml","lang":"xml","lines":4,"content":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <style name=\"Theme.Lanyue\" parent=\"android:Theme.Material.Light.NoActionBar\" />\n</resources>\n"},{"path":"build.gradle.kts","lang":"kts","lines":5,"content":"plugins {\n    id(\"com.android.application\") version \"8.5.2\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"2.0.20\" apply false\n    id(\"com.google.devtools.ksp\") version \"2.0.20-1.0.25\" apply false\n}\n"},{"path":"gradle.properties","lang":"properties","lines":4,"content":"org.gradle.jvmargs=-Xmx4g\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n"},{"path":"settings.gradle.kts","lang":"kts","lines":9,"content":"pluginManagement {\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = \"lanyue\"\ninclude(\":app\")\n"},{"path":"tests/BackupLayerTest.kt","lang":"kt","lines":334,"content":"import com.lanyue.reader.data.backup.BackupCodec\nimport com.lanyue.reader.data.backup.BackupFormat\nimport com.lanyue.reader.data.backup.BackupMerger\nimport com.lanyue.reader.data.backup.BackupPayload\nimport com.lanyue.reader.data.backup.BookBackup\nimport com.lanyue.reader.data.backup.BookSourceBackup\nimport com.lanyue.reader.data.backup.LocalSnapshot\nimport com.lanyue.reader.data.backup.MergeMode\nimport com.lanyue.reader.data.backup.PlayRecordBackup\nimport com.lanyue.reader.data.backup.ReadRecordBackup\nimport com.lanyue.reader.data.backup.RssFavoriteBackup\nimport com.lanyue.reader.data.backup.RssSourceBackup\nimport com.lanyue.reader.data.backup.VideoFavoriteBackup\nimport com.lanyue.reader.data.backup.VideoSiteBackup\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\nprivate fun samplePayload(): BackupPayload = BackupPayload(\n    books = listOf(\n        BookBackup(\n            bookUrl = \"https://a.com/book/1\", name = \"书一\", author = \"作者甲\",\n            origin = \"https://a.com\", sourceType = 0, groupName = \"小说\",\n            totalChapter = 120, lastReadAt = 1000L, sortOrder = 1\n        ),\n        BookBackup(\n            bookUrl = \"https://a.com/book/2\", name = \"书二\", origin = \"https://a.com\",\n            sourceType = 1, groupName = \"音频\", lastReadAt = 2000L\n        )\n    ),\n    bookSources = listOf(\n        BookSourceBackup(\n            bookSourceUrl = \"https://s1.com\", bookSourceName = \"源一\",\n            searchUrl = \"/s?q={{key}}\", ruleSearch = \"class.r@text\",\n            ruleToc = \"class.toc@text\", ruleContent = \"id.c@html\", lastUpdateTime = 500L\n        )\n    ),\n    rssSources = listOf(\n        RssSourceBackup(\n            sourceUrl = \"https://r.com/feed\", sourceName = \"订阅一\",\n            sortUrl = \"推荐::/rec\", ruleArticles = \"class.item\",\n            ruleTitle = \"tag.a@text\", ruleLink = \"tag.a@href\", customOrder = 3\n        )\n    ),\n    videoSites = listOf(\n        VideoSiteBackup(\n            configUrl = \"https://v.com/api\", siteKey = \"k1\", name = \"站一\",\n            type = 1, api = \"https://v.com/api?ac=detail\", ext = null\n        )\n    ),\n    readRecords = listOf(\n        ReadRecordBackup(\n            bookUrl = \"https://a.com/book/1\", chapterIndex = 12,\n            chapterTitle = \"第十二章\", position = 480, updatedAt = 3000L\n        )\n    ),\n    playRecords = listOf(\n        PlayRecordBackup(\n            videoKey = \"v1\", title = \"剧一\", episodeIndex = 3,\n            positionMs = 60000L, durationMs = 2700000L, updatedAt = 4000L\n        )\n    ),\n    rssFavorites = listOf(\n        RssFavoriteBackup(\n            articleUrl = \"https://r.com/a1\", title = \"文章一\",\n            sourceUrl = \"https://r.com/feed\", pubDate = 111L, savedAt = 5000L\n        )\n    ),\n    videoFavorites = listOf(\n        VideoFavoriteBackup(\n            videoUrl = \"https://v.com/detail/9\", title = \"影片一\",\n            configUrl = \"https://v.com/api\", siteKey = \"k1\", savedAt = 6000L\n        )\n    )\n)\n\nfun main() {\n    // ================= MergeMode =================\n    eq(\"默认合并策略\", MergeMode.Default, MergeMode.KEEP_NEWER)\n    eq(\"id keep_local\", MergeMode.fromId(\"keep_local\"), MergeMode.KEEP_LOCAL)\n    eq(\"id overwrite\", MergeMode.fromId(\"overwrite\"), MergeMode.OVERWRITE)\n    eq(\"id keep_newer\", MergeMode.fromId(\"keep_newer\"), MergeMode.KEEP_NEWER)\n    eq(\"未知策略回落\", MergeMode.fromId(\"merge_all\"), MergeMode.KEEP_NEWER)\n    eq(\"null 策略回落\", MergeMode.fromId(null), MergeMode.KEEP_NEWER)\n    eq(\"中文标签\", MergeMode.KEEP_LOCAL.label, \"保留本机，只补缺\")\n\n    // ================= 编码 =================\n    val payload = samplePayload()\n    eq(\"总条目数\", payload.totalCount, 9)\n    eq(\"非空判断\", payload.isEmpty, false)\n    eq(\"空载荷 isEmpty\", BackupPayload().isEmpty, true)\n\n    val json = BackupCodec.encode(payload, exportedAt = 1_700_000_000_000L, appVersion = \"1.4.0\")\n    check(\"JSON 含格式标记\", json.contains(\"\\\"lanyue-backup\\\"\"), json.take(200))\n    check(\"JSON 含 schemaVersion\", json.contains(\"\\\"schemaVersion\\\":2\"))\n    check(\"JSON 含导出时间\", json.contains(\"1700000000000\"))\n    check(\"JSON 含 appVersion\", json.contains(\"1.4.0\"))\n    check(\"JSON 含 checksum\", json.contains(\"\\\"checksum\\\"\"))\n    check(\"书一在 JSON 里\", json.contains(\"书一\"))\n    check(\"null 字段写成 null\", json.contains(\"\\\"author\\\":null\") || !json.contains(\"\\\"author\\\":null\"))\n\n    val checksum1 = BackupCodec.checksumOf(payload)\n    eq(\"摘要稳定\", BackupCodec.checksumOf(payload), checksum1)\n    check(\"摘要为 8 位十六进制\", checksum1.matches(Regex(\"[0-9a-f]{8}\")), checksum1)\n    eq(\"空载荷摘要稳定\", BackupCodec.checksumOf(BackupPayload()), BackupCodec.checksumOf(BackupPayload()))\n    check(\"不同载荷摘要不同\", BackupCodec.checksumOf(BackupPayload()) != checksum1)\n\n    // ================= 解码往返 =================\n    val decoded = BackupCodec.decode(json)\n    check(\"解码成功\", decoded is BackupCodec.DecodeResult.Success)\n    if (decoded is BackupCodec.DecodeResult.Success) {\n        val d = decoded.document\n        eq(\"往返版本\", d.meta.schemaVersion, BackupFormat.SCHEMA_VERSION)\n        eq(\"往返格式\", d.meta.format, BackupFormat.FORMAT_ID)\n        eq(\"往返导出时间\", d.meta.exportedAt, 1_700_000_000_000L)\n        eq(\"往返应用版本\", d.meta.appVersion, \"1.4.0\")\n        eq(\"往返无告警\", decoded.warnings.size, 0)\n        eq(\"往返总条目\", d.payload.totalCount, 9)\n        eq(\"往返书架首条\", d.payload.books.first().name, \"书一\")\n        eq(\"往返书架作者\", d.payload.books.first().author, \"作者甲\")\n        eq(\"往返书架偏移\", d.payload.books[1].lastReadAt, 2000L)\n        eq(\"往返书源规则\", d.payload.bookSources.first().ruleContent, \"id.c@html\")\n        eq(\"往返订阅分类\", d.payload.rssSources.first().sortUrl, \"推荐::/rec\")\n        eq(\"往返站点 ext 为 null\", d.payload.videoSites.first().ext, null)\n        eq(\"往返阅读进度\", d.payload.readRecords.first().chapterIndex, 12)\n        eq(\"往返播放进度\", d.payload.playRecords.first().positionMs, 60000L)\n        eq(\"往返收藏 pubDate\", d.payload.rssFavorites.first().pubDate, 111L)\n        eq(\"往返影视收藏\", d.payload.videoFavorites.first().videoUrl, \"https://v.com/detail/9\")\n        eq(\"整包相等\", d.payload, payload)\n        // 二次编码应完全一致（编码确定性）\n        eq(\"二次编码一致\", BackupCodec.encode(d.payload, 1_700_000_000_000L, \"1.4.0\"), json)\n    }\n\n    // ================= 解码失败分支 =================\n    fun expectFail(name: String, raw: String?, keyword: String) {\n        val r = BackupCodec.decode(raw)\n        if (r is BackupCodec.DecodeResult.Failure) {\n            check(name, r.reason.contains(keyword), \"reason=${r.reason}\")\n        } else {\n            fail++\n            failures.add(\"$name -> 期望失败但成功\")\n        }\n    }\n    expectFail(\"空字符串失败\", \"\", \"为空\")\n    expectFail(\"null 失败\", null, \"为空\")\n    expectFail(\"非法 JSON 失败\", \"{not json\", \"不是合法 JSON\")\n    expectFail(\"数组根节点失败\", \"[1,2]\", \"不是对象\")\n    expectFail(\"缺 meta 失败\", \"{\\\"data\\\":{}}\", \"缺少 meta\")\n    expectFail(\"格式标记不符失败\",\n        \"{\\\"meta\\\":{\\\"format\\\":\\\"other\\\"},\\\"data\\\":{}}\", \"不是蓝阅的备份\")\n    expectFail(\"版本过旧失败\",\n        \"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":0},\\\"data\\\":{}}\", \"过旧\")\n    expectFail(\"版本过新失败\",\n        \"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":99},\\\"data\\\":{}}\", \"过新\")\n\n    // 缺 data 段：成功但告警\n    val noData = BackupCodec.decode(\"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":2}}\")\n    if (noData is BackupCodec.DecodeResult.Success) {\n        eq(\"缺 data 得空载荷\", noData.document.payload.isEmpty, true)\n        check(\"缺 data 有告警\", noData.warnings.any { it.contains(\"data\") })\n    } else {\n        fail++; failures.add(\"缺 data 应成功但失败\")\n    }\n\n    // 某段类型错误：忽略该段并告警\n    val wrongType = BackupCodec.decode(\n        \"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":2},\" +\n            \"\\\"data\\\":{\\\"books\\\":\\\"oops\\\"}}\"\n    )\n    if (wrongType is BackupCodec.DecodeResult.Success) {\n        eq(\"错误段当空\", wrongType.document.payload.books.size, 0)\n        check(\"错误段有告警\", wrongType.warnings.any { it.contains(\"books\") })\n    } else {\n        fail++; failures.add(\"错误段应容错但失败\")\n    }\n\n    // 缺主键的记录被跳过并告警\n    val missingKey = BackupCodec.decode(\n        \"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":2},\" +\n            \"\\\"data\\\":{\\\"books\\\":[{\\\"name\\\":\\\"无主键\\\"},{\\\"bookUrl\\\":\\\"u1\\\",\\\"name\\\":\\\"好\\\"}]}}\"\n    )\n    if (missingKey is BackupCodec.DecodeResult.Success) {\n        eq(\"缺主键被跳过\", missingKey.document.payload.books.size, 1)\n        eq(\"保留合法条目\", missingKey.document.payload.books.first().bookUrl, \"u1\")\n        check(\"跳条有告警\", missingKey.warnings.any { it.contains(\"bookUrl\") || it.contains(\"主键\") })\n    } else {\n        fail++; failures.add(\"缺主键应容错但失败\")\n    }\n\n    // 老备份缺字段：落到默认值而不是 null/0 异常\n    val legacy = BackupCodec.decode(\n        \"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":1},\" +\n            \"\\\"data\\\":{\\\"books\\\":[{\\\"bookUrl\\\":\\\"old\\\",\\\"name\\\":\\\"老书\\\",\\\"origin\\\":\\\"o\\\"}]}}\"\n    )\n    if (legacy is BackupCodec.DecodeResult.Success) {\n        val b = legacy.document.payload.books.first()\n        eq(\"老备份默认分组\", b.groupName, \"全部\")\n        eq(\"老备份默认类型\", b.sourceType, 0)\n        eq(\"老备份默认引用位\", b.lastReadAt, 0L)\n        eq(\"老备份 name 正确\", b.name, \"老书\")\n    } else {\n        fail++; failures.add(\"老备份应可读但失败\")\n    }\n\n    // 摘要被改动：仍可导入但告警\n    val tampered = json.replace(\"\\\"书一\\\"\", \"\\\"书一改\\\"\")\n    val tRes = BackupCodec.decode(tampered)\n    if (tRes is BackupCodec.DecodeResult.Success) {\n        check(\"被改备份仍可读\", tRes.document.payload.books.first().name == \"书一改\")\n        // 名字不在摘要范围内，因此不告警；改主键才应告警\n    } else {\n        fail++; failures.add(\"被改备份应可读但失败\")\n    }\n    val tamperedKey = json.replace(\"https://a.com/book/1\", \"https://a.com/book/9\")\n    val tkRes = BackupCodec.decode(tamperedKey)\n    if (tkRes is BackupCodec.DecodeResult.Success) {\n        check(\"改主键触发摘要告警\", tkRes.warnings.any { it.contains(\"摘要\") })\n    } else {\n        fail++; failures.add(\"改主键备份应可读但失败\")\n    }\n\n    // ================= 合并：KEEP_NEWER =================\n    val local = LocalSnapshot(\n        books = mapOf(\"https://a.com/book/1\" to 1500L),   // 本机比备份新\n        bookSources = mapOf(\"https://s1.com\" to 100L),    // 备份比本机新\n        readRecords = mapOf(\"https://a.com/book/1\" to 3000L), // 同时间\n        videoSites = mapOf(BackupMerger.siteKeyOf(\"https://v.com/api\", \"k1\") to 0L)\n    )\n    val r1 = BackupMerger.mergeAll(payload, local, MergeMode.KEEP_NEWER)\n    eq(\"按新合并-书架跳过旧的\", r1.books.written, 1)          // 只写入 book/2（本机没有）\n    eq(\"按新合并-书源覆盖\", r1.bookSources.written, 1)\n    eq(\"按新合并-进度同时间不覆盖\", r1.readRecords.written, 0)\n    eq(\"按新合并-进度跳过计数\", r1.readRecords.skipped, 1)\n    eq(\"按新合并-站点已存在被跳过\", r1.videoSites.written, 0)\n    check(\"摘要文案包含导入\", r1.summary().contains(\"已导入\"), r1.summary())\n\n    // ================= 合并：KEEP_LOCAL =================\n    val r2 = BackupMerger.mergeAll(payload, local, MergeMode.KEEP_LOCAL)\n    eq(\"保留本机-已存在的都不覆盖\", r2.books.written, 1)\n    eq(\"保留本机-书源不动\", r2.bookSources.written, 0)\n    eq(\"保留本机-新站补充\", r2.videoSites.written, 0)\n    eq(\"保留本机-跳过量大于0\", r2.totalSkipped > 0, true)\n\n    // ================= 合并：OVERWRITE =================\n    val r3 = BackupMerger.mergeAll(payload, local, MergeMode.OVERWRITE)\n    eq(\"覆盖-书架覆盖旧\", r3.books.written, 2)\n    eq(\"覆盖-书源覆盖\", r3.bookSources.written, 1)\n    eq(\"覆盖-进度覆盖\", r3.readRecords.written, 1)\n    eq(\"覆盖-站点覆盖\", r3.videoSites.written, 1)\n    eq(\"覆盖-无跳过\", r3.totalSkipped, 0)\n\n    // ================= 合并：空本机 =================\n    val r4 = BackupMerger.mergeAll(payload, LocalSnapshot(), MergeMode.KEEP_LOCAL)\n    eq(\"空本机全部写入\", r4.totalWritten, 9)\n    eq(\"空本机无跳过\", r4.totalSkipped, 0)\n    eq(\"空 summary\", r4.summary(), \"已导入 9 项\")\n\n    // ================= 合并：用户改过的书源受保护 =================\n    val guarded = LocalSnapshot(\n        bookSources = mapOf(\"https://s1.com\" to 100L),\n        userEditedBookSources = setOf(\"https://s1.com\")\n    )\n    val r5 = BackupMerger.mergeAll(payload, guarded, MergeMode.OVERWRITE)\n    eq(\"受保护书源不被覆盖\", r5.bookSources.written, 0)\n    eq(\"受保护书源计入跳过\", r5.bookSources.skipped, 1)\n\n    // ================= 合并：备份内重复去重 =================\n    val dupPayload = BackupPayload(\n        books = listOf(\n            BookBackup(bookUrl = \"dup\", name = \"第一版\", origin = \"o\"),\n            BookBackup(bookUrl = \"dup\", name = \"第二版\", origin = \"o\")\n        )\n    )\n    val r6 = BackupMerger.mergeAll(dupPayload, LocalSnapshot(), MergeMode.OVERWRITE)\n    eq(\"重复只写一条\", r6.books.written, 1)\n    eq(\"重复计数\", r6.books.deduped, 1)\n    eq(\"后者覆盖前者\", r6.books.toWrite.first().name, \"第二版\")\n\n    // 空主键条目被丢弃\n    val blankKey = BackupPayload(books = listOf(BookBackup(bookUrl = \"  \", name = \"坏\")))\n    val r7 = BackupMerger.mergeAll(blankKey, LocalSnapshot(), MergeMode.OVERWRITE)\n    eq(\"空主键不写入\", r7.books.written, 0)\n\n    // ================= 结果文案 =================\n    eq(\"空报告文案\",\n        com.lanyue.reader.data.backup.MergeReport().summary(), \"备份里没有可导入的数据\")\n\n    // ================= 体积上限 =================\n    val huge = \"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":2},\\\"data\\\":{},\\\"pad\\\":\\\"\" +\n        \"x\".repeat(BackupFormat.MAX_BYTES) + \"\\\"}\"\n    val hugeRes = BackupCodec.decode(huge)\n    check(\"超大备份被拒\", hugeRes is BackupCodec.DecodeResult.Failure &&\n        hugeRes.reason.contains(\"过大\"))\n\n    // 条目数上限\n    val manyJson = StringBuilder()\n    manyJson.append(\"{\\\"meta\\\":{\\\"format\\\":\\\"lanyue-backup\\\",\\\"schemaVersion\\\":2},\\\"data\\\":{\\\"books\\\":[\")\n    val n = BackupFormat.MAX_ITEMS_PER_SECTION + 5\n    for (i in 0 until n) {\n        if (i > 0) manyJson.append(',')\n        manyJson.append(\"{\\\"bookUrl\\\":\\\"u\").append(i).append(\"\\\"}\")\n    }\n    manyJson.append(\"]}}\")\n    val manyRes = BackupCodec.decode(manyJson.toString())\n    if (manyRes is BackupCodec.DecodeResult.Success) {\n        eq(\"超限截断到上限\", manyRes.document.payload.books.size, BackupFormat.MAX_ITEMS_PER_SECTION)\n        check(\"超限有告警\", manyRes.warnings.any { it.contains(\"过多\") })\n    } else {\n        fail++; failures.add(\"超限应截断可读但失败\")\n    }\n\n    println(\"================ 备份层单测 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"},{"path":"tests/JsonXpathTest.kt","lang":"kt","lines":163,"content":"import com.lanyue.reader.source.rule.JsonPath\nimport com.lanyue.reader.source.rule.XPathLite\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\nprivate const val DOC = \"\"\"\n{\n  \"code\": 0,\n  \"data\": {\n    \"total\": 3,\n    \"list\": [\n      {\"name\":\"三体\",\"type\":\"book\",\"words\":880000,\"author\":\"刘慈欣\"},\n      {\"name\":\"活着\",\"type\":\"book\",\"words\":120000,\"author\":\"余华\"},\n      {\"name\":\"某漫画\",\"type\":\"comic\",\"words\":0,\"author\":null}\n    ]\n  },\n  \"meta\": {\"nested\": {\"name\":\"深层\"}}\n}\n\"\"\"\n\nfun main() {\n    // ---------------- 基础字段 ----------------\n    eq(\"根字段\", JsonPath.firstString(DOC, \"$.code\"), \"0\")\n    eq(\"两级字段\", JsonPath.firstString(DOC, \"$.data.total\"), \"3\")\n    eq(\"字符串字段\", JsonPath.firstString(DOC, \"$.data.list[0].name\"), \"三体\")\n    eq(\"负索引\", JsonPath.firstString(DOC, \"$.data.list[-1].name\"), \"某漫画\")\n    eq(\"越界索引\", JsonPath.selectText(DOC, \"$.data.list[99].name\").size, 0)\n\n    // ---------------- 通配 ----------------\n    eq(\"数组通配\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[*].name\")),\n        listOf(\"三体\", \"活着\", \"某漫画\"))\n    eq(\"对象通配\", JsonPath.selectText(DOC, \"$.data.*\").size, 2)\n    check(\"通配后取字段\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[*].author\")).contains(\"刘慈欣\"))\n\n    // ---------------- 递归下降 ----------------\n    val recursive = JsonPath.toStrings(JsonPath.selectText(DOC, \"$..name\"))\n    check(\"递归下降取到 4 个 name\", recursive.size == 4, \"got=$recursive\")\n    check(\"递归含深层值\", recursive.contains(\"深层\"))\n\n    // ---------------- 切片 ----------------\n    eq(\"切片 0:2\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[0:2].name\")),\n        listOf(\"三体\", \"活着\"))\n    eq(\"切片省略尾\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[1:].name\")),\n        listOf(\"活着\", \"某漫画\"))\n    eq(\"切片负端点\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[-2:].name\")),\n        listOf(\"活着\", \"某漫画\"))\n    eq(\"切片空区间\", JsonPath.selectText(DOC, \"$.data.list[2:1].name\").size, 0)\n\n    // ---------------- 方括号字符串键 ----------------\n    val weird = \"\"\"{\"a b\":{\"c-d\":1}}\"\"\"\n    eq(\"方括号字符串键\", JsonPath.firstString(weird, \"${'$'}['a b']['c-d']\"), \"1\")\n    eq(\"双引号方括号键\", JsonPath.firstString(weird, \"${'$'}[\\\"a b\\\"][\\\"c-d\\\"]\"), \"1\")\n\n    // ---------------- 过滤：相等 ----------------\n    eq(\"按字符串相等过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.type=='book')].name\")),\n        listOf(\"三体\", \"活着\"))\n    eq(\"按数字相等过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words==880000)].name\")),\n        listOf(\"三体\"))\n\n    // ---------------- 过滤：不等 ----------------\n    eq(\"按不等过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.type!='book')].name\")),\n        listOf(\"某漫画\"))\n\n    // ---------------- 过滤：比较 ----------------\n    eq(\"大于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words>500000)].name\")),\n        listOf(\"三体\"))\n    eq(\"大于等于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words>=120000)].name\")),\n        listOf(\"三体\", \"活着\"))\n    eq(\"小于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words<1000)].name\")),\n        listOf(\"某漫画\"))\n    eq(\"小于等于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words<=120000)].name\")),\n        listOf(\"活着\", \"某漫画\"))\n\n    // ---------------- 过滤：存在性 ----------------\n    eq(\"存在性过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.author)].name\")),\n        listOf(\"三体\", \"活着\"))\n    // null 值不算存在\n    check(\"null 不算存在\", !JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.author)].name\")).contains(\"某漫画\"))\n\n    // ---------------- 非法输入 ----------------\n    eq(\"非法 JSON\", JsonPath.selectText(\"{oops\", \"$.a\").size, 0)\n    eq(\"空路径\", JsonPath.selectText(DOC, \"\").size, 0)\n    eq(\"非法路径\", JsonPath.selectText(DOC, \"$.a[?]\").size, 0)\n    eq(\"未闭合方括号\", JsonPath.selectText(DOC, \"$.a[0\").size, 0)\n    eq(\"含空白的名字判非法\", JsonPath.selectText(DOC, \"$.a b\").size, 0)\n    eq(\"空 JSON 对象取字段\", JsonPath.selectText(\"{}\", \"$.a\").size, 0)\n    eq(\"数组取字段判空\", JsonPath.selectText(\"[1,2]\", \"$.a\").size, 0)\n    eq(\"对象取索引判空\", JsonPath.selectText(DOC, \"$.code[0]\").size, 0)\n\n    // ---------------- 结果形态 ----------------
