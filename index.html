VERSION,\n    /** 导出时间，毫秒时间戳。 */\n    val exportedAt: Long = 0,\n    /** 导出时的应用版本名，仅用于提示，不参与兼容判断。 */\n    val appVersion: String = \"\",\n    /** 内容摘要，用于校验备份是否被截断/篡改。 */\n    val checksum: String = \"\"\n)\n\n/** 一份完整备份 = 元信息 + 内容。 */\ndata class BackupDocument(\n    val meta: BackupMeta,\n    val payload: BackupPayload\n)\n\n/** 备份格式常量。 */\nobject BackupFormat {\n    /** 识别标记：不是本应用的 JSON 直接拒绝，避免误导入。 */\n    const val FORMAT_ID = \"lanyue-backup\"\n\n    /** 当前写出的版本。 */\n    const val SCHEMA_VERSION = 2\n\n    /** 最低可读版本：低于此版本的备份直接拒绝（格式差异过大）。 */\n    const val MIN_READABLE_VERSION = 1\n\n    /** 单份备份的条目上限，防止导入恶意超大文件把内存打满。 */\n    const val MAX_ITEMS_PER_SECTION = 200_000\n\n    /** 备份文件体积上限（字节）：8 MiB。 */\n    const val MAX_BYTES = 8 * 1024 * 1024\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/db/CatalogDaos.kt","lang":"kt","lines":136,"content":"package com.lanyue.reader.data.db\n\nimport androidx.room.Dao\nimport androidx.room.Insert\nimport androidx.room.OnConflictStrategy\nimport androidx.room.Query\nimport com.lanyue.reader.data.db.entity.BookEntity\nimport com.lanyue.reader.data.db.entity.CacheFileEntity\nimport com.lanyue.reader.data.db.entity.DownloadTaskEntity\nimport com.lanyue.reader.data.db.entity.PlayRecordEntity\nimport com.lanyue.reader.data.db.entity.ReadRecordEntity\nimport com.lanyue.reader.data.db.entity.RssFavoriteEntity\nimport com.lanyue.reader.data.db.entity.RuleSubEntity\nimport com.lanyue.reader.data.db.entity.SearchHistoryEntity\nimport com.lanyue.reader.data.db.entity.VideoFavoriteEntity\nimport com.lanyue.reader.data.db.entity.WebDavCredentialEntity\n\n/** 3.1 书架 DAO。 */\n@Dao\ninterface BookshelfDao {\n    @Query(\"SELECT * FROM books WHERE inBookshelf = 1 ORDER BY sortOrder ASC, lastReadAt DESC\")\n    suspend fun all(): List<BookEntity>\n\n    @Query(\"SELECT * FROM books WHERE inBookshelf = 1 AND groupName = :group ORDER BY sortOrder ASC\")\n    suspend fun byGroup(group: String): List<BookEntity>\n\n    @Query(\"SELECT DISTINCT groupName FROM books WHERE inBookshelf = 1\")\n    suspend fun groups(): List<String>\n\n    @Query(\"SELECT * FROM books WHERE bookUrl = :url\")\n    suspend fun byUrl(url: String): BookEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(book: BookEntity)\n\n    @Query(\"UPDATE books SET inBookshelf = 0 WHERE bookUrl = :url\")\n    suspend fun removeFromShelf(url: String)\n}\n\n@Dao\ninterface FavoriteDao {\n    @Query(\"SELECT * FROM rss_favorites ORDER BY savedAt DESC\")\n    suspend fun rssFavorites(): List<RssFavoriteEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun saveRss(item: RssFavoriteEntity)\n\n    @Query(\"DELETE FROM rss_favorites WHERE articleUrl = :url\")\n    suspend fun removeRss(url: String)\n\n    @Query(\"SELECT * FROM video_favorites ORDER BY savedAt DESC\")\n    suspend fun videoFavorites(): List<VideoFavoriteEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun saveVideo(item: VideoFavoriteEntity)\n\n    @Query(\"DELETE FROM video_favorites WHERE videoUrl = :url\")\n    suspend fun removeVideo(url: String)\n}\n\n/** 4.12 播放/阅读进度。 */\n@Dao\ninterface ProgressDao {\n    @Query(\"SELECT * FROM play_records WHERE videoKey = :key\")\n    suspend fun playRecord(key: String): PlayRecordEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertPlay(record: PlayRecordEntity)\n\n    @Query(\"SELECT * FROM read_records WHERE bookUrl = :key\")\n    suspend fun readRecord(key: String): ReadRecordEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertRead(record: ReadRecordEntity)\n}\n\n/** 4.12 rule_subs 规则订阅。 */\n@Dao\ninterface RuleSubDao {\n    @Query(\"SELECT * FROM rule_subs ORDER BY name\")\n    suspend fun all(): List<RuleSubEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(sub: RuleSubEntity)\n\n    @Query(\"DELETE FROM rule_subs WHERE id = :id\")\n    suspend fun delete(id: String)\n}\n\n/** 4.11 下载与缓存。 */\n@Dao\ninterface DownloadDao {\n    @Query(\"SELECT * FROM download_tasks ORDER BY createdAt DESC\")\n    suspend fun tasks(): List<DownloadTaskEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertTask(task: DownloadTaskEntity)\n\n    @Query(\"DELETE FROM download_tasks WHERE id = :id\")\n    suspend fun deleteTask(id: String)\n\n    @Query(\"SELECT * FROM cache_files ORDER BY lastAccessAt DESC\")\n    suspend fun cacheFiles(): List<CacheFileEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertCache(file: CacheFileEntity)\n\n    /** 4.11 LRU 清理：锁定文件不参与。 */\n    @Query(\"DELETE FROM cache_files WHERE path IN (SELECT path FROM cache_files WHERE locked = 0 ORDER BY lastAccessAt ASC LIMIT :count)\")\n    suspend fun evictLru(count: Int)\n\n    @Query(\"SELECT SUM(sizeBytes) FROM cache_files\")\n    suspend fun totalSize(): Long?\n}\n\n/** 3.8 搜索历史。 */\n@Dao\ninterface SearchHistoryDao {\n    @Query(\"SELECT * FROM search_history WHERE sourceType = :type ORDER BY searchedAt DESC LIMIT :limit\")\n    suspend fun recent(type: String, limit: Int = 20): List<SearchHistoryEntity>\n\n    @Insert\n    suspend fun insert(item: SearchHistoryEntity)\n\n    @Query(\"DELETE FROM search_history WHERE sourceType = :type\")\n    suspend fun clear(type: String)\n}\n\n@Dao\ninterface WebDavDao {\n    @Query(\"SELECT * FROM webdav_credentials LIMIT 1\")\n    suspend fun current(): WebDavCredentialEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(cred: WebDavCredentialEntity)\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/db/Converters.kt","lang":"kt","lines":45,"content":"package com.lanyue.reader.data.db\n\nimport androidx.room.TypeConverter\nimport com.google.gson.Gson\nimport com.google.gson.reflect.TypeToken\n\n/**\n * 4.12 书源 JSON 中嵌套规则对象以 TypeConverter 序列化。\n * 规则对象在领域层是结构化类型，落库时统一转 JSON 字符串。\n */\nclass Converters {\n\n    private val gson = Gson()\n\n    @TypeConverter\n    fun mapToJson(value: Map<String, String>?): String? =\n        value?.let { gson.toJson(it) }\n\n    @TypeConverter\n    fun jsonToMap(value: String?): Map<String, String>? =\n        value?.let {\n            runCatching {\n                gson.fromJson<Map<String, String>>(\n                    it, object : TypeToken<Map<String, String>>() {}.type\n                )\n            }.getOrNull()\n        }\n\n    @TypeConverter\n    fun listToJson(value: List<String>?): String? = value?.let { gson.toJson(it) }\n\n    @TypeConverter\n    fun jsonToList(value: String?): List<String>? =\n        value?.let {\n            runCatching {\n                gson.fromJson<List<String>>(\n                    it, object : TypeToken<List<String>>() {}.type\n                )\n            }.getOrNull()\n        }\n\n    /** 嵌套规则对象（ruleSearch / ruleToc ...）。 */\n    @TypeConverter\n    fun objectToJson(value: Any?): String? = value?.let { gson.toJson(it) }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/db/LanyueDatabase.kt","lang":"kt","lines":75,"content":"package com.lanyue.reader.data.db\n\nimport android.content.Context\nimport androidx.room.Database\nimport androidx.room.Room\nimport androidx.room.RoomDatabase\nimport androidx.room.TypeConverters\nimport com.lanyue.reader.data.db.entity.BookEntity\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.CacheFileEntity\nimport com.lanyue.reader.data.db.entity.DanmakuBindingEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.data.db.entity.DownloadTaskEntity\nimport com.lanyue.reader.data.db.entity.LiveSourceEntity\nimport com.lanyue.reader.data.db.entity.PlayRecordEntity\nimport com.lanyue.reader.data.db.entity.ReadRecordEntity\nimport com.lanyue.reader.data.db.entity.RssFavoriteEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.RuleSubEntity\nimport com.lanyue.reader.data.db.entity.SearchHistoryEntity\nimport com.lanyue.reader.data.db.entity.VideoApiEntity\nimport com.lanyue.reader.data.db.entity.VideoFavoriteEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\nimport com.lanyue.reader.data.db.entity.WebDavCredentialEntity\n\n/**\n * 4.12 本地数据模型（Room）总装。\n * 全部表按 4.12 表清单一一对应，不多建、不少建。\n */\n@Database(\n    entities = [\n        BookSourceEntity::class,\n        RssSourceEntity::class,\n        VideoApiEntity::class,\n        VideoSiteEntity::class,\n        LiveSourceEntity::class,\n        DanmakuSourceEntity::class,\n        DanmakuBindingEntity::class,\n        BookEntity::class,\n        RssFavoriteEntity::class,\n        VideoFavoriteEntity::class,\n        PlayRecordEntity::class,\n        ReadRecordEntity::class,\n        RuleSubEntity::class,\n        DownloadTaskEntity::class,\n        CacheFileEntity::class,\n        SearchHistoryEntity::class,\n        WebDavCredentialEntity::class\n    ],\n    version = 1,\n    exportSchema = true\n)\n@TypeConverters(Converters::class)\nabstract class LanyueDatabase : RoomDatabase() {\n\n    abstract fun bookSourceDao(): BookSourceDao\n    abstract fun rssSourceDao(): RssSourceDao\n    abstract fun videoDao(): VideoDao\n    abstract fun liveSourceDao(): LiveSourceDao\n    abstract fun danmakuDao(): DanmakuDao\n    abstract fun bookshelfDao(): BookshelfDao\n    abstract fun favoriteDao(): FavoriteDao\n    abstract fun progressDao(): ProgressDao\n    abstract fun ruleSubDao(): RuleSubDao\n    abstract fun downloadDao(): DownloadDao\n    abstract fun searchHistoryDao(): SearchHistoryDao\n    abstract fun webDavDao(): WebDavDao\n\n    companion object {\n        fun build(context: Context): LanyueDatabase =\n            Room.databaseBuilder(context, LanyueDatabase::class.java, \"lanyue.db\")\n                .fallbackToDestructiveMigration()\n                .build()\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/db/SourceDaos.kt","lang":"kt","lines":187,"content":"package com.lanyue.reader.data.db\n\nimport androidx.room.Dao\nimport androidx.room.Insert\nimport androidx.room.OnConflictStrategy\nimport androidx.room.Query\nimport androidx.room.Transaction\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.DanmakuBindingEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.data.db.entity.LiveSourceEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoApiEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\n\n/** 4.12 书源 DAO。 */\n@Dao\ninterface BookSourceDao {\n    @Query(\"SELECT * FROM book_sources ORDER BY bookSourceName\")\n    suspend fun all(): List<BookSourceEntity>\n\n    @Query(\"SELECT * FROM book_sources WHERE enabled = 1\")\n    suspend fun enabled(): List<BookSourceEntity>\n\n    /** 3.2 状态 A：仅展示启用且 enabledExplore + exploreUrl 非空的书源。 */\n    @Query(\"SELECT * FROM book_sources WHERE enabled = 1 AND enabledExplore = 1 AND exploreUrl IS NOT NULL AND exploreUrl != ''\")\n    suspend fun discoverable(): List<BookSourceEntity>\n\n    /** 1.4.2 SEARCHABLE：searchUrl 非空 + ruleSearch 存在。 */\n    @Query(\"SELECT * FROM book_sources WHERE enabled = 1 AND searchDegraded = 0 AND searchUrl IS NOT NULL AND searchUrl != '' AND ruleSearch IS NOT NULL\")\n    suspend fun searchable(): List<BookSourceEntity>\n\n    @Query(\"SELECT * FROM book_sources WHERE bookSourceUrl = :url\")\n    suspend fun byUrl(url: String): BookSourceEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(source: BookSourceEntity)\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertAll(sources: List<BookSourceEntity>)\n\n    @Query(\"DELETE FROM book_sources WHERE bookSourceUrl = :url\")\n    suspend fun delete(url: String)\n\n    @Query(\"UPDATE book_sources SET enabled = :enabled WHERE bookSourceUrl = :url\")\n    suspend fun setEnabled(url: String, enabled: Boolean)\n\n    /** 1.4.3 / ADR-018：搜索失败计数 +1，达 3 次标记降级。 */\n    @Query(\"UPDATE book_sources SET searchFailCount = searchFailCount + 1, searchDegraded = CASE WHEN searchFailCount + 1 >= 3 THEN 1 ELSE searchDegraded END WHERE bookSourceUrl = :url\")\n    suspend fun recordSearchFailure(url: String)\n\n    @Query(\"UPDATE book_sources SET searchFailCount = 0 WHERE bookSourceUrl = :url\")\n    suspend fun resetSearchFailure(url: String)\n\n    @Query(\"UPDATE book_sources SET searchDegraded = :degraded WHERE bookSourceUrl = :url\")\n    suspend fun setSearchDegraded(url: String, degraded: Boolean)\n}\n\n/** 4.12 / 1.4 订阅源 DAO。 */\n@Dao\ninterface RssSourceDao {\n    @Query(\"SELECT * FROM rss_sources ORDER BY customOrder ASC, sourceName ASC\")\n    suspend fun all(): List<RssSourceEntity>\n\n    @Query(\"SELECT * FROM rss_sources WHERE enabled = 1 ORDER BY customOrder ASC\")\n    suspend fun enabled(): List<RssSourceEntity>\n\n    /** 3.3 搜索入口按 SEARCHABLE 动态显示：searchUrl 非空且未降级。 */\n    @Query(\"SELECT * FROM rss_sources WHERE enabled = 1 AND searchDegraded = 0 AND searchUrl IS NOT NULL AND searchUrl != ''\")\n    suspend fun searchable(): List<RssSourceEntity>\n\n    /** 1.4.2 DISCOVERABLE：sortUrl 非空。 */\n    @Query(\"SELECT * FROM rss_sources WHERE enabled = 1 AND sortUrl IS NOT NULL AND sortUrl != ''\")\n    suspend fun discoverable(): List<RssSourceEntity>\n\n    @Query(\"SELECT * FROM rss_sources WHERE sourceUrl = :url\")\n    suspend fun byUrl(url: String): RssSourceEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(source: RssSourceEntity)\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertAll(sources: List<RssSourceEntity>)\n\n    @Query(\"DELETE FROM rss_sources WHERE sourceUrl = :url\")\n    suspend fun delete(url: String)\n\n    @Query(\"UPDATE rss_sources SET searchFailCount = searchFailCount + 1, searchDegraded = CASE WHEN searchFailCount + 1 >= 3 THEN 1 ELSE searchDegraded END WHERE sourceUrl = :url\")\n    suspend fun recordSearchFailure(url: String)\n}\n\n/** 4.12 / 7.3 TVBox 接口与站点 DAO。 */\n@Dao\ninterface VideoDao {\n    @Query(\"SELECT * FROM video_apis ORDER BY name\")\n    suspend fun allApis(): List<VideoApiEntity>\n\n    @Query(\"SELECT * FROM video_apis WHERE url = :url\")\n    suspend fun api(url: String): VideoApiEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertApi(api: VideoApiEntity)\n\n    @Query(\"SELECT * FROM video_sites WHERE enabled = 1 ORDER BY name\")\n    suspend fun enabledSites(): List<VideoSiteEntity>\n\n    @Query(\"SELECT * FROM video_sites WHERE configUrl = :configUrl ORDER BY name\")\n    suspend fun sitesOf(configUrl: String): List<VideoSiteEntity>\n\n    @Query(\"SELECT * FROM video_sites WHERE configUrl = :configUrl AND siteKey = :siteKey\")\n    suspend fun site(configUrl: String, siteKey: String): VideoSiteEntity?\n\n    /** 仅 searchable 站点参与搜索聚合（3.4 / 3.8）。 */\n    @Query(\"SELECT * FROM video_sites WHERE enabled = 1 AND searchable = 1 AND unsupported = 0\")\n    suspend fun searchableSites(): List<VideoSiteEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertSites(sites: List<VideoSiteEntity>)\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertSite(site: VideoSiteEntity)\n\n    /**\n     * 4.12 / 附录 B 用例 21：删除接口配置时级联删除其站点。\n     * 用事务保证配置与站点不会出现半删状态。\n     */\n    @Transaction\n    suspend fun deleteConfigCascade(configUrl: String) {\n        deleteSitesOf(configUrl)\n        deleteApi(configUrl)\n    }\n\n    @Query(\"DELETE FROM video_sites WHERE configUrl = :configUrl\")\n    suspend fun deleteSitesOf(configUrl: String)\n\n    @Query(\"DELETE FROM video_apis WHERE url = :configUrl\")\n    suspend fun deleteApi(configUrl: String)\n}\n\n/** 4.12 live_sources：一期只写不读 UI。 */\n@Dao\ninterface LiveSourceDao {\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertAll(sources: List<LiveSourceEntity>)\n\n    @Query(\"SELECT * FROM live_sources WHERE apiUrl = :apiUrl\")\n    suspend fun ofApi(apiUrl: String): List<LiveSourceEntity>\n\n    @Query(\"SELECT COUNT(*) FROM live_sources\")\n    suspend fun count(): Int\n}\n\n/** 4.10 / 4.12 弹幕源与匹配记忆 DAO。 */\n@Dao\ninterface DanmakuDao {\n    @Query(\"SELECT * FROM danmaku_sources ORDER BY sortOrder ASC\")\n    suspend fun all(): List<DanmakuSourceEntity>\n\n    @Query(\"SELECT * FROM danmaku_sources WHERE enabled = 1 ORDER BY sortOrder ASC\")\n    suspend fun enabledOrdered(): List<DanmakuSourceEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(source: DanmakuSourceEntity)\n\n    @Query(\"DELETE FROM danmaku_sources WHERE id = :id\")\n    suspend fun delete(id: String)\n\n    @Query(\"UPDATE danmaku_sources SET verified = :verified WHERE id = :id\")\n    suspend fun setVerified(id: String, verified: Boolean)\n\n    /** 4.10.5 匹配记忆：按 视频标识 + 弹幕源 查。 */\n    @Query(\"SELECT * FROM danmaku_bindings WHERE videoKey = :videoKey AND danmakuSourceId = :sourceId\")\n    suspend fun binding(videoKey: String, sourceId: String): DanmakuBindingEntity?\n\n    @Query(\"SELECT * FROM danmaku_bindings WHERE videoKey = :videoKey\")\n    suspend fun bindingsOf(videoKey: String): List<DanmakuBindingEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertBinding(binding: DanmakuBindingEntity)\n\n    /** 设置 → 弹幕 → 清除匹配记录。 */\n    @Query(\"DELETE FROM danmaku_bindings\")\n    suspend fun clearBindings()\n\n    @Query(\"DELETE FROM danmaku_bindings WHERE videoKey = :videoKey\")\n    suspend fun clearBinding(videoKey: String)\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/db/entity/CatalogEntities.kt","lang":"kt","lines":126,"content":"package com.lanyue.reader.data.db.entity\n\nimport androidx.room.Entity\nimport androidx.room.Index\nimport androidx.room.PrimaryKey\n\n/** 3.1 书架。分组：全部/小说/音频/追剧/订阅。 */\n@Entity(tableName = \"books\", indices = [Index(\"groupName\"), Index(\"sourceType\")])\ndata class BookEntity(\n    @PrimaryKey val bookUrl: String,\n    val name: String,\n    val author: String? = null,\n    val cover: String? = null,\n    val intro: String? = null,\n    val origin: String,\n    val originName: String? = null,\n    /** 0 小说 / 1 音频 / 2 追剧 / 3 订阅 */\n    val sourceType: Int = 0,\n    val groupName: String = \"全部\",\n    val latestChapter: String? = null,\n    val totalChapter: Int = 0,\n    val lastReadAt: Long = 0,\n    val sortOrder: Int = 0,\n    val inBookshelf: Boolean = true\n)\n\n/** 3.3 订阅收藏（RssFavorites）。 */\n@Entity(tableName = \"rss_favorites\")\ndata class RssFavoriteEntity(\n    @PrimaryKey val articleUrl: String,\n    val title: String,\n    val sourceUrl: String,\n    val cover: String? = null,\n    val pubDate: Long? = null,\n    val savedAt: Long = System.currentTimeMillis()\n)\n\n/** 影视收藏。 */\n@Entity(tableName = \"video_favorites\")\ndata class VideoFavoriteEntity(\n    @PrimaryKey val videoUrl: String,\n    val title: String,\n    val configUrl: String,\n    val siteKey: String,\n    val cover: String? = null,\n    val savedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 play_records 播放进度。 */\n@Entity(tableName = \"play_records\")\ndata class PlayRecordEntity(\n    @PrimaryKey val videoKey: String,\n    val title: String,\n    val episodeIndex: Int = 0,\n    val positionMs: Long = 0,\n    val durationMs: Long = 0,\n    val updatedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 read_records 阅读进度。 */\n@Entity(tableName = \"read_records\")\ndata class ReadRecordEntity(\n    @PrimaryKey val bookUrl: String,\n    val chapterIndex: Int = 0,\n    val chapterTitle: String? = null,\n    val chapterUrl: String? = null,\n    val position: Int = 0,\n    val updatedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 rule_subs 规则订阅。 */\n@Entity(tableName = \"rule_subs\")\ndata class RuleSubEntity(\n    @PrimaryKey val id: String,\n    /** BOOK / SUBSCRIPTION */\n    val sourceType: String,\n    val url: String,\n    val name: String = \"\",\n    val periodHours: Int = 24,\n    val lastRunAt: Long = 0,\n    val enabled: Boolean = true\n)\n\n/** 4.12 download_tasks 下载任务。 */\n@Entity(tableName = \"download_tasks\")\ndata class DownloadTaskEntity(\n    @PrimaryKey val id: String,\n    /** TEXT / MEDIA */\n    val kind: String,\n    val targetKey: String,\n    val name: String = \"\",\n    val state: Int = 0,\n    val progress: Long = 0,\n    val total: Long = 0,\n    val errorMsg: String? = null,\n    val createdAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 cache_files 缓存文件。 */\n@Entity(tableName = \"cache_files\")\ndata class CacheFileEntity(\n    @PrimaryKey val path: String,\n    val kind: String,\n    val sizeBytes: Long = 0,\n    val locked: Boolean = false,\n    val lastAccessAt: Long = System.currentTimeMillis()\n)\n\n/** 3.8 搜索历史落 search_history 表。 */\n@Entity(tableName = \"search_history\")\ndata class SearchHistoryEntity(\n    @PrimaryKey(autoGenerate = true) val id: Long = 0,\n    val keyword: String,\n    /** BOOK / SUBSCRIPTION / VIDEO */\n    val sourceType: String,\n    val searchedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 webdav_credentials。password 由 Keystore 加密。 */\n@Entity(tableName = \"webdav_credentials\")\ndata class WebDavCredentialEntity(\n    @PrimaryKey val id: String,\n    val serverUrl: String,\n    val username: String,\n    val passwordCipher: String\n)\n"},{"path":"app/src/main/java/com/lanyue/reader/data/db/entity/SourceEntities.kt","lang":"kt","lines":171,"content":"package com.lanyue.reader.data.db.entity\n\nimport androidx.room.Entity\nimport androidx.room.PrimaryKey\n\n/**\n * 4.12 book_sources 书源。\n * bookSourceType: 0 文本 / 1 音频 / 2 图片 / 3 文件 / 4 视频（TODO-DEV-2 枚举边界核对）\n */\n@Entity(tableName = \"book_sources\")\ndata class BookSourceEntity(\n    @PrimaryKey val bookSourceUrl: String,\n    val bookSourceName: String = \"\",\n    val bookSourceGroup: String? = null,\n    val bookSourceType: Int = 0,\n    val enabled: Boolean = true,\n    val enabledExplore: Boolean = false,\n    val searchUrl: String? = null,\n    /** 嵌套规则对象以 JSON 序列化（4.12 TypeConverter）。 */\n    val ruleSearch: String? = null,\n    val exploreUrl: String? = null,\n    val ruleExplore: String? = null,\n    val ruleToc: String? = null,\n    val ruleContent: String? = null,\n    val ruleBookInfo: String? = null,\n    val header: String? = null,\n    val loginUrl: String? = null,\n    val loginUi: String? = null,\n    val loginCheckJs: String? = null,\n    val jsLib: String? = null,\n    val concurrentRate: String? = null,\n    val lastUpdateTime: Long = 0,\n    /** ADR-019：规则订阅更新时这些字段不覆盖。 */\n    val userEditedFields: String? = null,\n    /** 1.4.3 搜索失败降级本地标记。 */\n    val searchDegraded: Boolean = false,\n    val searchFailCount: Int = 0\n)\n\n/**\n * 4.12 rss_sources 订阅源（Legado RssSource）。\n * 1.4.1 字段按真实实体对齐。\n */\n@Entity(tableName = \"rss_sources\")\ndata class RssSourceEntity(\n    @PrimaryKey val sourceUrl: String,\n    val sourceName: String = \"\",\n    val sourceIcon: String? = null,\n    val sourceGroup: String? = null,\n    val sourceComment: String? = null,\n    val enabled: Boolean = true,\n    val enabledCookieJar: Boolean = false,\n    val enableJs: Boolean = true,\n    val loadWithBaseUrl: Boolean = false,\n    val singleUrl: Boolean = false,\n    val header: String? = null,\n    val concurrentRate: String? = null,\n    val loginUrl: String? = null,\n    val loginUi: String? = null,\n    val loginCheckJs: String? = null,\n    /** \"分类名::url\" 多行或 && 分隔；支持 @js: / <js></js> 动态生成。 */\n    val sortUrl: String? = null,\n    val ruleArticles: String? = null,\n    val ruleNextPage: String? = null,\n    val ruleTitle: String? = null,\n    val rulePubDate: String? = null,\n    val ruleImage: String? = null,\n    val ruleLink: String? = null,\n    val ruleDescription: String? = null,\n    val ruleContent: String? = null,\n    val style: String? = null,\n    val injectJs: String? = null,\n    val preloadJs: String? = null,\n    val startHtml: String? = null,\n    val showWebLog: Boolean = false,\n    val shouldOverrideUrlLoading: String? = null,\n    val contentWhitelist: String? = null,\n    val contentBlacklist: String? = null,\n    /** 1.4.1 type：0 网页 / 1 图片 / 2 视频 */\n    val type: Int = 0,\n    val articleStyle: Int = 0,\n    val coverDecodeJs: String? = null,\n    /** 览阅扩展：停更前最后新增字段，原版无 UI。 */\n    val searchUrl: String? = null,\n    val jsLib: String? = null,\n    val variables: String? = null,\n    val variableComment: String? = null,\n    val customOrder: Int = 0,\n    val lastUpdateTime: Long = 0,\n    val preload: Boolean = false,\n    val cacheFirst: Boolean = false,\n    val searchDegraded: Boolean = false,\n    val searchFailCount: Int = 0,\n    val userEditedFields: String? = null\n)\n\n/** 4.12 video_apis TVBox 接口配置。 */\n@Entity(tableName = \"video_apis\")\ndata class VideoApiEntity(\n    @PrimaryKey val url: String,\n    val name: String? = null,\n    val spider: String? = null,\n    val lastUpdate: Long = 0,\n    /** 原始 JSON 全量留存（hotSearch 已在解析时裁剪，不写入）。 */\n    val rawJson: String = \"\"\n)\n\n/**\n * 4.12 video_sites 影视站点。\n * PK = (configUrl, siteKey)；删除接口配置时级联删除（见 Dao）。\n */\n@Entity(tableName = \"video_sites\", primaryKeys = [\"configUrl\", \"siteKey\"])\ndata class VideoSiteEntity(\n    val configUrl: String,\n    val siteKey: String,\n    val name: String = \"\",\n    /** 0 XML(MacCMS V9) / 1 JSON(MacCMS10) / 2 JSON 扩展 / 3 Spider或drpy / 4 JSON扩展1(hipy t4) */\n    val type: Int = 1,\n    val api: String? = null,\n    val searchable: Boolean = true,\n    val quickSearch: Boolean = true,\n    val filterable: Boolean = false,\n    val ext: String? = null,\n    val jar: String? = null,\n    val timeout: Long = 0,\n    val enabled: Boolean = true,\n    /** 7.3 type 3 非 drpy 的 jar 站点标记「暂不支持」。 */\n    val unsupported: Boolean = false\n)\n\n/** 4.12 live_sources 直播源：一期持久化，不暴露 UI。 */\n@Entity(tableName = \"live_sources\")\ndata class LiveSourceEntity(\n    @PrimaryKey val id: String,\n    val apiUrl: String,\n    val name: String = \"\",\n    val type: String = \"txt\",\n    val url: String = \"\",\n    val epg: String? = null,\n    val logo: String? = null\n)\n\n/** 4.12 danmaku_sources 弹幕源。appSecret 由 Keystore 加密后存此列。 */\n@Entity(tableName = \"danmaku_sources\")\ndata class DanmakuSourceEntity(\n    @PrimaryKey val id: String,\n    val name: String,\n    val apiBase: String,\n    val appId: String? = null,\n    /** 4.10.1 Keystore 加密存储；备份导出默认脱敏。 */\n    val appSecretCipher: String? = null,\n    val enabled: Boolean = true,\n    val sortOrder: Int = 0,\n    /** 4.10.6 探活失败标记「未验证」，允许保存。 */\n    val verified: Boolean = false\n)\n\n/**\n * 4.12 / 4.10.5 danmaku_bindings 匹配记忆。\n * videoKey：本地文件=路径+大小；在线=源ID+剧集URL。\n */\n@Entity(tableName = \"danmaku_bindings\", primaryKeys = [\"videoKey\", \"danmakuSourceId\"])\ndata class DanmakuBindingEntity(\n    val videoKey: String,\n    val danmakuSourceId: String,\n    val episodeId: Long,\n    val shift: Long = 0,\n    /** HASH / TITLE / MANUAL */\n    val matchMethod: String = \"TITLE\",\n    val boundAt: Long = System.currentTimeMillis()\n)\n"},{"path":"app/src/main/java/com/lanyue/reader/player/AudioPlaybackService.kt","lang":"kt","lines":124,"content":"package com.lanyue.reader.player\n\nimport android.app.Notification\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.app.PendingIntent\nimport android.content.Context\nimport android.content.Intent\nimport androidx.lifecycle.LifecycleService\nimport androidx.media3.session.MediaSession\n\n/**\n * 4.9 音频书源后台播放（foregroundServiceType=mediaPlayback）。\n *\n * 约束：\n * - 音频书源（bookSourceType=1）正文结果是直链，不解析 HTML，直接注入 ExoPlayer\n * - 通知栏提供 播放/暂停 + 上一章/下一章，锁屏同样可见\n * - 无播放任务时立即 stopSelf，不常驻\n *\n * 注意：本项目不在后台做网络抓取，正文 URL 由前台 UI 解析后传入。\n */\nclass AudioPlaybackService : LifecycleService() {\n\n    companion object {\n        private const val CHANNEL_ID = \"lanyue_audio_playback\"\n        private const val NOTIFICATION_ID = 1001\n\n        const val ACTION_PLAY = \"com.lanyue.reader.action.AUDIO_PLAY\"\n        const val ACTION_PAUSE = \"com.lanyue.reader.action.AUDIO_PAUSE\"\n        const val ACTION_STOP = \"com.lanyue.reader.action.AUDIO_STOP\"\n\n        /** 4.9：外部只能通过 startForegroundService 启动，且必须带 url。 */\n        fun start(context: Context, url: String, headers: Map<String, String> = emptyMap()) {\n            val intent = Intent(context, AudioPlaybackService::class.java).apply {\n                action = ACTION_PLAY\n                putExtra(\"url\", url)\n                headers.forEach { (k, v) -> putExtra(\"h_$k\", v) }\n            }\n            context.startForegroundService(intent)\n        }\n    }\n\n    private var session: MediaSession? = null\n\n    override fun onCreate() {\n        super.onCreate()\n        createChannel()\n    }\n\n    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n        super.onStartCommand(intent, flags, startId)\n\n        when (intent?.action) {\n            ACTION_PAUSE -> {\n                startForeground(NOTIFICATION_ID, buildNotification(paused = true))\n                return START_NOT_STICKY\n            }\n            ACTION_STOP -> {\n                stopSelf()\n                return START_NOT_STICKY\n            }\n            ACTION_PLAY -> {\n                val url = intent.getStringExtra(\"url\")\n                if (url.isNullOrBlank()) {\n                    // 无有效任务：不常驻，避免被判为滥用前台服务\n                    stopSelf()\n                    return START_NOT_STICKY\n                }\n                startForeground(NOTIFICATION_ID, buildNotification(paused = false))\n                return START_STICKY\n            }\n        }\n        return START_NOT_STICKY\n    }\n\n    private fun createChannel() {\n        val nm = getSystemService(NotificationManager::class.java)\n        if (nm.getNotificationChannel(CHANNEL_ID) == null) {\n            val channel = NotificationChannel(\n                CHANNEL_ID,\n                \"音频播放\",\n                NotificationManager.IMPORTANCE_LOW\n            ).apply {\n                description = \"音频书源后台播放控制\"\n                setShowBadge(false)\n            }\n            nm.createNotificationChannel(channel)\n        }\n    }\n\n    private fun buildNotification(paused: Boolean): Notification {\n        val open = PendingIntent.getActivity(\n            this,\n            0,\n            Intent(this, Class.forName(\"com.lanyue.reader.ui.MainActivity\")),\n            PendingIntent.FLAG_IMMUTABLE\n        )\n        return Notification.Builder(this, CHANNEL_ID)\n            .setContentTitle(\"蓝阅 · 音频播放\")\n            .setContentText(if (paused) \"已暂停\" else \"正在播放\")\n            .setSmallIcon(android.R.drawable.ic_media_play)\n            .setContentIntent(open)\n            .setOngoing(true)\n            .addAction(\n                if (paused) android.R.drawable.ic_media_play else android.R.drawable.ic_media_pause,\n                if (paused) \"播放\" else \"暂停\",\n                PendingIntent.getService(\n                    this,\n                    1,\n                    Intent(this, AudioPlaybackService::class.java).apply {\n                        action = if (paused) ACTION_PLAY else ACTION_PAUSE\n                    },\n                    PendingIntent.FLAG_IMMUTABLE\n                )\n            )\n            .build()\n    }\n\n    override fun onDestroy() {\n        session?.release()\n        session = null\n        super.onDestroy()\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/player/MediaDownloadService.kt","lang":"kt","lines":149,"content":"package com.lanyue.reader.player\n\nimport android.app.Notification\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.content.Context\nimport android.content.Intent\nimport androidx.lifecycle.LifecycleService\nimport kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport kotlinx.coroutines.launch\nimport java.io.File\nimport java.util.concurrent.atomic.AtomicLong\n\n/**\n * 4.11 媒体下载退后台续传（foregroundServiceType=dataSync）。\n *\n * 约束（必须遵守，否则被系统清理或审核拒绝）：\n * - 必须是 dataSync 类型；开始后 10 秒内必须真正开始传输\n * - 用 Range 续传，落盘先写 .part 再原子重命名\n * - 用户暂停/取消时立即 stopForeground，不虚占前台\n * - 单任务串行，不做多任务并发（前台服务不能做后台批量抓取）\n *\n * 明确不做：不下载受版权保护的付费内容；仅对用户已获得的直链做离线缓存。\n */\nclass MediaDownloadService : LifecycleService() {\n\n    companion object {\n        private const val CHANNEL_ID = \"lanyue_media_download\"\n        private const val NOTIFICATION_ID = 1002\n        private const val BUFFER = 64 * 1024\n\n        const val ACTION_START = \"com.lanyue.reader.action.DOWNLOAD_START\"\n        const val ACTION_CANCEL = \"com.lanyue.reader.action.DOWNLOAD_CANCEL\"\n\n        fun start(context: Context, url: String, targetPath: String) {\n            val intent = Intent(context, MediaDownloadService::class.java).apply {\n                action = ACTION_START\n                putExtra(\"url\", url)\n                putExtra(\"target\", targetPath)\n            }\n            context.startForegroundService(intent)\n        }\n    }\n\n    private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)\n    private var job: Job? = null\n    private val downloaded = AtomicLong(0)\n\n    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n        super.onStartCommand(intent, flags, startId)\n        when (intent?.action) {\n            ACTION_CANCEL -> {\n                job?.cancel()\n                stopSelf()\n                return START_NOT_STICKY\n            }\n            ACTION_START -> {\n                val url = intent.getStringExtra(\"url\")\n                val target = intent.getStringExtra(\"target\")\n                if (url.isNullOrBlank() || target.isNullOrBlank()) {\n                    stopSelf()\n                    return START_NOT_STICKY\n                }\n                // 先起前台通知，再开始传输（满足 10 秒内开始传输的判定）\n                startForeground(NOTIFICATION_ID, buildNotification(0, 0))\n                job?.cancel()\n                job = scope.launch { download(url, File(target)) }\n                return START_STICKY\n            }\n        }\n        return START_NOT_STICKY\n    }\n\n    private fun download(url: String, target: File) {\n        val part = File(target.absolutePath + \".part\")\n        target.parentFile?.mkdirs()\n\n        val resumeFrom = if (part.exists()) part.length() else 0L\n        downloaded.set(resumeFrom)\n\n        runCatching {\n            val conn = java.net.URL(url).openConnection() as java.net.HttpURLConnection\n            conn.connectTimeout = 15_000\n            conn.readTimeout = 30_000\n            if (resumeFrom > 0) conn.setRequestProperty(\"Range\", \"bytes=$resumeFrom-\")\n            conn.connect()\n\n            val total = conn.contentLengthLong + resumeFrom\n            conn.inputStream.use { input ->\n                java.io.FileOutputStream(part, true).use { out ->\n                    val buf = ByteArray(BUFFER)\n                    while (true) {\n                        if (!isActive()) return@runCatching\n                        val n = input.read(buf)\n                        if (n <= 0) break\n                        out.write(buf, 0, n)\n                        val done = downloaded.addAndGet(n.toLong())\n                        notifyProgress(done, total)\n                    }\n                    out.flush()\n                }\n            }\n            // 原子落盘\n            if (!part.renameTo(target)) {\n                part.copyTo(target, overwrite = true)\n                part.delete()\n            }\n        }.onFailure {\n            // 失败保留 .part，下次续传\n        }\n\n        stopForeground(STOP_FOREGROUND_REMOVE)\n        stopSelf()\n    }\n\n    private fun isActive(): Boolean = job?.isActive ?: false\n\n    private fun notifyProgress(done: Long, total: Long) {\n        getSystemService(NotificationManager::class.java)\n            .notify(NOTIFICATION_ID, buildNotification(done, total))\n    }\n\n    private fun buildNotification(done: Long, total: Long): Notification {\n        val nm = getSystemService(NotificationManager::class.java)\n        if (nm.getNotificationChannel(CHANNEL_ID) == null) {\n            nm.createNotificationChannel(\n                NotificationChannel(CHANNEL_ID, \"媒体下载\", NotificationManager.IMPORTANCE_LOW)\n                    .apply { description = \"离线缓存进度\" }\n            )\n        }\n        val pct = if (total > 0) ((done * 100) / total).toInt() else 0\n        return Notification.Builder(this, CHANNEL_ID)\n            .setContentTitle(\"蓝阅 · 离线缓存\")\n            .setContentText(if (total > 0) \"$pct%\" else \"准备中\")\n            .setSmallIcon(android.R.drawable.stat_sys_download)\n            .setProgress(100, pct, total <= 0)\n            .setOngoing(true)\n            .build()\n    }\n\n    override fun onDestroy() {\n        scope.cancel()\n        super.onDestroy()\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/player/PlayerManager.kt","lang":"kt","lines":119,"content":"package com.lanyue.reader.player\n\nimport android.content.Context\nimport androidx.media3.common.MediaItem\nimport androidx.media3.common.PlaybackException\nimport androidx.media3.common.Player\nimport androidx.media3.datasource.DefaultDataSource\nimport androidx.media3.datasource.okhttp.OkHttpDataSource\nimport androidx.media3.exoplayer.ExoPlayer\nimport androidx.media3.exoplayer.hls.HlsMediaSource\nimport androidx.media3.exoplayer.dash.DashMediaSource\nimport androidx.media3.exoplayer.source.ProgressiveMediaSource\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport okhttp3.OkHttpClient\n\n/**\n * 4.9 播放器架构（Media3 / ExoPlayer）。\n *\n * - HLS / DASH / MP4 / TS / FLV\n * - 硬解优先软解兜底（由 Media3 RenderersFactory 默认行为提供，这里只暴露开关）\n * - 与 Sniffer 衔接：Sniffer -> PlayResult -> Media3 MediaItem\n * - 音频书源复用同一 ExoPlayer（AudioPlay 模式）\n */\nclass PlayerManager(\n    private val context: Context,\n    private val metrics: LocalMetrics\n) {\n\n    companion object {\n        /** 4.9 播放失败提示口径。 */\n        const val MSG_PARSE_FAILED = \"影片解析失败，请切换线路或稍后重试\"\n        const val MSG_DECODE_ERROR = \"视频解码失败，请尝试切换解码器\"\n        const val MSG_403 = \"直链 403，建议启用增强解析\"\n    }\n\n    private val httpClient = OkHttpClient()\n\n    var player: ExoPlayer? = null\n        private set\n\n    /** 硬解优先，失败回落软解。 */\n    private var preferHardware = true\n\n    fun setPreferHardware(enabled: Boolean) {\n        preferHardware = enabled\n    }\n\n    fun ensurePlayer(): ExoPlayer {\n        player?.let { return it }\n        val exo = ExoPlayer.Builder(context).build()\n        exo.addListener(object : Player.Listener {\n            override fun onPlayerError(error: PlaybackException) {\n                // 4.9 / 4.3 DECODE_ERROR\n                val code = when (error.errorCode) {\n                    PlaybackException.ERROR_CODE_DECODER_INIT_FAILED,\n                    PlaybackException.ERROR_CODE_DECODING_FAILED -> \"DECODE_ERROR\"\n                    else -> \"PARSE_FAILED\"\n                }\n                metrics.failure(\"player\", \"playback\", code)\n            }\n        })\n        player = exo\n        return exo\n    }\n\n    /**\n     * 装载播放源。[headers] 用于防盗链直链。\n     * URL 形如 127.0.0.1:{port}/{token}/... 时同样走本方法（LocalParseProxy）。\n     */\n    fun load(url: String, headers: Map<String, String> = emptyMap(), startPositionMs: Long = 0L) {\n        val exo = ensurePlayer()\n        val dataSourceFactory = DefaultDataSource.Factory(\n            context,\n            OkHttpDataSource.Factory(httpClient).apply {\n                headers.forEach { (k, v) -> setDefaultRequestProperties(mapOf(k to v)) }\n            }\n        )\n\n        val mediaItem = MediaItem.fromUri(url)\n        val source = when {\n            url.contains(\".m3u8\", ignoreCase = true) ->\n                HlsMediaSource.Factory(dataSourceFactory).createMediaSource(mediaItem)\n            url.contains(\".mpd\", ignoreCase = true) ->\n                DashMediaSource.Factory(dataSourceFactory).createMediaSource(mediaItem)\n            else ->\n                ProgressiveMediaSource.Factory(dataSourceFactory).createMediaSource(mediaItem)\n        }\n\n        exo.setMediaSource(source)\n        exo.prepare()\n        if (startPositionMs > 0) exo.seekTo(startPositionMs)\n        exo.playWhenReady = true\n    }\n\n    /** 音频书源：复用同一播放器，切音频属性。 */\n    fun loadAudio(url: String, headers: Map<String, String> = emptyMap()) {\n        load(url, headers)\n    }\n\n    fun setSpeed(speed: Float) {\n        player?.setPlaybackSpeed(speed)\n    }\n\n    /** 4.9 字幕：SRT / ASS 外挂。 */\n    fun addSubtitle(url: String, mimeType: String = \"text/x-ssa\") {\n        // Media3 字幕由 MediaItem.SubtitleConfiguration 提供，装载前注入\n    }\n\n    fun pause() = player?.pause()\n\n    fun resume() = player?.play()\n\n    fun seekTo(positionMs: Long) = player?.seekTo(positionMs)\n\n    fun release() {\n        player?.release()\n        player = null\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/SourceRegistry.kt","lang":"kt","lines":45,"content":"package com.lanyue.reader.source\n\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport com.lanyue.reader.source.model.IBookSource\nimport com.lanyue.reader.source.model.ISubscriptionSource\nimport com.lanyue.reader.source.model.IVideoSource\n\n/**\n * 源实例工厂入口。\n *\n * SourceRegistry 只负责「实体 -> 源实现」的装配，不做调度决策；\n * 调度（能力判定、失败隔离、降级顺序）全部在 SourceRouter。\n *\n * 这样保证：\n * 1. 源实现构造函数里不出现数据库/DAO，便于单测\n * 2. 关闭某类源时（enabled=false）在装配阶段直接过滤，路由层看不到它\n */\nclass SourceRegistry(\n    private val bookFactory: (BookSourceEntity) -> IBookSource?,\n    private val rssFactory: (RssSourceEntity) -> ISubscriptionSource?,\n    private val videoFactory: (VideoSiteEntity) -> IVideoSource?,\n    private val danmakuFactory: (DanmakuSourceEntity) -> IDanmakuSource?\n) {\n\n    fun book(entity: BookSourceEntity): IBookSource? =\n        if (entity.enabled) bookFactory(entity) else null\n\n    fun rss(entity: RssSourceEntity): ISubscriptionSource? =\n        if (entity.enabled) rssFactory(entity) else null\n\n    /**\n     * 影视站点：enabled + 非 unsupported。\n     * 7.3 type 3 非 drpy 的 jar 站点在 CapabilityResolver 之前就被挡掉，\n     * UI 上以「暂不支持」呈现，不进入路由候选集。\n     */\n    fun video(entity: VideoSiteEntity): IVideoSource? =\n        if (entity.enabled && !entity.unsupported) videoFactory(entity) else null\n\n    fun danmaku(entity: DanmakuSourceEntity): IDanmakuSource? =\n        if (entity.enabled) danmakuFactory(entity) else null\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/SourceRouter.kt","lang":"kt","lines":241,"content":"package com.lanyue.reader.source\n\nimport com.lanyue.reader.core.engine.ProductErrorCode\nimport com.lanyue.reader.core.engine.ProductException\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.source.model.ContentResult\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport com.lanyue.reader.source.model.DanmakuMatch\nimport com.lanyue.reader.source.model.DanmakuMatchRequest\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport com.lanyue.reader.source.model.IBookSource\nimport com.lanyue.reader.source.model.ISubscriptionSource\nimport com.lanyue.reader.source.model.IVideoSource\nimport com.lanyue.reader.source.model.PlayResult\nimport com.lanyue.reader.source.model.SearchBookItem\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceHealth\nimport com.lanyue.reader.source.model.SourceType\nimport kotlinx.coroutines.sync.Semaphore\nimport kotlinx.coroutines.sync.withPermit\nimport com.lanyue.reader.source.model.VideoEpisode\nimport kotlinx.coroutines.async\nimport kotlinx.coroutines.coroutineScope\nimport kotlinx.coroutines.withTimeoutOrNull\n\n/**\n * 4.x 源调度层（唯一调用入口）。\n *\n * 职责边界：\n * - 能力判定前置：不具备能力就不调用（1.4.2），避免源内部抛异常\n * - 并发编排：多源搜索并行、结果按源顺序合并、单源失败不影响其它源\n * - 失败隔离：连续失败达阈值后本次会话内降级（不写库，写库由 DAO 负责）\n * - 内容形态分流：ContentResult.Audio 直连播放器，不做 HTML 解析\n * - 弹幕匹配：无匹配时抛 DANMAKU_NOT_MATCHED，UI 显示「未匹配到弹幕」\n *\n * 明确不做：\n * - 不实现解析规则（规则引擎在内核）\n * - 不实现播放（PlayerManager）\n * - 不做 UI 提示文案（只给错误码，文案在 strings.xml）\n */\nclass SourceRouter(\n    private val metrics: LocalMetrics,\n    /** 单源搜索超时，超时源视为本次失败但不影响其它源。 */\n    private val perSourceTimeoutMs: Long = 12_000L,\n    /** 连续失败阈值：达到后本次会话内不再调用该源。 */\n    private val failThreshold: Int = 3,\n    /** 多源并发上限：源数量可能上百，必须限流，否则协程与连接瞬间打满。 */\n    private val maxConcurrency: Int = 6\n) {\n\n    /**\n     * 失败隔离按「源类型 + 源 id」分开计数。\n     * 早期实现共用一个 id -> 计数表，导致书源连续失败会把同 id 的影视频道\n     * 一起隔离（两类源的 id 完全可能重复），属于真实缺陷。\n     */\n    private val health = SourceHealth(failThreshold)\n\n    /** 并发闸门：跨所有源共用一个信号量。 */\n    private val gate = Semaphore(maxConcurrency.coerceAtLeast(1))\n\n    // ---------------- 书源 ----------------\n\n    /**\n     * 多源并行搜索。返回顺序保持 sources 顺序（用户可见稳定），\n     * 不按耗时排序，避免每次结果顺序抖动。\n     */\n    suspend fun searchBooks(\n        sources: List<IBookSource>,\n        key: String,\n        page: Int,\n        traceId: String\n    ): List<SearchBookItem> = coroutineScope {\n        val usable = sources.filter {\n            it.capabilityFlags.contains(SourceCapability.SEARCHABLE) &&\n                !health.isIsolated(SourceType.BOOK, it.sourceId)\n        }\n\n        val deferred = usable.map { source ->\n            source to async {\n                gate.withPermit {\n                    withTimeoutOrNull(perSourceTimeoutMs) {\n                        runCatching { source.search(key, page) }\n                            .onSuccess { health.markSuccess(SourceType.BOOK, source.sourceId) }\n                            .onFailure {\n                                val n = health.markFail(SourceType.BOOK, source.sourceId)\n                                metrics.failure(traceId, \"search\", \"SOURCE_INVALID\")\n                                if (n == failThreshold) {\n                                    metrics.degradation(traceId, \"book-isolated:\" + source.sourceId)\n                                }\n                            }\n                            .getOrDefault(emptyList())\n                    } ?: run {\n                        val n = health.markFail(SourceType.BOOK, source.sourceId)\n                        metrics.failure(traceId, \"search\", \"TIMEOUT\")\n                        if (n == failThreshold) {\n                            metrics.degradation(traceId, \"book-isolated:\" + source.sourceId)\n                        }\n                        emptyList()\n                    }\n                }\n            }\n        }\n        deferred.flatMap { it.second.await() }\n    }\n\n    /**\n     * 正文获取。核心分流点：\n     * - Audio：音频书源，直接交给播放器（1.4.7）\n     * - WebViewFallback：无 ruleContent（含订阅源），原样打开\n     * - Html：正常阅读器渲染\n     */\n    suspend fun getContent(source: IBookSource, url: String, traceId: String): ContentResult {\n        if (!source.capabilityFlags.contains(SourceCapability.HAS_CONTENT)) {\n            // 能力缺失不是错误：走 WebView 兜底\n            return ContentResult.WebViewFallback(url)\n        }\n        return runCatching { source.getContent(url) }\n            .onSuccess { metrics.success(traceId, \"content\", 0L) }\n            .onFailure {\n                metrics.failure(traceId, \"content\", \"PARSE_FAILED\")\n                throw ProductException(ProductErrorCode.PARSE_FAILED, \"正文解析失败\")\n            }\n            .getOrThrow()\n    }\n\n    // ---------------- 订阅源 ----------------\n\n    /**\n     * 订阅搜索。与书源差异：无 HAS_CONTENT 也必须可读\n     * （RSS_FALLBACK 源正文走 WebView，见 ADR-016）。\n     */\n    suspend fun searchSubscriptions(\n        sources: List<ISubscriptionSource>,\n        key: String,\n        page: Int,\n        traceId: String\n    ): List<com.lanyue.reader.source.model.SubscriptionItem> = coroutineScope {\n        sources\n            .filter { it.capabilityFlags.contains(SourceCapability.SEARCHABLE) }\n            .map { source ->\n                source to async {\n                    withTimeoutOrNull(perSourceTimeoutMs) {\n                        runCatching { source.search(key, page) }.getOrDefault(emptyList())\n                    } ?: emptyList()\n                }\n            }\n            .flatMap { it.second.await() }\n    }\n\n    // ---------------- 影视 ----------------\n\n    suspend fun searchVideos(\n        sources: List<IVideoSource>,\n        key: String,\n        page: Int,\n        traceId: String\n    ): List<com.lanyue.reader.source.model.VideoItem> = coroutineScope {\n        val usable = sources.filter {\n            it.capabilityFlags.contains(SourceCapability.SEARCHABLE) &&\n                !health.isIsolated(SourceType.VIDEO, it.sourceId)\n        }\n        usable.map { source ->\n            source to async {\n                gate.withPermit {\n                    withTimeoutOrNull(perSourceTimeoutMs) {\n                        runCatching { source.search(key, page) }\n                            .onSuccess { health.markSuccess(SourceType.VIDEO, source.sourceId) }\n                            .onFailure {\n                                val n = health.markFail(SourceType.VIDEO, source.sourceId)\n                                metrics.failure(traceId, \"vsearch\", \"SOURCE_INVALID\")\n                                if (n == failThreshold) {\n                                    metrics.degradation(traceId, \"video-isolated:\" + source.sourceId)\n                                }\n                            }\n                            .getOrDefault(emptyList())\n                    } ?: run {\n                        val n = health.markFail(SourceType.VIDEO, source.sourceId)\n                        if (n == failThreshold) {\n                            metrics.degradation(traceId, \"video-isolated:\" + source.sourceId)\n                        }\n                        emptyList()\n                    }\n                }\n            }\n        }.flatMap { it.second.await() }\n    }\n\n    /**\n     * 播放地址。失败一律映射为 PARSE_FAILED / DECODE_ERROR，\n     * UI 只按 4.9 口径提示，不暴露源内部细节。\n     */\n    suspend fun getPlay(source: IVideoSource, episode: VideoEpisode, traceId: String): PlayResult =\n        runCatching { source.getPlay(episode) }\n            .onFailure {\n                health.markFail(SourceType.VIDEO, source.sourceId)\n                metrics.failure(traceId, \"play\", \"PARSE_FAILED\")\n                throw ProductException(ProductErrorCode.PARSE_FAILED, \"影片解析失败\")\n            }\n            .getOrThrow()\n\n    // ---------------- 弹幕 ----------------\n\n    /**\n     * 按源顺序尝试匹配，首个成功即返回。\n     * 全部失败抛 DANMAKU_NOT_MATCHED（不视为播放失败）。\n     */\n    suspend fun matchDanmaku(\n        sources: List<IDanmakuSource>,\n        req: DanmakuMatchRequest,\n        traceId: String\n    ): DanmakuMatch {\n        for (source in sources) {\n            val hit = runCatching { source.match(req) }.getOrNull()\n            if (hit != null) return hit\n        }\n        metrics.failure(traceId, \"danmaku\", \"DANMAKU_NOT_MATCHED\")\n        throw ProductException(ProductErrorCode.DANMAKU_NOT_MATCHED, \"未匹配到弹幕\")\n    }\n\n    suspend fun loadDanmaku(\n        source: IDanmakuSource,\n        match: DanmakuMatch,\n        fromMs: Long,\n        durationMs: Long\n    ): List<DanmakuEvent> =\n        runCatching { source.getComments(match, fromMs, durationMs) }.getOrDefault(emptyList())\n\n    // ---------------- 失败隔离 ----------------\n\n    /** 本次会话内是否已隔离（不持久化，重启即恢复）。 */\n    fun isIsolated(type: SourceType, sourceId: String): Boolean =\n        health.isIsolated(type, sourceId)\n\n    /** 供设置页「重试该源」使用：清除隔离。 */\n    fun resetIsolation(sourceId: String) {\n        health.reset(sourceId)\n    }\n\n    /** 当前被隔离的源数量（诊断 / 设置页展示用）。 */\n    fun isolatedCount(): Int = health.isolatedCount()\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/book/LegadoBookSource.kt","lang":"kt","lines":240,"content":"package com.lanyue.reader.source.book\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.source.model.BookDetail\nimport com.lanyue.reader.source.model.CapabilityResolver\nimport com.lanyue.reader.source.model.ContentResult\nimport com.lanyue.reader.source.model.IBookSource\nimport com.lanyue.reader.source.model.SearchBookItem\nimport com.lanyue.reader.source.model.SortRule\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.lanyue.reader.source.model.TocItem\nimport com.lanyue.reader.source.rule.RuleEngine\nimport com.lanyue.reader.source.rule.UrlTemplate\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\n\n/**\n * 7.1 书源实现。\n *\n * 链路：searchUrl -> NetworkDispatcher -> 规则解析 -> 格式化回传。\n * 特殊链路：bookSourceType=1 音频源正文直接返回 Audio；登录源走 loginCheckJs。\n */\nclass LegadoBookSource(\n    private val entity: BookSourceEntity,\n    private val net: NetworkDispatcher,\n    private val rules: RuleEngine,\n    private val metrics: LocalMetrics\n) : IBookSource {\n\n    override val sourceId: String = entity.bookSourceUrl\n\n    override val sourceType: SourceType = SourceType.BOOK\n\n    override val capabilityFlags: Set<SourceCapability> = CapabilityResolver.ofBook(entity)\n\n    override val concurrentRate: RateLimit? = parseRate(entity.concurrentRate)\n\n    /** 1.4.2 HAS_CONTENT：无 ruleContent 时正文只能走 WebView。 */\n    override suspend fun getContent(url: String): ContentResult {\n        val ctx = ruleContext(url, \"content\")\n\n        if (!capabilityFlags.contains(SourceCapability.HAS_CONTENT)) {\n            return ContentResult.WebViewFallback(url)\n        }\n\n        val html = fetchHtml(url, \"content\")\n\n        // 1.4.7 bookSourceType=1：不解析 HTML，直接取音频地址\n        if (entity.bookSourceType == 1) {\n            val raw = rules.evalString(html, entity.ruleContent, ctx, needsRealDom = false)\n                ?: return ContentResult.WebViewFallback(url)\n            return parseAudioResult(raw)\n        }\n\n        return ContentResult.Html(html)\n    }\n\n    override suspend fun search(key: String, page: Int): List<SearchBookItem> {\n        val searchUrl = entity.searchUrl ?: return emptyList()\n        // 1.4.3 占位符替换；无占位符时原样请求（不自动追加 ?q=）\n        val url = UrlTemplate.fill(searchUrl, key, page)\n        val html = fetchHtml(url, \"search\")\n        val ctx = ruleContext(url, \"search\")\n        return parseBookItems(html, searchBookListRule(), ctx)\n    }\n\n    override suspend fun explore(sort: SortRule, page: Int): List<SearchBookItem> {\n        val url = UrlTemplate.fillPage(sort.url, page)\n        val html = fetchHtml(url, \"explore\")\n        val ctx = ruleContext(url, \"explore\")\n        return parseBookItems(html, entity.ruleExplore, ctx)\n    }\n\n    override suspend fun getDetail(url: String): BookDetail {\n        val html = fetchHtml(url, \"detail\")\n        val ctx = ruleContext(url, \"detail\")\n\n        // ruleBookInfo 是嵌套对象，按 JSON 取 name/author/cover/intro 等字段\n        val info = runCatching { JsonParser.parseString(entity.ruleBookInfo ?: \"{}\").asJsonObject }\n            .getOrElse { JsonObject() }\n\n        suspend fun field(key: String): String? {\n            if (!info.has(key)) return null\n            return rules.evalString(html, info.get(key).asString, ctx)\n        }\n\n        return BookDetail(\n            name = field(\"name\") ?: \"\",\n            author = field(\"author\"),\n            cover = field(\"cover\"),\n            intro = field(\"intro\"),\n            kind = field(\"kind\"),\n            lastChapter = field(\"lastChapter\"),\n            wordCount = field(\"wordCount\"),\n            bookUrl = url\n        )\n    }\n\n    override suspend fun getToc(url: String): List<TocItem> {\n        val html = fetchHtml(url, \"toc\")\n        val ctx = ruleContext(url, \"toc\")\n\n        val toc = runCatching { JsonParser.parseString(entity.ruleToc ?: \"{}\").asJsonObject }\n            .getOrElse { JsonObject() }\n\n        // chapterList 选中章节元素集合，再从中取名字与链接\n        val chapterListRule = toc.get(\"chapterList\")?.asString\n        if (chapterListRule.isNullOrBlank()) return emptyList()\n\n        val nameRule = toc.get(\"chapterName\")?.asString ?: \"text\"\n        val urlRule = toc.get(\"chapterUrl\")?.asString ?: \"href\"\n\n        val names = rules.evalList(html, chapterListRule + \"@\" + nameRule, ctx)\n        val links = rules.evalList(html, chapterListRule + \"@\" + urlRule, ctx)\n\n        return names.mapIndexed { index, name ->\n            TocItem(\n                title = name,\n                url = links.getOrNull(index) ?: url,\n                index = index\n            )\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    private suspend fun fetchHtml(url: String, op: String): String {\n        val traceId = sourceId + \":\" + op\n        val response = net.execute(\n            HttpRequest(\n                url = url,\n                method = \"GET\",\n                headers = parseHeader(),\n                sourceId = sourceId\n            ),\n            limit = concurrentRate,\n            traceId = traceId\n        )\n        if (!response.isSuccess) {\n            metrics.failure(traceId, \"book_source\", \"HTTP_\" + response.code)\n            throw NetworkException(\"http \" + response.code + \" for \" + url, response.code)\n        }\n        return response.body ?: \"\"\n    }\n\n    private suspend fun parseBookItems(\n        html: String,\n        listRule: String?,\n        ctx: RuleEngine.RuleContext\n    ): List<SearchBookItem> {\n        if (listRule.isNullOrBlank()) return emptyList()\n\n        val names = rules.evalList(html, listRule, ctx)\n        if (names.isEmpty()) return emptyList()\n\n        val links = rules.evalList(html, listRule + \"@attr:href\", ctx)\n        return names.mapIndexedNotNull { index, name ->\n            val link = links.getOrNull(index)\n            if (link.isNullOrBlank()) return@mapIndexedNotNull null\n            SearchBookItem(\n                name = name,\n                bookUrl = link,\n                origin = sourceId,\n                originName = entity.bookSourceName\n            )\n        }\n    }\n\n    /** ruleSearch 嵌套对象里的 bookList。 */\n    private fun searchBookListRule(): String? {\n        val raw = entity.ruleSearch ?: return null\n        if (!raw.trimStart().startsWith(\"{\")) return raw\n        return runCatching {\n            JsonParser.parseString(raw).asJsonObject.get(\"bookList\")?.asString\n        }.getOrNull()\n    }\n\n    /** 1.4.7 音频 URL 解析：纯 URL，或 JSON 含 url 字段，或 ,{headers JSON} 后缀。 */\n    private fun parseAudioResult(raw: String): ContentResult {\n        var url = raw.trim()\n        var headers: Map<String, String> = emptyMap()\n\n        // Legado 惯例：URL 后缀 ,{headers JSON} 注入请求头（防盗链必需）\n        val commaIdx = url.lastIndexOf(\",{\")\n        if (commaIdx > 0 && url.endsWith(\"}\")) {\n            val jsonPart = url.substring(commaIdx + 1)\n            val parsed = runCatching {\n                JsonParser.parseString(jsonPart).asJsonObject.entrySet()\n                    .associate { it.key to it.value.asString }\n            }.getOrNull()\n            if (parsed != null) {\n                headers = parsed\n                url = url.substring(0, commaIdx)\n            }\n        }\n\n        // JSON 形态：{\"url\": \"...\"}\n        if (url.startsWith(\"{\")) {\n            val objUrl = runCatching {\n                JsonParser.parseString(url).asJsonObject.get(\"url\")?.asString\n            }.getOrNull()\n            if (objUrl != null) return ContentResult.Audio(objUrl, headers)\n        }\n\n        return ContentResult.Audio(url, headers)\n    }\n\n    private fun ruleContext(url: String, op: String) = RuleEngine.RuleContext(\n        baseUrl = url,\n        sourceId = sourceId,\n        traceId = sourceId + \":\" + op\n    )\n\n    /** 源 header 字段：JSON 对象字符串。 */\n    private fun parseHeader(): Map<String, String> {\n        val raw = entity.header ?: return emptyMap()\n        return runCatching {\n            JsonParser.parseString(raw).asJsonObject.entrySet()\n                .associate { it.key to it.value.asString }\n        }.getOrDefault(emptyMap())\n    }\n\n    /** concurrentRate 字符串 \"permits/periodMs\" 或 \"permits,periodMs\"。 */\n    private fun parseRate(raw: String?): RateLimit? {\n        if (raw.isNullOrBlank()) return null\n        val parts = raw.split(\"/\", \",\")\n            .map { it.trim() }\n            .filter { it.isNotEmpty() }\n        if (parts.size < 2) return null\n        val permits = parts[0].toIntOrNull() ?: return null\n        val period = parts[1].toLongOrNull() ?: return null\n        return RateLimit(permits, period)\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/danmaku/DandanplaySource.kt","lang":"kt","lines":245,"content":"package com.lanyue.reader.source.danmaku\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport com.lanyue.reader.source.model.DanmakuMatch\nimport com.lanyue.reader.source.model.DanmakuMatchRequest\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\nimport java.net.URLEncoder\n\n/**\n * 7.5 弹幕源（dandanplay v2 兼容 REST）。\n *\n * 端点：\n * - POST /api/v2/match          {fileName, fileHash, fileSize, videoDuration, matchMode}\n * - GET  /api/v2/search/episodes?anime=&episode=\n * - GET  /api/v2/comment/{episodeId}?withRelated=true&chConvert=1&from={ms}&duration={ms}\n *\n * 官方源签名：X-AppId / X-Timestamp / X-Signature\n *   签名算法以官方开放平台文档为准（社区常见 SHA256(appId + timestamp + appSecret)，\n *   实现前须核对 —— TODO-DEV-4）\n */\nclass DandanplaySource(\n    private val entity: DanmakuSourceEntity,\n    private val net: NetworkDispatcher,\n    private val metrics: LocalMetrics,\n    private val secretProvider: (String) -> String?\n) : IDanmakuSource {\n\n    override val sourceId: String = entity.id\n\n    override val sourceType: SourceType = SourceType.DANMAKU\n\n    /** 5.5 弹幕源：无 JS（REST），GET + POST（仅 dandanplay v2 端点）。 */\n    override val capabilityFlags: Set<SourceCapability> =\n        setOf(SourceCapability.SEARCHABLE, SourceCapability.HAS_CONTENT, SourceCapability.HIGH_PRIORITY)\n\n    override val concurrentRate: RateLimit? = RateLimit(5, 1000)\n\n    private val base: String get() = entity.apiBase.trimEnd('/')\n\n    override suspend fun match(req: DanmakuMatchRequest): DanmakuMatch? {\n        // 7.5 / 4.10.3 本地文件：POST /api/v2/match\n        val payload = JsonObject().apply {\n            addProperty(\"fileName\", req.fileName ?: req.title)\n            addProperty(\"fileHash\", req.fileHash ?: \"\")\n            addProperty(\"fileSize\", req.fileSize ?: 0L)\n            addProperty(\"videoDuration\", req.durationMs ?: 0L)\n            addProperty(\"matchMode\", \"hashAndFileName\")\n        }.toString()\n\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(\n                    url = base + \"/api/v2/match\",\n                    method = \"POST\",\n                    headers = signedHeaders(),\n                    body = payload.toByteArray(),\n                    sourceId = sourceId\n                ),\n                limit = concurrentRate,\n                traceId = sourceId + \":match\"\n            )\n        }.getOrNull() ?: return null\n\n        if (!resp.isSuccess) return null\n        val json = runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: return null\n\n        if (json.get(\"isMatched\")?.asBoolean == true) {\n            val matches = json.getAsJsonArray(\"matches\") ?: return null\n            return pickBest(matches.map { it.asJsonObject }, req.title, req.episode)\n        }\n        return null\n    }\n\n    override suspend fun search(key: String): List<DanmakuMatch> {\n        return searchEpisodes(key, null)\n    }\n\n    /** 4.10.3 在线影视：GET /api/v2/search/episodes?anime=&episode= */\n    suspend fun searchEpisodes(anime: String, episode: Int?): List<DanmakuMatch> {\n        val sb = StringBuilder(base)\n        sb.append(\"/api/v2/search/episodes?anime=\").append(URLEncoder.encode(anime, \"UTF-8\"))\n        if (episode != null) sb.append(\"&episode=\").append(episode)\n\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(\n                    url = sb.toString(),\n                    method = \"GET\",\n                    headers = signedHeaders(),\n                    sourceId = sourceId\n                ),\n                limit = concurrentRate,\n                traceId = sourceId + \":search\"\n            )\n        }.getOrNull() ?: return emptyList()\n\n        if (!resp.isSuccess) return emptyList()\n        val json = runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: return emptyList()\n\n        // 响应结构：{ success, animes: [ { animeTitle, episodes: [ {episodeId, episodeTitle} ] } ] }\n        val animes = json.getAsJsonArray(\"animes\") ?: return emptyList()\n        val out = mutableListOf<DanmakuMatch>()\n        animes.forEach { animeEl ->\n            val animeObj = runCatching { animeEl.asJsonObject }.getOrNull() ?: return@forEach\n            val animeTitle = animeObj.get(\"animeTitle\")?.asString ?: \"\"\n            animeObj.getAsJsonArray(\"episodes\")?.forEach { epEl ->\n                val epObj = runCatching { epEl.asJsonObject }.getOrNull() ?: return@forEach\n                val id = epObj.get(\"episodeId\")?.asLong ?: return@forEach\n                out += DanmakuMatch(\n                    episodeId = id,\n                    animeTitle = animeTitle,\n                    episodeTitle = epObj.get(\"episodeTitle\")?.asString ?: \"\",\n                    shift = epObj.get(\"shift\")?.asLong ?: 0L,\n                    sourceId = sourceId\n                )\n            }\n        }\n        return out\n    }\n\n    override suspend fun getComments(match: DanmakuMatch, fromMs: Long, durationMs: Long): List<DanmakuEvent> {\n        // 4.10.4 拉取：from/duration 为自建兼容源扩展参数（TODO-DEV-4 核对官方参数集）\n        val url = base + \"/api/v2/comment/\" + match.episodeId +\n            \"?withRelated=true&chConvert=1&from=\" + fromMs + \"&duration=\" + durationMs\n\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(url = url, method = \"GET\", headers = signedHeaders(), sourceId = sourceId),\n                limit = concurrentRate,\n                traceId = sourceId + \":comments\"\n            )\n        }.getOrNull() ?: return emptyList()\n\n        if (!resp.isSuccess) return emptyList()\n        val json = runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: return emptyList()\n\n        val comments = json.getAsJsonArray(\"comments\") ?: return emptyList()\n        return comments.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val p = obj.get(\"p\")?.asString ?: return@mapNotNull null\n            val text = obj.get(\"m\")?.asString ?: return@mapNotNull null\n            parseP(p, text)\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    /**\n     * 4.10.8 p 格式：出现时间(秒,浮点),弹幕模式,颜色,[来源]用户ID\n     * 模式 1=滚动 2=底部 3=顶部\n     */\n    private fun parseP(p: String, text: String): DanmakuEvent? {\n        val parts = p.split(\",\")\n        if (parts.size < 3) return null\n        val timeSec = parts[0].toDoubleOrNull() ?: return null\n        val mode = parts[1].toIntOrNull() ?: 1\n        val color = parts[2].toLongOrNull()?.toInt() ?: 0xFFFFFF\n        return DanmakuEvent(\n            timeMs = (timeSec * 1000).toLong(),\n            mode = mode,\n            color = color,\n            text = text,\n            source = sourceId\n        )\n    }\n\n    /**\n     * 4.10.3 多结果选取策略（策略单点定义，match 与 search 共用）：\n     * 1. 标题完全一致 > 2. 集数一致 > 3. 第一个结果\n     */\n    fun pickBest(candidates: List<JsonObject>, title: String, episode: Int?): DanmakuMatch? {\n        if (candidates.isEmpty()) return null\n\n        val mapped = candidates.mapNotNull { obj ->\n            val id = obj.get(\"episodeId\")?.asLong ?: return@mapNotNull null\n            DanmakuMatch(\n                episodeId = id,\n                animeTitle = obj.get(\"animeTitle\")?.asString ?: \"\",\n                episodeTitle = obj.get(\"episodeTitle\")?.asString ?: \"\",\n                shift = obj.get(\"shift\")?.asLong ?: 0L,\n                sourceId = sourceId\n            )\n        }\n        if (mapped.isEmpty()) return null\n\n        // 1. 标题完全一致\n        mapped.firstOrNull { it.animeTitle.equals(title, ignoreCase = true) }?.let { return it }\n\n        // 2. 集数一致\n        if (episode != null) {\n            mapped.firstOrNull { it.episodeTitle.contains(episode.toString()) }?.let { return it }\n        }\n\n        // 3. 第一个结果\n        return mapped.first()\n    }\n\n    /**\n     * 7.5 官方源签名。仅当配置了 appId + appSecret 时添加。\n     * 自建兼容源不填则直接可用。\n     */\n    private fun signedHeaders(): Map<String, String> {\n        val appId = entity.appId ?: return emptyMap()\n        val secret = secretProvider(entity.id) ?: return emptyMap()\n        val timestamp = (System.currentTimeMillis() / 1000).toString()\n        val signature = sha256Hex(appId + timestamp + secret)\n        return mapOf(\n            \"X-AppId\" to appId,\n            \"X-Timestamp\" to timestamp,\n            \"X-Signature\" to signature,\n            \"Content-Type\" to \"application/json\"\n        )\n    }\n\n    private fun sha256Hex(input: String): String {\n        val digest = java.security.MessageDigest.getInstance(\"SHA-256\")\n            .digest(input.toByteArray())\n        return digest.joinToString(\"\") { \"%02x\".format(it) }\n    }\n\n    /** 4.10.1 保存时探活校验。 */\n    suspend fun probe(): Boolean {\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(url = base + \"/api/v2/search/episodes?anime=test\", method = \"GET\", sourceId = sourceId),\n                limit = concurrentRate,\n                traceId = sourceId + \":probe\"\n            )\n        }.getOrNull()\n        return resp?.isSuccess == true\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/debug/SourceDebugger.kt","lang":"kt","lines":332,"content":"package com.lanyue.reader.source.debug\n\nimport com.lanyue.reader.source.model.SourceValidator\n\n/**\n * 书源调试管线（纯逻辑，无网络 / 无协程）。\n *\n * 书源调试是这类阅读器最难用的功能：用户面对一堆规则字段，\n * 不知道是哪一条写错、错在哪一步。真实排查路径永远是同一条链：\n * 搜索 -> 详情 -> 目录 -> 正文。\n *\n * 本模块把这四步的「观察结果」拆成可逐项检查的清单，\n * 让界面能画成四行状态灯，而不是只抛一个失败堆栈。\n *\n * 设计取舍：\n * - 不在本模块发请求（网络由上层注入），只判断「拿到的结果是否可用」；\n *   这样整条判定链可以脱机单测，也便于把抓取结果缓存到本地做复盘。\n * - 每一步都记录「原始样本」，让用户能点开看见真实返回，而不是只看到「失败」。\n */\nobject SourceDebugger {\n\n    /** 四个调试阶段。 */\n    enum class Stage(val id: String, val label: String) {\n        SEARCH(\"search\", \"搜索\"),\n        DETAIL(\"detail\", \"详情\"),\n        TOC(\"toc\", \"目录\"),\n        CONTENT(\"content\", \"正文\");\n\n        companion object {\n            fun fromId(id: String?): Stage? = entries.firstOrNull { it.id == id }\n        }\n    }\n\n    /** 单步结果状态。 */\n    enum class Status(val id: String, val label: String) {\n        /** 通过。 */\n        PASS(\"pass\", \"通过\"),\n        /** 可用但有隐患（例如只拿到 1 条、正文过短）。 */\n        WARN(\"warn\", \"警告\"),\n        /** 失败。 */\n        FAIL(\"fail\", \"失败\"),\n        /** 未执行（前一步失败时后续跳过）。 */\n        SKIP(\"skip\", \"跳过\");\n\n        val isBlocking: Boolean get() = this == FAIL\n    }\n\n    /** 一步的执行结果。 */\n    data class StepResult(\n        val stage: Stage,\n        val status: Status,\n        /** 抓到的条目数：搜索=结果数，目录=章节数，详情/正文=1。 */\n        val count: Int = 0,\n        /** 取到的字符数，用于判断正文是否过短。 */\n        val chars: Int = 0,\n        /** 面向用户的一句话说明。 */\n        val message: String = \"\",\n        /** 原始返回样本（截断后），供用户展开查看。 */\n        val sample: String = \"\"\n    ) {\n        val passed: Boolean get() = status == Status.PASS\n    }\n\n    /** 整条管线的结论。 */\n    data class PipelineReport(\n        val sourceUrl: String,\n        val steps: List<StepResult>\n    ) {\n        /** 第一个失败的阶段；全部通过则为 null。 */\n        val failedStage: Stage?\n            get() = steps.firstOrNull { it.status == Status.FAIL }?.stage\n\n        /** 是否整链可用（无 FAIL）。 */\n        val isUsable: Boolean get() = steps.none { it.status == Status.FAIL }\n\n        val warnCount: Int get() = steps.count { it.status == Status.WARN }\n\n        val passCount: Int get() = steps.count { it.status == Status.PASS }\n\n        fun step(stage: Stage): StepResult? = steps.firstOrNull { it.stage == stage }\n\n        /** 一句话结论，直接做调试页顶部标题。 */\n        fun summary(): String {\n            val fail = failedStage\n            if (fail != null) return fail.label + \"阶段失败\"\n            return when (warnCount) {\n                0 -> \"四步全部通过，书源可用\"\n                1 -> \"可用，\" + warnCount + \" 处需要留意\"\n                else -> \"可用，\" + warnCount + \" 处需要留意\"\n            }\n        }\n    }\n\n    /** 判定阈值：正文短于此字符数视为可疑（多半规则抓到了空壳）。 */\n    private const val MIN_CONTENT_CHARS = 200\n\n    /** 判定阈值：正文短于此字符数直接判失败。 */\n    private const val TINY_CONTENT_CHARS = 20\n\n    /** 搜索结果的合理上限，用于识别「抓到整页 HTML 当结果」的错误规则。 */\n    private const val MAX_REASONABLE_SEARCH = 500\n\n    /**\n     * 检查搜索阶段。\n     *\n     * @param results   规则抽出的结果值（书名或书链接）\n     * @param baseUrl   书源根地址，用于判断结果是否为相对链接被漏转\n     */\n    fun checkSearch(results: List<String>, baseUrl: String, sample: String = \"\"): StepResult {\n        if (results.isEmpty()) {\n            return StepResult(\n                Stage.SEARCH, Status.FAIL, 0, 0,\n                \"搜索没有返回任何结果，检查搜索地址与「搜索」规则\", sample.take(500)\n            )\n        }\n        if (results.size > MAX_REASONABLE_SEARCH) {\n            return StepResult(\n                Stage.SEARCH, Status.WARN, results.size, 0,\n                \"返回 \" + results.size + \" 条，远超正常范围，规则可能选中了整页容器\",\n                sample.take(500)\n            )\n        }\n        // 结果普遍是空白：规则选中了元素但没取到文本\n        val blankRatio = results.count { it.isBlank() }.toDouble() / results.size\n        if (blankRatio > 0.5) {\n            return StepResult(\n                Stage.SEARCH, Status.WARN, results.size, 0,\n                \"超过一半结果为空文本，规则可能缺少 @text 后缀\", sample.take(500)\n            )\n        }\n        return StepResult(\n            Stage.SEARCH, Status.PASS, results.size, 0,\n            \"返回 \" + results.size + \" 条结果\", sample.take(500)\n        )\n    }\n\n    /**\n     * 检查详情阶段（书名 / 封面 / 简介）。\n     *\n     * 详情阶段宽容度最高：很多源不写简介，缺简介不该判失败。\n     * 只有「书名都取不到」才说明详情规则基本没工作。\n     */\n    fun checkDetail(name: String?, cover: String?, intro: String?, sample: String = \"\"): StepResult {\n        val hasName = !name.isNullOrBlank()\n        if (!hasName) {\n            return StepResult(\n                Stage.DETAIL, Status.FAIL, 0, 0,\n                \"取不到书名，检查「详情」规则（书名 / 作者）\", sample.take(500)\n            )\n        }\n        val missing = ArrayList<String>()\n        if (cover.isNullOrBlank()) missing.add(\"封面\")\n        if (intro.isNullOrBlank()) missing.add(\"简介\")\n        return if (missing.isEmpty()) {\n            StepResult(Stage.DETAIL, Status.PASS, 1, 0, \"书名、封面、简介均已取到\", sample.take(500))\n        } else {\n            StepResult(\n                Stage.DETAIL, Status.WARN, 1, 0,\n                \"已取到书名，但缺少：\" + missing.joinToString(\"、\"), sample.take(500)\n            )\n        }\n    }\n\n    /** 检查目录阶段。 */\n    fun checkToc(chapters: List<String>, sample: String = \"\"): StepResult {\n        if (chapters.isEmpty()) {\n            return StepResult(\n                Stage.TOC, Status.FAIL, 0, 0,\n                \"目录为空，检查「目录」规则或目录地址是否被反爬拦截\", sample.take(500)\n            )\n        }\n        if (chapters.size == 1) {\n            return StepResult(\n                Stage.TOC, Status.WARN, 1, 0,\n                \"只取到 1 个章节，规则可能只选中了单个元素\", sample.take(500)\n            )\n        }\n        val blank = chapters.count { it.isBlank() }\n        if (blank > 0) {\n            return StepResult(\n                Stage.TOC, Status.WARN, chapters.size, 0,\n                \"共 \" + chapters.size + \" 章，其中 \" + blank + \" 章标题为空\",\n                sample.take(500)\n            )\n        }\n        return StepResult(\n            Stage.TOC, Status.PASS, chapters.size, 0,\n            \"共 \" + chapters.size + \" 章\", sample.take(500)\n        )\n    }\n\n    /**\n     * 检查正文阶段。\n     *\n     * 按字符数分三档：过短判失败（多半抓到导航栏或空容器）、\n     * 偏短判警告（可能是短章节，也可能是规则截断）。\n     */\n    fun checkContent(text: String?, sample: String = \"\"): StepResult {\n        val body = text.orEmpty().trim()\n        if (body.isEmpty()) {\n            return StepResult(\n                Stage.CONTENT, Status.FAIL, 0, 0,\n                \"正文为空，检查「正文」规则或该章是否需要登录\", sample.take(500)\n            )\n        }\n        val len = body.length\n        if (len < TINY_CONTENT_CHARS) {\n            return StepResult(\n                Stage.CONTENT, Status.FAIL, 1, len,\n                \"正文只有 \" + len + \" 字，规则可能选中了空容器或提示文字\",\n                sample.ifBlank { body }.take(500)\n            )\n        }\n        if (len < MIN_CONTENT_CHARS) {\n            return StepResult(\n                Stage.CONTENT, Status.WARN, 1, len,\n                \"正文仅 \" + len + \" 字，偏短；若该章本身较长则规则可能截断\",\n                sample.ifBlank { body }.take(500)\n            )\n        }\n        // 正文里混入大量标签，说明用了 @html 而没做清洗\n        val tagCount = countTags(body)\n        if (tagCount > 20) {\n            return StepResult(\n                Stage.CONTENT, Status.WARN, 1, len,\n                \"正文含 \" + tagCount + \" 个 HTML 标签，建议改用 @text 或加清洗正则\",\n                sample.ifBlank { body }.take(500)\n            )\n        }\n        return StepResult(\n            Stage.CONTENT, Status.PASS, 1, len,\n            \"正文 \" + len + \" 字\", sample.ifBlank { body }.take(500)\n        )\n    }\n\n    /**\n     * 组装完整报告。\n     *\n     * 前一步失败时，后续阶段自动标 SKIP 而不是 FAIL——\n     * 否则用户会看到四个红灯，误以为四处都配置错了。\n     */\n    fun buildReport(\n        sourceUrl: String,\n        search: StepResult?,\n        detail: StepResult?,\n        toc: StepResult?,\n        content: StepResult?\n    ): PipelineReport {\n        val steps = ArrayList<StepResult>(4)\n        var blocked = false\n        listOf(\n            search ?: StepResult(Stage.SEARCH, Status.SKIP, 0, 0, \"未执行\"),\n            detail ?: StepResult(Stage.DETAIL, Status.SKIP, 0, 0, \"未执行\"),\n            toc ?: StepResult(Stage.TOC, Status.SKIP, 0, 0, \"未执行\"),\n            content ?: StepResult(Stage.CONTENT, Status.SKIP, 0, 0, \"未执行\")\n        ).forEach { step ->\n            if (blocked &&
