<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蓝阅 Android · 源码浏览</title>
<style>:root {
  --bg: #0d1117;
  --panel: #141a22;
  --panel-2: #1a212b;
  --border: #242d39;
  --text: #d5dde8;
  --muted: #7c8a9c;
  --dim: #55636f;
  --accent: #e0a84a;
  --accent-soft: rgba(224, 168, 74, 0.14);
  --hit: rgba(224, 168, 74, 0.18);

  --kw: #7aa2f7;
  --str: #9ece6a;
  --com: #5b6878;
  --num: #ff9e64;
  --ann: #e0af68;
  --typ: #7dcfff;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

body {
  display: grid;
  grid-template-rows: 58px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ---------- header ---------- */

header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}

.brand h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin: 0;
  white-space: nowrap;
}

.brand .sub {
  font-size: 11.5px;
  color: var(--muted);
  font-family: var(--mono);
  white-space: nowrap;
}

.stats {
  display: flex;
  gap: 16px;
  margin-left: 6px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
}

.stats b {
  color: var(--text);
  font-weight: 600;
}

.spacer { flex: 1; }

button {
  font-family: inherit;
  font-size: 12.5px;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}

button:hover {
  background: #212a36;
  border-color: #33404f;
}

button:active { transform: translateY(0.5px); }

button.primary {
  background: var(--accent-soft);
  border-color: rgba(224, 168, 74, 0.35);
  color: var(--accent);
}

button.primary:hover {
  background: rgba(224, 168, 74, 0.22);
  border-color: rgba(224, 168, 74, 0.55);
}

button svg { width: 14px; height: 14px; flex: none; }

/* ---------- layout ---------- */

.shell {
  display: grid;
  grid-template-columns: 306px 1fr;
  min-height: 0;
  overflow: hidden;
}

/* ---------- sidebar ---------- */

aside {
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-right: 1px solid var(--border);
  min-height: 0;
}

.searchwrap {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.searchbox {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
}

.searchbox:focus-within {
  border-color: rgba(224, 168, 74, 0.5);
}

.searchbox svg {
  width: 13px;
  height: 13px;
  color: var(--dim);
  flex: none;
}

.searchbox input {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
}

.searchbox input::placeholder { color: var(--dim); }

.searchmeta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--dim);
  padding: 7px 2px 0;
  min-height: 15px;
}

.tree {
  flex: 1;
  overflow: auto;
  padding: 6px 6px 24px;
}

.tree::-webkit-scrollbar,
.code-pane::-webkit-scrollbar,
.results::-webkit-scrollbar { width: 11px; height: 11px; }

.tree::-webkit-scrollbar-thumb,
.code-pane::-webkit-scrollbar-thumb,
.results::-webkit-scrollbar-thumb {
  background: #2b3644;
  border-radius: 6px;
  border: 3px solid var(--panel);
}

.folder > .folder-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--muted);
  user-select: none;
}

.folder > .folder-row:hover { background: var(--panel-2); color: var(--text); }

.folder .chev {
  width: 12px;
  height: 12px;
  flex: none;
  transition: transform 0.15s;
  color: var(--dim);
}

.folder.open > .folder-row > .chev { transform: rotate(90deg); }

.folder > .children { display: none; padding-left: 11px; }
.folder.open > .children { display: block; }

.file-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--muted);
  font-family: var(--mono);
}

.file-row:hover { background: var(--panel-2); color: var(--text); }

.file-row.active {
  background: var(--accent-soft);
  color: var(--accent);
}

.file-row .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex: none;
  background: var(--dim);
}

.file-row.kt .dot { background: #8b7ef8; }
.file-row.py .dot { background: #4b8bbe; }
.file-row.sh .dot { background: #6fbf73; }
.file-row.xml .dot { background: #d98b4a; }
.file-row.kts .dot { background: #c78af7; }

/* ---------- results ---------- */

.results {
  flex: 1;
  overflow: auto;
  padding: 6px 6px 24px;
  display: none;
}

.results.on { display: block; }
.results.on + .tree { display: none; }

.result {
  padding: 7px 9px;
  border-radius: 6px;
  cursor: pointer;
  border-left: 2px solid transparent;
}

.result:hover { background: var(--panel-2); }

.result .rp {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.result .rl {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.result mark {
  background: rgba(224, 168, 74, 0.28);
  color: var(--accent);
  border-radius: 2px;
  padding: 0 1px;
}

.result .ln-no { color: var(--dim); margin-right: 6px; }

/* ---------- main ---------- */

main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
}

.filebar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  height: 44px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex: none;
}

.path {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.path b { color: var(--text); font-weight: 600; }

.filestats {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
  flex: none;
}

.code-pane {
  flex: 1;
  overflow: auto;
  min-height: 0;
  position: relative;
}

table.code {
  border-collapse: collapse;
  width: 100%;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.62;
  tab-size: 4;
}

table.code td {
  padding: 0;
  vertical-align: top;
  white-space: pre;
}

td.gutter {
  width: 56px;
  min-width: 56px;
  text-align: right;
  padding: 0 12px 0 10px;
  color: var(--dim);
  user-select: none;
  font-size: 11.5px;
  position: sticky;
  left: 0;
  background: var(--bg);
  border-right: 1px solid rgba(36, 45, 57, 0.7);
}

td.src { padding-left: 14px; padding-right: 24px; }

tr.hit td { background: var(--hit); }
tr.hit td.gutter { color: var(--accent); }

.k, .s, .c, .n, .a, .t { }
.k { color: var(--kw); }
.s { color: var(--str); }
.c { color: var(--com); font-style: italic; }
.n { color: var(--num); }
.a { color: var(--ann); }
.t { color: var(--typ); }

.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--dim);
  font-size: 13px;
}

.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #1f2833;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 12.5px;
  padding: 9px 16px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 50;
}

.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  body { grid-template-rows: auto 1fr; }
  header { flex-wrap: wrap; padding: 10px 14px; gap: 10px; height: auto; }
  .stats { display: none; }
  .shell { grid-template-columns: 1fr; grid-template-rows: 232px 1fr; }
  aside { border-right: none; border-bottom: 1px solid var(--border); }
  td.gutter { width: 42px; min-width: 42px; padding: 0 8px; }
}
</style>
</head>

  function decodeB64(b64) {
    var bin = atob(b64);
    var n = bin.length;
    var bytes = new Uint8Array(n);
    for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
    if (typeof TextDecoder !== 'undefined') {
      return new TextDecoder('utf-8').decode(bytes);
    }
    var s = '';
    for (var j = 0; j < n; j++) s += String.fromCharCode(bytes[j]);
    try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
  }

  files.forEach(function (f) {
    f.text = decodeB64(f.b64);
    delete f.b64;

  function buildTree(list) {
    var root = { name: '', children: {}, files: [] };

      for (var i = 0; i < parts.length - 1; i++) {
        var p = parts[i];
        if (!node.children[p]) node.children[p] = { name: p, children: {}, files: [] };
        node = node.children[p];
      }
      node.files.push(f);
    });
    return root;
  }

        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="9 6 15 12 9 18"></polyline></svg>' +
        '<span></span>';
      row.querySelector('span').textContent = name;
      row.addEventListener('click', function (e) {
        e.stopPropagation();
        wrap.classList.toggle('open');
        openFolders[key] = wrap.classList.contains('open');
      });
      wrap.appendChild(row);

      var kids = document.createElement('div');
      kids.className = 'children';
      renderTree(child, kids, depth + 1, filter);
      wrap.appendChild(kids);
      container.appendChild(wrap);
    });

    node.files.sort(function (a, b) { return a.path.localeCompare(b.path); })
      .forEach(function (f) {
        if (filter && f.path.toLowerCase().indexOf(filter) === -1) return;
        container.appendChild(fileRow(f));
      });
  }

  function subtreeMatches(node, filter) {
    for (var i = 0; i < node.files.length; i++) {
      if (node.files[i].path.toLowerCase().indexOf(filter) !== -1) return true;
    }
    for (var k in node.children) {
      if (subtreeMatches(node.children[k], filter)) return true;
    }
    return false;
  }

  function fileRow(f) {
    var row = document.createElement('div');
    row.className = 'file-row ' + (f.ext || '');
    if (current && current.path === f.path) row.classList.add('active');
    row.setAttribute('data-path', f.path);
    var dot = document.createElement('span');
    dot.className = 'dot';
    var label = document.createElement('span');
    label.textContent = f.name;
    row.appendChild(dot);
    row.appendChild(label);
    row.addEventListener('click', function () { openFile(f.path); });
    return row;
  }

  var ROOT = buildTree(files);

  function paintTree(filter) {
    treeEl.innerHTML = '';
    renderTree(ROOT, treeEl, 0, filter);
  }

  /* ---------------- highlighting ---------------- */

  var KW = /^(package|import|class|object|interface|data|fun|val|var|suspend|private|public|internal|protected|override|return|if|else|when|for|while|do|try|catch|finally|throw|is|as|in|out|null|true|false|this|super|companion|init|constructor|enum|sealed|abstract|open|by|lazy|typealias|inline|reified|crossinline|operator|infix|lateinit|const|vararg|where|break|continue|typeof|new|static|void|int|long|float|double|boolean|char|byte|short|String|def|elif|exception|with|lambda|None|True|False|self|echo|then|fi|esac|done)$/;

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // tokenise a single line; state carries open block-comment across lines
  var TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?|`[^`]*`?)|(@[A-Za-z_][\w.]*)|\b(0[xX][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?[fFlLdD]?)\b|([A-Za-z_][A-Za-z0-9_]*)|([^\s\w]+|\s+)/g;

  function highlightLine(line, state) {
    var out = '';
    var rest = line;

    if (state.inBlock) {
      var end = rest.indexOf('*/');
      if (end === -1) return '<span class="c">' + esc(rest) + '</span>';
      out += '<span class="c">' + esc(rest.slice(0, end + 2)) + '</span>';
      rest = rest.slice(end + 2);
      state.inBlock = false;
    }

    TOKEN.lastIndex = 0;
    var m;
    var buf = '';
    while ((m = TOKEN.exec(rest)) !== null) {
      if (m.index > buf.length) { /* unreachable guard */ }
      if (m[1]) {
        if (m[1].indexOf('/*') === 0 && m[1].indexOf('*/') === -1) {
          state.inBlock = true;
        }
        out += '<span class="c">' + esc(m[1]) + '</span>';
      } else if (m[2]) {
        out += '<span class="s">' + esc(m[2]) + '</span>';
      } else if (m[3]) {
        out += '<span class="a">' + esc(m[3]) + '</span>';
      } else if (m[4]) {
        out += '<span class="n">' + esc(m[4]) + '</span>';
      } else if (m[5]) {
        if (KW.test(m[5])) {
          out += '<span class="k">' + esc(m[5]) + '</span>';
        } else if (/^[A-Z]/.test(m[5])) {
          out += '<span class="t">' + esc(m[5]) + '</span>';
        } else {
          out += esc(m[5]);
        }
      } else {
        out += esc(m[6] || '');
      }
    }
    return out;
  }

  /* ---------------- open file ---------------- */

  function openFile(path, hitLine) {
    var f = null;
    for (var i = 0; i < files.length; i++) {
      if (files[i].path === path) { f = files[i]; break; }
    }
    if (!f) return;

    current = f;

    // sidebar active state
    var rows = treeEl.querySelectorAll('.file-row');
    for (var r = 0; r < rows.length; r++) {
      rows[r].classList.toggle('active', rows[r].getAttribute('data-path') === path);
    }

    // breadcrumb
    var parts = path.split('/');
    var name = parts.pop();
    pathEl.innerHTML = '';
    if (parts.length) {
      var dir = document.createElement('span');
      dir.textContent = parts.join('/') + '/';
      pathEl.appendChild(dir);
    }
    var nm = document.createElement('b');
    nm.textContent = name;
    pathEl.appendChild(nm);

    statsEl.textContent = f.lines + ' 行 · ' + fmtSize(f.size) + ' · ' + (f.ext || 'text');

    // render lines
    var lines = f.text.split('\n');
    var state = { inBlock: false };
    var html = [];
    for (var ln = 0; ln < lines.length; ln++) {
      html.push(
        '<tr data-line="' + (ln + 1) + '"><td class="gutter">' + (ln + 1) +
        '</td><td class="src">' + (highlightLine(lines[ln], state) || '&nbsp;') + '</td></tr>'
      );
    }
    paneEl.innerHTML = '<table class="code"><tbody>' + html.join('') + '</tbody></table>';

    if (hitLine) {
      var tr = paneEl.querySelector('tr[data-line="' + hitLine + '"]');
      if (tr) {
        tr.classList.add('hit');
        paneEl.scrollTop = Math.max(0, tr.offsetTop - 120);
        return;
      }
    }
    paneEl.scrollTop = 0;
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  /* ---------------- search ---------------- */

  function runSearch(q) {
    var query = q.trim();
    if (!query) {
      resultsEl.classList.remove('on');
      resultsEl.innerHTML = '';
      searchMeta.textContent = '';
      paintTree('');
      return;
    }

    var lower = query.toLowerCase();

    // filename filter for the tree
    paintTree(lower);

    if (query.length < 2) {
      resultsEl.classList.remove('on');
      searchMeta.textContent = '文件名过滤中';
      return;
    }

    // full-text
    var hits = [];
    var MAX = 200;
    for (var i = 0; i < files.length && hits.length < MAX; i++) {
      var f = files[i];
      var ls = f.text.split('\n');
      for (var j = 0; j < ls.length; j++) {
        var idx = ls[j].toLowerCase().indexOf(lower);
        if (idx === -1) continue;
        hits.push({ path: f.path, line: j + 1, text: ls[j].trim() });
        if (hits.length >= MAX) break;
      }
    }

    resultsEl.innerHTML = '';
    if (!hits.length) {
      resultsEl.innerHTML = '<div class="empty" style="height:auto;padding:26px 8px;">没有匹配内容</div>';
      resultsEl.classList.add('on');
      searchMeta.textContent = '0 处匹配';
      return;
    }

    var frag = document.createDocumentFragment();
    hits.forEach(function (h) {
      var d = document.createElement('div');
      d.className = 'result';
      var rp = document.createElement('div');
      rp.className = 'rp';
      rp.textContent = h.path;
      var rl = document.createElement('div');
      rl.className = 'rl';
      var ln = document.createElement('span');
      ln.className = 'ln-no';
      ln.textContent = h.line;
      rl.appendChild(ln);
      rl.appendChild(marked(h.text, query));
      d.appendChild(rp);
      d.appendChild(rl);
      d.addEventListener('click', function () { openFile(h.path, h.line); });
      frag.appendChild(d);
    });
    resultsEl.appendChild(frag);
    resultsEl.classList.add('on');
    searchMeta.textContent = hits.length + ' 处匹配' + (hits.length >= MAX ? '（已截断）' : '');
  }

  function marked(text, query) {
    var span = document.createElement('span');
    var lower = text.toLowerCase();
    var q = query.toLowerCase();
    var at = lower.indexOf(q);
    if (at === -1) { span.textContent = text; return span; }
    var clipped = text.length > 160 ? text.slice(Math.max(0, at - 50), at + 110) : text;
    var cl = clipped.toLowerCase();
    var ai = cl.indexOf(q);
    if (ai === -1) { span.textContent = clipped; return span; }
    span.appendChild(document.createTextNode(clipped.slice(0, ai)));
    var mk = document.createElement('mark');
    mk.textContent = clipped.slice(ai, ai + q.length);
    span.appendChild(mk);
    span.appendChild(document.createTextNode(clipped.slice(ai + q.length)));
    return span;
  }

  var searchTimer = null;
  searchEl.addEventListener('input', function () {
    clearTimeout(searchTimer);
    var v = searchEl.value;
    searchTimer = setTimeout(function () { runSearch(v); }, 130);
  });

  /* ---------------- actions ---------------- */

  copyBtn.addEventListener('click', function () {
    if (!current) { toast('请先选择一个文件'); return; }
    var text = current.text;
    var done = function () { toast('已复制 ' + current.name); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, done) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) {
      toast('复制失败，请手动选择');
    }
  }

  dlBtn.addEventListener('click', function () {
    var b64 = document.getElementById('zipData').textContent.trim();
    openDownload(b64);
    toast('正在下载源码包');
  });

  function openDownload(b64) {
    var bin = atob(b64);
    var len = bin.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: 'application/zip' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = meta.zipName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
    } else if (e.key === 'Escape' && document.activeElement === searchEl) {
      searchEl.value = '';
      runSearch('');
      searchEl.blur();
    }
  });

  /* ---------------- boot ---------------- */

  paintTree('');
  var first = files.filter(function (f) { return f.name === 'SourceRouter.kt'; })[0] || files[0];
  if (first) openFile(first.path);

  document.getElementById('statFiles').textContent = meta.fileCount;
  document.getElementById('statKt').textContent = meta.ktCount;
  document.getElementById('statLines').textContent = meta.totalLines.toLocaleString();
})();
</script>
</body>
</html>
