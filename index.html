\n    val objs = JsonPath.selectText(DOC, \"$.data.list[*]\")\n    eq(\"对象结果保留结构\", objs.size, 3)\n    check(\"对象转字符串是 JSON\", JsonPath.toStrings(objs).first().startsWith(\"{\"))\n    eq(\"null 被过滤\", JsonPath.selectText(DOC, \"$.data.list[2].author\").size, 0)\n\n    // ---------------- looksLikeJsonPath ----------------\n    eq(\"识别 $.\", JsonPath.looksLikeJsonPath(\"$.a\"), true)\n    eq(\"识别 $[\", JsonPath.looksLikeJsonPath(\"$[0]\"), true)\n    eq(\"CSS 不算\", JsonPath.looksLikeJsonPath(\"class.a@text\"), false)\n    eq(\"XPath 不算\", JsonPath.looksLikeJsonPath(\"//div/a\"), false)\n    eq(\"单 $ 算\", JsonPath.looksLikeJsonPath(\"$\"), true)\n\n    // ================= XPathLite =================\n    eq(\"识别 XPath //\", XPathLite.looksLikeXPath(\"//div/a\"), true)\n    eq(\"识别 XPath /\", XPathLite.looksLikeXPath(\"/html/body\"), true)\n    eq(\"协议相对 URL 不算\", XPathLite.looksLikeXPath(\"//example.com/a\"), false)\n    eq(\"CSS 不算 XPath\", XPathLite.looksLikeXPath(\"class.a\"), false)\n\n    // 基本转换\n    eq(\"后代 + 取文本\", XPathLite.toCss(\"//div[@class='x']/a/text()\"),\n        XPathLite.Converted(\"div[class=\\\"x\\\"] > a\", \"text\"))\n    eq(\"class 谓词(全等)\", XPathLite.toCss(\"//div[@class='x']\")?.css, \"div[class=\\\"x\\\"]\")\n    eq(\"id 谓词(全等)\", XPathLite.toCss(\"//div[@id='y']//span\")?.css, \"div[id=\\\"y\\\"] span\")\n    eq(\"位置谓词\", XPathLite.toCss(\"//ul/li[2]\")?.css, \"ul > li:nth-child(2)\")\n    eq(\"last()\", XPathLite.toCss(\"//p[last()]\")?.css, \"p:last-child\")\n    eq(\"属性取值\", XPathLite.toCss(\"//a[@href]/@href\")?.directive, \"attr:href\")\n    eq(\"属性取值的 css\", XPathLite.toCss(\"//a[@href]/@href\")?.css, \"a[href]\")\n    eq(\"contains\", XPathLite.toCss(\"//div[contains(@class,'box')]\")?.css, \"div[class*=\\\"box\\\"]\")\n    eq(\"绝对路径\", XPathLite.toCss(\"/html/body/div[1]\")?.css, \"html > body > div:nth-child(1)\")\n    eq(\"通配段\", XPathLite.toCss(\"//div/*/a\")?.css, \"div > * > a\")\n\n    // 不等谓词 -> :not()\n    eq(\"不等谓词\", XPathLite.toCss(\"//div[@class!='x']\")?.css, \"div:not([class=\\\"x\\\"])\")\n\n    // 无取值指令\n    eq(\"无指令\", XPathLite.toCss(\"//div/a\")?.directive, null)\n\n    // 明确不支持的\n    eq(\"轴不支持\", XPathLite.toCss(\"//div/ancestor::span\"), null)\n    eq(\"and 不支持\", XPathLite.toCss(\"//div[@a and @b]\"), null)\n    eq(\"or 不支持\", XPathLite.toCss(\"//div[@a or @b]\"), null)\n    eq(\"非 / 开头\", XPathLite.toCss(\"div/a\"), null)\n    eq(\"未知函数\", XPathLite.toCss(\"//div[normalize-space(@class)]\"), null)\n    eq(\"位置 0 非法\", XPathLite.toCss(\"//li[0]\"), null)\n\n    // 引号转义\n    val q = XPathLite.toCss(\"//div[@class='a\\\"b']\")\n    check(\"引号被转义\", q != null && q.css.contains(\"\\\\\\\"\"), \"css=${q?.css}\")\n\n    println(\"================ JSONPath / XPathLite 单测 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"},{"path":"tests/ReadingLayerTest.kt","lang":"kt","lines":344,"content":"import com.lanyue.reader.core.render.PageTurnController\nimport com.lanyue.reader.core.render.PageTurnController.Boundary\nimport com.lanyue.reader.core.render.PageTurnMode\nimport com.lanyue.reader.core.render.Paginator\nimport com.lanyue.reader.core.render.ReadingLocator\nimport com.lanyue.reader.core.render.ReadingProgress\nimport com.lanyue.reader.core.render.ReadingSettings\nimport com.lanyue.reader.core.render.ThemePalette\nimport com.lanyue.reader.core.render.ThemeRegistry\nimport com.lanyue.reader.core.render.TypographySpec\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\nprivate fun near(name: String, actual: Float, expected: Float, tol: Float = 1e-4f) {\n    if (kotlin.math.abs(actual - expected) <= tol) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun throws(name: String, block: () -> Unit) {\n    try {\n        block(); fail++; failures.add(\"$name -> 期望抛异常但未抛出\")\n    } catch (e: IllegalArgumentException) {\n        pass++\n    } catch (e: Throwable) {\n        fail++; failures.add(\"$name -> 异常类型不对: $e\")\n    }\n}\n\n/** 造一个可预测的两章文档：每页 3 行。 */\nprivate fun doc(pages: Int, linesPerPage: Int = 3, baseChars: Int = 10): Paginator.PagedDocument {\n    val lines = ArrayList<Paginator.Line>()\n    for (i in 0 until pages * linesPerPage) {\n        val s = i * baseChars\n        lines.add(Paginator.Line(\"line$i\", s, s + baseChars))\n    }\n    val list = ArrayList<Paginator.Page>()\n    var p = 0\n    while (p < lines.size) {\n        val end = minOf(p + linesPerPage, lines.size)\n        val slice = lines.subList(p, end).toList()\n        list.add(Paginator.Page(list.size, slice, slice.first().startOffset, slice.last().endOffset))\n        p = end\n    }\n    return Paginator.PagedDocument(list, lines.last().endOffset)\n}\n\nfun main() {\n    // ================= PageTurnMode =================\n    eq(\"默认翻页\", PageTurnMode.Default, PageTurnMode.SLIDE)\n    eq(\"id=slide 解析\", PageTurnMode.fromId(\"slide\"), PageTurnMode.SLIDE)\n    eq(\"id=cover 解析\", PageTurnMode.fromId(\"cover\"), PageTurnMode.COVER)\n    eq(\"id=none 解析\", PageTurnMode.fromId(\"none\"), PageTurnMode.NONE)\n    eq(\"id=scroll 解析\", PageTurnMode.fromId(\"scroll\"), PageTurnMode.SCROLL)\n    eq(\"未知 id 回落默认\", PageTurnMode.fromId(\"hologram\"), PageTurnMode.SLIDE)\n    eq(\"null 回落默认\", PageTurnMode.fromId(null), PageTurnMode.SLIDE)\n    eq(\"空串回落默认\", PageTurnMode.fromId(\"\"), PageTurnMode.SLIDE)\n    eq(\"slide 是分页\", PageTurnMode.SLIDE.isPaged, true)\n    eq(\"cover 是分页\", PageTurnMode.COVER.isPaged, true)\n    eq(\"none 仍分页\", PageTurnMode.NONE.isPaged, true)\n    eq(\"scroll 不是分页\", PageTurnMode.SCROLL.isPaged, false)\n    eq(\"中文标签\", PageTurnMode.COVER.label, \"覆盖\")\n\n    // ================= ReadingSettings 默认与转换 =================\n    val d = ReadingSettings.Default\n    eq(\"默认字号\", d.fontSizeSp, TypographySpec.DEFAULT_FONT_SP)\n    eq(\"默认主题\", d.themeId, ThemePalette.DayId)\n    eq(\"默认翻页\", d.pageTurnMode, PageTurnMode.SLIDE)\n    eq(\"默认常亮\", d.keepScreenOn, true)\n    eq(\"默认全屏\", d.fullScreen, true)\n    eq(\"默认不自动夜间\", d.autoNightByClock, false)\n\n    val typo = d.toTypography()\n    eq(\"转换字号一致\", typo.fontSizeSp, d.fontSizeSp)\n    near(\"转换行距一致\", typo.lineSpacingAdd, d.lineSpacingAdd)\n    near(\"转换字距一致\", typo.letterSpacingEm, d.letterSpacingEm)\n    // 缩进/段距沿用默认\n    near(\"缩进沿用默认\", typo.indentEm, TypographySpec.Default.indentEm)\n\n    // ================= 边界与夹紧 =================\n    eq(\"字号上调夹到上限\", d.withFontSize(999f).fontSizeSp, TypographySpec.MAX_FONT_SP)\n    eq(\"字号下调夹到下限\", d.withFontSize(-10f).fontSizeSp, TypographySpec.MIN_FONT_SP)\n    eq(\"字号步进 +1\", d.stepFontSize(1f).fontSizeSp, d.fontSizeSp + 1f)\n    eq(\"步进撞上限被夹\", d.withFontSize(TypographySpec.MAX_FONT_SP).stepFontSize(5f).fontSizeSp,\n        TypographySpec.MAX_FONT_SP)\n    eq(\"行距夹到上限\", d.withLineSpacing(99f).lineSpacingAdd,\n        TypographySpec.MAX_LINE_SPACING_ADD)\n    eq(\"行距夹到 0\", d.withLineSpacing(-1f).lineSpacingAdd, 0f)\n    near(\"字距夹到上限\", d.withLetterSpacing(9f).letterSpacingEm,\n        TypographySpec.MAX_LETTER_SPACING_EM)\n\n    throws(\"非法字号构造被拒\") { ReadingSettings(fontSizeSp = 200f) }\n    throws(\"非法行距构造被拒\") { ReadingSettings(lineSpacingAdd = -1f) }\n    throws(\"空主题 id 被拒\") { ReadingSettings(themeId = \" \") }\n\n    // ================= 主题解析 =================\n    eq(\"当前主题为纸质\", d.theme().id, ThemePalette.DayId)\n    eq(\"未知主题回落纸质\", d.withTheme(\"no-such\").theme().id, ThemePalette.DayId)\n    eq(\"夜间主题可解析\", d.withTheme(ThemePalette.NightId).theme().isDark, true)\n\n    // 关闭自动夜间时与时间无关\n    eq(\"关自动夜间 2 点仍是纸质\", d.resolveTheme(2).id, ThemePalette.DayId)\n    eq(\"关自动夜间 21 点仍是纸质\", d.resolveTheme(21).id, ThemePalette.DayId)\n\n    val auto = d.copy(autoNightByClock = true)\n    eq(\"自动夜间 21 点转夜间\", auto.resolveTheme(21).id, ThemePalette.NightId)\n    eq(\"自动夜间 19 点转夜间\", auto.resolveTheme(19).id, ThemePalette.NightId)\n    eq(\"自动夜间 5 点仍是夜间\", auto.resolveTheme(5).id, ThemePalette.NightId)\n    eq(\"自动夜间 6 点转白天\", auto.resolveTheme(6).id, ThemePalette.DayId)\n    eq(\"自动夜间 12 点是白天\", auto.resolveTheme(12).id, ThemePalette.DayId)\n    eq(\"小时越界夹紧(99->23 夜间)\", auto.resolveTheme(99).id, ThemePalette.NightId)\n    eq(\"小时负数夹紧(-5->0 夜间)\", auto.resolveTheme(-5).id, ThemePalette.NightId)\n\n    // 用户原本选了护眼绿，白天保持绿，不强行改回纸质\n    val greenAuto = d.withTheme(\"green\").copy(autoNightByClock = true)\n    eq(\"白天保留用户浅色主题\", greenAuto.resolveTheme(12).id, \"green\")\n    eq(\"夜间切到夜间主题\", greenAuto.resolveTheme(22).id, ThemePalette.NightId)\n\n    // ================= 序列化往返 =================\n    val custom = ReadingSettings(\n        fontSizeSp = 22.5f,\n        lineSpacingAdd = 0.6f,\n        letterSpacingEm = 0.02f,\n        themeId = \"green\",\n        pageTurnMode = PageTurnMode.COVER,\n        keepScreenOn = false,\n        fullScreen = false,\n        autoNightByClock = true\n    )\n    val restored = ReadingSettings.deserialize(custom.serialize())\n    eq(\"往返字号\", restored.fontSizeSp, 22.5f)\n    eq(\"往返行距\", restored.lineSpacingAdd, 0.6f)\n    eq(\"往返字距\", restored.letterSpacingEm, 0.02f)\n    eq(\"往返主题\", restored.themeId, \"green\")\n    eq(\"往返翻页\", restored.pageTurnMode, PageTurnMode.COVER)\n    eq(\"往返常亮\", restored.keepScreenOn, false)\n    eq(\"往返全屏\", restored.fullScreen, false)\n    eq(\"往返自动夜间\", restored.autoNightByClock, true)\n    eq(\"整串相等\", restored, custom)\n\n    eq(\"整数字号序列化无尾巴\", d.serialize().contains(\"fontSizeSp=18\"), true)\n    eq(\"空串反序列化得默认\", ReadingSettings.deserialize(\"\"), ReadingSettings.Default)\n    eq(\"null 反序列化得默认\", ReadingSettings.deserialize(null), ReadingSettings.Default)\n    // 部分损坏只回落单字段\n    val partial = ReadingSettings.deserialize(\"fontSizeSp=abc;themeId=oled\")\n    eq(\"坏字号回落默认\", partial.fontSizeSp, TypographySpec.DEFAULT_FONT_SP)\n    eq(\"好字段仍生效\", partial.themeId, \"oled\")\n    // 越界值被夹紧而非丢弃\n    val clamped = ReadingSettings.deserialize(\"fontSizeSp=999;lineSpacingAdd=-3\")\n    eq(\"序列化越界字号被夹\", clamped.fontSizeSp, TypographySpec.MAX_FONT_SP)\n    eq(\"序列化越界行距被夹\", clamped.lineSpacingAdd, 0f)\n    // 未知翻页 id 回落\n    eq(\"未知翻页回落\", ReadingSettings.deserialize(\"pageTurnMode=zzz\").pageTurnMode,\n        PageTurnMode.SLIDE)\n    // 无等号片段被忽略\n    eq(\"垃圾片段被忽略\", ReadingSettings.deserialize(\";;;=;x\").themeId, ThemePalette.DayId)\n\n    // ================= 翻页：页内 =================\n    val prog = ReadingProgress.initial(listOf(100, 100))\n    val d3 = doc(3) // 3 页，每页 3 行，行 10 字符\n\n    val n1 = PageTurnController.nextPage(prog, d3)\n    eq(\"页内下一页 moved\", n1.moved, true)\n    eq(\"页内下一页 boundary\", n1.boundary, Boundary.NONE)\n    eq(\"页内下一页页码\", n1.progress.pageInChapter, 1)\n    eq(\"页内下一页偏移对齐页首\", n1.progress.locator.charOffset, d3.pages[1].startOffset)\n    eq(\"页内不跨章\", n1.crossedChapter, false)\n    eq(\"章节保持不变\", n1.progress.locator.chapterIndex, 0)\n\n    val n2 = PageTurnController.nextPage(n1.progress, d3)\n    eq(\"第二页再下一页码\", n2.progress.pageInChapter, 2)\n\n    // ================= 翻页：撞全书末页（只有一章时） =================\n    val single = ReadingProgress(ReadingLocator(0, 0), listOf(1000))\n    val sn2 = PageTurnController.nextPage(PageTurnController.nextPage(single, d3).progress, d3).progress\n    eq(\"单章第3页页码\", sn2.pageInChapter, 2)\n    val n3 = PageTurnController.nextPage(sn2, d3)\n    eq(\"末页且末章 moved=false\", n3.moved, false)\n    eq(\"末页且末章 boundary\", n3.boundary, Boundary.BOOK_END)\n    eq(\"末页且末章位置不变\", n3.progress, sn2)\n    eq(\"页数回填\", n3.progress.pagesInChapter, d3.pageCount)\n\n    // ================= 翻页：跨章 =================\n    val crossStart = n2.progress.copy(\n        chapterCharCounts = listOf(100, 100),\n        locator = ReadingLocator(0, d3.pages.last().startOffset),\n        pageInChapter = d3.pageCount - 1,\n        pagesInChapter = d3.pageCount\n    )\n    val cross = PageTurnController.nextPage(crossStart, d3)\n    eq(\"跨章 moved\", cross.moved, true)\n    eq(\"跨章 boundary\", cross.boundary, Boundary.CHAPTER_END)\n    eq(\"跨章后章节+1\", cross.progress.locator.chapterIndex, 1)\n    eq(\"跨章后回到章首\", cross.progress.locator.charOffset, 0)\n    eq(\"跨章被识别\", cross.crossedChapter, true)\n    eq(\"跨章强制标记已读\", cross.progress.isChapterRead(0), true)\n\n    // ================= 翻页：上一页 =================\n    val back = PageTurnController.previousPage(n1.progress, d3)\n    eq(\"上一页 moved\", back.moved, true)\n    eq(\"上一页页码\", back.progress.pageInChapter, 0)\n    eq(\"上一页偏移\", back.progress.locator.charOffset, d3.pages[0].startOffset)\n\n    val backStart = PageTurnController.previousPage(\n        ReadingProgress(ReadingLocator(0, 0), listOf(100, 100), pageInChapter = 0, pagesInChapter = 3),\n        d3\n    )\n    eq(\"书首再上一页 moved=false\", backStart.moved, false)\n    eq(\"书首 boundary\", backStart.boundary, Boundary.BOOK_START)\n\n    // 本章首页再上一页 -> 上一章末屏\n    val atChapter2 = ReadingProgress(\n        ReadingLocator(1, 0), listOf(100, 100), pageInChapter = 0, pagesInChapter = 3\n    )\n    val up = PageTurnController.previousPage(atChapter2, d3)\n    eq(\"跨回上一章 moved\", up.moved, true)\n    eq(\"跨回上一章 boundary\", up.boundary, Boundary.CHAPTER_START)\n    eq(\"跨回章节-1\", up.progress.locator.chapterIndex, 0)\n    eq(\"跨回定位到上一章末尾\", up.progress.locator.charOffset, 99)\n    eq(\"跨回被识别\", up.crossedChapter, true)\n\n    // ================= 翻页：空文档防御 =================\n    val emptyDoc = Paginator.PagedDocument(emptyList(), 0)\n    val e1 = PageTurnController.nextPage(prog, emptyDoc)\n    eq(\"空文档下一页不移动\", e1.moved, false)\n    eq(\"空文档下一页 boundary\", e1.boundary, Boundary.NONE)\n    eq(\"空文档下一页不改位置\", e1.progress, prog)\n    val e2 = PageTurnController.nextPage(prog, null)\n    eq(\"null 文档不移动\", e2.moved, false)\n    val e3 = PageTurnController.previousPage(prog, null)\n    eq(\"null 上翻不移动\", e3.moved, false)\n\n    // ================= 滚动模式 =================\n    val scrollProg = ReadingProgress(ReadingLocator(0, 10), listOf(100, 100))\n    val s1 = PageTurnController.scrollBy(scrollProg, 30)\n    eq(\"滚动前进 moved\", s1.moved, true)\n    eq(\"滚动前进偏移\", s1.progress.locator.charOffset, 40)\n    eq(\"滚动不产生页号\", s1.progress.pageInChapter, 0)\n    eq(\"滚动章内 boundary\", s1.boundary, Boundary.NONE)\n\n    val s2 = PageTurnController.scrollBy(scrollProg, -20)\n    eq(\"滚动回退偏移夹到0\", s2.progress.locator.charOffset, 0)\n    eq(\"滚动回退仍算移动\", s2.moved, true)\n    // 从偏移 10 继续回滚：位置从 10 夹到 0，属于移动\n    val s3 = PageTurnController.scrollBy(scrollProg, -100)\n    eq(\"滚动回滚越界夹到0\", s3.progress.locator.charOffset, 0)\n    eq(\"滚动回滚越界仍算移动\", s3.moved, true)\n    eq(\"滚动回滚越界 boundary\", s3.boundary, Boundary.BOOK_START)\n    // 已在 0 再回滚：不再移动\n    val s3b = PageTurnController.scrollBy(s3.progress, -50)\n    eq(\"已在书首再回滚不移动\", s3b.moved, false)\n    eq(\"已在书首 boundary\", s3b.boundary, Boundary.BOOK_START)\n    eq(\"滚动 0 无动作\", PageTurnController.scrollBy(scrollProg, 0).moved, false)\n\n    val s4 = PageTurnController.scrollBy(ReadingProgress(ReadingLocator(0, 95), listOf(100, 100)), 50)\n    eq(\"滚动越章 moved\", s4.moved, true)\n    eq(\"滚动越章 boundary\", s4.boundary, Boundary.CHAPTER_END)\n    eq(\"滚动越章章节\", s4.progress.locator.chapterIndex, 1)\n    eq(\"滚动越章回章首\", s4.progress.locator.charOffset, 0)\n\n    val s5 = PageTurnController.scrollBy(\n        ReadingProgress(ReadingLocator(1, 0), listOf(100, 100)), -30\n    )\n    eq(\"滚动回上章 boundary\", s5.boundary, Boundary.CHAPTER_START)\n    eq(\"滚动回上章章节\", s5.progress.locator.chapterIndex, 0)\n    eq(\"滚动回上章偏移\", s5.progress.locator.charOffset, 70)\n\n    val s6 = PageTurnController.scrollBy(\n        ReadingProgress(ReadingLocator(1, 90), listOf(100, 100)), 50\n    )\n    eq(\"滚动撞全书末夹到章末\", s6.progress.locator.charOffset, 100)\n    eq(\"滚动撞末 boundary\", s6.boundary, Boundary.BOOK_END)\n    val s7 = PageTurnController.scrollBy(\n        ReadingProgress(ReadingLocator(1, 100), listOf(100, 100)), 50\n    )\n    eq(\"已在末尾再滚不再移动\", s7.moved, false)\n\n    // ================= 设置驱动分页 =================\n    val paras = listOf(\n        \"第一章开头的段落，用来验证分页链路是否把设置正确并入了度量。\",\n        \"第二个段落同样参与分页，含标点、数字 123 与英文 word。\",\n        \"第三段用于把页数推到一个以上，确保多页场景也走通。\"\n    )\n    val docSmall = PageTurnController.paginateWithSettings(\n        paras, ReadingSettings(fontSizeSp = 14f), viewportWidthDp = 360f, viewportHeightDp = 640f\n    )\n    check(\"小字号分页有内容\", docSmall.pageCount >= 1 && docSmall.pages.first().lines.isNotEmpty(),\n        \"pageCount=${docSmall.pageCount}\")\n    val docBig = PageTurnController.paginateWithSettings(\n        paras, ReadingSettings(fontSizeSp = 34f), viewportWidthDp = 360f, viewportHeightDp = 640f\n    )\n    check(\"大字号页数不少于小字号\", docBig.pageCount >= docSmall.pageCount,\n        \"big=${docBig.pageCount} small=${docSmall.pageCount}\")\n\n    // 窄屏 + 大字号必须仍能分页（不能死循环/空页）\n    val docNarrow = PageTurnController.paginateWithSettings(\n        paras,\n        ReadingSettings(fontSizeSp = 34f, lineSpacingAdd = 1.5f),\n        viewportWidthDp = 60f,\n        viewportHeightDp = 80f\n    )\n    check(\"极端窄屏仍出页\", docNarrow.pageCount >= 1, \"pageCount=${docNarrow.pageCount}\")\n    check(\"极端窄屏每页至少一行\", docNarrow.pages.all { it.lines.isNotEmpty() })\n\n    // 空段落不炸\n    val docEmpty = PageTurnController.paginateWithSettings(\n        listOf(\"\", \"   \", \"\\n\"), ReadingSettings.Default, 360f, 640f\n    )\n    eq(\"全空段落页数\", docEmpty.pageCount, 1)\n    eq(\"全空段落字数\", docEmpty.totalChars, 0)\n\n    // 分页后页码与偏移保持一致：翻到第 2 页应命中第 2 页\n    if (docBig.pageCount > 1) {\n        val p0 = ReadingProgress.initial(listOf(docBig.totalChars))\n        val moved = PageTurnController.nextPage(p0, docBig)\n        eq(\"分页器第2页页码\", moved.progress.pageInChapter, 1)\n        eq(\"分页器页码回查一致\", docBig.pageOfOffset(moved.progress.locator.charOffset), 1)\n    }\n\n    println(\"================ 阅读层单测 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"},{"path":"tests/RuleEngineDispatchTest.kt","lang":"kt","lines":171,"content":"import com.lanyue.reader.core.engine.DomParser\nimport com.lanyue.reader.core.engine.JsExecMode\nimport com.lanyue.reader.core.engine.JsRuntime\nimport com.lanyue.reader.core.engine.PoolTier\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.core.engine.EngineException\nimport com.lanyue.reader.source.rule.RuleEngine\nimport com.lanyue.reader.source.rule.RuleEngine.RuleContext\nimport kotlinx.coroutines.runBlocking\nimport java.io.File\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\n/** 假 JS 运行时：只回传固定值，用于验证引擎的 JS 分发路径不依赖真 WebView。 */\nprivate class FakeJs(private val reply: String) : JsRuntime {\n    var lastScript: String = \"\"\n    override suspend fun eval(\n        script: String,\n        mode: JsExecMode,\n        tier: PoolTier,\n        traceId: String,\n        dispatch: (String, String) -> Boolean\n    ): String {\n        lastScript = script\n        dispatch(\"task-1\", script)\n        return reply\n    }\n    override fun onRenderProcessGone(error: Throwable) {}\n    override suspend fun drainPending(): Int = 0\n}\n\nprivate const val HTML = \"\"\"\n<html><head><title>书城</title></head><body>\n<div class=\"book-list\">\n  <div class=\"item\"><a class=\"name\" href=\"/book/1\">三体</a><span class=\"author\">刘慈欣</span><img src=\"//img.a.com/1.jpg\"></div>\n  <div class=\"item\"><a class=\"name\" href=\"/book/2\">活着</a><span class=\"author\">余华</span><img src=\"//img.a.com/2.jpg\"></div>\n  <div class=\"item\"><a class=\"name\" href=\"https://x.com/b3\">围城</a></div>\n</div>\n<div id=\"meta\" data-cid=\"42\">元信息</div>\n<a href=\"rel/path\">相对链接</a>\n</body></html>\n\"\"\"\n\nprivate const val JSON = \"\"\"\n{\"code\":0,\"data\":{\"list\":[\n  {\"name\":\"三体\",\"type\":\"book\",\"words\":880000},\n  {\"name\":\"某漫画\",\"type\":\"comic\",\"words\":0}\n]}}\n\"\"\"\n\nfun main() = runBlocking {\n    val metrics = LocalMetrics(File(\"/tmp/metrics\"))\n    val dom = DomParser(null, metrics) // realDom = null，走 jsoup 降级\n    val js = FakeJs(\"js-ok\")\n    val engine = RuleEngine(js, dom, metrics)\n\n    // ---------------- CSS 基础 ----------------\n    eq(\"CSS 取文本\", engine.evalList(HTML, \"class.name@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"CSS 标签前缀\", engine.evalList(HTML, \"tag.span@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"刘慈欣\", \"余华\"))\n    eq(\"CSS id 前缀\", engine.evalList(HTML, \"id.meta@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"元信息\"))\n\n    // ---------------- @href / @src（本轮修复的核心缺陷） ----------------\n    eq(\"CSS 取 href\", engine.evalList(HTML, \"class.name@href\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"/book/1\", \"/book/2\", \"https://x.com/b3\"))\n    eq(\"CSS 取 img src\", engine.evalList(HTML, \"tag.img@src\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"//img.a.com/1.jpg\", \"//img.a.com/2.jpg\"))\n    eq(\"CSS 取 data-* 属性\", engine.evalList(HTML, \"id.meta@data-cid\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"42\"))\n    eq(\"attr: 前缀\", engine.evalList(HTML, \"class.name@attr:href\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"/book/1\", \"/book/2\", \"https://x.com/b3\"))\n\n    // ---------------- @abs: 绝对化 ----------------\n    eq(\"abs: 站点根相对\", engine.evalList(HTML, \"class.name@abs:href\", RuleContext(baseUrl = \"https://a.com/list\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"https://a.com/book/1\", \"https://a.com/book/2\", \"https://x.com/b3\"))\n    eq(\"abs: 协议相对\", engine.evalList(HTML, \"tag.img@abs:src\", RuleContext(baseUrl = \"https://a.com/list\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"https://img.a.com/1.jpg\", \"https://img.a.com/2.jpg\"))\n    // tag.a 会选中全部 <a>，因此结果含 4 条；最后一条验证\"目录相对\"拼接\n    val absAll = engine.evalList(HTML, \"tag.a@abs:href\",\n        RuleContext(baseUrl = \"https://a.com/dir/page\", sourceId = \"src-1\", traceId = \"trace-1\"))\n    eq(\"abs: 全量链接数\", absAll.size, 4)\n    eq(\"abs: 目录相对\", absAll.last(), \"https://a.com/dir/rel/path\")\n\n    // ---------------- 链式选择器 + 尾部索引 ----------------\n    eq(\"链式嵌套\", engine.evalList(HTML, \"class.book-list@class.name@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"尾部索引取第 2 个\", engine.evalList(HTML, \"class.name.1@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"活着\"))\n    eq(\"尾部负索引\", engine.evalList(HTML, \"class.name.-1@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"围城\"))\n\n    // ---------------- XPath ----------------\n    eq(\"XPath 取文本\", engine.evalList(HTML, \"//div[@class='book-list']//a/text()\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"XPath 取属性\", engine.evalList(HTML, \"//a[@class='name']/@href\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"/book/1\", \"/book/2\", \"https://x.com/b3\"))\n    eq(\"XPath 位置\", engine.evalList(HTML, \"//div[@class='item'][2]//span/text()\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"余华\"))\n    // 不支持的结构必须明确报错，不能静默空\n    try {\n        engine.evalList(HTML, \"//div/ancestor::span\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\"))\n        fail++; failures.add(\"XPath 轴应报错却成功\")\n    } catch (e: EngineException) {\n        check(\"XPath 轴报错信息含 unsupported\", e.message?.contains(\"unsupported\") == true, \"msg=${e.message}\")\n    }\n\n    // ---------------- JSONPath ----------------\n    eq(\"JSONPath 字段\", engine.evalList(JSON, \"$.data.list[*].name\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"某漫画\"))\n    eq(\"JSONPath 过滤\", engine.evalList(JSON, \"$.data.list[?(@.type=='book')].name\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\"))\n    eq(\"JSONPath 比较\", engine.evalList(JSON, \"$.data.list[?(@.words>1000)].name\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\"))\n    // JSON 响应套 CSS 规则 -> 取不到，不应崩\n    eq(\"HTML 上跑 JSONPath 判空\", engine.evalList(HTML, \"$.data.list\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        emptyList<String>())\n\n    // ---------------- JS 分发 ----------------\n    eq(\"JS 规则走运行时\", engine.evalList(HTML, \"@js:1+1\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"js-ok\"))\n    check(\"JS 脚本注入了 result\", js.lastScript.contains(\"var result =\"))\n\n    // ---------------- 正则替换 ----------------\n    eq(\"## 替换\", engine.evalList(HTML, \"class.name@text##第(\\\\d+)章##$1\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n\n    // ---------------- || 短路 ----------------\n    eq(\"|| 第一备选命中\", engine.evalList(HTML, \"class.name@text||class.author@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"|| 第一备选失败回落\", engine.evalList(HTML, \"class.nope@text||class.author@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"刘慈欣\", \"余华\"))\n\n    // ---------------- && 合并 ----------------\n    eq(\"&& 合并两段\", engine.evalList(HTML, \"class.author@text&&id.meta@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"刘慈欣\", \"余华\", \"元信息\"))\n\n    // ---------------- 空规则 ----------------\n    eq(\"null 规则\", engine.evalList(HTML, null, RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), emptyList<String>())\n    eq(\"空串规则\", engine.evalList(HTML, \"  \", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), emptyList<String>())\n    eq(\"选择器无匹配\", engine.evalList(HTML, \"class.none@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), emptyList<String>())\n\n    // ---------------- evalString ----------------\n    eq(\"evalString 取首个\", engine.evalString(HTML, \"class.name@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), \"三体\")\n    eq(\"evalString 无匹配\", engine.evalString(HTML, \"class.none@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), null)\n\n    println(\"================ RuleEngine 分发集成测试 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"},{"path":"tests/SourceImportLayerTest.kt","lang":"kt","lines":433,"content":"import com.lanyue.reader.source.debug.SourceDebugger\nimport com.lanyue.reader.source.debug.SourceDebugger.Stage\nimport com.lanyue.reader.source.debug.SourceDebugger.Status\nimport com.lanyue.reader.source.import.SourceImportParser\nimport com.lanyue.reader.source.repo.SourceRepository\nimport com.lanyue.reader.source.repo.SourceRepository.InstalledSource\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\nfun main() {\n    // ================= 清洗：注释与尾随逗号 =================\n    // 最关键：https:// 里的 // 不能被当注释\n    val urlSafe = SourceImportParser.stripCommentsAndTrailingCommas(\n        \"{\\\"bookSourceUrl\\\":\\\"https://a.com/x\\\",\\\"bookSourceName\\\":\\\"A\\\"}\"\n    )\n    check(\"URL 未被截断\", urlSafe.contains(\"https://a.com/x\"), urlSafe)\n\n    val withLineComment = SourceImportParser.stripCommentsAndTrailingCommas(\n        \"// 顶部注释\\n{\\\"a\\\":1} // 尾部注释\\n\"\n    )\n    eq(\"去行注释\", withLineComment.trim(), \"{\\\"a\\\":1}\")\n\n    val withBlock = SourceImportParser.stripCommentsAndTrailingCommas(\n        \"{/* 块注释 */\\\"a\\\":1}\"\n    )\n    eq(\"去块注释\", withBlock, \"{\\\"a\\\":1}\")\n\n    val trailing = SourceImportParser.stripCommentsAndTrailingCommas(\n        \"{\\\"a\\\":[1,2,],\\\"b\\\":2,}\"\n    )\n    eq(\"去尾随逗号\", trailing, \"{\\\"a\\\":[1,2],\\\"b\\\":2}\")\n\n    // 转义引号内的 // 也不能被当注释\n    val escaped = SourceImportParser.stripCommentsAndTrailingCommas(\n        \"{\\\"a\\\":\\\"x\\\\\\\"//y\\\"}\"\n    )\n    check(\"转义引号内 // 保留\", escaped.contains(\"//y\"), escaped)\n\n    // 单引号字符串（JSON5）\n    val singleQ = SourceImportParser.stripCommentsAndTrailingCommas(\n        \"{\\\"a\\\":'p//q'}\"\n    )\n    check(\"单引号内 // 保留\", singleQ.contains(\"p//q\"), singleQ)\n\n    // ================= 解析：JSON 数组 =================\n    val arrJson = \"\"\"\n    [\n      {\"bookSourceUrl\":\"https://s1.com\",\"bookSourceName\":\"源一\",\"bookSourceGroup\":\"小说\",\"bookSourceType\":0},\n      {\"bookSourceUrl\":\"https://s2.com\",\"bookSourceName\":\"源二\",\"bookSourceType\":1}\n    ]\n    \"\"\".trimIndent()\n    val r1 = SourceImportParser.parse(arrJson)\n    eq(\"数组解析格式\", r1.format, \"json-array\")\n    eq(\"数组解析条数\", r1.accepted.size, 2)\n    eq(\"数组无拒绝\", r1.rejected.size, 0)\n    eq(\"首条名称\", r1.accepted[0].name, \"源一\")\n    eq(\"首条分组\", r1.accepted[0].group, \"小说\")\n    eq(\"次条类型\", r1.accepted[1].type, 1)\n    check(\"raw 保留原文\", r1.accepted[0].raw.contains(\"s1.com\"))\n\n    // ================= 解析：单个对象 =================\n    val objJson = \"\"\"{\"bookSourceUrl\":\"https://one.com\",\"bookSourceName\":\"单源\"}\"\"\"\n    val r2 = SourceImportParser.parse(objJson)\n    eq(\"单对象格式\", r2.format, \"json-object\")\n    eq(\"单对象条数\", r2.accepted.size, 1)\n    eq(\"单对象名称\", r2.accepted[0].name, \"单源\")\n\n    // ================= 解析：包裹层 =================\n    val wrapped = \"\"\"{\"code\":0,\"data\":[{\"bookSourceUrl\":\"https://w1.com\",\"bookSourceName\":\"包一\"}]}\"\"\"\n    val r3 = SourceImportParser.parse(wrapped)\n    eq(\"包裹层格式\", r3.format, \"json-wrapped\")\n    eq(\"包裹层条数\", r3.accepted.size, 1)\n    eq(\"包裹层名称\", r3.accepted[0].name, \"包一\")\n\n    // 自定义包裹键名（不在已知列表里也要能找到）\n    val customWrap = \"\"\"{\"mySources\":{\"x\":[{\"bookSourceUrl\":\"https://c1.com\",\"name\":\"自定义\"}]}}\"\"\"\n    val r4 = SourceImportParser.parse(customWrap)\n    eq(\"自定义包裹能识别\", r4.accepted.size, 1)\n    eq(\"自定义包裹别名 name\", r4.accepted[0].name, \"自定义\")\n\n    // 字段别名 sourceUrl / url\n    val alias = \"\"\"[{\"url\":\"https://alias.com\",\"title\":\"别名源\"}]\"\"\"\n    val r5 = SourceImportParser.parse(alias)\n    eq(\"url 别名识别\", r5.accepted.size, 1)\n    eq(\"title 别名识别\", r5.accepted[0].name, \"别名源\")\n\n    // ================= 解析：容错 =================\n    // 缺地址的条目被拒\n    val noUrl = \"\"\"[{\"bookSourceName\":\"无地址\"},{\"bookSourceUrl\":\"https://ok.com\",\"bookSourceName\":\"好\"}]\"\"\"\n    val r6 = SourceImportParser.parse(noUrl)\n    eq(\"缺地址被拒\", r6.rejected.size, 1)\n    eq(\"合法条目保留\", r6.accepted.size, 1)\n    eq(\"合法条目地址\", r6.accepted[0].url, \"https://ok.com\")\n\n    // 非 http 被拒\n    val badScheme = \"\"\"[{\"bookSourceUrl\":\"ftp://x.com\",\"bookSourceName\":\"F\"}]\"\"\"\n    val r7 = SourceImportParser.parse(badScheme)\n    eq(\"非 http 被拒\", r7.rejected.size, 1)\n    eq(\"非 http 无接受\", r7.accepted.size, 0)\n\n    // 文件内重复只留一条\n    val dup = \"\"\"[{\"bookSourceUrl\":\"https://d.com\",\"bookSourceName\":\"A\"},\n                 {\"bookSourceUrl\":\"https://d.com\",\"bookSourceName\":\"B\"}]\"\"\"\n    val r8 = SourceImportParser.parse(dup)\n    eq(\"重复去重后一条\", r8.accepted.size, 1)\n    eq(\"重复计数\", r8.duplicates, 1)\n    eq(\"保留首次出现\", r8.accepted[0].name, \"A\")\n\n    // 缺名称时用域名兜底\n    val noName = \"\"\"[{\"bookSourceUrl\":\"https://host-only.com/path\"}]\"\"\"\n    val r9 = SourceImportParser.parse(noName)\n    eq(\"无名称用域名\", r9.accepted[0].name, \"host-only.com\")\n\n    // 带注释 + 尾随逗号的真实文件\n    val messy = \"\"\"\n    [\n      // 主源\n      {\"bookSourceUrl\":\"https://m1.com\",\"bookSourceName\":\"乱一\",},\n      {\"bookSourceUrl\":\"https://m2.com\",\"bookSourceName\":\"乱二\"}\n    ]\n    \"\"\".trimIndent()\n    val r10 = SourceImportParser.parse(messy)\n    eq(\"脏 JSON 仍解析出两条\", r10.accepted.size, 2)\n\n    // 类型越界被夹紧\n    val badType = \"\"\"[{\"bookSourceUrl\":\"https://t.com\",\"bookSourceName\":\"T\",\"bookSourceType\":99}]\"\"\"\n    val r11 = SourceImportParser.parse(badType)\n    eq(\"类型越界夹到 3\", r11.accepted[0].type, 3)\n\n    // ================= 解析：纯文本行 =================\n    val text = \"\"\"\n    # 注释行\n    https://t1.com 源甲\n    https://t2.com\t源乙\t分组二\n    not-a-url\n    https://t1.com 重复\n    \"\"\".trimIndent()\n    val r12 = SourceImportParser.parse(text)\n    eq(\"文本行格式\", r12.format, \"text-lines\")\n    eq(\"文本行接受数\", r12.accepted.size, 2)\n    eq(\"文本行名称\", r12.accepted[0].name, \"源甲\")\n    eq(\"文本行分组\", r12.accepted[1].group, \"分组二\")\n    eq(\"文本行拒绝\", r12.rejected.size, 1)\n    eq(\"文本行去重\", r12.duplicates, 1)\n    check(\"文本行 raw 含地址\", r12.accepted[0].raw.contains(\"t1.com\"))\n\n    // ================= 解析：空与异常 =================\n    eq(\"空串 isEmpty\", SourceImportParser.parse(\"\").isEmpty, true)\n    eq(\"null 格式\", SourceImportParser.parse(null).format, \"empty\")\n    val onlyComments = SourceImportParser.parse(\"// 只有注释\\n/* 块 */\")\n    check(\"只有注释无接受\", onlyComments.accepted.isEmpty())\n    val badJson = SourceImportParser.parse(\"{this is broken\")\n    check(\"坏 JSON 不崩\", badJson.accepted.isEmpty())\n    eq(\"坏 JSON 无接受\", badJson.accepted.size, 0)\n\n    // 空 JSON 数组\n    val emptyArr = SourceImportParser.parse(\"[]\")\n    eq(\"空数组无接受\", emptyArr.accepted.size, 0)\n    check(\"空数组有拒绝说明\", emptyArr.rejected.isNotEmpty() || emptyArr.total == 0)\n\n    // 摘要文案\n    check(\"摘要含已识别\", r1.summary().contains(\"已识别\"), r1.summary())\n    eq(\"空结果摘要\", SourceImportParser.parse(\"[]\").rejected.size >= 1, true)\n\n    // ================= 仓库：基础 =================\n    val repo = SourceRepository()\n    eq(\"空仓库\", repo.isEmpty(), true)\n    eq(\"空仓库大小\", repo.size(), 0)\n\n    val s1 = InstalledSource(\"https://a.com\", \"源A\", \"小说\", updatedAt = 100)\n    val rep1 = repo.installOne(s1)\n    eq(\"新增一条\", rep1.added.size, 1)\n    eq(\"仓库大小 1\", repo.size(), 1)\n    eq(\"默认启用\", repo.find(\"https://a.com\")!!.enabled, true)\n\n    // 新增排序接在已有之后\n    val s2 = InstalledSource(\"https://b.com\", \"源B\", \"小说\", updatedAt = 100)\n    repo.installOne(s2)\n    check(\"排序递增\", repo.find(\"https://b.com\")!!.sortOrder > repo.find(\"https://a.com\")!!.sortOrder)\n\n    // ================= 仓库：升级语义 =================\n    // 本机旧 -> 覆盖配置但保留启用状态与排序\n    repo.setEnabled(\"https://a.com\", false)\n    val orderBefore = repo.find(\"https://a.com\")!!.sortOrder\n    val upgrade = repo.installOne(\n        InstalledSource(\"https://a.com\", \"源A新\", \"小说\", updatedAt = 200, raw = \"newcfg\")\n    )\n    eq(\"更新计数\", upgrade.updated.size, 1)\n    eq(\"名称已更新\", repo.find(\"https://a.com\")!!.name, \"源A新\")\n    eq(\"启用状态保留\", repo.find(\"https://a.com\")!!.enabled, false)\n    eq(\"排序保留\", repo.find(\"https://a.com\")!!.sortOrder, orderBefore)\n    eq(\"配置已更新\", repo.find(\"https://a.com\")!!.raw, \"newcfg\")\n\n    // 备份不更新 -> unchanged\n    val noUp = repo.installOne(InstalledSource(\"https://a.com\", \"旧版\", updatedAt = 50))\n    eq(\"不更新计入 unchanged\", noUp.unchanged.size, 1)\n    eq(\"名称未被旧版覆盖\", repo.find(\"https://a.com\")!!.name, \"源A新\")\n\n    // 用户手工改过 -> 受保护，不覆盖\n    repo.markUserEdited(\"https://a.com\", true)\n    val guarded = repo.installOne(\n        InstalledSource(\"https://a.com\", \"想覆盖\", updatedAt = 999)\n    )\n    eq(\"受保护被跳过\", guarded.skippedProtected.size, 1)\n    eq(\"受保护名称不变\", repo.find(\"https://a.com\")!!.name, \"源A新\")\n\n    // ================= 仓库：无效输入 =================\n    val invalidRep = repo.install(listOf(InstalledSource(\"ftp://bad.com\", \"坏\")))\n    eq(\"无效地址计入\", invalidRep.skippedInvalid.size, 1)\n    eq(\"无效未入库\", repo.contains(\"ftp://bad.com\"), false)\n\n    // 输入内部重复\n    val dupeIn = repo.install(\n        listOf(\n            InstalledSource(\"https://dup2.com\", \"第一\", updatedAt = 1),\n            InstalledSource(\"https://dup2.com\", \"第二\", updatedAt = 2)\n        )\n    )\n    eq(\"输入去重计数\", dupeIn.dedupedIncoming, 1)\n    eq(\"输入去重后一条\", dupeIn.added.size, 1)\n    eq(\"后者生效\", repo.find(\"https://dup2.com\")!!.name, \"第二\")\n\n    // ================= 仓库：分组 / 查询 / 统计 =================\n    repo.install(listOf(\n        InstalledSource(\"https://g1.com\", \"组一源\", \"历史\", updatedAt = 1),\n        InstalledSource(\"https://g2.com\", \"组二源\", \"玄幻\", updatedAt = 1)\n    ))\n    val byGroup = repo.byGroup()\n    check(\"分组含小说\", byGroup.containsKey(\"小说\"))\n    check(\"分组含历史\", byGroup.containsKey(\"历史\"))\n    check(\"分组含玄幻\", byGroup.containsKey(\"玄幻\"))\n    check(\"分组数正确\", repo.groups().size >= 4, repo.groups().joinToString(\",\"))\n\n    eq(\"搜索按名称\", repo.search(\"组一源\").size, 1)\n    eq(\"搜索按地址\", repo.search(\"g2.com\").size, 1)\n    eq(\"搜索按分组\", repo.search(\"玄幻\").size, 1)\n    eq(\"空关键字返回全部\", repo.search(\"  \").size, repo.size())\n    eq(\"无匹配返回空\", repo.search(\"zzz-not-exist\").size, 0)\n\n    val st = repo.stats()\n    eq(\"统计总数\", st.total, repo.size())\n    eq(\"统计启用+停用=总数\", st.enabled + st.disabled, st.total)\n    check(\"统计有手工编辑\", st.userEdited >= 1)\n\n    // ================= 仓库：增删改 =================\n    val beforeRemove = repo.size()\n    eq(\"删除成功\", repo.remove(\"https://g2.com\"), true)\n    eq(\"删除后减少\", repo.size(), beforeRemove - 1)\n    eq(\"重复删除返回 false\", repo.remove(\"https://g2.com\"), false)\n\n    val g1Count = repo.export(\"历史\").size\n    eq(\"删组条数\", repo.removeGroup(\"历史\"), g1Count)\n    eq(\"删组后无该组\", repo.export(\"历史\").size, 0)\n\n    // 前面删组已把 g1 删掉，重新装一条专用于改名/移组测试\n    repo.installOne(InstalledSource(\"https://g1.com\", \"恢复源\", \"历史\", updatedAt = 9))\n    eq(\"重命名成功\", repo.rename(\"https://g1.com\", \"改名后\"), true)\n    eq(\"重命名已生效\", repo.find(\"https://g1.com\")!!.name, \"改名后\")\n    eq(\"重命名标记手工编辑\", repo.find(\"https://g1.com\")!!.userEdited, true)\n    eq(\"重命名同名返回 false\", repo.rename(\"https://g1.com\", \"改名后\"), false)\n    eq(\"空名重命名被拒\", repo.rename(\"https://g1.com\", \"  \"), false)\n    eq(\"重命名不存在返回 false\", repo.rename(\"https://nope.com\", \"x\"), false)\n\n    eq(\"移动分组成功\", repo.moveToGroup(\"https://g1.com\", \"武侠\"), true)\n    eq(\"移动后分组\", repo.find(\"https://g1.com\")!!.group, \"武侠\")\n    eq(\"移到同名返回 false\", repo.moveToGroup(\"https://g1.com\", \"武侠\"), false)\n    eq(\"空分组回落默认\", repo.moveToGroup(\"https://g1.com\", \"  \"), true)\n    eq(\"回落后为默认分组\",\n        repo.find(\"https://g1.com\")!!.group, SourceRepository.DEFAULT_GROUP)\n\n    // 批量启停\n    val allUrls = repo.all().map { it.url }\n    check(\"批量停用\", repo.setEnabled(allUrls, false) > 0)\n    eq(\"全部停用后无启用\", repo.enabled().size, 0)\n    check(\"批量启用\", repo.setEnabled(allUrls, true) > 0)\n    eq(\"全部启用\", repo.enabled().size, repo.size())\n\n    // 重排\n    val reversed = repo.all().map { it.url }.reversed()\n    eq(\"重排返回 true\", repo.reorder(reversed), true)\n    eq(\"重排后首项\", repo.all().first().url, reversed.first())\n\n    // 写校验摘要\n    eq(\"写摘要成功\", repo.updateValidateSummary(reversed.first(), \"通过\"), true)\n    eq(\"摘要已写入\", repo.find(reversed.first())!!.validateSummary, \"通过\")\n    eq(\"重复写同摘要返回 false\", repo.updateValidateSummary(reversed.first(), \"通过\"), false)\n\n    // 摘要文案\n    check(\"安装摘要含新增\", rep1.summary().contains(\"新增\"), rep1.summary())\n    eq(\"空安装摘要\", SourceRepository.InstallReport().summary(), \"没有需要安装的书源\")\n\n    // ================= 调试：搜索 =================\n    val okSearch = SourceDebugger.checkSearch(listOf(\"书一\", \"书二\"), \"https://a.com\")\n    eq(\"搜索通过\", okSearch.status, Status.PASS)\n    eq(\"搜索计数\", okSearch.count, 2)\n    eq(\"搜索阶段\", okSearch.stage, Stage.SEARCH)\n\n    val emptySearch = SourceDebugger.checkSearch(emptyList(), \"https://a.com\")\n    eq(\"空搜索失败\", emptySearch.status, Status.FAIL)\n    check(\"空搜索有提示\", emptySearch.message.contains(\"搜索\"))\n\n    val hugeSearch = SourceDebugger.checkSearch(List(600) { \"r$it\" }, \"https://a.com\")\n    eq(\"过多结果警告\", hugeSearch.status, Status.WARN)\n    eq(\"过多计数\", hugeSearch.count, 600)\n\n    val blankSearch = SourceDebugger.checkSearch(listOf(\"\", \" \", \"ok\", \"\"), \"https://a.com\")\n    eq(\"大量空白警告\", blankSearch.status, Status.WARN)\n\n    // ================= 调试：详情 =================\n    val okDetail = SourceDebugger.checkDetail(\"书名\", \"cover.jpg\", \"简介\")\n    eq(\"详情全通过\", okDetail.status, Status.PASS)\n\n    val noNameDetail = SourceDebugger.checkDetail(null, \"c.jpg\", \"简介\")\n    eq(\"缺书名失败\", noNameDetail.status, Status.FAIL)\n\n    val partialDetail = SourceDebugger.checkDetail(\"书名\", null, null)\n    eq(\"缺封面简介警告\", partialDetail.status, Status.WARN)\n    check(\"警告说明含封面\", partialDetail.message.contains(\"封面\"), partialDetail.message)\n    check(\"警告说明含简介\", partialDetail.message.contains(\"简介\"), partialDetail.message)\n\n    // ================= 调试：目录 =================\n    val okToc = SourceDebugger.checkToc(List(20) { \"第${it}章\" })\n    eq(\"目录通过\", okToc.status, Status.PASS)\n    eq(\"目录章节数\", okToc.count, 20)\n\n    eq(\"空目录失败\", SourceDebugger.checkToc(emptyList()).status, Status.FAIL)\n    eq(\"单章警告\", SourceDebugger.checkToc(listOf(\"唯一章\")).status, Status.WARN)\n    val blankToc = SourceDebugger.checkToc(listOf(\"a\", \"\", \"c\"))\n    eq(\"含空标题警告\", blankToc.status, Status.WARN)\n    check(\"空标题计数在文案\", blankToc.message.contains(\"1\"), blankToc.message)\n\n    // ================= 调试：正文 =================\n    eq(\"空正文失败\", SourceDebugger.checkContent(null).status, Status.FAIL)\n    eq(\"空白正文失败\", SourceDebugger.checkContent(\"   \").status, Status.FAIL)\n    eq(\"极短正文失败\", SourceDebugger.checkContent(\"太短了\").status, Status.FAIL)\n\n    val shortBody = \"字\".repeat(100)\n    eq(\"偏短正文警告\", SourceDebugger.checkContent(shortBody).status, Status.WARN)\n\n    val goodBody = \"正文内容。\".repeat(100)\n    eq(\"正常正文通过\", SourceDebugger.checkContent(goodBody).status, Status.PASS)\n    eq(\"正文字数\", SourceDebugger.checkContent(goodBody).chars, goodBody.length)\n\n    val htmlBody = (\"<p>段落</p>\").repeat(30) + \"字\".repeat(300)\n    eq(\"含标签正文警告\", SourceDebugger.checkContent(htmlBody).status, Status.WARN)\n    check(\"标签提示在文案\", SourceDebugger.checkContent(htmlBody).message.contains(\"标签\"))\n\n    // 样本被截断\n    val longBody = \"字\".repeat(2000)\n    check(\"样本被截断\", SourceDebugger.checkContent(longBody).sample.length <= 500)\n\n    // ================= 调试：整链 =================\n    val pipeline = SourceDebugger.buildReport(\n        \"https://a.com\",\n        okSearch, okDetail, okToc, SourceDebugger.checkContent(goodBody)\n    )\n    eq(\"整链可用\", pipeline.isUsable, true)\n    eq(\"整链四步\", pipeline.steps.size, 4)\n    eq(\"整链通过数\", pipeline.passCount, 4)\n    eq(\"整链无失败阶段\", pipeline.failedStage, null)\n    eq(\"整链摘要\", pipeline.summary(), \"四步全部通过，书源可用\")\n\n    // 搜索失败 -> 后续 SKIP\n    val broken = SourceDebugger.buildReport(\n        \"https://a.com\",\n        emptySearch, okDetail, okToc, SourceDebugger.checkContent(goodBody)\n    )\n    eq(\"搜索失败整链不可用\", broken.isUsable, false)\n    eq(\"首个失败阶段\", broken.failedStage, Stage.SEARCH)\n    eq(\"后续被跳过\", broken.step(Stage.DETAIL)!!.status, Status.SKIP)\n    eq(\"跳过说明\", broken.step(Stage.DETAIL)!!.message.contains(\"上一步失败\"), true)\n    check(\"失败摘要含阶段名\", broken.summary().contains(\"搜索\"), broken.summary())\n\n    // 警告不阻断\n    val warnChain = SourceDebugger.buildReport(\n        \"https://a.com\", okSearch, partialDetail, okToc, SourceDebugger.checkContent(goodBody)\n    )\n    eq(\"警告仍可用\", warnChain.isUsable, true)\n    eq(\"警告计数\", warnChain.warnCount, 1)\n    check(\"警告摘要含留意\", warnChain.summary().contains(\"留意\"), warnChain.summary())\n\n    // 未执行阶段标 SKIP\n    val partialReport = SourceDebugger.buildReport(\"https://a.com\", okSearch, null, null, null)\n    eq(\"未执行标跳过\", partialReport.step(Stage.DETAIL)!!.status, Status.SKIP)\n\n    // ================= 调试：静态自检 =================\n    val staticBad = SourceDebugger.staticCheck(\n        \"ftp://bad\", \"源\", null, null, null, null\n    )\n    eq(\"静态自检失败\", staticBad.isUsable, false)\n    eq(\"静态自检单步\", staticBad.steps.size, 1)\n\n    val staticOk = SourceDebugger.staticCheck(\n        \"https://a.com\", \"源名\",\n        \"https://a.com/s?q={{key}}\", \"class.s@text\",\n        \"class.toc@tag.a\", \"id.c@text\"\n    )\n    eq(\"静态自检可用\", staticOk.isUsable, true)\n    check(\"静态自检提示实测\", staticOk.steps.first().message.contains(\"实测\"),\n        staticOk.steps.first().message)\n\n    // ================= 枚举契约 =================\n    eq(\"阶段 id 解析\", Stage.fromId(\"toc\"), Stage.TOC)\n    eq(\"未知阶段\", Stage.fromId(\"nope\"), null)\n    eq(\"状态 isBlocking\", Status.FAIL.isBlocking, true)\n    eq(\"PASS 不阻断\", Status.PASS.isBlocking, false)\n    eq(\"阶段数\", Stage.entries.size, 4)\n    eq(\"状态数\", Status.entries.size, 4)\n\n    println(\"================ R7 源导入/仓库/调试 单测 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"},{"path":"tests/SourceLayerTest.kt","lang":"kt","lines":312,"content":"import com.lanyue.reader.source.model.SourceHealth\nimport com.lanyue.reader.source.model.SourceType\nimport com.lanyue.reader.source.model.SourceValidator\nimport com.lanyue.reader.source.model.SourceValidator.Level\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\nprivate fun throws(name: String, block: () -> Unit) {\n    try {\n        block(); fail++; failures.add(\"$name -> 期望抛异常但未抛出\")\n    } catch (e: IllegalArgumentException) {\n        pass++\n    } catch (e: Throwable) {\n        fail++; failures.add(\"$name -> 异常类型不对: $e\")\n    }\n}\n\nfun main() {\n    // ================= SourceHealth =================\n    val h = SourceHealth(3)\n\n    eq(\"初始未隔离\", h.isIsolated(SourceType.BOOK, \"s1\"), false)\n    eq(\"未知源不视为隔离\", h.isIsolated(SourceType.VIDEO, \"never-seen\"), false)\n\n    eq(\"第1次失败计数\", h.markFail(SourceType.BOOK, \"s1\"), 1)\n    eq(\"第2次失败计数\", h.markFail(SourceType.BOOK, \"s1\"), 2)\n    eq(\"未达阈值不隔离\", h.isIsolated(SourceType.BOOK, \"s1\"), false)\n    eq(\"第3次失败计数\", h.markFail(SourceType.BOOK, \"s1\"), 3)\n    eq(\"达阈值即隔离\", h.isIsolated(SourceType.BOOK, \"s1\"), true)\n\n    // 关键回归：书源失败不得连带隔离同 id 的影视源（本轮修复的缺陷）\n    eq(\"同 id 影视源不受书源隔离影响\", h.isIsolated(SourceType.VIDEO, \"s1\"), false)\n\n    h.markSuccess(SourceType.BOOK, \"s1\")\n    eq(\"成功后解除隔离\", h.isIsolated(SourceType.BOOK, \"s1\"), false)\n    eq(\"成功后计数清零\", h.markFail(SourceType.BOOK, \"s1\"), 1)\n\n    // 影视源独立累计\n    h.markFail(SourceType.VIDEO, \"s1\")\n    h.markFail(SourceType.VIDEO, \"s1\")\n    eq(\"影视源未达阈值\", h.isIsolated(SourceType.VIDEO, \"s1\"), false)\n    h.markFail(SourceType.VIDEO, \"s1\")\n    eq(\"影视源达阈值被隔离\", h.isIsolated(SourceType.VIDEO, \"s1\"), true)\n    eq(\"影视隔离不波及书源\", h.isIsolated(SourceType.BOOK, \"s1\"), false)\n\n    // reset 跨类型清理\n    h.reset(\"s1\")\n    eq(\"reset 清影视隔离\", h.isIsolated(SourceType.VIDEO, \"s1\"), false)\n    eq(\"reset 后计数归零\", h.markFail(SourceType.BOOK, \"s1\"), 1)\n\n    // 隔离计数\n    val h2 = SourceHealth(2)\n    h2.markFail(SourceType.BOOK, \"a\"); h2.markFail(SourceType.BOOK, \"a\")\n    h2.markFail(SourceType.BOOK, \"b\")\n    eq(\"隔离源数量\", h2.isolatedCount(), 1)\n    eq(\"跟踪源数量含未达阈值\", h2.trackedCount(), 2)\n    h2.clear()\n    eq(\"clear 后无跟踪\", h2.trackedCount(), 0)\n    eq(\"clear 后无隔离\", h2.isolatedCount(), 0)\n\n    // 阈值 1 立刻隔离\n    val h3 = SourceHealth(1)\n    h3.markFail(SourceType.BOOK, \"x\")\n    eq(\"阈值1立即隔离\", h3.isIsolated(SourceType.BOOK, \"x\"), true)\n\n    // 非法阈值\n    throws(\"阈值 0 应拒绝\") { SourceHealth(0) }\n    throws(\"阈值负数应拒绝\") { SourceHealth(-1) }\n\n    // ================= SourceValidator: 书源 =================\n    val okBook = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\",\n        bookSourceName = \"测试源\",\n        searchUrl = \"/search?q={{key}}\",\n        ruleSearch = \"class.book@text\",\n        exploreUrl = \"/list\",\n        enabledExplore = true,\n        ruleToc = \"class.toc@text\",\n        ruleContent = \"id.content@html\"\n    )\n    eq(\"完整书源无错误\", okBook.hasError, false)\n    eq(\"完整书源摘要\", okBook.summary(), \"配置有效\")\n\n    val noUrl = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false, ruleToc = \"a@text\", ruleContent = \"b\"\n    )\n    eq(\"缺书源地址报错\", noUrl.hasError, true)\n    eq(\"错误字段是 bookSourceUrl\", noUrl.errors().first().field, \"bookSourceUrl\")\n\n    val badUrl = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"ftp://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false, ruleToc = \"a\", ruleContent = \"b\"\n    )\n    eq(\"非 http 地址报错\", badUrl.hasError, true)\n\n    val halfSearch = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = \"/s\",\n        ruleSearch = null, exploreUrl = null, enabledExplore = false,\n        ruleToc = \"a\", ruleContent = \"b\"\n    )\n    eq(\"只配搜索地址不报错但有告警\", halfSearch.hasError, false)\n    check(\"搜索告警存在\", halfSearch.warnings().any { it.field == \"searchUrl\" })\n\n    val noToc = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false, ruleToc = null, ruleContent = \"b\"\n    )\n    eq(\"缺目录规则报错\", noToc.hasError, true)\n\n    val noContent = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false, ruleToc = \"a\", ruleContent = null\n    )\n    eq(\"缺正文规则只是告警\", noContent.hasError, false)\n    check(\"正文告警存在\", noContent.warnings().any { it.field == \"ruleContent\" })\n\n    val audioNoContent = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false, ruleToc = \"a\", ruleContent = null,\n        bookSourceType = 1\n    )\n    eq(\"音频源缺正文不告警\", audioNoContent.warnings().none { it.field == \"ruleContent\" }, true)\n\n    val exploreWarn = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = true, ruleToc = \"a\", ruleContent = \"b\"\n    )\n    check(\"开发现却无地址告警\", exploreWarn.warnings().any { it.field == \"exploreUrl\" })\n\n    val badLogin = SourceValidator.validateBook(\n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false, ruleToc = \"a\", ruleContent = \"b\",\n        loginUrl = \"javascript:void(0)\"\n    )\n    eq(\"非法登录地址报错\", badLogin.hasError, true)\n\n    val badJs = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false,\n        ruleToc = \"@js:result = 'oops\", ruleContent = \"b\"\n    )\n    eq(\"JS 引号未闭合报错\", badJs.hasError, true)\n    check(\"错误提示提到 JS\", badJs.errors().first().message.contains(\"JS\"))\n\n    val goodJs = SourceValidator.validateBook(loginUrl = null, \n        bookSourceUrl = \"https://a.com\", bookSourceName = \"x\", searchUrl = null, ruleSearch = null,\n        exploreUrl = null, enabledExplore = false,\n        ruleToc = \"@js:result = JSON.parse(html).data\", ruleContent = \"b\"\n    )\n    eq(\"JS 配平不报错\", goodJs.hasError, false)\n\n    // ================= isHttpUrl =================\n    eq(\"https 合法\", SourceValidator.isHttpUrl(\"https://a.com\"), true)\n    eq(\"http 带路径合法\", SourceValidator.isHttpUrl(\"http://a.com/x?y=1\"), true)\n    eq(\"localhost 合法\", SourceValidator.isHttpUrl(\"http://localhost:8080\"), true)\n    eq(\"缺协议非法\", SourceValidator.isHttpUrl(\"a.com\"), false)\n    eq(\"空值非法\", SourceValidator.isHttpUrl(\"\"), false)\n    eq(\"null 非法\", SourceValidator.isHttpUrl(null), false)\n    eq(\"ftp 非法\", SourceValidator.isHttpUrl(\"ftp://a.com\"), false)\n    eq(\"无点主机非法\", SourceValidator.isHttpUrl(\"http://abc\"), false)\n    eq(\"协议相对非法\", SourceValidator.isHttpUrl(\"//a.com\"), false)\n\n    // ================= looksLikeJson =================\n    eq(\"空对象合法\", SourceValidator.looksLikeJson(\"{}\"), true)\n    eq(\"空数组合法\", SourceValidator.looksLikeJson(\"[]\"), true)\n    eq(\"嵌套合法\", SourceValidator.looksLikeJson(\"{\\\"a\\\":[1,{\\\"b\\\":2}]}\"), true)\n    eq(\"缺右括号非法\", SourceValidator.looksLikeJson(\"{\"), false)\n    eq(\"括号不配平非法\", SourceValidator.looksLikeJson(\"{\\\"a\\\":1\"), false)\n    eq(\"多余右括号非法\", SourceValidator.looksLikeJson(\"{\\\"a\\\":1}}\"), false)\n    eq(\"纯文本非法\", SourceValidator.looksLikeJson(\"abc\"), false)\n    eq(\"字符串内括号不算\", SourceValidator.looksLikeJson(\"{\\\"a\\\":\\\"}\\\"}\"), true)\n    eq(\"null 非法\", SourceValidator.looksLikeJson(null), false)\n\n    // ================= balanced =================\n    eq(\"配平括号\", SourceValidator.balanced(\"(a[b]{c})\"), true)\n    eq(\"未闭合圆括号\", SourceValidator.balanced(\"(a\"), false)\n    eq(\"多余右括号\", SourceValidator.balanced(\"a)\"), false)\n    eq(\"未闭合双引号\", SourceValidator.balanced(\"\\\"abc\"), false)\n    eq(\"未闭合单引号\", SourceValidator.balanced(\"'abc\"), false)\n    eq(\"字符串内括号不参与\", SourceValidator.balanced(\"\\\"(((\\\"\"), true)\n    eq(\"转义引号\", SourceValidator.balanced(\"\\\"a\\\\\\\"b\\\"\"), true)\n\n    // ================= 订阅源 =================\n    val okRss = SourceValidator.validateRss(\n        sourceUrl = \"https://a.com/rss\", sourceName = \"订阅\", sortUrl = \"推荐::/rec\",\n        ruleArticles = \"class.item\", ruleTitle = \"tag.a@text\", ruleLink = \"tag.a@href\",\n        searchUrl = null\n    )\n    eq(\"完整订阅源无错误\", okRss.hasError, false)\n\n    val rssNoUrl = SourceValidator.validateRss(\n        sourceUrl = null, sourceName = \"x\", sortUrl = null, ruleArticles = null,\n        ruleTitle = null, ruleLink = null, searchUrl = null\n    )\n    eq(\"订阅源缺地址报错\", rssNoUrl.hasError, true)\n\n    val rssNoTitle = SourceValidator.validateRss(\n        sourceUrl = \"https://a.com\", sourceName = \"x\", sortUrl = null,\n        ruleArticles = \"class.item\", ruleTitle = null, ruleLink = \"a@href\", searchUrl = null\n    )\n    eq(\"有列表无标题报错\", rssNoTitle.hasError, true)\n\n    val rssNoLink = SourceValidator.validateRss(\n        sourceUrl = \"https://a.com\", sourceName = \"x\", sortUrl = null,\n        ruleArticles = \"class.item\", ruleTitle = \"a@text\", ruleLink = null, searchUrl = null\n    )\n    eq(\"有列表无链接报错\", rssNoLink.hasError, true)\n\n    val rssBadType = SourceValidator.validateRss(\n        sourceUrl = \"https://a.com\", sourceName = \"x\", sortUrl = null,\n        ruleArticles = null, ruleTitle = null, ruleLink = null, searchUrl = null, type = 9\n    )\n    eq(\"非法内容类型报错\", rssBadType.hasError, true)\n\n    val rssBadSort = SourceValidator.validateRss(\n        sourceUrl = \"https://a.com\", sourceName = \"x\", sortUrl = \"只有名字没有地址\",\n        ruleArticles = null, ruleTitle = null, ruleLink = null, searchUrl = null\n    )\n    eq(\"分类行缺分隔只是告警\", rssBadSort.hasError, false)\n    check(\"分类分隔告警存在\", rssBadSort.warnings().any { it.field == \"sortUrl\" })\n\n    // 无规则的纯 RSS 兜底：合法\n    val pureRss = SourceValidator.validateRss(\n        sourceUrl = \"https://a.com/feed.xml\", sourceName = \"纯RSS\", sortUrl = null,\n        ruleArticles = null, ruleTitle = null, ruleLink = null, searchUrl = null\n    )\n    eq(\"纯 RSS 兜底合法\", pureRss.hasError, false)\n\n    // ================= 影视站点 =================\n    val okVideo = SourceValidator.validateVideoSite(\n        configUrl = \"https://a.com/api.php/provide/vod/\", siteKey = \"k1\",\n        name = \"站点\", type = 1, api = \"https://a.com/api.php/provide/vod/\", jar = null, ext = null\n    )\n    eq(\"正常站点无错误\", okVideo.hasError, false)\n\n    val drpySite = SourceValidator.validateVideoSite(\n        configUrl = \"https://a.com\", siteKey = \"k2\", name = \"drpy\", type = 3,\n        api = \"https://a.com/drpy.js\", jar = null, ext = null\n    )\n    eq(\"drpy 站点合法\", drpySite.hasError, false)\n\n    val jarSite = SourceValidator.validateVideoSite(\n        configUrl = \"https://a.com\", siteKey = \"k3\", name = \"jar站\", type = 3,\n        api = \"csp_AppYs\", jar = \"https://a.com/a.jar\", ext = null\n    )\n    eq(\"jar 站点报错(暂不支持)\", jarSite.hasError, true)\n    check(\"错误字段是 jar\", jarSite.errors().any { it.field == \"jar\" })\n\n    val noApi = SourceValidator.validateVideoSite(\n        configUrl = \"https://a.com\", siteKey = \"k4\", name = \"x\", type = 1,\n        api = null, jar = null, ext = null\n    )\n    eq(\"缺 api 报错\", noApi.hasError, true)\n\n    val badType = SourceValidator.validateVideoSite(\n        configUrl = \"https://a.com\", siteKey = \"k5\", name = \"x\", type = 7,\n        api = \"https://a.com/api\", jar = null, ext = null\n    )\n    eq(\"非法站点类型报错\", badType.hasError, true)\n\n    val badExt = SourceValidator.validateVideoSite(\n        configUrl = \"https://a.com\", siteKey = \"k6\", name = \"x\", type = 1,\n        api = \"https://a.com/api\", jar = null, ext = \"not-json\"\n    )\n    eq(\"非法 ext 只是告警\", badExt.hasError, false)\n    check(\"ext 告警存在\", badExt.warnings().any { it.field == \"ext\" })\n\n    val okExt = SourceValidator.validateVideoSite(\n        configUrl = \"https://a.com\", siteKey = \"k7\", name = \"x\", type = 1,\n        api = \"https://a.com/api\", jar = null, ext = \"{\\\"filter\\\":{}}\"\n    )\n    eq(\"合法 ext 无告警\", okExt.warnings().none { it.field == \"ext\" }, true)\n\n    // ================= 摘要文案 =================\n    val warnOnly = SourceValidator.Report(listOf(\n        SourceValidator.Issue(\"a\", Level.WARN, \"提示一\"),\n        SourceValidator.Issue(\"b\", Level.WARN, \"提示二\")\n    ))\n    eq(\"仅告警摘要\", warnOnly.summary(), \"可用，2 处提示\")\n    eq(\"仅告警仍有效\", warnOnly.isValid, true)\n    val errReport = SourceValidator.Report(listOf(\n        SourceValidator.Issue(\"a\", Level.ERROR, \"错了\")\n    ))\n    eq(\"错误摘要\", errReport.summary(), \"存在 1 处错误：错了\")\n    eq(\"错误即无效\", errReport.isValid, false)\n    eq(\"空报告有效\", SourceValidator.Report(emptyList()).isValid, true)\n\n    println(\"================ 源调度/校验单测 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"},{"path":"tools/check_contracts.py","lang":"py","lines":57,"content":"#!/usr/bin/env python3\n\"\"\"架构门禁（轻量静态检查）。\n\n1. EngineException 不得继承 CancellationException（4.3 强制约束）\n2. 源实现（source/）不得直接引用 UI 层\n3. LocalParseProxy 只允许绑定 127.0.0.1\n4. 关键 TODO 必须带编号（TODO-DEV-*），便于评审追踪\n\"\"\"\nimport re\nimport sys\nfrom pathlib import Path\n\nMAIN = Path(\"app/src/main/java\")\n\n\ndef read_all(path: Path):\n    return [(f, f.read_text(encoding=\"utf-8\")) for f in path.rglob(\"*.kt\")]\n\n\ndef main() -> int:\n    problems = []\n\n    engine = MAIN / \"com/lanyue/reader/core/engine/Engine.kt\"\n    if engine.exists():\n        text = engine.read_text(encoding=\"utf-8\")\n        m = re.search(r\"class EngineException\\([^)]*\\)\\s*:\\s*([A-Za-z0-9_.]+)\", text, re.S)\n        if m and \"CancellationException\" in m.group(1):\n            problems.append(\"Engine.kt: EngineException 不得继承 CancellationException\")\n    else:\n        problems.append(\"缺少 Engine.kt\")\n\n    for f, text in read_all(MAIN / \"com/lanyue/reader/source\"):\n        if re.search(r\"import com\\.lanyue\\.reader\\.ui\", text):\n            problems.append(f\"{f}: 源层不得依赖 UI 层\")\n\n    proxy = MAIN / \"com/lanyue/reader/source/video/LocalParseProxy.kt\"\n    if proxy.exists():\n        text = proxy.read_text(encoding=\"utf-8\")\n        if \"0.0.0.0\" in text:\n            problems.append(\"LocalParseProxy.kt: 禁止绑定 0.0.0.0\")\n\n    for f, text in read_all(MAIN):\n        for m in re.finditer(r\"TODO(?!-DEV-)[^ \\n]*\", text):\n            problems.append(f\"{f}: TODO 未带编号 -> {m.group(0)}\")\n\n    if problems:\n        print(\"[FAIL] 架构门禁：\")\n        for p in problems:\n            print(\"  -\", p)\n        return 1\n\n    print(\"[OK] 架构契约门禁通过\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"},{"path":"tools/check_disclaimer.py","lang":"py","lines":48,"content":"#!/usr/bin/env python3\n\"\"\"合规门禁：免责声明与版权声明必须存在于 strings.xml。\n\n要求（见产品合规章节）：\n1. 免责声明明确\"内容来自第三方源，App 不存储、不分发\"\n2. 明确\"用户自行承担使用风险\"与\"举报/下架通道\"\n\"\"\"\nimport sys\nfrom pathlib import Path\nfrom xml.etree import ElementTree as ET\n\nTARGET = Path(\"app/src/main/res/values/strings.xml\")\n\nREQUIRED_KEYS = {\n    \"disclaimer_title\",\n    \"disclaimer_body\",\n    \"disclaimer_copyright\",\n    \"disclaimer_report\",\n}\n\nREQUIRED_PHRASES = [\"第三方\", \"不存储\"]\n\n\ndef main() -> int:\n    if not TARGET.exists():\n        print(f\"[FAIL] strings.xml 不存在: {TARGET}\")\n        return 1\n\n    root = ET.parse(TARGET).getroot()\n    values = {el.get(\"name\"): (el.text or \"\") for el in root if el.tag == \"string\"}\n\n    missing = REQUIRED_KEYS - set(values)\n    if missing:\n        print(\"[FAIL] 缺少免责声明条目：\", sorted(missing))\n        return 1\n\n    body = values[\"disclaimer_body\"] + values[\"disclaimer_copyright\"]\n    for phrase in REQUIRED_PHRASES:\n        if phrase not in body:\n            print(f\"[FAIL] 免责声明缺少关键表述：{phrase}\")\n            return 1\n\n    print(\"[OK] 免责声明门禁通过\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"},{"path":"tools/check_no_telemetry.py","lang":"py","lines":55,"content":"#!/usr/bin/env python3\n\"\"\"合规门禁：本地埋点不得有网络出口。\n\n第八章要求：埋点只落本地文件（LocalMetrics -> 本地环形日志），\n禁止上报、禁止初始化第三方统计 SDK、禁止向远端发请求。\n\"\"\"\nimport re\nimport sys\nfrom pathlib import Path\n\nSRC = Path(\"app/src/main/java\")\nMETRICS_DIR = SRC / \"com/lanyue/reader/core/observability\"\n\nNET_HINTS = re.compile(\n    r\"HttpURLConnection|OkHttpClient|openConnection\\(|Retrofit|\"\n    r\"firebase|umeng|appsflyer|sensorsdata|bugly\",\n    re.I,\n)\n\nTHIRD_PARTY_SDK = re.compile(\n    r\"com\\.google\\.firebase|com\\.umeng|com\\.bugly|com\\.appsflyer|\"\n    r\"com\\.sensorsdata|cn\\.jpush|com\\.tencent\\.bugly\",\n)\n\n\ndef main() -> int:\n    problems = []\n\n    if METRICS_DIR.exists():\n        for f in METRICS_DIR.rglob(\"*.kt\"):\n            text = f.read_text(encoding=\"utf-8\")\n            for m in NET_HINTS.finditer(text):\n                problems.append(f\"{f}: 埋点模块出现网络/SDK 特征 {m.group(0)}\")\n\n    build = Path(\"app/build.gradle.kts\")\n    if build.exists():\n        for line in build.read_text(encoding=\"utf-8\").splitlines():\n            s = line.strip()\n            if s.startswith(\"//\") or not s.startswith(\"implementation(\"):\n                continue\n            if THIRD_PARTY_SDK.search(s):\n                problems.append(f\"build.gradle.kts: 引入第三方统计 SDK -> {s}\")\n\n    if problems:\n        print(\"[FAIL] 存在数据上报风险：\")\n        for p in problems:\n            print(\"  -\", p)\n        return 1\n\n    print(\"[OK] 无遥测出口门禁通过\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"},{"path":"tools/check_permissions.py","lang":"py","lines":76,"content":"#!/usr/bin/env python3\n\"\"\"第六章 6.2.4 权限最小化门禁。\n\n校验 AndroidManifest.xml 的 uses-permission 只能是白名单集合。\n白名单是\"允许集\"，不代表都是非危险级；POST_NOTIFICATIONS 属 dangerous，\n必须运行时请求（见 ui 层 requestPermission）。\n\"\"\"\nimport re\nimport sys\nfrom pathlib import Path\n\nALLOWED = {\n    \"android.permission.INTERNET\",\n    \"android.permission.ACCESS_NETWORK_STATE\",\n    \"android.permission.POST_NOTIFICATIONS\",\n    \"android.permission.FOREGROUND_SERVICE\",\n    \"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\",\n    \"android.permission.FOREGROUND_SERVICE_DATA_SYNC\",\n    \"android.permission.CHANGE_WIFI_MULTICAST_STATE\",\n    \"android.permission.WAKE_LOCK\",\n}\n\nFORBIDDEN_HINTS = (\n    \"READ_PHONE_STATE\",\n    \"READ_SMS\",\n    \"READ_EXTERNAL_STORAGE\",\n    \"QUERY_ALL_PACKAGES\",\n    \"MANAGE_EXTERNAL_STORAGE\",\n    \"ACCESS_FINE_LOCATION\",\n    \"READ_CONTACTS\",\n    \"RECORD_AUDIO\",\n    \"CAMERA\",\n)\n\nMANIFEST = Path(\"app/src/main/AndroidManifest.xml\")\n\n\ndef main() -> int:\n    if not MANIFEST.exists():\n        print(f\"[FAIL] manifest not found: {MANIFEST}\")\n        return 1\n\n    text = MANIFEST.read_text(encoding=\"utf-8\")\n    declared = set(re.findall(r'android:name=\"(android\\.permission\\.[A-Z_]+)\"', text))\n\n    extra = declared - ALLOWED\n    if extra:\n        print(\"[FAIL] 超出权限白名单：\")\n        for p in sorted(extra):\n            print(f\"  - {p}\")\n        return 1\n\n    bad = [p for p in declared if any(h in p for h in FORBIDDEN_HINTS)]\n    if bad:\n        print(\"[FAIL] 命中禁止清单：\", bad)\n        return 1\n\n    # 前台服务类型必须与代码用途一致\n    for svc, need in (\n        (\"MediaDownloadService\", \"dataSync\"),\n        (\"AudioPlaybackService\", \"mediaPlayback\"),\n    ):\n        m = re.search(r'android:name=\"\\.player\\.' + svc + r'\"(.*?)/>', text, re.S)\n        if not m:\n            print(f\"[FAIL] 未声明服务 {svc}\")\n            return 1\n        if need not in m.group(1):\n            print(f\"[FAIL] {svc} foregroundServiceType 应为 {need}\")\n            return 1\n\n    print(f\"[OK] 权限门禁通过，已声明 {len(declared)} 项，均在白名单内\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"},{"path":"tools/ci.sh","lang":"sh","lines":17,"content":"#!/usr/bin/env bash\n# 合规 + 架构门禁总入口。CI 与本地提交前均执行。\nset -euo pipefail\ncd \"$(dirname \"$0\")/..\"\n\nfail=0\nfor script in tools/check_permissions.py tools/check_disclaimer.py \\\n              tools/check_no_telemetry.py tools/check_contracts.py; do\n    echo \"== $script\"\n    python3 \"$script\" || fail=1\ndone\n\nif [ \"$fail\" -ne 0 ]; then\n    echo \"合规门禁未通过，禁止合并\"\n    exit 1\nfi\necho \"全部门禁通过\"\n"}]</script>

<script>
(function(){
  var FILES = JSON.parse(document.getElementById('srcData').textContent);
  var tree = document.getElementById('tree');
  var codePane = document.getElementById('codePane');
  var pathEl = document.getElementById('path');
  var fileStats = document.getElementById('fileStats');
  var resultsEl = document.getElementById('results');
  var searchMeta = document.getElementById('searchMeta');
  var searchInput = document.getElementById('search');
  var toastEl = document.getElementById('toast');
  var current = null;

  document.getElementById('statFiles').textContent = FILES.length;
  document.getElementById('statKt').textContent = FILES.filter(function(f){return f.lang==='kt';}).length;
  document.getElementById('statLines').textContent =
    FILES.reduce(function(a,f){return a+f.lines;},0).toLocaleString();

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var KW = /\b(package|import|fun|val|var|class|object|interface|data|enum|sealed|abstract|override|private|public|internal|protected|suspend|return|if|else|when|for|while|try|catch|finally|throw|is|as|in|out|null|true|false|this|super|const|companion|init|by|where|typealias|lateinit)\b/g;

  function highlight(src){
    var out = esc(src);
    out = out.replace(/(\/\/[^\n]*)/g, '<span style="color:var(--com)">$1</span>');
    out = out.replace(/(&quot;[^&]*?&quot;)/g, '<span style="color:var(--str)">$1</span>');
    out = out.replace(KW, '<span style="color:var(--kw)">$1</span>');
    out = out.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span style="color:var(--num)">$1</span>');
    return out;
  }

  function renderTree(){
    var html = '', lastDir = '';
    FILES.forEach(function(f){
      var dir = f.path.indexOf('/') >= 0 ? f.path.slice(0, f.path.lastIndexOf('/')) : '.';
      if (dir !== lastDir){ html += '<div class="dir">'+esc(dir)+'</div>'; lastDir = dir; }
      var name = f.path.slice(f.path.lastIndexOf('/')+1);
      html += '<div class="file" data-path="'+esc(f.path)+'">'+esc(name)+'</div>';
    });
    tree.innerHTML = html;
  }

  function show(file){
    current = file;
    pathEl.textContent = file.path;
    fileStats.textContent = file.lines + ' 行 · ' + file.lang;
    codePane.innerHTML = highlight(file.content);
    codePane.scrollTop = 0;
    resultsEl.classList.add('hidden');
    searchMeta.classList.add('hidden');
    codePane.classList.remove('hidden');
    Array.prototype.forEach.call(tree.querySelectorAll('.file'), function(el){
      el.classList.toggle('active', el.getAttribute('data-path') === file.path);
    });
  }

  tree.addEventListener('click', function(e){
    var el = e.target.closest('.file');
    if (!el) return;
    var p = el.getAttribute('data-path');
    var f = FILES.filter(function(x){return x.path===p;})[0];
    if (f) show(f);
  });

  var timer = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(timer); timer = setTimeout(runSearch, 160);
  });

  function runSearch(){
    var q = searchInput.value.trim();
    if (!q){ show(current || FILES[0]); return; }
    var lower = q.toLowerCase(), hits = [];
    FILES.forEach(function(f){
      f.content.split('\n').forEach(function(line, i){
        if (line.toLowerCase().indexOf(lower) >= 0){
          hits.push({path:f.path, line:i+1, text:line.trim().slice(0,200)});
        }
      });
      if (f.path.toLowerCase().indexOf(lower) >= 0){
        hits.push({path:f.path, line:0, text:'（文件名匹配）'});
      }
    });
    codePane.classList.add('hidden');
    resultsEl.classList.remove('hidden');
    searchMeta.classList.remove('hidden');
    searchMeta.textContent = hits.length + ' 处匹配';
    var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    resultsEl.innerHTML = hits.slice(0,400).map(function(h){
      var t = esc(h.text).replace(re, '<mark>$1</mark>');
      return '<div class="hit" data-path="'+esc(h.path)+'"><div class="hit-path">'
        + esc(h.path) + ' : ' + h.line + '</div><div class="hit-line">' + t + '</div></div>';
    }).join('');
  }

  resultsEl.addEventListener('click', function(e){
    var el = e.target.closest('.hit');
    if (!el) return;
    var p = el.getAttribute('data-path');
    var f = FILES.filter(function(x){return x.path===p;})[0];
    if (f) { searchInput.value=''; show(f); }
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    if (!current) return;
    var t = document.createElement('textarea');
    t.value = current.content;
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('已复制 ' + current.path); }
    catch(e){ toast('复制失败'); }
    document.body.removeChild(t);
  });

  document.getElementById('dlBtn').addEventListener('click', function(){
    var b64 = document.getElementById('zipData').textContent.trim();
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], {type:'application/zip'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lanyue-android-src.zip';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('ZIP 下载已开始');
  });

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  renderTree();
  if (FILES.length) show(FILES[0]);
})();
</script>
</body>
</html>
