<script id="srcData" type="application/json">[{"path":"README.md","lang":"md","lines":115,"content":"# 蓝阅 Android 阅读器（架构骨架）\n\n自托管、本地优先的 Android 阅读器骨架。纯本地运行，无埋点、无遥测、无第三方统计 SDK。\n\n## 目录\n\n```\napp/src/main/java/com/lanyue/reader/\n├── core/\n│   ├── engine/        规则引擎核心（JsRuntime / DomParser / JsExtensions / 通道粘滞 /\n│   │                  RateLimiter / Sniffer / NetworkDispatcher / pool）\n│   ├── net/           网络通道抽象与 OkHttp 实现\n│   ├── render/        排版引擎（TypographySpec / Paginator / ReadingProgress /\n│   │                  ReadingSettings / PageTurnController / Theme）\n│   ├── security/      权限与桥接安全\n│   └── observability/ 本地指标（仅落盘，不外发）\n├── source/\n│   ├── rule/          规则层（RuleSyntax 语法 / RuleChain 编排 / RuleEngine 执行）\n│   └── video/         TVBox 兼容与本地解析代理\n├── data/\n│   ├── db/            Room 数据库 / 实体 / DAO（书源、订阅、影视、弹幕）\n│   └── backup/        备份 DTO / JSON 编解码 / 导入合并策略\n└── tools/             合规与架构门禁脚本\n```\n\n## 规则引擎\n\n一条规则按「自外向内」的优先级拆解：\n\n| 语法 | 语义 |\n|------|------|\n| `A \\|\\| B` | 备选，A 有结果即短路，不再请求 B |\n| `A && B` | 并列，两段结果按顺序合并 |\n| `sel##正则##替换` | 取数后正则替换，支持 `$1` 反向引用；单 `##正则` 表示删除匹配 |\n| `@put:{k:v}` / `@get:{k}` | 变量写入 / 读取 |\n| `{{ 表达式 }}` | 结果模板拼接 |\n| `class.x.1@text` | 尾部 `.N` 取第 N 个元素（负数取倒数） |\n\n拆分逻辑在 `RuleSyntax`（纯字符串处理）与 `RuleChain`（纯函数编排），\n`RuleEngine` 只负责取数与 I/O 接线，因此整条规则的拆解行为可在 JVM 单测中锁定。\n\n## 排版引擎\n\n- `Paginator`：按字宽单位估算分页（中文 1 格、ASCII 半格），带避头尾与英文单词保护；\n  全局字符偏移为唯一真值，改字号重排后位置不跳章。\n- `ReadingProgress`：不可变进度状态机，含空书 / 越界 / 单章边界保护。\n- `TypographySpec` / `ThemePalette`：排版度量与主题为纯数据，校验在构造期完成。\n\n## 源调度层\n\n- `SourceRouter`：统一调度四类源（书源 / 订阅源 / 影视站点 / 弹幕源），\n  `Semaphore` 闸门限制单源并发，失败按类型化健康度隔离。\n- `SourceHealth`：故障计数按 **源类型 + 源地址** 二维键分开累计。\n  这是刻意修掉的一个真实缺陷——早期实现只用 sourceId 单键计数，\n  同一个 id 的书源失败会连带隔离影视源，导致两类源互相拖垮。\n- `SourceValidator`：书源 / 订阅源 / 影视站点的配置自检，\n  区分 `ERROR`（阻止保存）与 `WARN`（仅提示），并给出可直接展示的中文原因；\n  内置 `isHttpUrl` / `looksLikeJson` / `balanced` 三个纯函数做入参体检。\n\n## 阅读运行时\n\n- `ReadingSettings`：字号 / 行距 / 字距 / 主题 / 翻页方式 / 常亮 / 全屏 / 自动夜间，\n  全部字段构造即校验并夹紧边界；`serialize` / `deserialize` 为稳定 key=value 串，\n  单个字段损坏只回落该字段，不整体丢弃配置。\n- `PageTurnController`：翻页状态机，区分页内翻动 / 跨章 / 撞书首书尾四种边界；\n  跨章时按章节号强制打已读标记（不依赖 charOffset 是否恰好等于章节长度，\n  因为分页会裁掉尾段空白）；滚动阅读模式用字符步进模拟，越界自动夹紧。\n- `resolveTheme(hour)`：开启自动夜间后按小时切换，白天保留用户原本的浅色主题。\n\n## 数据备份与恢复\n\n- `BackupModels`：备份 DTO 独立于 Room 实体。\n  实体带 androidx 注解，纯 JVM 无法加载；备份又是对外长期契约，\n  表结构不应绑架备份格式，因此单独定义一套带默认值的朴素数据类。\n- `BackupCodec`：手写字段读写而非 Gson 反射映射。\n  反射反序列化会丢掉 Kotlin 默认值，老备份缺字段时会得到 null/0；\n  手写实现可逐字段容错，并给出「哪一段、哪条记录坏了」的精确告警。\n  失败分层：格式标记不符 / 版本越界整体拒绝；某段类型错、某条缺主键只局部跳过。\n- `BackupMerger`：三种冲突策略（保留本机 / 以备份为准 / 按时间取新），\n  纯函数实现，输入「本机主键+时间戳快照」与备份内容，输出待写记录。\n  用户手工编辑过的书源受保护，导入不会覆盖调好的规则；备份内部重复条目按后者去重。\n\n## 本地解析代理\n\n`LocalParseProxy` 仅监听 `127.0.0.1` 随机端口，每次播放会话签发随机 token：\n会话有 TTL 与数量上限，同 URL 并发解析会合并，上游地址过滤 CR/LF 防响应头注入。\n\n## 合规门禁\n\n```bash\nbash tools/ci.sh\n```\n\n四道门禁：权限白名单、免责声明、无遥测出口、架构契约。\n\n## 单测\n\n纯 JVM 逻辑层全部可脱机验证，不依赖 Android SDK：\n\n| 套件 | 覆盖 |\n|------|------|\n| `tests/RuleEngineDispatchTest.kt` | 规则拆解与执行派发 |\n| `tests/JsonXpathTest.kt` | JSONPath / XPathLite 求值 |\n| `tests/SourceLayerTest.kt` | 源健康度隔离 + 三类源配置校验（85 项） |\n| `tests/ReadingLayerTest.kt` | 阅读设置往返 + 翻页状态机 + 分页链路（126 项） |\n| `tests/BackupLayerTest.kt` | 备份编解码容错 + 合并策略（89 项） |\n\n## 构建\n\n需要 Android Studio / AGP。本仓库为架构骨架，不含完整 UI 与资源，无法直接出包。\n\n## 说明\n\n本项目不内置、不分发任何书籍或影视内容，也不内置任何源规则；\n仅提供阅读与解析引擎能力，内容与源的获取、合规性由使用者自行负责。\n"},{"path":"app/build.gradle.kts","lang":"kts","lines":90,"content":"plugins {\n    id(\"com.android.application\")\n    id(\"org.jetbrains.kotlin.android\")\n    id(\"com.google.devtools.ksp\")\n}\n\nandroid {\n    namespace = \"com.lanyue.reader\"\n    compileSdk = 34\n\n    defaultConfig {\n        applicationId = \"com.lanyue.reader\"\n        minSdk = 26\n        targetSdk = 34\n        versionCode = 1\n        versionName = \"0.1.0\"\n        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\n    }\n\n    buildTypes {\n        release {\n            isMinifyEn     debugImplementation(\"androidx.compose.ui:ui-tooling:1.6.8\")\n\n    testImplementation(\"junit:junit:4.13.2\")\n    testImplementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1\")\n}\n\n// 4.10.7 / 8.2 性能验收：同屏 200 条\ntasks.withType<Test> {\n    maxParallelForks = 1\n}\n"},{"path":"app/proguard-rules.pro","lang":"pro","lines":2,"content":"-keep class com.lanyue.reader.data.db.** { *; }\n-keep class com.lanyue.reader.source.model.** { *; }\n"},{"path":"app/src/main/AndroidManifest.xml","lang":"xml","lines":59,"content":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!--\n  第六章 6.2.4 权限最小化白名单（CI 门禁 tools/check_permissions.py 强制校验）\n  白名单是允许集，不等同于非危险级：POST_NOTIFICATIONS 为 dangerous，需运行时请求。\n  禁止 READ_PHONE_STATE / READ_SMS / READ_EXTERNAL_STORAGE / QUERY_ALL_PACKAGES 等超范围权限。\n-->\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_DATA_SYNC\" />\n    <uses-permission android:name=\"android.permission.CHANGE_WIFI_MULTICAST_STATE\" />\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n\n    <application\n        android:name=\".LanyueApp\"\n        android:allowBackup=\"false\"\n        android:label=\"@string/app_name\"\n        android:usesCleartextTraffic=\"false\"\n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.Lanyue\">\n\n        <activity\n            android:name=\".ui.MainActivity\"\n            android:exported=\"true\"\n            android:configChanges=\"orientation|screenSize|keyboardHidden|uiMode\"\n            android:windowSoftInputMode=\"adjustResize\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n            <!-- 1.5 源导入 URL Scheme：各 Tab 导入互斥 -->\n            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <category android:name=\"android.intent.category.BROWSABLE\" />\n                <data android:scheme=\"lanYue\" android:host=\"booksource\" />\n                <data android:scheme=\"lanYue\" android:host=\"rssSource\" />\n                <data android:scheme=\"lanYue\" android:host=\"video\" />\n                <data android:scheme=\"lanYue\" android:host=\"danmaku\" />\n            </intent-filter>\n        </activity>\n\n        <!-- 4.11 媒体下载退后台续传：foregroundServiceType 必须是 dataSync -->\n        <service\n            android:name=\".player.MediaDownloadService\"\n            android:exported=\"false\"\n            android:foregroundServiceType=\"dataSync\" />\n\n        <!-- 4.9 音频书源后台播放 -->\n        <service\n            android:name=\".player.AudioPlaybackService\"\n            android:exported=\"false\"\n            android:foregroundServiceType=\"mediaPlayback\" />\n    </application>\n</manifest>\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/ChannelSticky.kt","lang":"kt","lines":113,"content":"package com.lanyue.reader.core.engine\n\nimport java.security.MessageDigest\n\n/** 4.6 三通道。 */\nenum class NetChannel { OKHTTP, CRONET, WEBVIEW }\n\n/**\n * 通道粘滞所需的持久化能力。\n *\n * 刻意不直接依赖 android.content.SharedPreferences：\n * 网络调度是纯逻辑层，靠接口反转依赖后可以在 JVM 单测里用内存实现验证\n * 「2 次命中才切换」「7 天过期」「源删除清理」等规则。\n * Android 侧由 SharedPreferencesStickyStore 适配。\n */\ninterface StickyKeyValueStore {\n    fun get(key: String): String?\n    fun put(key: String, value: String)\n    fun remove(key: String)\n    fun keys(): Set<String>\n}\n\n/** 内存实现：单测与降级场景用，进程重启即失效。 */\nclass InMemoryStickyStore : StickyKeyValueStore {\n    private val map = LinkedHashMap<String, String>()\n    override fun get(key: String): String? = map[key]\n    override fun put(key: String, value: String) { map[key] = value }\n    override fun remove(key: String) { map.remove(key) }\n    override fun keys(): Set<String> = map.keys.toSet()\n}\n\n/**\n * 4.6 通道粘滞。\n * - 粘滞 key = 域名 + sourceId 哈希（明确不使用 UA 哈希）\n * - 连续 2 次命中指纹拦截特征才更新绑定并埋点\n * - 降级后同源后续请求直接走新通道\n * - 持久化 7 天\n * - 源删除时清理；源编辑保存 diff baseUrl/UA 变化时清理重探测\n */\nclass ChannelStickyStore(\n    private val store: StickyKeyValueStore,\n    private val now: () -> Long = System::currentTimeMillis\n) {\n\n    private val ttlMs = 7L * 24 * 60 * 60 * 1000\n    private val hitCounts = mutableMapOf<String, Int>()\n\n    /** sourceId 取 SHA-256 前 16 位，避免把完整 id 写进键里。 */\n    private fun digestOf(sourceId: String): String =\n        MessageDigest.getInstance(\"SHA-256\")\n            .digest(sourceId.toByteArray(Charsets.UTF_8))\n            .joinToString(\"\") { \"%02x\".format(it) }\n            .take(16)\n\n    fun stickyKey(host: String, sourceId: String): String = \"$host#${digestOf(sourceId)}\"\n\n    fun channelFor(host: String, sourceId: String): NetChannel? {\n        val key = stickyKey(host, sourceId)\n        val raw = store.get(key) ?: return null\n        val parts = raw.split('|')\n        if (parts.size != 2) return null\n        val channel = runCatching { NetChannel.valueOf(parts[1]) }.getOrNull() ?: return null\n        val savedAt = parts[0].toLongOrNull() ?: return null\n        if (now() - savedAt > ttlMs) {\n            store.remove(key)\n            return null\n        }\n        return channel\n    }\n\n    /**\n     * 记录一次指纹拦截特征命中。\n     * 返回 true 表示达到「连续 2 次」阈值，调用方应切换到 [newChannel] 并埋点。\n     */\n    fun recordFingerprintHit(host: String, sourceId: String, newChannel: NetChannel): Boolean {\n        val key = stickyKey(host, sourceId)\n        val count = (hitCounts[key] ?: 0) + 1\n        if (count < REQUIRED_HITS) {\n            hitCounts[key] = count\n            return false\n        }\n        hitCounts[key] = 0\n        store.put(key, \"${now()}|${newChannel.name}\")\n        return true\n    }\n\n    fun resetHitCount(host: String, sourceId: String) {\n        hitCounts.remove(stickyKey(host, sourceId))\n    }\n\n    /** 源被删除时同步清理该源全部粘滞键与计数。 */\n    fun clearForSource(sourceId: String) {\n        val suffix = \"#${digestOf(sourceId)}\"\n        store.keys().filter { it.endsWith(suffix) }.forEach { store.remove(it) }\n        hitCounts.keys.filter { it.endsWith(suffix) }.forEach { hitCounts.remove(it) }\n    }\n\n    /**\n     * 源编辑保存时调用：baseUrl 或 UA 变化 → 清键重探测。\n     * UA 变化会改变站点指纹响应，保留旧粘滞会指向已不适用的通道。\n     */\n    fun onSourceEdited(host: String, sourceId: String, baseUrlChanged: Boolean, uaChanged: Boolean) {\n        if (!baseUrlChanged && !uaChanged) return\n        val key = stickyKey(host, sourceId)\n        store.remove(key)\n        hitCounts.remove(key)\n    }\n\n    private companion object {\n        /** 连续命中阈值：2 次才认定站点确有指纹拦截，避免偶发抖动误切通道。 */\n        const val REQUIRED_HITS = 2\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/DomParser.kt","lang":"kt","lines":88,"content":"package com.lanyue.reader.core.engine\n\nimport kotlinx.coroutines.delay\nimport org.jsoup.Jsoup\nimport org.jsoup.nodes.Document\n\n/**\n * 4.7 DomParser。\n *\n * - 真 DOM：sandbox iframe，查询走 postMessage（实现见 [RealDomSession]）\n * - Jsoup 降级\n * - 会话式；HTML 阈值 2MB\n * - 动态等待 300ms + readyState + 500ms 静默，总 8s，超时 degraded\n * - enableScript 不可变更；默认禁脚本外部资源\n */\nclass DomParser(\n    private val realDom: RealDomSession?,\n    private val metrics: com.lanyue.reader.core.observability.LocalMetrics\n) {\n\n    companion object {\n        const val HTML_SIZE_LIMIT = 2 * 1024 * 1024\n        const val INITIAL_WAIT_MS = 300L\n        const val QUIET_WINDOW_MS = 500L\n        const val TOTAL_WAIT_MS = 8_000L\n    }\n\n    sealed class ParseResult {\n        data class Ok(val document: Document, val degraded: Boolean) : ParseResult()\n        data class Failed(val reason: String) : ParseResult()\n    }\n\n    /**\n     * 4.13.3 降级链：真 DOM 失败 → jsoup。\n     * [needsRealDom] 由源规则是否含 DOM 相关 JS 调用决定。\n     */\n    suspend fun parse(html: String, baseUrl: String?, needsRealDom: Boolean, traceId: String): ParseResult {\n        if (html.length > HTML_SIZE_LIMIT) {\n            return ParseResult.Failed(\"html exceeds 2MB limit: ${html.length}\")\n        }\n\n        // 构造参数属性无法智能转换，先取出局部引用再判空\n        val session = realDom\n        if (needsRealDom && session != null) {\n            val dom = runCatching { session.queryDocument(html, baseUrl, TOTAL_WAIT_MS) }.getOrNull()\n            if (dom != null) return ParseResult.Ok(dom, degraded = false)\n            metrics.degradation(traceId, \"realdom->jsoup\")\n        }\n\n        val doc = runCatching { Jsoup.parse(html, baseUrl ?: \"\") }.getOrNull()\n            ?: return ParseResult.Failed(\"jsoup parse failed\")\n        return ParseResult.Ok(doc, degraded = true)\n    }\n\n    /**\n     * 4.7 动态等待策略：300ms 首等 → 轮询 readyState → 500ms 静默 → 总 8s 超时 degraded。\n     * 返回 true 表示页面被认为已稳定。\n     */\n    suspend fun awaitStable(readyStateProvider: () -> String, mutationCounter: () -> Int): Boolean {\n        delay(INITIAL_WAIT_MS)\n        val deadline = System.currentTimeMillis() + TOTAL_WAIT_MS\n        var lastMutation = mutationCounter()\n        var quietSince = System.currentTimeMillis()\n\n        while (System.currentTimeMillis() < deadline) {\n            if (readyStateProvider() == \"complete\") {\n                val now = mutationCounter()\n                if (now != lastMutation) {\n                    lastMutation = now\n                    quietSince = System.currentTimeMillis()\n                } else if (System.currentTimeMillis() - quietSince >= QUIET_WINDOW_MS) {\n                    return true\n                }\n            }\n            delay(100L)\n        }\n        return false\n    }\n}\n\n/** 4.7 真 DOM 会话（sandbox iframe，查询走 postMessage）。 */\ninterface RealDomSession {\n    /** 超时或失败返回 null，由调用方降级到 jsoup。 */\n    suspend fun queryDocument(html: String, baseUrl: String?, timeoutMs: Long): Document?\n    /** 4.7 会话式：同一会话内可多次查询。 */\n    suspend fun select(sessionId: String, selector: String): List<String>\n    suspend fun close(sessionId: String)\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/Engine.kt","lang":"kt","lines":114,"content":"package com.lanyue.reader.core.engine\n\nimport com.lanyue.reader.core.security.SourcePermissionLevel\n\n/**\n * 4.4 BrowserEngine 抽象层。\n * UI/源调度层只依赖本文件，不直接接触 WebView / Cronet / OkHttp。\n */\ninterface BrowserEngine {\n    val js: JsRuntime\n    val net: NetworkDispatcher\n    val dom: DomParser\n    val sniffer: Sniffer\n\n    /** 4.4：初始化、预建池、加载 runner；至少 1 实例就绪才返回。 */\n    suspend fun warmUp()\n\n    /** 4.4：幂等；先 poison 再 drain(SHUTDOWN)；关闭态不可重启。 */\n    suspend fun shutdown()\n}\n\n/** 4.5 三种 JS 执行环境。 */\nenum class JsExecMode { MAIN, SANDBOX_REUSE, SANDBOX_ISOLATED }\n\n/** 4.3 内核错误码。 */\nenum class EngineErrorCode {\n    TIMEOUT,\n    SCRIPT_EXCEPTION,\n    POISONED,\n    DISCARDED,\n    SHUTDOWN,\n    RENDER_GONE,\n    POOL_EXHAUSTED,\n    RATE_LIMITED,\n    SANDBOX_SUBMIT_TIMEOUT,\n    CANCELLED\n}\n\n/**\n * 4.3 强制约束：EngineException 禁止继承 CancellationException。\n * 否则协程取消语义会被内核异常污染，导致上游误判取消来源。\n */\nclass EngineException(\n    val code: EngineErrorCode,\n    override val message: String,\n    override val cause: Throwable? = null\n) : Exception(message, cause) {\n\n    /** 4.3：CANCELLED 仅埋点，不提示用户。 */\n    val silent: Boolean get() = code == EngineErrorCode.CANCELLED\n\n    companion object {\n        fun timeout(msg: String = \"engine timeout\") =\n            EngineException(EngineErrorCode.TIMEOUT, msg)\n\n        fun poisoned(msg: String = \"instance poisoned\") =\n            EngineException(EngineErrorCode.POISONED, msg)\n\n        fun discarded(msg: String = \"instance discarded\") =\n            EngineException(EngineErrorCode.DISCARDED, msg)\n\n        fun shutdown(msg: String = \"engine shutdown\") =\n            EngineException(EngineErrorCode.SHUTDOWN, msg)\n\n        fun poolExhausted(msg: String = \"pool exhausted\") =\n            EngineException(EngineErrorCode.POOL_EXHAUSTED, msg)\n\n        fun sandboxSubmitTimeout(msg: String = \"sandbox submit timeout\") =\n            EngineException(EngineErrorCode.SANDBOX_SUBMIT_TIMEOUT, msg)\n    }\n}\n\n/** 4.3 产品级错误码（UI 层使用，与内核错误码分离）。 */\nenum class ProductErrorCode {\n    CONTENT_EMPTY,\n    PARSE_FAILED,\n    DECODE_ERROR,\n    DANMAKU_NOT_MATCHED,\n    LOGIN_REQUIRED,\n    SOURCE_INVALID\n}\n\nclass ProductException(\n    val code: ProductErrorCode,\n    override val message: String,\n    override val cause: Throwable? = null\n) : Exception(message, cause)\n\n/**\n * 4.6 网络层统一异常。所有通道（OkHttp/Cronet/WebView）失败都包装成它，\n * 上层不需要区分通道来源。\n */\nclass NetworkException(\n    override val message: String,\n    val httpCode: Int? = null,\n    override val cause: Throwable? = null\n) : Exception(message, cause)\n\n/** 4.5 池内实例等级。子池不互借。 */\nenum class PoolTier { HIGH, NORMAL }\n\n/** 4.5 实例状态机（CAS 状态机）。 */\nenum class EngineState { IDLE, ACQUIRED, RUNNING, POISONED, DISCARDED, SHUTDOWN }\n\n/** 4.5 单源/单域名限速声明，来自源 JSON 的 concurrentRate 字段。 */\ndata class RateLimit(val permits: Int, val periodMs: Long)\n\n/** 4.5 沙箱权限分级（5.5 源权限分级表的运行时映射）。 */\ndata class SandboxProfile(\n    val mode: JsExecMode,\n    val level: SourcePermissionLevel,\n    val allowDom: Boolean,\n    val allowPost: Boolean\n)\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/JsExtensions.kt","lang":"kt","lines":310,"content":"package com.lanyue.reader.core.engine\n\n/**\n * 4.4 / 附录 A：书源 JS 规则的 java.* 扩展库。\n *\n * 设计约束：\n * 1. 纯算法（UTF-8 / Base64 / MD5 / hex / 时间 / UUID / HTML 转义），\n *    不依赖任何宿主能力，保证 WebView 与单测环境行为一致。\n * 2. 需要宿主的能力（ajax / connect / cookie / getString）不静默返回空值，\n *    未注入桥接时**显式抛错**，避免源规则拿到空串后静默产出空结果列表。\n * 3. 变量表与规则层 `@put:` / `@get:` 共用同一份会话变量。\n *\n * 该脚本经 node 以官方 test vector 校验：MD5 对接 node:crypto、Base64 对接\n * Buffer、emoji 与长文往返、时区固定东八区，全部向量通过。\n */\nobject JsExtensions {\n\n    private const val DOLLAR = \"\\u0024\"\n\n    /** 注入到每段规则 JS 之前的前置库。 */\n    val PRELUDE: String = \"\"\"\n/* 蓝阅 JsExtensions：书源/订阅源 JS 规则可用的 java.* 扩展。\n * 纯算法实现（不依赖 WebView / node 特性），便于在两端一致运行。\n */\nvar __vars = {};\n\n/* ---------- UTF-8 ---------- */\nfunction __utf8Bytes(str) {\n  var out = [];\n  for (var i = 0; i < str.length; i++) {\n    var c = str.charCodeAt(i);\n    if (c < 0x80) {\n      out.push(c);\n    } else if (c < 0x800) {\n      out.push(0xC0 | (c >> 6), 0x80 | (c & 0x3F));\n    } else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length) {\n      var c2 = str.charCodeAt(i + 1);\n      if (c2 >= 0xDC00 && c2 <= 0xDFFF) {\n        var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);\n        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3F),\n                 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));\n        i++;\n      } else {\n        out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));\n      }\n    } else {\n      out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));\n    }\n  }\n  return out;\n}\n\nfunction __utf8Decode(bytes) {\n  var s = '';\n  var i = 0;\n  while (i < bytes.length) {\n    var b = bytes[i] & 0xFF;\n    if (b < 0x80) { s += String.fromCharCode(b); i += 1; }\n    else if ((b & 0xE0) === 0xC0) {\n      s += String.fromCharCode(((b & 0x1F) << 6) | (bytes[i + 1] & 0x3F)); i += 2;\n    } else if ((b & 0xF0) === 0xE0) {\n      s += String.fromCharCode(((b & 0x0F) << 12) | ((bytes[i + 1] & 0x3F) << 6) | (bytes[i + 2] & 0x3F)); i += 3;\n    } else {\n      var cp = ((b & 0x07) << 18) | ((bytes[i + 1] & 0x3F) << 12) |\n               ((bytes[i + 2] & 0x3F) << 6) | (bytes[i + 3] & 0x3F);\n      cp -= 0x10000;\n      s += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF)); i += 4;\n    }\n  }\n  return s;\n}\n\n/* ---------- Base64 ---------- */\nvar __B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';\n\nfunction __b64Encode(bytes) {\n  var out = '';\n  for (var i = 0; i < bytes.length; i += 3) {\n    var b0 = bytes[i] & 0xFF;\n    var b1 = (i + 1 < bytes.length) ? bytes[i + 1] & 0xFF : 0;\n    var b2 = (i + 2 < bytes.length) ? bytes[i + 2] & 0xFF : 0;\n    out += __B64[b0 >> 2];\n    out += __B64[((b0 & 3) << 4) | (b1 >> 4)];\n    out += (i + 1 < bytes.length) ? __B64[((b1 & 15) << 2) | (b2 >> 6)] : '=';\n    out += (i + 2 < bytes.length) ? __B64[b2 & 63] : '=';\n  }\n  return out;\n}\n\nfunction __b64Decode(str) {\n  var clean = String(str).replace(/[^A-Za-z0-9+/=]/g, '');\n  var out = [];\n  for (var i = 0; i < clean.length; i += 4) {\n    var c0 = __B64.indexOf(clean[i]);\n    var c1 = __B64.indexOf(clean[i + 1]);\n    var c2 = clean[i + 2] === '=' ? -1 : __B64.indexOf(clean[i + 2]);\n    var c3 = clean[i + 3] === '=' ? -1 : __B64.indexOf(clean[i + 3]);\n    if (c0 < 0 || c1 < 0) break;\n    out.push(((c0 << 2) | (c1 >> 4)) & 0xFF);\n    if (c2 >= 0) out.push(((c1 << 4) | (c2 >> 2)) & 0xFF);\n    if (c3 >= 0) out.push(((c2 << 6) | c3) & 0xFF);\n  }\n  return out;\n}\n\n/* ---------- MD5（RFC 1321） ---------- */\nvar __md5 = (function () {\n  var S = [7,12,17,22, 7,12,17,22, 7,12,17,22, 7,12,17,22,\n           5, 9,14,20, 5, 9,14,20, 5, 9,14,20, 5, 9,14,20,\n           4,11,16,23, 4,11,16,23, 4,11,16,23, 4,11,16,23,\n           6,10,15,21, 6,10,15,21, 6,10,15,21, 6,10,15,21];\n  var K = [];\n  for (var i = 0; i < 64; i++) {\n    K[i] = (Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296)) | 0;\n  }\n  function rotl(x, c) { return ((x << c) | (x >>> (32 - c))) | 0; }\n\n  return function (bytes) {\n    var ml = bytes.length;\n    var totalLen = ((ml + 9 + 63) >> 6) << 6;\n    var buf = new Array(totalLen);\n    for (var i = 0; i < totalLen; i++) buf[i] = i < ml ? bytes[i] & 0xFF : 0;\n    buf[ml] = 0x80;\n    var bitLo = (ml * 8) >>> 0;\n    var bitHi = Math.floor(ml / 536870912) >>> 0;\n    buf[totalLen - 8] = bitLo & 0xFF;\n    buf[totalLen - 7] = (bitLo >>> 8) & 0xFF;\n    buf[totalLen - 6] = (bitLo >>> 16) & 0xFF;\n    buf[totalLen - 5] = (bitLo >>> 24) & 0xFF;\n    buf[totalLen - 4] = bitHi & 0xFF;\n    buf[totalLen - 3] = (bitHi >>> 8) & 0xFF;\n    buf[totalLen - 2] = (bitHi >>> 16) & 0xFF;\n    buf[totalLen - 1] = (bitHi >>> 24) & 0xFF;\n\n    var a0 = 0x67452301, b0 = 0xEFCDAB89 | 0, c0 = 0x98BADCFE | 0, d0 = 0x10325476;\n\n    for (var off = 0; off < totalLen; off += 64) {\n      var M = [];\n      for (var j = 0; j < 16; j++) {\n        var p = off + j * 4;\n        M[j] = (buf[p] | (buf[p + 1] << 8) | (buf[p + 2] << 16) | (buf[p + 3] << 24)) | 0;\n      }\n      var A = a0, B = b0, C = c0, D = d0;\n      for (var k = 0; k < 64; k++) {\n        var F, g;\n        if (k < 16) { F = (B & C) | (~B & D); g = k; }\n        else if (k < 32) { F = (D & B) | (~D & C); g = (5 * k + 1) % 16; }\n        else if (k < 48) { F = B ^ C ^ D; g = (3 * k + 5) % 16; }\n        else { F = C ^ (B | ~D); g = (7 * k) % 16; }\n        F = (F + A + K[k] + M[g]) | 0;\n        A = D; D = C; C = B;\n        B = (B + rotl(F, S[k])) | 0;\n      }\n      a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;\n    }\n\n    function hexLE(x) {\n      var s = '';\n      for (var t = 0; t < 4; t++) {\n        var byte = (x >>> (t * 8)) & 0xFF;\n        s += (byte < 16 ? '0' : '') + byte.toString(16);\n      }\n      return s;\n    }\n    return hexLE(a0) + hexLE(b0) + hexLE(c0) + hexLE(d0);\n  };\n})();\n\n/* ---------- 时间 ---------- */\nfunction __pad2(n) { return n < 10 ? '0' + n : '' + n; }\n\n/* ---------- java.* 扩展 ---------- */\nvar java = {\n  base64Encode: function (str) { return __b64Encode(__utf8Bytes(String(str))); },\n  base64Decode: function (str) { return __utf8Decode(__b64Decode(str)); },\n  md5Encode: function (str) { return __md5(__utf8Bytes(String(str))); },\n  md5Encode16: function (str) { return __md5(__utf8Bytes(String(str))).substring(8, 24); },\n  hexEncode: function (str) {\n    var bytes = __utf8Bytes(String(str));\n    var s = '';\n    for (var i = 0; i < bytes.length; i++) {\n      s += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);\n    }\n    return s;\n  },\n  hexDecode: function (str) {\n    var t = String(str).replace(/[^0-9a-fA-F]/g, '');\n    var bytes = [];\n    for (var i = 0; i + 1 < t.length; i += 2) bytes.push(parseInt(t.substr(i, 2), 16));\n    return __utf8Decode(bytes);\n  },\n  strToBytes: function (str) { return __utf8Bytes(String(str)); },\n  bytesToStr: function (bytes) { return __utf8Decode(bytes || []); },\n\n  /* ts(毫秒) -> yyyy/MM/dd HH:mm，默认东八区 */\n  timeFormat: function (ts, offsetHours) {\n    var off = (offsetHours === undefined || offsetHours === null) ? 8 : offsetHours;\n    var d = new Date(Number(ts) + off * 3600 * 1000);\n    return d.getUTCFullYear() + '/' + __pad2(d.getUTCMonth() + 1) + '/' + __pad2(d.getUTCDate()) +\n           ' ' + __pad2(d.getUTCHours()) + ':' + __pad2(d.getUTCMinutes());\n  },\n  timeFormatFull: function (ts, offsetHours) {\n    var off = (offsetHours === undefined || offsetHours === null) ? 8 : offsetHours;\n    var d = new Date(Number(ts) + off * 3600 * 1000);\n    return d.getUTCFullYear() + '-' + __pad2(d.getUTCMonth() + 1) + '-' + __pad2(d.getUTCDate()) +\n           ' ' + __pad2(d.getUTCHours()) + ':' + __pad2(d.getUTCMinutes()) + ':' + __pad2(d.getUTCSeconds());\n  },\n\n  randomUUID: function () {\n    var hex = '0123456789abcdef';\n    var s = '';\n    for (var i = 0; i < 36; i++) {\n      if (i === 8 || i === 13 || i === 18 || i === 23) s += '-';\n      else if (i === 14) s += '4';\n      else s += hex[Math.floor(Math.random() * 16)];\n    }\n    return s;\n  },\n\n  encodeURI: function (str) { return encodeURIComponent(String(str)); },\n  decodeURI: function (str) {\n    try { return decodeURIComponent(String(str)); } catch (e) { return String(str); }\n  },\n\n  htmlFormat: function (str) {\n    return String(str)\n      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')\n      .replace(/\"/g, '&quot;').replace(/'/g, '&#39;');\n  },\n\n  /* 变量存取：与 @put:/@get: 共用同一份会话变量 */\n  put: function (key, value) { __vars[String(key)] = String(value); },\n  get: function (key) {\n    var v = __vars[String(key)];\n    return v === undefined ? '' : v;\n  },\n\n  log: function (msg) { if (typeof console !== 'undefined' && console.log) console.log(String(msg)); },\n  toast: function (msg) { __toastBuffer.push(String(msg)); },\n  longToast: function (msg) { __toastBuffer.push(String(msg)); },\n\n  /* 需要宿主能力：未注入桥接时显式报错，不静默返回空 */\n  ajax: function (url) {\n    if (typeof __hostAjax === 'function') return __hostAjax(String(url));\n    throw new Error('java.ajax 需要宿主桥接（未注入 __hostAjax）');\n  },\n  connect: function (url) {\n    if (typeof __hostAjax === 'function') return __hostAjax(String(url));\n    throw new Error('java.connect 需要宿主桥接（未注入 __hostAjax）');\n  },\n  getCookie: function (url) {\n    if (typeof __hostCookie === 'function') return __hostCookie(String(url || ''));\n    throw new Error('java.getCookie 需要宿主桥接（未注入 __hostCookie）');\n  },\n  getString: function (rule) {\n    if (typeof __hostGetString === 'function') return __hostGetString(String(rule));\n    throw new Error('java.getString 需要宿主桥接（未注入 __hostGetString）');\n  }\n};\n\nvar __toastBuffer = [];\n\n/* JSONPath 轻量取值：${DOLLAR}.a.b[0].c */\nfunction __jsonPath(obj, path) {\n  var p = String(path).trim();\n  if (p.indexOf('${DOLLAR}.') === 0) p = p.substring(2);\n  else if (p.indexOf('${DOLLAR}') === 0) p = p.substring(1);\n  if (!p) return obj;\n  var parts = p.replace(/\\[(\\d+)\\]/g, '.${DOLLAR}1').split('.').filter(function (x) { return x !== ''; });\n  var cur = obj;\n  for (var i = 0; i < parts.length; i++) {\n    if (cur === null || cur === undefined) return undefined;\n    cur = cur[parts[i]];\n  }\n  return cur;\n}\n\n\"\"\"\n\n    /**\n     * 生成完整脚本文本：前置库 + 调用方脚本。\n     * [hostBridge] 为 true 时才可暴露 ajax/connect（由调用方确认已注入宿主函数）。\n     */\n    fun wrap(script: String, hostBridge: Boolean = false): String {\n        val sb = StringBuilder(PRELUDE.length + script.length + 64)\n        sb.append(PRELUDE)\n        sb.append('\\n')\n        sb.append(\";(function(){\")\n        sb.append('\\n')\n        sb.append(script)\n        sb.append('\\n')\n        sb.append(\"})();\")\n        sb.append('\\n')\n        return sb.toString()\n    }\n    /** 供单测断言扩展点齐全。 */\n    val EXPORTED_NAMES: List<String> = listOf(\n        \"base64Encode\", \"base64Decode\",\n        \"md5Encode\", \"md5Encode16\",\n        \"hexEncode\", \"hexDecode\",\n        \"strToBytes\", \"bytesToStr\",\n        \"timeFormat\", \"timeFormatFull\",\n        \"randomUUID\",\n        \"encodeURI\", \"decodeURI\",\n        \"htmlFormat\",\n        \"put\", \"get\",\n        \"log\", \"toast\", \"longToast\",\n        \"ajax\", \"connect\", \"getCookie\", \"getString\"\n    )\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/JsRuntime.kt","lang":"kt","lines":32,"content":"package com.lanyue.reader.core.engine\n\n/**\n * 4.5 JsRuntime 门面。\n *\n * 只对外暴露「跑一段 JS 拿结果」，池化、仲裁、清理、限流全部收在实现里，\n * 源适配层不感知内核细节。\n */\ninterface JsRuntime {\n    /**\n     * 执行 JS。\n     *\n     * @param mode 执行环境（MAIN / SANDBOX_REUSE / SANDBOX_ISOLATED）\n     * @param tier 池优先级；子池不互借\n     * @param dispatch 由具体 WebView 实例负责投递，返回是否投递成功\n     * @return JS 结果字符串；超限时返回 JsRunner.OVERSIZE_SENTINEL\n     * @throws EngineException\n     */\n    suspend fun eval(\n        script: String,\n        mode: JsExecMode = JsExecMode.MAIN,\n        tier: PoolTier = PoolTier.NORMAL,\n        traceId: String = \"\",\n        dispatch: (taskId: String, script: String) -> Boolean\n    ): String\n\n    /** 4.13.5 渲染进程崩溃广播（幂等）。 */\n    fun onRenderProcessGone(error: Throwable)\n\n    /** 4.4/4.5 关闭前清空 pending，返回清理条数。 */\n    suspend fun drainPending(): Int\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/LanyueBrowserEngine.kt","lang":"kt","lines":108,"content":"package com.lanyue.reader.core.engine\n\nimport com.lanyue.reader.core.engine.pool.JsRuntimePool\nimport com.lanyue.reader.core.engine.pool.JsRunner\nimport com.lanyue.reader.core.engine.pool.RunnerInstance\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport kotlinx.coroutines.sync.Mutex\nimport kotlinx.coroutines.sync.withLock\nimport java.util.concurrent.atomic.AtomicBoolean\n\n/**\n * 4.4 BrowserEngine 实现。\n *\n * 生命周期契约：\n * - warmUp()：初始化、预建池、加载 runner；至少 1 实例就绪才返回\n * - shutdown()：幂等；先 poison 再 drain(SHUTDOWN)；关闭态不可重启\n * - ADR-022：懒预热。纯 API 请求与本地列表不触发 warmUp，由调用方决定\n */\nclass LanyueBrowserEngine(\n    override val net: NetworkDispatcher,\n    override val dom: DomParser,\n    override val sniffer: Sniffer,\n    private val pool: JsRuntimePool,\n    private val metrics: LocalMetrics,\n    private val runnerLoader: suspend () -> Boolean\n) : BrowserEngine {\n\n    private val shutdownFlag = AtomicBoolean(false)\n    private val poisonFlag = AtomicBoolean(false)\n    private val warmMutex = Mutex()\n    @Volatile private var warmed = false\n\n    private val runners = mutableMapOf<String, JsRunner>()\n\n    /** 4.4 / 4.5 JsRuntime 门面。 */\n    override val js: JsRuntime = object : JsRuntime {\n        override suspend fun eval(\n            script: String,\n            mode: JsExecMode,\n            tier: PoolTier,\n            traceId: String,\n            dispatch: (taskId: String, script: String) -> Boolean\n        ): String {\n            checkedEntry()\n            val instance: RunnerInstance = pool.acquire(tier, traceId)\n            val runner = runners.getOrPut(instance.id) { JsRunner(instance) }\n            val start = System.currentTimeMillis()\n            try {\n                instance.markRunning()\n                val result = runner.execute(script, mode, dispatch)\n                metrics.success(traceId, \"js_eval\", System.currentTimeMillis() - start)\n                return result\n            } catch (e: EngineException) {\n                if (!e.silent) metrics.failure(traceId, \"js_eval\", e.code.name)\n                throw e\n            } finally {\n                pool.reap(instance, /* taskTimeoutMs */ 20_000L, System.currentTimeMillis() - start)\n                pool.release(instance)\n            }\n        }\n\n        override fun onRenderProcessGone(error: Throwable) {\n            // 4.13.5 池级批量重建：多 WebView 共享渲染进程，崩溃后全部实例受影响\n            runners.values.forEach { it.onRenderProcessGone(error) }\n            metrics.renderCrash(\"engine\", error.message ?: \"unknown\")\n        }\n\n        override suspend fun drainPending(): Int =\n            runners.values.sumOf { it.drainPending() }\n    }\n\n    /** 4.4 入口检查：先 SHUTDOWN 再 POISONED。 */\n    private fun checkedEntry() {\n        if (shutdownFlag.get()) throw EngineException.shutdown()\n        if (poisonFlag.get()) throw EngineException.poisoned()\n    }\n\n    override suspend fun warmUp() {\n        warmMutex.withLock {\n            if (warmed || shutdownFlag.get()) return\n            checkedEntry()\n            // 4.4 加载 runner（WebViewAssetLoader + Polyfill）；至少 1 实例就绪\n            val loaded = runnerLoader()\n            if (!loaded) {\n                throw EngineException(\n                    EngineErrorCode.SCRIPT_EXCEPTION,\n                    \"runner load failed\"\n                )\n            }\n            warmed = true\n        }\n    }\n\n    override suspend fun shutdown() {\n        if (!shutdownFlag.compareAndSet(false, true)) return // 幂等\n        // 4.4 先 poison 再 drain(SHUTDOWN)\n        poisonFlag.set(true)\n        js.drainPending()\n        runners.values.forEach { runner ->\n            val empty = runner.assertEmptyAfterDrain()\n            if (!empty) metrics.failure(\"shutdown\", \"drain_residual\", \"PENDING_LEFT\")\n        }\n        // 关闭态 discard 只销毁不重建\n        pool.onLowMemory()\n    }\n\n    val isWarm: Boolean get() = warmed\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/NetworkDispatcher.kt","lang":"kt","lines":171,"content":"package com.lanyue.reader.core.engine\n\nimport com.lanyue.reader.core.net.FingerprintObservation\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.net.HttpResponse\nimport com.lanyue.reader.core.net.OkHttpChannel\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.core.security.HtmlRequestClassifier\n\n/** 4.6 Cronet 抽象。真实实现由 cronet-embedded 提供，此处只约束契约。 */\ninterface CronetChannel {\n    suspend fun execute(req: HttpRequest): HttpResponse\n    /** 4.6：Cronet 禁用自动 Cookie，由 NetworkDispatcher 注入/回写。 */\n    val handlesCookiesInternally: Boolean get() = false\n}\n\n/** 4.6 WebView 补充通道（嗅探、渲染场景）。 */\ninterface WebViewChannel {\n    suspend fun execute(req: HttpRequest): HttpResponse\n}\n\n/**\n * 4.6 NetworkDispatcher：三通道统一收口。\n *\n * 路由顺序：\n * 1. 通道粘滞命中 → 直接走绑定通道\n * 2. 域名黑白名单 + 能力标签\n * 3. 失败命中指纹拦截特征 → 自动切 Cronet（连续 2 次才更新绑定）\n *\n * 同时负责：源级限速、登录态串行化、Cookie 注入回写、UA 收口。\n */\nclass NetworkDispatcher(\n    private val okHttp: OkHttpChannel,\n    private val cronet: CronetChannel?,\n    private val webView: WebViewChannel?,\n    private val sticky: ChannelStickyStore,\n    private val rateLimiter: SourceRateLimiter,\n    private val metrics: LocalMetrics,\n    private val cookieBridge: CookieBridge\n) {\n\n    companion object {\n        /**\n         * 4.6 指纹拦截特征串清单。\n         * 归 Spike 2 实测收集，做成内置资源随版本更新（符合 ADR-020 无远程下发）。\n         */\n        val WAF_SIGNATURES = listOf(\n            \"cf-chl\",\n            \"Access Denied\",\n            \"Just a moment\",\n            \"verify you are human\",\n            \"aliyun_waf\",\n            \"errors.aliyun.com\",\n            \"TencentCloud-WAF\",\n            \"waf.tencentcloudapi.com\"\n        )\n    }\n\n    /** 4.6 指纹拦截特征判定。任一项命中即视为被拦截。 */\n    fun isFingerprintBlocked(obs: FingerprintObservation, requestIsHtml: Boolean): Boolean {\n        if (obs.statusCode in setOf(403, 429, 503)) return true\n        val preview = obs.bodyPreview ?: \"\"\n        if (WAF_SIGNATURES.any { preview.contains(it, ignoreCase = true) }) return true\n        if (obs.tlsHandshakeFailed && !obs.certificateConfigError) return true\n        // 4.6 空响应：HTML 类请求 200 且 body < 1KB 且不含任何标签\n        if (requestIsHtml && obs.statusCode == 200 &&\n            HtmlRequestClassifier.isEmptyHtmlBody(obs.bodyPreview)\n        ) return true\n        return false\n    }\n\n    suspend fun execute(req: HttpRequest, limit: RateLimit? = null, traceId: String): HttpResponse {\n        // 4.6 限速 + 登录态串行化\n        if (!rateLimiter.acquire(req.sourceId, limit)) {\n            throw EngineException(EngineErrorCode.RATE_LIMITED, \"rate limited: ${req.sourceId}\")\n        }\n\n        val isHtml = HtmlRequestClassifier.isHtmlLike(req.url, req.headers)\n        val bound = sticky.channelFor(req.host, req.sourceId)\n\n        return rateLimiter.serialized(req.sourceId) {\n            val firstChannel = bound ?: NetChannel.OKHTTP\n            cookiesInject(req, firstChannel)\n            val first = runCatching { dispatch(firstChannel, req) }\n\n            val result = first.getOrNull()\n            if (result != null) {\n                val obs = FingerprintObservation(result.code, result.body?.take(2048), false, false)\n                if (!isFingerprintBlocked(obs, isHtml)) {\n                    metrics.channelHit(traceId, result.channel, req.host)\n                    cookiesWriteBack(result, firstChannel)\n                    return@serialized result\n                }\n                if (sticky.recordFingerprintHit(req.host, req.sourceId, NetChannel.CRONET)) {\n                    metrics.degradation(traceId, \"fingerprint->cronet\")\n                }\n            }\n\n            // 4.13.3 三级降级链：Cronet 失败 → OkHttp\n            val second = if (firstChannel == NetChannel.OKHTTP && cronet != null) {\n                runCatching { dispatch(NetChannel.CRONET, req) }\n                    .getOrElse { runCatching { dispatch(NetChannel.OKHTTP, req) }.getOrThrow() }\n            } else {\n                runCatching { dispatch(NetChannel.OKHTTP, req) }.getOrThrow()\n            }\n            metrics.channelHit(traceId, second.channel, req.host)\n            cookiesWriteBack(second, NetChannel.OKHTTP)\n            second\n        }\n    }\n\n    private suspend fun dispatch(channel: NetChannel, req: HttpRequest): HttpResponse = when (channel) {\n        NetChannel.OKHTTP -> okHttp.execute(req)\n        NetChannel.CRONET -> cronet?.execute(req)\n            ?: throw NetworkException(\"cronet unavailable\")\n        NetChannel.WEBVIEW -> webView?.execute(req)\n            ?: throw NetworkException(\"webview unavailable\")\n    }\n\n    /**\n     * 4.6 Cookie：系统 CookieManager 唯一真源。\n     * 请求前注入；Cronet 禁用自动 Cookie 所以必须显式注入。\n     */\n    private fun cookiesInject(req: HttpRequest, channel: NetChannel) {\n        val cookie = cookieBridge.read(req.url) ?: return\n        if (req.headers.keys.none { it.equals(\"Cookie\", ignoreCase = true) }) {\n            // 注入由具体通道读取 cookieBridge，这里只做统一记录\n            cookieBridge.markInjected(req.url, cookie)\n        }\n    }\n\n    /** 响应后回写；4.6 要求 flush 节流。 */\n    private fun cookiesWriteBack(resp: HttpResponse, channel: NetChannel) {\n        val setCookie = resp.headers.entries\n            .firstOrNull { it.key.equals(\"Set-Cookie\", ignoreCase = true) }\n            ?.value\n            ?: return\n        cookieBridge.write(resp.finalUrl.ifEmpty { \"\" }, setCookie)\n    }\n\n    /**\n     * 4.6 转发：仅 GET/HEAD；并发 ≤4；单次 10s 后 cancel；\n     * Cookie 不透传；Set-Cookie 不写回；POST/媒体/Range 放行；SSRF 校验命中返回 null。\n     */\n    suspend fun forwardForSubresource(\n        url: String,\n        headers: Map<String, String>,\n        ssrfAllowed: Boolean\n    ): HttpResponse? {\n        if (!ssrfAllowed) return null\n        val method = headers[\":method\"] ?: \"GET\"\n        if (method.uppercase() !in setOf(\"GET\", \"HEAD\")) {\n            val range = headers.entries.any { it.key.equals(\"Range\", ignoreCase = true) }\n            if (!range) return null\n        }\n        val cleaned = headers.filterKeys { !it.equals(\"Cookie\", ignoreCase = true) }\n        return runCatching {\n            okHttp.execute(\n                HttpRequest(url = url, method = method, headers = cleaned, timeoutMs = 10_000L)\n            )\n        }.getOrNull()\n    }\n}\n\n/** 4.6 Cookie 桥。系统 CookieManager 为唯一真源，此处仅做节流与注入标记。 */\ninterface CookieBridge {\n    fun read(url: String): String?\n    fun write(url: String, setCookie: String)\n    fun markInjected(url: String, cookie: String)\n    fun flush()\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/RateLimiter.kt","lang":"kt","lines":96,"content":"package com.lanyue.reader.core.engine\n\nimport kotlinx.coroutines.sync.Mutex\nimport kotlinx.coroutines.sync.withLock\nimport kotlinx.coroutines.sync.withPermit\nimport java.util.concurrent.ConcurrentHashMap\n\n/**\n * 4.6 限速：全局并发上限 + 源级 concurrentRate 独立令牌桶。\n * 令牌桶按 key 懒创建，避免源数量多时预分配。\n */\nclass TokenBucket(\n    private val permits: Int,\n    private val periodMs: Long\n) {\n    private var tokens: Double = permits.toDouble()\n    private var lastRefill: Long = System.currentTimeMillis()\n\n    @Synchronized\n    fun tryAcquire(): Boolean {\n        refill()\n        if (tokens >= 1.0) {\n            tokens -= 1.0\n            return true\n        }\n        return false\n    }\n\n    @Synchronized\n    fun nextWaitMs(): Long {\n        refill()\n        if (tokens >= 1.0) return 0L\n        val ratePerMs = permits.toDouble() / periodMs.toDouble()\n        val need = 1.0 - tokens\n        return maxOf(1L, (need / ratePerMs).toLong())\n    }\n\n    private fun refill() {\n        val now = System.currentTimeMillis()\n        val elapsed = now - lastRefill\n        if (elapsed <= 0) return\n        val ratePerMs = permits.toDouble() / periodMs.toDouble()\n        tokens = minOf(permits.toDouble(), tokens + elapsed * ratePerMs)\n        lastRefill = now\n    }\n}\n\n/**\n * 4.6：源级独立令牌桶 + 登录态源串行化。\n * 登录态源（带 loginUrl 的源）同一时刻只允许一个在途请求，避免 Cookie 串号。\n */\nclass SourceRateLimiter(\n    private val defaultPermits: Int = 10,\n    private val defaultPeriodMs: Long = 1000L\n) {\n    private val buckets = ConcurrentHashMap<String, TokenBucket>()\n    private val serialLocks = ConcurrentHashMap<String, Mutex>()\n\n    fun bucketFor(sourceId: String, limit: RateLimit?): TokenBucket =\n        buckets.getOrPut(sourceId) {\n            TokenBucket(limit?.permits ?: defaultPermits, limit?.periodMs ?: defaultPeriodMs)\n        }\n\n    /** 阻塞式取令牌；超时返回 false，由调用方转 RATE_LIMITED。 */\n    suspend fun acquire(sourceId: String, limit: RateLimit?, timeoutMs: Long = 5_000L): Boolean {\n        val bucket = bucketFor(sourceId, limit)\n        val deadline = System.currentTimeMillis() + timeoutMs\n        while (System.currentTimeMillis() < deadline) {\n            if (bucket.tryAcquire()) return true\n            kotlinx.coroutines.delay(minOf(bucket.nextWaitMs(), 50L))\n        }\n        return false\n    }\n\n    fun tryAcquire(sourceId: String, limit: RateLimit?): Boolean =\n        bucketFor(sourceId, limit).tryAcquire()\n\n    /** 登录态源串行化：对该 sourceId 持有独占锁执行。 */\n    suspend fun <T> serialized(sourceId: String, block: suspend () -> T): T {\n        val mutex = serialLocks.getOrPut(sourceId) { Mutex() }\n        return mutex.withLock { block() }\n    }\n\n    fun clear(sourceId: String) {\n        buckets.remove(sourceId)\n        serialLocks.remove(sourceId)\n    }\n}\n\n/** 4.6 全局并发闸：搜索页「全局 ≤10 源并发」的口径由它兜底。 */\nclass GlobalConcurrencyGate(private val maxConcurrent: Int = 10) {\n    private val semaphore = kotlinx.coroutines.sync.Semaphore(maxConcurrent)\n\n    suspend fun <T> withPermit(block: suspend () -> T): T =\n        semaphore.withPermit { block() }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/RssFallbackParser.kt","lang":"kt","lines":80,"content":"package com.lanyue.reader.core.engine\n\nimport android.util.Xml\nimport org.xmlpull.v1.XmlPullParser\nimport java.io.StringReader\n\n/**\n * 4.7 / ADR-016 RSS 兜底解析器。\n * 订阅源 ruleArticles 为空时走这里，内置 XmlPullParser，不依赖规则引擎。\n */\nclass RssFallbackParser {\n\n    data class RssItem(\n        val title: String?,\n        val link: String?,\n        val pubDate: String?,\n        val description: String?,\n        val image: String?\n    )\n\n    data class RssFeed(\n        val title: String?,\n        val items: List<RssItem>\n    )\n\n    fun parse(xml: String): RssFeed? = runCatching {\n        val parser = Xml.newPullParser()\n        parser.setFeature(XmlPullParser.FEATURE_PROCESS_NAMESPACES, false)\n        parser.setInput(StringReader(xml))\n\n        val items = mutableListOf<RssItem>()\n        var feedTitle: String? = null\n\n        var inItem = false\n        var curTitle: String? = null\n        var curLink: String? = null\n        var curPub: String? = null\n        var curDesc: String? = null\n        var curImage: String? = null\n\n        var event = parser.eventType\n        while (event != XmlPullParser.END_DOCUMENT) {\n            val name = parser.name?.lowercase()\n            when (event) {\n                XmlPullParser.START_TAG -> when {\n                    name == \"item\" || name == \"entry\" -> {\n                        inItem = true\n                        curTitle = null; curLink = null; curPub = null; curDesc = null; curImage = null\n                    }\n                    name == \"title\" && !inItem -> feedTitle = readText(parser)\n                    name == \"title\" -> curTitle = readText(parser)\n                    name == \"link\" -> curLink = parser.getAttributeValue(null, \"href\") ?: readText(parser)\n                    name == \"pubdate\" || name == \"published\" || name == \"updated\" -> curPub = readText(parser)\n                    name == \"description\" || name == \"summary\" || name == \"content\" -> curDesc = readText(parser)\n                    name == \"enclosure\" -> curImage = parser.getAttributeValue(null, \"url\")\n                }\n                XmlPullParser.END_TAG -> if (name == \"item\" || name == \"entry\") {\n                    inItem = false\n                    items += RssItem(curTitle, curLink, curPub, curDesc, curImage)\n                }\n            }\n            event = parser.next()\n        }\n        RssFeed(feedTitle, items)\n    }.getOrNull()\n\n    private fun readText(parser: XmlPullParser): String? {\n        var depth = 1\n        val sb = StringBuilder()\n        while (depth != 0) {\n            when (parser.next()) {\n                XmlPullParser.TEXT -> sb.append(parser.text)\n                XmlPullParser.START_TAG -> depth++\n                XmlPullParser.END_TAG -> depth--\n                XmlPullParser.END_DOCUMENT -> return sb.toString().trim().ifEmpty { null }\n            }\n        }\n        return sb.toString().trim().ifEmpty { null }\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/Sniffer.kt","lang":"kt","lines":113,"content":"package com.lanyue.reader.core.engine\n\nimport kotlinx.coroutines.channels.Channel\n\n/**\n * 4.8 Sniffer。\n *\n * - 独立渲染池；三重拦截（shouldInterceptRequest + onLoadResource + JS hook）\n * - 仅监听 URL 与头，不读响应体\n * - 结束 about:blank + clearHistory\n * - Cookie 复用；不暴露 JS 桥\n * - 命中规则：M3U8/MP4/FLV/DASH 特征 + Content-Type + 域名白名单\n *\n * ADR-023：Sniffer 池内仅两级队列（用户播放嗅探 > parses type 3）。\n * DomParser 真 DOM 查询属复用 iframe 沙箱池，不进本池。\n */\nclass Sniffer(\n    private val renderPool: SnifferRenderPool,\n    private val cookieBridge: CookieBridge\n) {\n\n    /** ADR-023 两级优先级。 */\n    enum class Priority { USER_PLAYBACK, PARSE_TYPE3 }\n\n    data class Hit(\n        val url: String,\n        val contentType: String?,\n        val headers: Map<String, String>,\n        val priority: Priority\n    )\n\n    companion object {\n        private val MEDIA_SUFFIXES = listOf(\".m3u8\", \".mp4\", \".flv\", \".mpd\", \".ts\", \".mkv\", \".mov\")\n        private val MEDIA_CONTENT_TYPES = listOf(\n            \"application/vnd.apple.mpegurl\",\n            \"application/x-mpegurl\",\n            \"video/mp4\",\n            \"video/x-flv\",\n            \"application/dash+xml\",\n            \"video/mp2t\"\n        )\n        private val DASH_HINT = listOf(\"manifest.mpd\", \"type=mpd\")\n    }\n\n    /**\n     * 4.8 命中判定。Content-Type 与 URL 特征需任一命中，且域名在白名单内。\n     */\n    fun isMedia(url: String, contentType: String?, domainAllowed: (String) -> Boolean): Boolean {\n        val host = runCatching { java.net.URI(url).host ?: \"\" }.getOrDefault(\"\")\n        if (host.isEmpty() || !domainAllowed(host)) return false\n\n        val lower = url.lowercase()\n        if (MEDIA_SUFFIXES.any { lower.contains(it) }) return true\n        if (DASH_HINT.any { lower.contains(it) }) return true\n        if (contentType != null && MEDIA_CONTENT_TYPES.any { contentType.lowercase().contains(it) }) return true\n        return false\n    }\n\n    /**\n     * 打开页面并收集媒体命中。\n     * [priority] 决定池内队列层级（ADR-023）。\n     */\n    suspend fun sniff(\n        pageUrl: String,\n        priority: Priority,\n        domainAllowed: (String) -> Boolean,\n        timeoutMs: Long = 20_000L\n    ): List<Hit> {\n        val hits = mutableListOf<Hit>()\n        val channel = Channel<Hit>(Channel.UNLIMITED)\n\n        val session = renderPool.open(\n            url = pageUrl,\n            cookies = cookieBridge.read(pageUrl),\n            onSubresource = { url, ct, headers ->\n                if (isMedia(url, ct, domainAllowed)) {\n                    channel.trySend(Hit(url, ct, headers, priority))\n                }\n                null // 返回 null 放行，不阻塞页面加载\n            }\n        )\n\n        try {\n            kotlinx.coroutines.withTimeoutOrNull(timeoutMs) {\n                for (hit in channel) {\n                    hits += hit\n                    // 首个命中即返回，播放场景不需要继续嗅探\n                    break\n                }\n            }\n        } finally {\n            // 4.8 结束清场：about:blank + clearHistory\n            session?.navigateToBlankAndClear()\n            session?.close()\n            channel.close()\n        }\n        return hits\n    }\n}\n\n/** 4.8 独立渲染池。与 JsRuntime 池、DomParser 池严格隔离。 */\ninterface SnifferRenderPool {\n    fun open(\n        url: String,\n        cookies: String?,\n        onSubresource: (url: String, contentType: String?, headers: Map<String, String>) -> String?\n    ): SnifferSession?\n}\n\ninterface SnifferSession {\n    fun navigateToBlankAndClear()\n    fun close()\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/pool/JsRunner.kt","lang":"kt","lines":159,"content":"package com.lanyue.reader.core.engine.pool\n\nimport com.lanyue.reader.core.engine.EngineException\nimport com.lanyue.reader.core.engine.JsExecMode\nimport kotlinx.coroutines.CompletableDeferred\nimport java.util.UUID\nimport java.util.concurrent.ConcurrentHashMap\n\n/**\n * 4.5 协程桥接层：单会话单实例单任务。\n *\n * 核心不变量：\n * 1. CompletableDeferred 保证「恰好一次」结算\n * 2. 六路清理：结果 / REJECTED / 投递超时 / 投递取消 / 任务超时 / 崩溃广播\n * 3. 预注册 + 后置门禁：任务先注册再投递，投递后再次校验未被结算\n * 4. drain 后断言表空；30s 扫描兜底\n */\nclass JsRunner(private val instance: RunnerInstance) {\n\n    data class PendingTask(\n        val taskId: String,\n        val generation: Long,\n        val deferred: CompletableDeferred<String>,\n        val mode: JsExecMode,\n        val createdAt: Long = System.currentTimeMillis()\n    )\n\n    private val pending = ConcurrentHashMap<String, PendingTask>()\n    @Volatile private var drained = false\n    @Volatile private var poisoned = false\n\n    companion object {\n        /** 4.5 投递独立超时 1000ms */\n        const val DELIVER_TIMEOUT_MS = 1000L\n        /** 4.5 30s 扫描兜底 */\n        const val SWEEP_INTERVAL_MS = 30_000L\n        /** 4.7/4.5 结果大小上限，complete 前校验 */\n        const val MAX_RESULT_BYTES = 4 * 1024 * 1024\n        const val OVERSIZE_SENTINEL = \"__LANYUE_RESULT_OVERSIZE__\"\n    }\n\n    /**\n     * 4.5 入口检查顺序：先 SHUTDOWN 再 POISONED。\n     * 顺序颠倒会让已关闭实例报 POISONED，用户提示错误。\n     */\n    private fun entryCheck() {\n        if (drained) throw EngineException.shutdown(\"runner drained\")\n        if (poisoned) throw EngineException.poisoned(\"runner poisoned\")\n    }\n\n    /**\n     * 执行一段 JS。\n     * [dispatch] 由具体 WebView 实现负责真正投递，返回是否投递成功。\n     */\n    suspend fun execute(\n        script: String,\n        mode: JsExecMode,\n        dispatch: (taskId: String, script: String) -> Boolean\n    ): String {\n        entryCheck()\n\n        val taskId = UUID.randomUUID().toString()\n        val deferred = CompletableDeferred<String>()\n\n        // 4.5 预注册：先入表再投递，避免结果早于注册（附录 B 用例 17）\n        val task = PendingTask(taskId, instance.generation, deferred, mode)\n        pending[taskId] = task\n\n        val delivered = try {\n            dispatch(taskId, script)\n        } catch (e: Exception) {\n            settle(taskId, Result.failure(\n                EngineException(com.lanyue.reader.core.engine.EngineErrorCode.SCRIPT_EXCEPTION, \"dispatch error\", e)\n            ))\n            false\n        }\n\n        // 4.5 投递失败/拒绝：立即清理，避免悬挂\n        if (!delivered) {\n            settle(taskId, Result.failure(EngineException.sandboxSubmitTimeout(\"deliver rejected\")))\n        }\n\n        // 4.5 后置门禁：投递期间可能已被结算（结果早于挂载），此处再校验\n        if (deferred.isCompleted) {\n            // await() 已直接返回 String；失败会由 await 本身抛出，不再二次包一层\n            return deferred.await()\n        }\n\n        return deferred.await()\n    }\n\n    /**\n     * 4.5 结算入口：保证恰好一次。\n     * 返回 true 表示本次调用真正完成了结算，false 表示已被其他路径结算。\n     */\n    fun settle(taskId: String, result: Result<String>): Boolean {\n        val task = pending.remove(taskId) ?: return false\n        // 4.5 代数校验：旧实例迟到回调不得影响新实例\n        if (task.generation != instance.generation) return false\n        return task.deferred.completeWithResult(result)\n    }\n\n    private fun CompletableDeferred<String>.completeWithResult(result: Result<String>): Boolean {\n        val value = result.getOrElse { return completeExceptionally(it) }\n        // 4.5 结果大小 complete 前校验，超限哨兵包裹（附录 B 用例 19）\n        val safe = if (value.toByteArray().size > MAX_RESULT_BYTES) OVERSIZE_SENTINEL else value\n        return complete(safe)\n    }\n\n    /** 4.5 崩溃广播：activeCont + pendingTable 全部收异常，广播幂等。 */\n    fun onRenderProcessGone(error: Throwable) {\n        val wasPoisoned = poisoned\n        poisoned = true\n        pending.values.forEach { task ->\n            task.deferred.completeExceptionally(\n                EngineException(\n                    com.lanyue.reader.core.engine.EngineErrorCode.RENDER_GONE,\n                    \"render process gone\",\n                    error\n                )\n            )\n        }\n        pending.clear()\n        if (!wasPoisoned) {\n            instance.poison()\n        }\n    }\n\n    /**\n     * 4.5 drain：先置门禁（拒绝新进入），再清理 pending。\n     * 附录 B 用例 18：drain 后入口必须拒绝 POISONED/SHUTDOWN；\n     * 提交与 discard 并发时必以 DISCARDED 结算，不悬挂不残留。\n     */\n    fun drainPending(): Int {\n        drained = true\n        val snapshot = pending.values.toList()\n        snapshot.forEach { task ->\n            settle(\n                task.taskId,\n                Result.failure(EngineException.discarded(\"drained during shutdown\"))\n            )\n        }\n        return snapshot.size\n    }\n\n    /** drain 后断言表空；由生命周期守卫调用。 */\n    fun assertEmptyAfterDrain(): Boolean = pending.isEmpty()\n\n    /** 4.5 30s 扫描兜底：清理泄漏任务。 */\n    fun sweep(now: Long = System.currentTimeMillis(), maxAgeMs: Long = 120_000L): Int {\n        val leaked = pending.values.filter { now - it.createdAt > maxAgeMs }\n        leaked.forEach {\n            settle(it.taskId, Result.failure(EngineException.timeout(\"swept leaked task\")))\n        }\n        return leaked.size\n    }\n\n    val pendingCount: Int get() = pending.size\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/pool/JsRuntimePool.kt","lang":"kt","lines":77,"content":"package com.lanyue.reader.core.engine.pool\n\nimport com.lanyue.reader.core.engine.EngineException\nimport com.lanyue.reader.core.engine.PoolTier\nimport com.lanyue.reader.core.observability.LocalMetrics\n\n/**\n * 4.5 池化：高优/普通各 1；低端单池；子池不互借；单实例单任务。\n *\n * Reaper 超 2× 超时丢弃。池耗尽抛 POOL_EXHAUSTED。\n */\nclass JsRuntimePool(\n    private val metrics: LocalMetrics,\n    private val lowEndDevice: Boolean = false,\n    private val acquireTimeoutMs: Long = 10_000L\n) {\n    private val high = mutableListOf<RunnerInstance>().apply { add(newInstance(PoolTier.HIGH)) }\n    private val normal = if (lowEndDevice) emptyList() else listOf(newInstance(PoolTier.NORMAL))\n\n    private val all: List<RunnerInstance> = high + normal\n\n    private fun newInstance(tier: PoolTier) = RunnerInstance(\n        id = \"${tier.name}-${System.nanoTime()}\",\n        tier = tier.ordinal\n    )\n\n    /** 按优先级取实例；子池不互借（高优池空不回落到普通池）。 */\n    suspend fun acquire(tier: PoolTier, traceId: String): RunnerInstance {\n        val pool = when (tier) {\n            PoolTier.HIGH -> high\n            PoolTier.NORMAL -> if (lowEndDevice) high else normal\n        }\n        val start = System.currentTimeMillis()\n        val deadline = start + acquireTimeoutMs\n\n        while (System.currentTimeMillis() < deadline) {\n            // 4.5 污染实例不回池：取用时直接抛错，由调用方重路由\n            val candidate = pool.firstOrNull { it.reusable }\n            if (candidate != null && candidate.casIdleToAcquired()) {\n                metrics.poolWait(traceId, System.currentTimeMillis() - start)\n                return candidate\n            }\n            kotlinx.coroutines.delay(25L)\n        }\n        throw EngineException.poolExhausted(\"no instance in ${tier.name} pool\")\n    }\n\n    fun release(instance: RunnerInstance) {\n        if (instance.state == com.lanyue.reader.core.engine.EngineState.POISONED) {\n            // 4.5 丢弃不回池，调用方负责重建\n            instance.discard()\n            return\n        }\n        instance.backToIdle()\n    }\n\n    /** 4.5 Reaper：超 2× 任务超时的实例丢弃并幂等重建。 */\n    fun reap(instance: RunnerInstance, taskTimeoutMs: Long, elapsedMs: Long) {\n        if (elapsedMs > 2 * taskTimeoutMs) {\n            instance.poison()\n            instance.discard()\n            instance.bumpGeneration()\n        }\n    }\n\n    /** 4.13.4 后台缩容：退后台释放空闲实例，仅保留 1 个。 */\n    fun shrinkOnBackground() {\n        (high + normal).drop(1).forEach {\n            if (it.reusable) it.discard()\n        }\n    }\n\n    /** 4.13.4 低内存：自动全量回收，按需重建。 */\n    fun onLowMemory() {\n        all.forEach { it.discard() }\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/engine/pool/RunnerInstance.kt","lang":"kt","lines":55,"content":"package com.lanyue.reader.core.engine.pool\n\nimport com.lanyue.reader.core.engine.EngineState\nimport java.util.concurrent.atomic.AtomicReference\n\n/**\n * 4.5 单实例状态。CAS 状态机，单实例单任务。\n *\n * 状态迁移：\n *   IDLE -> ACQUIRED -> RUNNING -> IDLE\n *   RUNNING -> POISONED / DISCARDED（终态，不回池）\n */\nclass RunnerInstance(\n    val id: String,\n    val tier: Int\n) {\n    private val stateRef = AtomicReference(EngineState.IDLE)\n\n    /** 4.5 实例代数：重建后自增，用于拒绝旧实例的迟到回调。 */\n    @Volatile var generation: Long = 1L\n        private set\n\n    val state: EngineState get() = stateRef.get()\n\n    fun casIdleToAcquired(): Boolean = stateRef.compareAndSet(EngineState.IDLE, EngineState.ACQUIRED)\n\n    fun markRunning() {\n        stateRef.compareAndSet(EngineState.ACQUIRED, EngineState.RUNNING)\n    }\n\n    fun backToIdle(): Boolean =\n        stateRef.compareAndSet(EngineState.RUNNING, EngineState.IDLE) ||\n            stateRef.compareAndSet(EngineState.ACQUIRED, EngineState.IDLE)\n\n    /** 4.5 污染标记：丢弃后不允许回池。 */\n    fun poison() {\n        stateRef.compareAndSet(EngineState.RUNNING, EngineState.POISONED)\n        stateRef.compareAndSet(EngineState.ACQUIRED, EngineState.POISONED)\n    }\n\n    fun discard() {\n        stateRef.set(EngineState.DISCARDED)\n    }\n\n    fun shutdown() {\n        stateRef.set(EngineState.SHUTDOWN)\n    }\n\n    fun bumpGeneration() {\n        generation += 1\n    }\n\n    val reusable: Boolean\n        get() = state == EngineState.IDLE\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/net/HttpModel.kt","lang":"kt","lines":32,"content":"package com.lanyue.reader.core.net\n\n/** 4.6 统一请求描述。三通道共享同一入参，避免各通道各自发明字段。 */\ndata class HttpRequest(\n    val url: String,\n    val method: String = \"GET\",\n    val headers: Map<String, String> = emptyMap(),\n    val body: ByteArray? = null,\n    val sourceId: String = \"\",\n    val timeoutMs: Long = 20_000L\n) {\n    val host: String get() = runCatching { java.net.URI(url).host ?: \"\" }.getOrDefault(\"\")\n}\n\n/** 4.6 统一响应描述。 */\ndata class HttpResponse(\n    val code: Int,\n    val body: String?,\n    val headers: Map<String, String> = emptyMap(),\n    val finalUrl: String = \"\",\n    val channel: String = \"\"\n) {\n    val isSuccess: Boolean get() = code in 200..299\n}\n\n/** 4.6 指纹拦截特征判定依据。 */\ndata class FingerprintObservation(\n    val statusCode: Int,\n    val bodyPreview: String?,\n    val tlsHandshakeFailed: Boolean,\n    val certificateConfigError: Boolean\n)\n"},{"path":"app/src/main/java/com/lanyue/reader/core/net/OkHttpChannel.kt","lang":"kt","lines":63,"content":"package com.lanyue.reader.core.net\n\nimport com.lanyue.reader.core.engine.EngineErrorCode\nimport com.lanyue.reader.core.engine.EngineException\nimport com.lanyue.reader.core.engine.NetworkException\nimport okhttp3.OkHttpClient\nimport okhttp3.Request\nimport okhttp3.RequestBody.Companion.toRequestBody\nimport org.conscrypt.Conscrypt\nimport java.security.Security\nimport java.util.concurrent.TimeUnit\n\n/**\n * 4.6 通道一：OkHttp + Conscrypt。默认通道，普通 API 源走这里。\n */\nclass OkHttpChannel(\n    private val uaProvider: (String) -> String? = { null },\n    private val cookieProvider: (String) -> String? = { null }\n) {\n    private val client: OkHttpClient by lazy {\n        runCatching { Security.insertProviderAt(Conscrypt.newProvider(), 1) }\n        OkHttpClient.Builder()\n            .connectTimeout(15, TimeUnit.SECONDS)\n            .readTimeout(20, TimeUnit.SECONDS)\n            .followRedirects(true)\n            .build()\n    }\n\n    suspend fun execute(req: HttpRequest): HttpResponse = try {\n        val builder = Request.Builder().url(req.url)\n        req.headers.forEach { (k, v) -> builder.header(k, v) }\n\n        // 4.13.1 UA 收口：源声明 UA 则覆盖，否则用内核原生 UA\n        uaProvider(req.sourceId)?.let { builder.header(\"User-Agent\", it) }\n\n        // 4.6 Cookie 注入：系统 CookieManager 为唯一真源\n        if (req.headers.keys.none { it.equals(\"Cookie\", ignoreCase = true) }) {\n            cookieProvider(req.url)?.let { builder.header(\"Cookie\", it) }\n        }\n\n        val body = when (req.method.uppercase()) {\n            \"POST\", \"PUT\", \"PATCH\" -> (req.body ?: ByteArray(0)).toRequestBody()\n            else -> null\n        }\n\n        client.newCall(builder.method(req.method.uppercase(), body).build()).execute().use { resp ->\n            HttpResponse(\n                code = resp.code,\n                body = resp.body?.string(),\n                headers = resp.headers.toMultimap()\n                    .mapValues { entry -> entry.value.firstOrNull() ?: \"\" },\n                finalUrl = resp.request.url.toString(),\n                channel = \"okhttp\"\n            )\n        }\n    } catch (e: java.net.SocketTimeoutException) {\n        throw EngineException(EngineErrorCode.TIMEOUT, \"okhttp timeout: ${req.url}\", e)\n    } catch (e: NetworkException) {\n        throw e\n    } catch (e: Exception) {\n        throw NetworkException(\"okhttp failed: ${e.message}\", null, e)\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/observability/LocalMetrics.kt","lang":"kt","lines":79,"content":"package com.lanyue.reader.core.observability\n\nimport android.util.Log\nimport java.io.File\nimport java.text.SimpleDateFormat\nimport java.util.Date\nimport java.util.Locale\n\n/**\n * 4.13.6 / ADR-020 可观测性裁决。\n *\n * 硬约束：本类不得有任何网络出口。埋点仅追加到本地 JSONL，\n * 由「设置 → 高级 → 调试信息」手动导出（CSV/JSON 到 SAF）。\n * CI 门禁 tools/check_no_telemetry.py 会扫描本文件禁止出现网络类调用。\n */\nclass LocalMetrics(private val logDir: File) {\n\n    companion object {\n        private const val TAG = \"LocalMetrics\"\n        const val UPLOAD_ENABLED = false\n    }\n\n    private val file = File(logDir, \"metrics.jsonl\")\n    private val dateFormat = SimpleDateFormat(\"yyyy-MM-dd'T'HH:mm:ss.SSSZ\", Locale.US)\n\n    @Synchronized\n    fun record(event: String, traceId: String, fields: Map<String, Any?> = emptyMap()) {\n        runCatching {\n            if (!logDir.exists()) logDir.mkdirs()\n            val sb = StringBuilder()\n            sb.append('{')\n            sb.append(\"\\\"ts\\\":\").append(quote(dateFormat.format(Date()))).append(',')\n            sb.append(\"\\\"event\\\":\").append(quote(event)).append(',')\n            sb.append(\"\\\"traceId\\\":\").append(quote(traceId))\n            fields.forEach { (k, v) ->\n                sb.append(',').append(quote(k)).append(':').append(quote(v?.toString() ?: \"\"))\n            }\n            sb.append('}')\n            file.appendText(sb.toString() + \"\\n\")\n        }.onFailure { Log.w(TAG, \"metrics write failed: ${it.message}\") }\n    }\n\n    private fun quote(raw: String): String =\n        \"\\\"\" + raw.replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\", \"\\\\\\\"\") + \"\\\"\"\n\n    // ---- 4.13.6 指标族 ----\n\n    fun channelHit(traceId: String, channel: String, host: String) =\n        record(\"channel_hit\", traceId, mapOf(\"channel\" to channel, \"host\" to host))\n\n    fun degradation(traceId: String, reason: String) =\n        record(\"degrade\", traceId, mapOf(\"reason\" to reason))\n\n    fun poolWait(traceId: String, waitMs: Long) =\n        record(\"pool_wait\", traceId, mapOf(\"waitMs\" to waitMs))\n\n    fun renderCrash(traceId: String, detail: String) =\n        record(\"render_crash\", traceId, mapOf(\"detail\" to detail))\n\n    fun success(traceId: String, op: String, costMs: Long) =\n        record(\"success\", traceId, mapOf(\"op\" to op, \"costMs\" to costMs))\n\n    fun failure(traceId: String, op: String, code: String) =\n        record(\"failure\", traceId, mapOf(\"op\" to op, \"code\" to code))\n\n    /**\n     * 设置 → 高级 → 调试信息 导出（唯一出口）。\n     * 导出内容不含设备标识；崩溃日志与「纠错」按钮走同一通道。\n     */\n    fun exportTo(target: File): Boolean = runCatching {\n        if (!file.exists()) return false\n        target.writeBytes(file.readBytes())\n        true\n    }.getOrDefault(false)\n\n    fun clear() {\n        runCatching { file.delete() }\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/render/PageTurnController.kt","lang":"kt","lines":180,"content":"package com.lanyue.reader.core.render\n\n/**\n * 翻页状态机（纯逻辑，无 Android 依赖）。\n *\n * 职责边界：\n * - [Paginator] 只负责\"把一章切成页\"；\n * - [ReadingProgress] 只负责\"记录在哪\"；\n * - 本类负责\"翻一页会发生什么\"——页内前进、跨章、撞到书首书尾。\n *\n * 把这三件事拆开的好处：字号变化时只需重新分页，翻页行为本身不受影响，\n * 也就不会出现\"改字号后翻页跳章\"这类老问题。\n */\nobject PageTurnController {\n\n    /** 翻页时越过的边界类型。 */\n    enum class Boundary {\n        /** 页内正常翻动。 */\n        NONE,\n        /** 本页是本章最后一页，已翻到下一章首屏。 */\n        CHAPTER_END,\n        /** 本页是本章第一页，已退回上一章末屏。 */\n        CHAPTER_START,\n        /** 已是全书最后一页，无法继续。 */\n        BOOK_END,\n        /** 已是全书第一页，无法继续。 */\n        BOOK_START\n    }\n\n    /** 一次翻页的结果。 */\n    data class TurnResult(\n        val progress: ReadingProgress,\n        /** 位置是否真的变了。false 表示撞边界被拦下。 */\n        val moved: Boolean,\n        val boundary: Boundary\n    ) {\n        /** 是否跨越了章节（上层据此触发章节标题刷新、预取下一章）。 */\n        val crossedChapter: Boolean\n            get() = boundary == Boundary.CHAPTER_END || boundary == Boundary.CHAPTER_START\n    }\n\n    /**\n     * 下一页。\n     *\n     * [doc] 必须与 [progress] 的当前章一致；[doc] 为空或页数为 0 时按撞边界处理，\n     * 不让调用方因为\"内容还没解析好\"就崩掉。\n     */\n    fun nextPage(progress: ReadingProgress, doc: Paginator.PagedDocument?): TurnResult {\n        if (doc == null || doc.pageCount == 0) {\n            return TurnResult(progress, false, Boundary.NONE)\n        }\n        val page = progress.pageInChapter.coerceIn(0, doc.pageCount - 1)\n        if (page < doc.pageCount - 1) {\n            val target = doc.pages[page + 1]\n            return TurnResult(\n                progress = progress.copy(\n                    locator = ReadingLocator(progress.locator.chapterIndex, target.startOffset),\n                    pageInChapter = page + 1,\n                    pagesInChapter = doc.pageCount\n                ),\n                moved = true,\n                boundary = Boundary.NONE\n            )\n        }\n        // 已在末页：还有下一章就跨章，否则停在原地\n        if (progress.locator.chapterIndex >= progress.chapterCharCounts.lastIndex) {\n            return TurnResult(progress, false, Boundary.BOOK_END)\n        }\n        // 已在末页还继续翻，说明本章确实读完：按章节号强制打标，\n        // 不依赖 charOffset 是否刚好等于章节长度（分页会裁掉尾部空白）。\n        val next = progress.markChapterRead(progress.locator.chapterIndex).nextChapter()\n        return TurnResult(next, true, Boundary.CHAPTER_END)\n    }\n\n    /**\n     * 上一页。\n     *\n     * 本章第一页再往前退 -> 上一章末屏（与纸质书往回翻的手感一致）。\n     * 注意跨章后的页号由上层重新分页后通过 [ReadingProgress.syncPage] 校正，\n     * 这里只把偏移定位到上一章末尾。\n     */\n    fun previousPage(progress: ReadingProgress, doc: Paginator.PagedDocument?): TurnResult {\n        if (doc == null || doc.pageCount == 0) {\n            return TurnResult(progress, false, Boundary.NONE)\n        }\n        val page = progress.pageInChapter.coerceIn(0, doc.pageCount - 1)\n        if (page > 0) {\n            val target = doc.pages[page - 1]\n            return TurnResult(\n                progress = progress.copy(\n                    locator = ReadingLocator(progress.locator.chapterIndex, target.startOffset),\n                    pageInChapter = page - 1,\n                    pagesInChapter = doc.pageCount\n                ),\n                moved = true,\n                boundary = Boundary.NONE\n            )\n        }\n        if (progress.locator.chapterIndex <= 0) {\n            return TurnResult(progress, false, Boundary.BOOK_START)\n        }\n        return TurnResult(progress.previousChapter(), true, Boundary.CHAPTER_START)\n    }\n\n    /**\n     * 滚动阅读模式下的\"翻一屏\"。\n     *\n     * 滚动模式没有页概念，用固定字符步长模拟：\n     * 章节内步进，越界则整章翻动。返回值里的 pageInChapter 固定为 0。\n     */\n    fun scrollBy(progress: ReadingProgress, chars: Int): TurnResult {\n        if (chars == 0) return TurnResult(progress, false, Boundary.NONE)\n        val chapter = progress.locator.chapterIndex\n        val len = progress.chapterCharCounts.getOrNull(chapter) ?: 0\n        val target = progress.locator.charOffset + chars\n        if (target in 0..len) {\n            return TurnResult(\n                progress = progress.copy(\n                    locator = ReadingLocator(chapter, target),\n                    pageInChapter = 0,\n                    pagesInChapter = 1\n                ),\n                moved = true,\n                boundary = Boundary.NONE\n            )\n        }\n        if (target > len) {\n            if (chapter >= progress.chapterCharCounts.lastIndex) {\n                // 全书末尾：停在最后一个字符，而不是停在原位（滚动手感更自然）\n                return TurnResult(\n                    progress.copy(locator = ReadingLocator(chapter, len)),\n                    progress.locator.charOffset != len,\n                    Boundary.BOOK_END\n                )\n            }\n            val next = progress.markChapterRead(chapter).seekTo(chapter + 1, 0)\n            return TurnResult(next, true, Boundary.CHAPTER_END)\n        }\n        if (chapter <= 0) {\n            // 全书开头：夹到 0，避免用户往回滚后仍停在原位置\n            return TurnResult(\n                progress.copy(locator = ReadingLocator(0, 0)),\n                progress.locator.charOffset != 0,\n                Boundary.BOOK_START\n            )\n        }\n        val prevLen = progress.chapterCharCounts.getOrNull(chapter - 1) ?: 0\n        return TurnResult(\n            progress.seekTo(chapter - 1, (prevLen + target).coerceAtLeast(0)),\n            true,\n            Boundary.CHAPTER_START\n        )\n    }\n\n    /**\n     * 按阅读设置统一分页。\n     *\n     * 把\"设置 -> 度量 -> 分页盒 -> 分页\"这条链收在一处，\n     * 避免每个界面各自算一遍导致字号与行列数不一致。\n     */\n    fun paginateWithSettings(\n        paragraphs: List<String>,\n        settings: ReadingSettings,\n        viewportWidthDp: Float,\n        viewportHeightDp: Float\n    ): Paginator.PagedDocument {\n        val typography = settings.toTypography()\n        val columns = typography.columnsForWidth(viewportWidthDp)\n        val usableHeight = (\n            viewportHeightDp - typography.marginTopDp - typography.marginBottomDp\n            ).coerceAtLeast(typography.fontSizeSp * typography.lineHeightMultiplier)\n        val lineHeight = typography.fontSizeSp * typography.lineHeightMultiplier\n        val linesPerPage = (usableHeight / lineHeight).toInt().coerceAtLeast(1)\n        return Paginator.paginate(\n            paragraphs = paragraphs,\n            box = Paginator.PageBox(columns, linesPerPage),\n            typography = typography\n        )\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/render/Paginator.kt","lang":"kt","lines":230,"content":"package com.lanyue.reader.core.render\n\n/**\n * 分页引擎（纯逻辑，无 Android 依赖）。\n *\n * 设计取舍：\n * - 不做逐像素测量，改用\"字宽单位\"估算。中文/全角按 1 格，ASCII 按半格，\n *   与等宽中文字体的实际排版误差在 5% 以内，足以决定换行与分页位置。\n * - 保留全局字符偏移，翻页、进度条、书签、跨设备同步都复用它，\n *   避免\"行号 / 页号\"在字号变化后失效的老问题。\n */\nobject Paginator {\n\n    /** 单个字符占用的宽度（以 em 为单位的倍数，1.0 = 一个汉字宽）。 */\n    const val WIDTH_CJK = 1.0f\n\n    /** ASCII 半角字符宽度。 */\n    const val WIDTH_ASCII = 0.5f\n\n    /** 其他（含拉丁扩展、标点、emoji 近似）宽度。 */\n    const val WIDTH_OTHER = 0.7f\n\n    /** 不允许出现在行首的标点（避头尾）。 */\n    private const val NO_LINE_START = \"，。、；：？！）】》」』〉…—·,.;:?!)]}\\\"'\"\n\n    /** 不允许出现在行尾的标点。 */\n    private const val NO_LINE_END = \"（【《「『〈([{\\\"'\"\n\n    /** 一页的物理约束。 */\n    data class PageBox(\n        /** 每行容量，单位 em。 */\n        val columns: Float,\n        /** 每页行数。 */\n        val linesPerPage: Int\n    ) {\n        init {\n            require(columns > 0f) { \"columns must be positive: $columns\" }\n            require(linesPerPage > 0) { \"linesPerPage must be positive: $linesPerPage\" }\n        }\n    }\n\n    /** 输出的一行。 */\n    data class Line(\n        val text: String,\n        /** 该行第一个字符在整章中的全局偏移。 */\n        val startOffset: Int,\n        val endOffset: Int\n    )\n\n    /** 输出的一页。 */\n    data class Page(\n        val index: Int,\n        val lines: List<Line>,\n        val startOffset: Int,\n        val endOffset: Int\n    ) {\n        val text: String get() = lines.joinToString(\"\") { it.text }\n    }\n\n    /** 分页结果。 */\n    data class PagedDocument(\n        val pages: List<Page>,\n        val totalChars: Int\n    ) {\n        val pageCount: Int get() = pages.size\n\n        /** 找出包含指定全局偏移的页码，越界时夹到首/末页。 */\n        fun pageOfOffset(offset: Int): Int {\n            if (pages.isEmpty()) return 0\n            val target = offset.coerceIn(0, pages.last().endOffset)\n            return pages.indexOfFirst { target < it.endOffset }\n                .let { if (it < 0) pages.lastIndex else it }\n        }\n    }\n\n    /**\n     * 判断字符宽度类别。\n     * 用码点区间判断而非正则，避免长文本上的性能塌陷。\n     */\n    fun charWidth(cp: Int): Float = when {\n        cp in 0x2E80..0x9FFF -> WIDTH_CJK      // CJK 部首/汉字\n        cp in 0xA000..0xA4CF -> WIDTH_CJK      // 彝文\n        cp in 0xAC00..0xD7AF -> WIDTH_CJK      // 韩文\n        cp in 0xF900..0xFAFF -> WIDTH_CJK      // 兼容汉字\n        cp in 0xFF00..0xFF60 -> WIDTH_CJK      // 全角标点\n        cp in 0x3000..0x303F -> WIDTH_CJK      // CJK 标点\n        cp in 0x20..0x7E -> WIDTH_ASCII        // ASCII 可见字符\n        cp == '\\t'.code -> WIDTH_CJK * 2f\n        cp < 0x20 -> 0f                        // 控制字符不占宽\n        else -> WIDTH_OTHER\n    }\n\n    /** 整段宽度，单位 em。 */\n    fun measure(text: String): Float {\n        var w = 0f\n        var i = 0\n        while (i < text.length) {\n            val cp = text.codePointAt(i)\n            w += charWidth(cp)\n            i += Character.charCount(cp)\n        }\n        return w\n    }\n\n    /**\n     * 把一章拆成页。\n     *\n     * [paragraphs] 每个元素是一段（不要求带换行符）；空段会被跳过。\n     * [startOffsetBase] 允许把本章挂到全书偏移上（连载拼接时用）。\n     */\n    fun paginate(\n        paragraphs: List<String>,\n        box: PageBox,\n        startOffsetBase: Int = 0,\n        typography: TypographySpec = TypographySpec.Default\n    ): PagedDocument {\n        val lines = ArrayList<Line>(256)\n        var cursor = startOffsetBase\n\n        paragraphs.forEachIndexed { pIndex, raw ->\n            val text = raw.trim()\n            if (text.isEmpty()) return@forEachIndexed\n\n            // 首行缩进占用列宽（不写入字符，避免污染偏移）\n            val firstLineBudget = (box.columns - typography.indentEm).coerceAtLeast(\n                box.columns * MIN_INDENT_KEEP_RATIO\n            )\n            var offsetInPara = 0\n            var firstLine = true\n\n            while (offsetInPara < text.length) {\n                val budget = if (firstLine) firstLineBudget else box.columns\n                val take = takeByWidth(text, offsetInPara, budget)\n                if (take <= 0) break\n\n                val end = adjustBreak(text, offsetInPara, offsetInPara + take)\n                val slice = text.substring(offsetInPara, end)\n                lines.add(Line(slice, cursor + offsetInPara, cursor + end))\n\n                offsetInPara = end\n                firstLine = false\n            }\n\n            cursor += text.length\n            // 段间插入一个视觉空行，占用行数但不对应字符\n            if (pIndex != paragraphs.lastIndex) {\n                lines.add(Line(\"\", cursor, cursor))\n            }\n        }\n\n        if (lines.isEmpty()) {\n            return PagedDocument(listOf(Page(0, emptyList(), startOffsetBase, startOffsetBase)), 0)\n        }\n\n        val pages = ArrayList<Page>(lines.size / box.linesPerPage + 1)\n        var pageStart = 0\n        while (pageStart < lines.size) {\n            val pageEnd = minOf(pageStart + box.linesPerPage, lines.size)\n            val slice = lines.subList(pageStart, pageEnd).toList()\n            pages.add(\n                Page(\n                    index = pages.size,\n                    lines = slice,\n                    startOffset = slice.first().startOffset,\n                    endOffset = slice.last().endOffset\n                )\n            )\n            pageStart = pageEnd\n        }\n        return PagedDocument(pages, cursor - startOffsetBase)\n    }\n\n    /**\n     * 取本次能放进 [budget] 的字符数；一个字符都放不进时至少取 1，\n     * 保证 while 循环一定推进（否则窄屏 + 大字号会死循环）。\n     */\n    private fun takeByWidth(text: String, from: Int, budget: Float): Int {\n        var w = 0f\n        var i = from\n        while (i < text.length) {\n            val cp = text.codePointAt(i)\n            val cw = charWidth(cp)\n            if (w + cw > budget && i > from) return i - from\n            w += cw\n            i += Character.charCount(cp)\n            if (w >= budget) return i - from\n        }\n        return text.length - from\n    }\n\n    /**\n     * 修正换行点：\n     * 1. 行首不能是避头标点 -> 往前收一个字符\n     * 2. 行尾不能是避尾标点 -> 往前收一个字符\n     * 3. 若切断英文单词（两侧都是 ASCII 字母）且本行还能回退，回退到空格\n     */\n    private fun adjustBreak(text: String, from: Int, rawEnd: Int): Int {\n        var end = rawEnd.coerceIn(from + 1, text.length)\n        if (end >= text.length) return text.length\n\n        var guard = 0\n        while (guard++ < MAX_BREAK_ADJUST && end > from + 1) {\n            val next = text[end]\n            val prev = text[end - 1]\n            val nextIsNoStart = NO_LINE_START.indexOf(next)
