 >= 0\n            val prevIsNoEnd = NO_LINE_END.indexOf(prev) >= 0\n            if (!nextIsNoStart && !prevIsNoEnd) break\n            end--\n        }\n\n        // 英文单词保护：两侧都是 ASCII 字母时，回退到最近空格\n        if (end < text.length && end > from + 1) {\n            val prev = text[end - 1]\n            val next = text[end]\n            if (isLatinLetter(prev) && isLatinLetter(next)) {\n                val space = text.lastIndexOf(' ', end - 1)\n                if (space > from + 1) return space\n            }\n        }\n        return end\n    }\n\n    private fun isLatinLetter(c: Char): Boolean = c in 'a'..'z' || c in 'A'..'Z'\n\n    /** 缩进最多吃掉几成列宽。 */\n    private const val MIN_INDENT_KEEP_RATIO = 0.5f\n\n    /** 换行点修正的最大回退步数。 */\n    private const val MAX_BREAK_ADJUST = 8\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/render/ReadingProgress.kt","lang":"kt","lines":135,"content":"package com.lanyue.reader.core.render\n\n/**\n * 阅读进度与定位。\n *\n * 进度以\"全局字符偏移\"为唯一真值，页号只是派生量：\n * 用户改字号 -> 重新分页 -> 用偏移还原位置，不会跳章。\n */\ndata class ReadingLocator(\n    val chapterIndex: Int,\n    val charOffset: Int\n) : Comparable<ReadingLocator> {\n\n    init {\n        require(chapterIndex >= 0) { \"chapterIndex must not be negative: $chapterIndex\" }\n        require(charOffset >= 0) { \"charOffset must not be negative: $charOffset\" }\n    }\n\n    override fun compareTo(other: ReadingLocator): Int {\n        val byChapter = chapterIndex.compareTo(other.chapterIndex)\n        return if (byChapter != 0) byChapter else charOffset.compareTo(other.charOffset)\n    }\n\n    fun isSamePlaceAs(other: ReadingLocator?): Boolean =\n        other != null && chapterIndex == other.chapterIndex && charOffset == other.charOffset\n}\n\n/**\n * 全书阅读进度状态机。\n *\n * 刻意做成不可变对象：每次翻页产生新实例，便于 Compose 触发重组，\n * 也便于\"回滚到上一位置\"这类操作只靠保存旧引用实现。\n */\ndata class ReadingProgress(\n    val locator: ReadingLocator,\n    val chapterCharCounts: List<Int>,\n    /** 已读章节数，用于目录里的\"已读\"标记。 */\n    val readChapters: Set<Int> = emptySet(),\n    /** 当前章节内的页号与总页数，仅用于显示。 */\n    val pageInChapter: Int = 0,\n    val pagesInChapter: Int = 1\n) {\n\n    init {\n        require(pagesInChapter >= 1) { \"pagesInChapter must be at least 1\" }\n        require(pageInChapter in 0 until pagesInChapter) {\n            \"pageInChapter out of range: $pageInChapter / $pagesInChapter\"\n        }\n    }\n\n    val totalChars: Long get() = chapterCharCounts.sumOf { it.toLong() }\n\n    /**\n     * 全书百分比，0f..1f。\n     * 空书返回 0f 而不是抛异常或 NaN。\n     */\n    fun percent(): Float {\n        val total = totalChars\n        if (total <= 0L) return 0f\n        val consumed = chapterCharCounts\n            .take(locator.chapterIndex.coerceIn(0, chapterCharCounts.size))\n            .sumOf { it.toLong() } + locator.charOffset\n        return (consumed.toDouble() / total.toDouble()).toFloat().coerceIn(0f, 1f)\n    }\n\n    /** 章节内百分比，用于页脚进度条。 */\n    fun chapterPercent(): Float {\n        val total = chapterCharCounts.getOrNull(locator.chapterIndex) ?: return 0f\n        if (total <= 0) return 0f\n        return (locator.charOffset.toDouble() / total.toDouble()).toFloat().coerceIn(0f, 1f)\n    }\n\n    fun isChapterRead(index: Int): Boolean = index in readChapters\n\n    /** 跳到章节内偏移，同时夹紧到该章长度内。 */\n    fun seekTo(chapterIndex: Int, charOffset: Int): ReadingProgress {\n        val safeChapter = chapterIndex.coerceIn(0, (chapterCharCounts.size - 1).coerceAtLeast(0))\n        val len = chapterCharCounts.getOrNull(safeChapter) ?: 0\n        val safeOffset = charOffset.coerceIn(0, len)\n        return copy(\n            locator = ReadingLocator(safeChapter, safeOffset),\n            pageInChapter = 0,\n            pagesInChapter = 1\n        )\n    }\n\n    /** 用一次分页结果同步页号。偏移落在本章之外时夹到边界。 */\n    fun syncPage(doc: Paginator.PagedDocument): ReadingProgress {\n        if (doc.pages.isEmpty()) return copy(pageInChapter = 0, pagesInChapter = 1)\n        val page = doc.pageOfOffset(locator.charOffset)\n        return copy(pageInChapter = page, pagesInChapter = doc.pageCount)\n    }\n\n    /**\n     * 按章节号强制打已读标记。\n     *\n     * 翻页跨章时用这个而不是 [markCurrentChapterRead]：\n     * 分页可能只覆盖到章节尾部之前（尾段落为空白被裁掉），\n     * 用偏移判断会把\"确实读完了\"的一章漏标。\n     */\n    fun markChapterRead(index: Int): ReadingProgress {\n        if (index !in chapterCharCounts.indices) return this\n        if (index in readChapters) return this\n        return copy(readChapters = readChapters + index)\n    }\n\n    /** 章节读完时打标。 */\n    fun markCurrentChapterRead(): ReadingProgress {\n        val len = chapterCharCounts.getOrNull(locator.chapterIndex) ?: 0\n        if (locator.charOffset < len) return this\n        return copy(readChapters = readChapters + locator.chapterIndex)\n    }\n\n    /** 下一章首屏。已是最后一章则原地不动。 */\n    fun nextChapter(): ReadingProgress {\n        if (locator.chapterIndex >= chapterCharCounts.lastIndex) return this\n        return seekTo(locator.chapterIndex + 1, 0)\n    }\n\n    /** 上一章末屏（不是首屏，符合长按/返回上一章的习惯）。 */\n    fun previousChapter(): ReadingProgress {\n        if (locator.chapterIndex <= 0) return seekTo(0, 0)\n        val prevIndex = locator.chapterIndex - 1\n        val len = chapterCharCounts.getOrNull(prevIndex) ?: 0\n        return seekTo(prevIndex, (len - 1).coerceAtLeast(0))\n    }\n\n    companion object {\n        fun initial(chapterCharCounts: List<Int>): ReadingProgress =\n            ReadingProgress(\n                locator = ReadingLocator(0, 0),\n                chapterCharCounts = if (chapterCharCounts.isEmpty()) listOf(0) else chapterCharCounts\n            )\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/render/ReadingSettings.kt","lang":"kt","lines":168,"content":"package com.lanyue.reader.core.render\n\n/**\n * 翻页方式。\n *\n * 只有 [SLIDE]、[COVER]、[NONE] 是\"分页阅读\"下的动画差异，\n * [SCROLL] 是连续滚动阅读，语义上不产生页的概念，\n * 上层据 [isPaged] 决定走分页器还是滚动容器。\n */\nenum class PageTurnMode(val id: String, val label: String) {\n    SLIDE(\"slide\", \"平移\"),\n    COVER(\"cover\", \"覆盖\"),\n    NONE(\"none\", \"无动画\"),\n    SCROLL(\"scroll\", \"滚动\");\n\n    /** 是否为分页阅读（需要分页器）。 */\n    val isPaged: Boolean get() = this != SCROLL\n\n    companion object {\n        val Default = SLIDE\n\n        /** 未知 id 回落到默认，避免坏配置导致白屏。 */\n        fun fromId(id: String?): PageTurnMode =\n            entries.firstOrNull { it.id == id } ?: Default\n    }\n}\n\n/**\n * 用户可调的阅读设置。\n *\n * 全部字段都带上下界，构造即校验：设置页拖动滑杆不会把界面拖进非法状态。\n * 与 [TypographySpec] 的分工是：本类负责\"用户意图 + 持久化\"，\n * [TypographySpec] 负责\"排版度量计算\"，两者通过 [toTypography] 单向转换。\n */\ndata class ReadingSettings(\n    val fontSizeSp: Float = TypographySpec.DEFAULT_FONT_SP,\n    val lineSpacingAdd: Float = 0.35f,\n    val letterSpacingEm: Float = 0f,\n    val themeId: String = ThemePalette.DayId,\n    val pageTurnMode: PageTurnMode = PageTurnMode.Default,\n    /** 阅读时保持屏幕常亮。 */\n    val keepScreenOn: Boolean = true,\n    /** 全屏（隐藏状态栏）。 */\n    val fullScreen: Boolean = true,\n    /** 跟随系统时间自动切换日夜主题。 */\n    val autoNightByClock: Boolean = false\n) {\n    init {\n        require(fontSizeSp in TypographySpec.MIN_FONT_SP..TypographySpec.MAX_FONT_SP) {\n            \"fontSizeSp out of range: $fontSizeSp\"\n        }\n        require(lineSpacingAdd in 0f..TypographySpec.MAX_LINE_SPACING_ADD) {\n            \"lineSpacingAdd out of range: $lineSpacingAdd\"\n        }\n        require(\n            letterSpacingEm in TypographySpec.MIN_LETTER_SPACING_EM..\n                TypographySpec.MAX_LETTER_SPACING_EM\n        ) { \"letterSpacingEm out of range: $letterSpacingEm\" }\n        require(themeId.isNotBlank()) { \"themeId must not be blank\" }\n    }\n\n    /** 转成排版度量。缩进/段距沿用 [TypographySpec] 默认值。 */\n    fun toTypography(): TypographySpec = TypographySpec(\n        fontSizeSp = fontSizeSp,\n        lineSpacingAdd = lineSpacingAdd,\n        letterSpacingEm = letterSpacingEm\n    )\n\n    fun withFontSize(sp: Float): ReadingSettings = copy(\n        fontSizeSp = sp.coerceIn(TypographySpec.MIN_FONT_SP, TypographySpec.MAX_FONT_SP)\n    )\n\n    /** 字号步进，供 +/- 按钮使用，结果仍被夹在合法区间。 */\n    fun stepFontSize(delta: Float): ReadingSettings = withFontSize(fontSizeSp + delta)\n\n    fun withLineSpacing(add: Float): ReadingSettings = copy(\n        lineSpacingAdd = add.coerceIn(0f, TypographySpec.MAX_LINE_SPACING_ADD)\n    )\n\n    fun withLetterSpacing(em: Float): ReadingSettings = copy(\n        letterSpacingEm = em.coerceIn(\n            TypographySpec.MIN_LETTER_SPACING_EM,\n            TypographySpec.MAX_LETTER_SPACING_EM\n        )\n    )\n\n    fun withTheme(id: String): ReadingSettings = copy(themeId = id)\n\n    /** 当前主题；未知 id 由 [ThemeRegistry] 回落，不会抛异常。 */\n    fun theme(): ThemePalette = ThemeRegistry.byIdOrDefault(themeId)\n\n    /**\n     * 按时间解析实际生效主题。\n     * [hourOfDay] 取 0..23；开启自动夜间时 19 点后到早上 6 点前用夜间主题。\n     */\n    fun resolveTheme(hourOfDay: Int): ThemePalette {\n        if (!autoNightByClock) return theme()\n        val h = hourOfDay.coerceIn(0, 23)\n        val night = h >= 19 || h < 6\n        return if (night) {\n            ThemeRegistry.byId(ThemePalette.NightId) ?: theme()\n        } else {\n            val day = ThemeRegistry.byId(ThemePalette.DayId) ?: theme()\n            // 白天向夜间切换时保留用户原本的浅色主题\n            if (theme().isDark) day else theme()\n        }\n    }\n\n    /**\n     * 序列化为稳定的 key=value 串，便于存 SharedPreferences / DataStore。\n     * 顺序固定，方便测试与 diff。\n     */\n    fun serialize(): String = listOf(\n        \"fontSizeSp=${trimFloat(fontSizeSp)}\",\n        \"lineSpacingAdd=${trimFloat(lineSpacingAdd)}\",\n        \"letterSpacingEm=${trimFloat(letterSpacingEm)}\",\n        \"themeId=$themeId\",\n        \"pageTurnMode=${pageTurnMode.id}\",\n        \"keepScreenOn=$keepScreenOn\",\n        \"fullScreen=$fullScreen\",\n        \"autoNightByClock=$autoNightByClock\"\n    ).joinToString(\";\")\n\n    companion object {\n        val Default = ReadingSettings()\n\n        /**\n         * 从序列化串恢复设置。\n         * 任何字段缺失或非法都单独回落到默认值，不整体丢弃——\n         * 升级后新增字段时老配置仍然可用。\n         */\n        fun deserialize(raw: String?): ReadingSettings {\n            if (raw.isNullOrBlank()) return Default\n            val map = HashMap<String, String>()\n            raw.split(';').forEach { pair ->\n                val idx = pair.indexOf('=')\n                if (idx > 0) map[pair.substring(0, idx).trim()] = pair.substring(idx + 1).trim()\n            }\n            val base = Default\n            return ReadingSettings(\n                fontSizeSp = map[\"fontSizeSp\"]?.toFloatOrNull()\n                    ?.coerceIn(TypographySpec.MIN_FONT_SP, TypographySpec.MAX_FONT_SP)\n                    ?: base.fontSizeSp,\n                lineSpacingAdd = map[\"lineSpacingAdd\"]?.toFloatOrNull()\n                    ?.coerceIn(0f, TypographySpec.MAX_LINE_SPACING_ADD)\n                    ?: base.lineSpacingAdd,\n                letterSpacingEm = map[\"letterSpacingEm\"]?.toFloatOrNull()\n                    ?.coerceIn(\n                        TypographySpec.MIN_LETTER_SPACING_EM,\n                        TypographySpec.MAX_LETTER_SPACING_EM\n                    )\n                    ?: base.letterSpacingEm,\n                themeId = map[\"themeId\"]?.takeIf { it.isNotBlank() } ?: base.themeId,\n                pageTurnMode = PageTurnMode.fromId(map[\"pageTurnMode\"]),\n                keepScreenOn = map[\"keepScreenOn\"]?.toBooleanStrictOrNull() ?: base.keepScreenOn,\n                fullScreen = map[\"fullScreen\"]?.toBooleanStrictOrNull() ?: base.fullScreen,\n                autoNightByClock = map[\"autoNightByClock\"]?.toBooleanStrictOrNull()\n                    ?: base.autoNightByClock\n            )\n        }\n\n        /** 去掉浮点尾巴（18.0 -> 18，18.35 -> 18.35），让配置串可读。 */\n        private fun trimFloat(v: Float): String {\n            val asInt = v.toInt()\n            return if (v == asInt.toFloat()) asInt.toString() else v.toString()\n        }\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/render/TypographyTheme.kt","lang":"kt","lines":162,"content":"package com.lanyue.reader.core.render\n\n/**\n * 排版度量。\n *\n * 这里只保存\"无单位\"的排版意图（Sp / Em / Dp 数值），\n * 不引用 android.* 任何类型，便于在 JVM 单测里直接验证边界。\n * 真正落到画布时由房型层乘 density / scaledDensity。\n */\ndata class TypographySpec(\n    /** 正文字号，单位 sp。 */\n    val fontSizeSp: Float = DEFAULT_FONT_SP,\n    /** 行距附加倍数：0 表示单倍行距。 */\n    val lineSpacingAdd: Float = 0.35f,\n    /** 字距，单位 em。 */\n    val letterSpacingEm: Float = 0f,\n    /** 首行缩进，单位 em。 */\n    val indentEm: Float = 2f,\n    /** 段间距，单位 em。 */\n    val paragraphSpacingEm: Float = 0.8f,\n    /** 左右留白，单位 dp。 */\n    val marginSideDp: Float = 20f,\n    /** 上下留白，单位 dp。 */\n    val marginTopDp: Float = 16f,\n    val marginBottomDp: Float = 16f\n) {\n    init {\n        require(fontSizeSp in MIN_FONT_SP..MAX_FONT_SP) {\n            \"fontSizeSp out of range: $fontSizeSp\"\n        }\n        require(lineSpacingAdd in 0f..MAX_LINE_SPACING_ADD) {\n            \"lineSpacingAdd out of range: $lineSpacingAdd\"\n        }\n        require(letterSpacingEm in MIN_LETTER_SPACING_EM..MAX_LETTER_SPACING_EM) {\n            \"letterSpacingEm out of range: $letterSpacingEm\"\n        }\n        require(indentEm in 0f..MAX_INDENT_EM) { \"indentEm out of range: $indentEm\" }\n        require(paragraphSpacingEm in 0f..MAX_PARAGRAPH_SPACING_EM) {\n            \"paragraphSpacingEm out of range: $paragraphSpacingEm\"\n        }\n        require(marginSideDp >= 0f && marginTopDp >= 0f && marginBottomDp >= 0f) {\n            \"margins must not be negative\"\n        }\n    }\n\n    /** 行高倍数：1 + lineSpacingAdd。 */\n    val lineHeightMultiplier: Float get() = 1f + lineSpacingAdd\n\n    /**\n     * 按可用的正文宽度算每行容纳的 em 数。\n     * 留白过大导致宽度为 0 时返回安全下限，避免上层除以 0。\n     */\n    fun columnsForWidth(widthDp: Float): Float {\n        val usable = widthDp - marginSideDp * 2f\n        if (usable <= 0f) return MIN_COLUMNS\n        // 1 em ≈ fontSizeSp 像素（sp 与 dp 在无系统字体缩放下等价）\n        return (usable / fontSizeSp).coerceAtLeast(MIN_COLUMNS)\n    }\n\n    fun withFontSize(sp: Float): TypographySpec =\n        copy(fontSizeSp = sp.coerceIn(MIN_FONT_SP, MAX_FONT_SP))\n\n    fun withLineSpacing(add: Float): TypographySpec =\n        copy(lineSpacingAdd = add.coerceIn(0f, MAX_LINE_SPACING_ADD))\n\n    companion object {\n        const val MIN_FONT_SP = 12f\n        const val MAX_FONT_SP = 34f\n        const val DEFAULT_FONT_SP = 18f\n        const val MAX_LINE_SPACING_ADD = 1.5f\n        const val MIN_LETTER_SPACING_EM = -0.05f\n        const val MAX_LETTER_SPACING_EM = 0.3f\n        const val MAX_INDENT_EM = 4f\n        const val MAX_PARAGRAPH_SPACING_EM = 3f\n        const val MIN_COLUMNS = 1f\n\n        /** 默认阅读排版。 */\n        val Default = TypographySpec()\n    }\n}\n\n/**\n * 主题配色。颜色统一用 ARGB Int 表示，避免依赖 Android Color。\n */\ndata class ThemePalette(\n    val id: String,\n    val name: String,\n    val isDark: Boolean,\n    val backgroundArgb: Int,\n    val textArgb: Int,\n    val secondaryTextArgb: Int,\n    val accentArgb: Int,\n    /** 是否叠加纸张纹理（仅对浅色主题有意义）。 */\n    val paperGrain: Boolean = false\n) {\n    init {\n        require(id.isNotBlank()) { \"theme id must not be blank\" }\n        require(name.isNotBlank()) { \"theme name must not be blank\" }\n    }\n\n    /** 与本主题搭配的深色/浅色切换目标。 */\n    fun toggled(registry: ThemeRegistry = ThemeRegistry): ThemePalette =\n        if (isDark) registry.byId(DayId) ?: this else registry.byId(NightId) ?: this\n\n    companion object {\n        const val DayId = \"day\"\n        const val NightId = \"night\"\n    }\n}\n\n/**\n * 内置主题集合。主题是纯数据，运行时可被用户覆盖（用户主题由上层持久化）。\n */\nobject ThemeRegistry {\n\n    private val builtIn: List<ThemePalette> = listOf(\n        ThemePalette(\n            id = ThemePalette.DayId,\n            name = \"纸质\",\n            isDark = false,\n            backgroundArgb = 0xFFF5F0E6.toInt(),\n            textArgb = 0xFF2B2620.toInt(),\n            secondaryTextArgb = 0xFF7A7267.toInt(),\n            accentArgb = 0xFF8C6A3F.toInt(),\n            paperGrain = true\n        ),\n        ThemePalette(\n            id = ThemePalette.NightId,\n            name = \"夜间\",\n            isDark = true,\n            backgroundArgb = 0xFF16181C.toInt(),\n            textArgb = 0xFFC9CDD4.toInt(),\n            secondaryTextArgb = 0xFF7E848D.toInt(),\n            accentArgb = 0xFF6E9BD1.toInt()\n        ),\n        ThemePalette(\n            id = \"green\",\n            name = \"护眼绿\",\n            isDark = false,\n            backgroundArgb = 0xFFCCE8CF.toInt(),\n            textArgb = 0xFF23301F.toInt(),\n            secondaryTextArgb = 0xFF5C6B58.toInt(),\n            accentArgb = 0xFF3F7A46.toInt()\n        ),\n        ThemePalette(\n            id = \"oled\",\n            name = \"纯黑\",\n            isDark = true,\n            backgroundArgb = 0xFF000000.toInt(),\n            textArgb = 0xFFE6E6E6.toInt(),\n            secondaryTextArgb = 0xFF8A8A8A.toInt(),\n            accentArgb = 0xFF4C9AFF.toInt()\n        )\n    )\n\n    val all: List<ThemePalette> get() = builtIn\n\n    fun byId(id: String?): ThemePalette? = builtIn.firstOrNull { it.id == id }\n\n    /** 未知 id 回落到浅色纸质主题，不让界面因为坏配置变黑。 */\n    fun byIdOrDefault(id: String?): ThemePalette = byId(id) ?: builtIn.first()\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/security/BridgeSecurity.kt","lang":"kt","lines":156,"content":"package com.lanyue.reader.core.security\n\nimport java.net.InetAddress\nimport java.net.URI\nimport java.util.UUID\n\n/**\n * 5.1 桥白名单：仅 3 个异步方法，仅 Runner 及沙箱。\n * Sniffer / 渲染 WebView 不加桥（调用方保证）。\n */\nobject BridgeWhitelist {\n    const val NATIVE_LOG = \"nativeLog\"\n    const val NATIVE_FETCH = \"nativeFetch\"\n    const val NATIVE_POST_MESSAGE = \"nativePostMessage\"\n\n    /** 5.1 原生 → JS 回调用固定名，并冻结（5.3 防伪造）。 */\n    const val DISPATCH_RESULT = \"__dispatchResult\"\n\n    val ALLOWED = setOf(NATIVE_LOG, NATIVE_FETCH, NATIVE_POST_MESSAGE)\n}\n\n/** 5.2 nativeFetch 校验结果。 */\nsealed class FetchVerdict {\n    data class Allow(val normalizedUrl: String, val method: String) : FetchVerdict()\n    data class Deny(val reason: String) : FetchVerdict()\n}\n\n/**\n * 5.2 nativeFetch 校验链：Scheme → 内网拦截 → DNS 后 IP → 重定向逐跳\n * → 域名白名单 → 大小限制 → JSON Schema。\n *\n * ADR-021：默认仅 GET/HEAD；书源/订阅源规则内 method=POST 即视为源显式声明；\n * 弹幕源对 dandanplay v2 端点放行 POST；drpy 源 req() 默认放行 GET/POST。\n */\nclass NativeFetchGuard(\n    private val domainWhitelist: (host: String) -> Boolean,\n    private val maxResponseBytes: Long = 8L * 1024 * 1024\n) {\n\n    companion object {\n        private val ALLOWED_SCHEMES = setOf(\"http\", \"https\")\n    }\n\n    fun verify(url: String, method: String, declaredByRule: Boolean, postAllowed: Boolean): FetchVerdict {\n        val uri = runCatching { URI(url) }.getOrNull()\n            ?: return FetchVerdict.Deny(\"malformed url\")\n        val scheme = uri.scheme?.lowercase() ?: return FetchVerdict.Deny(\"missing scheme\")\n        if (scheme !in ALLOWED_SCHEMES) return FetchVerdict.Deny(\"scheme not allowed: $scheme\")\n\n        val host = uri.host ?: return FetchVerdict.Deny(\"missing host\")\n        if (isInternalHost(host)) return FetchVerdict.Deny(\"internal host blocked: $host\")\n        if (!domainWhitelist(host)) return FetchVerdict.Deny(\"domain not whitelisted: $host\")\n\n        val normalized = method.uppercase()\n        val isWrite = normalized !in setOf(\"GET\", \"HEAD\")\n        if (isWrite) {\n            if (!declaredByRule && !postAllowed) {\n                return FetchVerdict.Deny(\"method $normalized requires explicit source declaration\")\n            }\n            // 5.2：POST 仍必须过域名白名单与 SSRF 校验（上面已做）\n        }\n        return FetchVerdict.Allow(url, normalized)\n    }\n\n    /**\n     * 内网 / 回环 / 链路本地拦截。\n     * 注意：LocalParseProxy 的 127.0.0.1 播放地址只给 Media3 用，不经过本闸门。\n     */\n    fun isInternalHost(host: String): Boolean {\n        val literal = runCatching { InetAddress.getByName(host) }.getOrNull() ?: return false\n        return literal.isLoopbackAddress ||\n            literal.isSiteLocalAddress ||\n            literal.isLinkLocalAddress ||\n            literal.isAnyLocalAddress\n    }\n\n    /** 重定向逐跳校验：每次 Location 都要重新过 verify，不允许一跳放行到底。 */\n    fun verifyHop(currentUrl: String, location: String): String? {\n        val next = runCatching { URI(currentUrl).resolve(location).toString() }.getOrNull() ?: return null\n        return when (verify(next, \"GET\", declaredByRule = true, postAllowed = false)) {\n            is FetchVerdict.Allow -> next\n            is FetchVerdict.Deny -> null\n        }\n    }\n\n    fun maxBytes(): Long = maxResponseBytes\n}\n\n/**\n * 5.3 防伪造与限流。\n * - nativePostMessage 仅 SANDBOX / DOM_QUERY 通道可用\n * - taskId 为 UUID 闭包，不可预测\n * - 提交侧限流：单源 10/s、单域名 5/s、沙箱 20/s；结果回调不限流\n */\nclass SubmitGuard(\n    private val perSourcePerSec: Int = 10,\n    private val perDomainPerSec: Int = 5,\n    private val perSandboxPerSec: Int = 20\n) {\n    private val sourceWindows = mutableMapOf<String, Window>()\n    private val domainWindows = mutableMapOf<String, Window>()\n    private val sandboxWindows = mutableMapOf<String, Window>()\n\n    private class Window(var startMs: Long, var count: Int)\n\n    @Synchronized\n    fun allowSubmit(sourceId: String, host: String, sandboxId: String, now: Long = System.currentTimeMillis()): Boolean {\n        fun check(map: MutableMap<String, Window>, key: String, limit: Int): Boolean {\n            val w = map.getOrPut(key) { Window(now, 0) }\n            if (now - w.startMs >= 1000L) {\n                w.startMs = now\n                w.count = 0\n            }\n            if (w.count >= limit) return false\n            w.count += 1\n            return true\n        }\n        return check(sourceWindows, sourceId, perSourcePerSec) &&\n            check(domainWindows, host, perDomainPerSec) &&\n            check(sandboxWindows, sandboxId, perSandboxPerSec)\n    }\n\n    fun newTaskId(): String = UUID.randomUUID().toString()\n}\n\n/**\n * 4.6 与 4.10 共用的「HTML 类请求」判定口径。\n * 文档明确要求：C.5 转发判定与 4.6 空响应判定共用同一函数，不允许各自发明。\n */\nobject HtmlRequestClassifier {\n\n    private val HTML_SUFFIXES = setOf(\"html\", \"htm\", \"xhtml\", \"shtml\", \"php\", \"asp\", \"aspx\", \"jsp\")\n\n    fun isHtmlLike(url: String, headers: Map<String, String>): Boolean {\n        val accept = headers.entries\n            .firstOrNull { it.key.equals(\"Accept\", ignoreCase = true) }\n            ?.value\n            ?.lowercase()\n            ?: \"\"\n        if (accept.contains(\"text/html\") || accept.contains(\"application/xhtml\")) return true\n\n        val path = url.substringBefore('?').substringBefore('#')\n        val suffix = path.substringAfterLast('.', \"\").lowercase()\n        if (suffix.isNotEmpty() && suffix in HTML_SUFFIXES) return true\n\n        // 无后缀且无 Accept 声明：按 HTML 视作可疑，进入空响应判定\n        return suffix.isEmpty()\n    }\n\n    /** 4.6 空响应判定：HTML 类请求 200 且 body < 1KB 且不含任何标签。 */\n    fun isEmptyHtmlBody(body: String?): Boolean {\n        if (body == null) return true\n        if (body.length >= 1024) return false\n        return !body.contains('<')\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/security/KeystoreSecretStore.kt","lang":"kt","lines":44,"content":"package com.lanyue.reader.core.security\n\nimport android.content.Context\nimport android.util.Base64\nimport androidx.security.crypto.EncryptedSharedPreferences\nimport androidx.security.crypto.MasterKey\n\n/**\n * 4.10.1 / 4.12 Keystore 加密存储。\n *\n * 适用范围：danmaku_sources.appSecret、webdav_credentials.password。\n * 备份导出默认脱敏：不含 secret，恢复时提示重填（ADR-017）。\n */\nclass KeystoreSecretStore(context: Context) {\n\n    private val prefs = runCatching {\n        val masterKey = MasterKey.Builder(context)\n            .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)\n            .build()\n        EncryptedSharedPreferences.create(\n            context,\n            \"lanyue_secrets\",\n            masterKey,\n            EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,\n            EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM\n        )\n    }.getOrNull()\n\n    fun put(key: String, secret: String) {\n        prefs?.edit()?.putString(key, secret)?.apply()\n    }\n\n    fun get(key: String): String? = prefs?.getString(key, null)\n\n    fun remove(key: String) {\n        prefs?.edit()?.remove(key)?.apply()\n    }\n\n    /**\n     * 备份导出默认脱敏：调用方必须使用此方法而不是 raw secret。\n     * 返回 null 表示不应写入备份文件。\n     */\n    fun forBackup(key: String): String? = null\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/core/security/SourcePermission.kt","lang":"kt","lines":74,"content":"package com.lanyue.reader.core.security\n\nimport com.lanyue.reader.core.engine.JsExecMode\n\n/**\n * 5.5 源权限分级。\n * 表的每一行都映射为一个 [SourcePermissionLevel]，决定默认执行环境与网络权限。\n */\nenum class SourcePermissionLevel {\n    /** 书源：主上下文 IIFE，DOM + 受控 GET/POST（规则内 method 声明）+ 基础 JS */\n    BOOK,\n\n    /** 订阅源：主上下文 IIFE，同书源 */\n    SUBSCRIPTION,\n\n    /** 影视源（CMS json/xml）：无 JS，仅受控 HTTP + JSON/XML */\n    VIDEO_CMS,\n\n    /** 影视源（drpy/JS）：复用 iframe 沙箱，DOM + 受控 GET/POST（req() 默认放行） */\n    VIDEO_DRPY,\n\n    /** 影视源（spider jar，二期）：独立进程 ClassLoader 隔离（非安全边界） */\n    VIDEO_SPIDER,\n\n    /** 弹幕源：无 JS（REST），GET + POST（仅 dandanplay v2 端点） */\n    DANMAKU,\n\n    /** 未知源：独立沙箱，最低权限，导入需高危确认 */\n    UNKNOWN\n}\n\n/** 5.5 运行时权限裁决结果。 */\ndata class PermissionGrant(\n    val level: SourcePermissionLevel,\n    val mode: JsExecMode,\n    val allowJs: Boolean,\n    val allowDom: Boolean,\n    val allowGet: Boolean,\n    val allowPost: Boolean,\n    val requireHighRiskConfirm: Boolean\n) {\n    companion object {\n        fun of(level: SourcePermissionLevel): PermissionGrant = when (level) {\n            SourcePermissionLevel.BOOK -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = true, allowDom = true,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.SUBSCRIPTION -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = true, allowDom = true,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.VIDEO_CMS -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = false, allowDom = false,\n                allowGet = true, allowPost = false, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.VIDEO_DRPY -> PermissionGrant(\n                level, JsExecMode.SANDBOX_REUSE, allowJs = true, allowDom = true,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.VIDEO_SPIDER -> PermissionGrant(\n                level, JsExecMode.SANDBOX_ISOLATED, allowJs = true, allowDom = false,\n                allowGet = true, allowPost = false, requireHighRiskConfirm = true\n            )\n            SourcePermissionLevel.DANMAKU -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = false, allowDom = false,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.UNKNOWN -> PermissionGrant(\n                level, JsExecMode.SANDBOX_ISOLATED, allowJs = false, allowDom = false,\n                allowGet = true, allowPost = false, requireHighRiskConfirm = true\n            )\n        }\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/danmaku/DanmakuMatchEngine.kt","lang":"kt","lines":186,"content":"package com.lanyue.reader.danmaku\n\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.DanmakuDao\nimport com.lanyue.reader.data.db.entity.DanmakuBindingEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport com.lanyue.reader.source.model.DanmakuMatch\nimport com.lanyue.reader.source.model.DanmakuMatchRequest\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport kotlinx.coroutines.withTimeoutOrNull\n\n/**\n * 4.10.3 弹幕自动匹配引擎（零操作）。\n *\n * 链路：\n *   onPlaybackStarted\n *   -> 提取匹配上下文（在线：片名+集数 / 本地：文件名+hash+size+时长）\n *   -> 查 danmaku_bindings（视频标识 + 弹幕源）\n *      - 命中 -> 复用 episodeId\n *      - 未命中 -> 遍历启用弹幕源（按 sortOrder）\n *   -> 任一源命中 -> 写 danmaku_bindings -> 拉取\n *   -> 全部未命中 -> 非阻塞提示「未匹配到弹幕，点此手动选择」\n *\n * 关键规则：\n * - 多源按配置顺序尝试，首个命中即用\n * - 单源匹配超时 5s，超时跳过下一源\n * - 后台协程执行，不阻塞起播\n */\nclass DanmakuMatchEngine(\n    private val dao: DanmakuDao,\n    private val sourceFactory: (DanmakuSourceEntity) -> IDanmakuSource?,\n    private val metrics: LocalMetrics\n) {\n\n    companion object {\n        /** 单源匹配超时 5s */\n        const val PER_SOURCE_TIMEOUT_MS = 5_000L\n        /** 4.10.4 分段拉取窗口 */\n        const val COMMENT_WINDOW_MS = 60_000L\n        /** 剩余 < 30s 触发下一段增量拉取 */\n        const val PREFETCH_THRESHOLD_MS = 30_000L\n    }\n\n    sealed class Outcome {\n        /** 命中：可直接进入拉取。 */\n        data class Matched(\n            val match: DanmakuMatch,\n            val source: DanmakuSourceEntity,\n            val videoKey: String\n        ) : Outcome()\n\n        /** 全部未命中：UI 显示「未匹配到弹幕，点此手动选择」。 */\n        data class NotMatched(val videoKey: String) : Outcome()\n    }\n\n    /**\n     * 生成视频标识 videoKey。\n     * 本地文件 = 路径+大小；在线 = 源ID+剧集URL（4.10.5）。\n     */\n    fun videoKeyFor(request: DanmakuMatchRequest, sourceId: String?, episodeUrl: String?): String {\n        return when {\n            request.fileName != null && request.fileSize != null ->\n                \"file:\" + request.fileName + \":\" + request.fileSize\n            sourceId != null && episodeUrl != null ->\n                \"online:\" + sourceId + \":\" + episodeUrl\n            else -> \"title:\" + request.title + \":\" + (request.episode ?: 0)\n        }\n    }\n\n    /**\n     * 自动匹配入口。后台协程执行，不阻塞起播。\n     */\n    suspend fun autoMatch(\n        request: DanmakuMatchRequest,\n        videoKey: String\n    ): Outcome {\n        val sources = dao.enabledOrdered()\n        if (sources.isEmpty()) return Outcome.NotMatched(videoKey)\n\n        // 1) 先查匹配记忆（按 videoKey + 弹幕源）\n        for (entity in sources) {\n            val binding = dao.binding(videoKey, entity.id) ?: continue\n            val match = DanmakuMatch(\n                episodeId = binding.episodeId,\n                animeTitle = request.title,\n                episodeTitle = \"\",\n                shift = binding.shift,\n                sourceId = entity.id\n            )\n            return Outcome.Matched(match, entity, videoKey)\n        }\n\n        // 2) 未命中记忆：遍历启用源（按 sortOrder），首个命中即用\n        for (entity in sources) {\n            val source = sourceFactory(entity) ?: continue\n            val traceId = entity.id + \":match\"\n\n            val match = withTimeoutOrNull(PER_SOURCE_TIMEOUT_MS) {\n                tryMatchOne(source, request)\n            }\n            if (match == null) {\n                metrics.degradation(traceId, \"source_timeout_or_miss\")\n                continue\n            }\n\n            // 写入匹配记忆\n            dao.upsertBinding(\n                DanmakuBindingEntity(\n                    videoKey = videoKey,\n                    danmakuSourceId = entity.id,\n                    episodeId = match.episodeId,\n                    shift = match.shift,\n                    matchMethod = if (request.fileHash != null) \"HASH\" else \"TITLE\",\n                    boundAt = System.currentTimeMillis()\n                )\n            )\n            return Outcome.Matched(match, entity, videoKey)\n        }\n\n        return Outcome.NotMatched(videoKey)\n    }\n\n    /**\n     * 单源匹配：\n     * - 本地文件：先 POST /match（hash），失败转标题搜索\n     * - 在线影视：直接标题+集数搜索\n     */\n    private suspend fun tryMatchOne(source: IDanmakuSource, req: DanmakuMatchRequest): DanmakuMatch? {\n        // 本地文件路径：先哈希匹配\n        if (req.fileName != null && req.fileHash != null) {\n            val hashMatch = source.match(req)\n            if (hashMatch != null) return hashMatch\n        }\n\n        // 标题搜索兜底（在线影视主路径）\n        val results = source.search(req.title)\n        if (results.isEmpty()) return null\n        return pickBest(results, req.title, req.episode)\n    }\n\n    /**\n     * 4.10.3 多结果选取策略（策略单点定义，match 与 search 共用）：\n     * 标题完全一致 > 集数一致 > 第一个\n     */\n    fun pickBest(candidates: List<DanmakuMatch>, title: String, episode: Int?): DanmakuMatch? {\n        if (candidates.isEmpty()) return null\n        candidates.firstOrNull { it.animeTitle.equals(title, ignoreCase = true) }?.let { return it }\n        if (episode != null) {\n            candidates.firstOrNull { it.episodeTitle.contains(episode.toString()) }?.let { return it }\n        }\n        return candidates.first()\n    }\n\n    /**\n     * 4.10.4 拉取。首屏 from=0，duration=60s。\n     * 拉取失败静默重试 1 次，仍失败提示「弹幕加载失败」，不阻塞播放。\n     */\n    suspend fun fetchComments(\n        source: IDanmakuSource,\n        match: DanmakuMatch,\n        fromMs: Long,\n        shiftMs: Long = 0L\n    ): List<DanmakuEvent> {\n        val first = runCatching { source.getComments(match, fromMs, COMMENT_WINDOW_MS) }.getOrNull()\n        val events = first ?: runCatching { source.getComments(match, fromMs, COMMENT_WINDOW_MS) }.getOrNull()\n            ?: return emptyList()\n\n        // 时间轴对齐 + shift 偏移\n        return events.map { it.copy(timeMs = (it.timeMs + shiftMs).coerceAtLeast(0L)) }\n    }\n\n    /** 4.10.5 用户手动改选后覆盖绑定。 */\n    suspend fun bindManually(videoKey: String, sourceId: String, match: DanmakuMatch) {\n        dao.upsertBinding(\n            DanmakuBindingEntity(\n                videoKey = videoKey,\n                danmakuSourceId = sourceId,\n                episodeId = match.episodeId,\n                shift = match.shift,\n                matchMethod = \"MANUAL\",\n                boundAt = System.currentTimeMillis()\n            )\n        )\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuCanvasLayer.kt","lang":"kt","lines":142,"content":"package com.lanyue.reader.danmaku.render\n\nimport androidx.compose.foundation.Canvas\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableLongStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\nimport androidx.compose.runtime.withFrameNanos\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.TextStyle\nimport androidx.compose.ui.text.drawText\nimport androidx.compose.ui.text.rememberTextMeasurer\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport com.lanyue.reader.source.model.DanmakuEvent\n\n/**\n * 4.10.7 Canvas 弹幕层。\n *\n * 设计约束（对应 8.2 性能验收：同屏 200 条不掉帧）：\n * 1. 单 Canvas 绘制，每条弹幕不创建 Composable，避免组合层过载\n * 2. 文本测量结果按 text+size 缓存，循环内不再测量\n * 3. 轨道分配 O(轨道数)，滚动轨道记录\"尾部进入时刻\"判断可复用\n * 4. 超过 maxOnScreen 直接丢弃新弹幕，保帧优于保量\n * 5. 暂停时停止推进时钟，不空转\n *\n * 该层不处理屏蔽规则与去重（DanmakuFilter 已在上游完成），\n * 只负责\"给定事件列表 + 当前播放进度 -> 画面\"。\n */\n@Composable\nfun DanmakuCanvasLayer(\n    events: List<DanmakuEvent>,\n    positionMs: Long,\n    isPlaying: Boolean,\n    params: DanmakuRenderParams = DanmakuRenderParams.DEFAULT,\n    modifier: Modifier = Modifier\n) {\n    val textMeasurer = rememberTextMeasurer()\n    val style = remember(params) {\n        TextStyle(fontSize = (params.fontSizeSp * params.fontScale).sp)\n    }\n\n    // 时钟：仅在播放时推进，暂停即冻结，避免无意义重绘\n    var clockMs by remember { mutableLongStateOf(positionMs) }\n    LaunchedEffect(positionMs, isPlaying) {\n        clockMs = positionMs\n        if (!isPlaying) return@LaunchedEffect\n        val base = positionMs\n        val startNanos = withFrameNanos { it }\n        while (true) {\n            val now = withFrameNanos { it }\n            clockMs = base + (now - startNanos) / 1_000_000\n        }\n    }\n\n    Canvas(modifier = modifier) {\n        val areaHeight = size.height * params.displayAreaRatio\n        val top = params.topReservedDp.dp.toPx()\n        val bottom = areaHeight - params.bottomReservedDp.dp.toPx()\n        if (bottom <= top) return@Canvas\n\n        val lineHeight = style.fontSize.toPx() * params.lineSpacing\n        val trackCount = ((bottom - top) / lineHeight).toInt().coerceAtLeast(1)\n\n        // 滚动轨道尾部位置（用于判断能否复用轨道）\n        val scrollTail = FloatArray(trackCount) { 0f }\n        val topBusyUntil = LongArray(trackCount)\n        val bottomBusyUntil = LongArray(trackCount)\n\n        // 仅保留显示窗口内的事件：以 8 秒窗口为例，够覆盖一屏\n        val windowStart = clockMs - 1_000L\n        val windowEnd = clockMs + 800L\n\n        var drawn = 0\n        for (ev in events) {\n            if (drawn >= params.maxOnScreen) break\n            if (ev.timeMs < windowStart) continue\n            if (ev.timeMs > windowEnd) break\n\n            if (params.blockScroll && ev.mode == 1) continue\n            if (params.blockTop && ev.mode == 3) continue\n            if (params.blockBottom && ev.mode == 2) continue\n\n            val layout = textMeasurer.measure(\n                text = ev.text,\n                style = style,\n                maxLines = 1\n            )\n            val w = layout.size.width.toFloat()\n            val age = (clockMs - ev.timeMs) / 1000f\n            if (age < 0f) continue\n\n            val color = Color(0xFF000000.toInt() or (ev.color and 0xFFFFFF)).copy(alpha = params.opacity)\n\n            when (ev.mode) {\n                1 -> { // 滚动\n                    val travel = size.width + w\n                    val x = size.width - travel * (age * params.scrollSpeedPxPerSec / travel)\n                    if (x + w < 0f) continue\n                    val track = pickTrack(scrollTail, trackCount) { tail -> tail <= size.width - w }\n                    val y = top + track * lineHeight\n                    scrollTail[track] = x + w\n                    drawText(layout, color = color, topLeft = androidx.compose.ui.geometry.Offset(x, y))\n                }\n                2 -> { // 底部\n                    val x = (size.width - w) / 2f\n                    val track = pickTrackReverse(bottomBusyUntil, trackCount, ev.timeMs)\n                    if (track < 0) continue\n                    val y = bottom - (track + 1) * lineHeight\n                    drawText(layout, color = color, topLeft = androidx.compose.ui.geometry.Offset(x, y))\n                }\n                else -> { // 顶部\n                    val x = (size.width - w) / 2f\n                    val track = pickTrackForward(topBusyUntil, trackCount, ev.timeMs)\n                    if (track < 0) continue\n                    val y = top + track * lineHeight\n                    drawText(layout, color = color, topLeft = androidx.compose.ui.geometry.Offset(x, y))\n                }\n            }\n            drawn++\n        }\n    }\n}\n\n/** 找一条尾部在屏幕右侧之外的轨道，找不到就复用第 0 条（密度优先）。 */\nprivate fun pickTrack(tails: FloatArray, count: Int, ok: (Float) -> Boolean): Int {\n    for (i in 0 until count) if (ok(tails[i])) return i\n    return 0\n}\n\nprivate fun pickTrackForward(busy: LongArray, count: Int, nowMs: Long): Int {\n    for (i in 0 until count) if (busy[i] <= nowMs) { busy[i] = nowMs + 4000; return i }\n    return -1\n}\n\nprivate fun pickTrackReverse(busy: LongArray, count: Int, nowMs: Long): Int {\n    for (i in count - 1 downTo 0) if (busy[i] <= nowMs) { busy[i] = nowMs + 4000; return i }\n    return -1\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuFilter.kt","lang":"kt","lines":36,"content":"package com.lanyue.reader.danmaku.render\n\nimport com.lanyue.reader.source.model.DanmakuEvent\n\n/**\n * 4.10.7 屏蔽规则与合并重复。\n * 独立成类便于单测，且保证 UI 层不做过滤逻辑。\n */\nclass DanmakuFilter(private val params: DanmakuRenderParams) {\n\n    private val regexes = params.blockKeywords.map { Regex(Regex.escape(it), RegexOption.IGNORE_CASE) } +\n        params.blockRegexes.mapNotNull { runCatching { Regex(it) }.getOrNull() }\n\n    fun accept(event: DanmakuEvent): Boolean {\n        if (params.blockScroll && event.mode == 1) return false\n        if (params.blockTop && event.mode == 3) return false\n        if (params.blockBottom && event.mode == 2) return false\n        if (event.text.isBlank()) return false\n        if (regexes.any { it.containsMatchIn(event.text) }) return false\n        return true\n    }\n\n    /** 合并重复：同一时刻同一文本只保留一条。 */\n    fun dedupe(events: List<DanmakuEvent>): List<DanmakuEvent> {\n        if (!params.mergeDuplicates) return events\n        val seen = HashSet<String>()\n        return events.filter { ev ->\n            val key = ev.timeMs.toString() + \"|\" + ev.text\n            seen.add(key)\n        }\n    }\n\n    fun apply(events: List<DanmakuEvent>): List<DanmakuEvent> =\n        dedupe(events.filter { accept(it) })\n            .sortedBy { it.timeMs }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuFormatConverter.kt","lang":"kt","lines":60,"content":"package com.lanyue.reader.danmaku.render\n\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport org.xmlpull.v1.XmlPullParser\nimport org.xmlpull.v1.XmlPullParserFactory\nimport java.io.StringReader\n\n/**\n * 4.10.8 格式转换器。\n * - B 站 XML / AcFun XML -> DanmakuEvent\n * - p 格式：出现时间(秒,浮点),弹幕模式,颜色,[来源]用户ID；模式 1=滚动 2=底部 3=顶部\n */\nobject DanmakuFormatConverter {\n\n    /**\n     * B 站 / AcFun XML。\n     * <d p=\"time,mode,color,uid,...\">text</d>\n     */\n    fun fromXml(xml: String): List<DanmakuEvent> = runCatching {\n        val factory = XmlPullParserFactory.newInstance()\n        factory.isNamespaceAware = false\n        val parser = factory.newPullParser()\n        parser.setInput(StringReader(xml))\n\n        val out = mutableListOf<DanmakuEvent>()\n        var event = parser.eventType\n        while (event != XmlPullParser.END_DOCUMENT) {\n            if (event == XmlPullParser.START_TAG && parser.name.equals(\"d\", ignoreCase = true)) {\n                val p = parser.getAttributeValue(null, \"p\")\n                val text = parser.nextText()\n                if (p != null) parseP(p, text)?.let { out.add(it) }\n            }\n            event = parser.next()\n        }\n        out\n    }.getOrDefault(emptyList())\n\n    /** p 格式解析。 */\n    fun parseP(p: String, text: String): DanmakuEvent? {\n        val parts = p.split(\",\")\n        if (parts.size < 3) return null\n        val seconds = parts[0].toDoubleOrNull() ?: return null\n        val mode = normalizeMode(parts[1].toIntOrNull() ?: 1)\n        val color = parts[2].toLongOrNull()?.toInt() ?: 0xFFFFFF\n        return DanmakuEvent(\n            timeMs = (seconds * 1000).toLong(),\n            mode = mode,\n            color = color,\n            text = text\n        )\n    }\n\n    /** B 站 mode：1/2/3 滚动, 4 底部, 5 顶部 -> 内部 1 滚动 / 2 底部 / 3 顶部。 */\n    private fun normalizeMode(raw: Int): Int = when (raw) {\n        4 -> 2\n        5 -> 3\n        in 1..3 -> 1\n        else -> 1\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuRenderParams.kt","lang":"kt","lines":34,"content":"package com.lanyue.reader.danmaku.render\n\n/**\n * 4.10.7 渲染参数。\n * 速度、不透明度、字号缩放、显示区域、顶部/底部保留区、同屏密度、合并重复、屏蔽规则。\n */\ndata class DanmakuRenderParams(\n    /** 滚动速度：每秒横穿屏幕的屏幕宽度倍数 */\n    val scrollSpeedPxPerSec: Float = 240f,\n    val opacity: Float = 0.9f,\n    val fontSizeSp: Float = 15f,\n    val fontScale: Float = 1f,\n    /** 显示区域占屏幕高度的比例（0~1） */\n    val displayAreaRatio: Float = 1f,\n    val topReservedDp: Int = 0,\n    val bottomReservedDp: Int = 40,\n    /** 同屏最大条数，超出丢弃（保帧） */\n    val maxOnScreen: Int = 200,\n    val mergeDuplicates: Boolean = true,\n    /** 屏蔽规则：关键词 */\n    val blockKeywords: List<String> = emptyList(),\n    /** 屏蔽规则：正则 */\n    val blockRegexes: List<String> = emptyList(),\n    val blockScroll: Boolean = false,\n    val blockTop: Boolean = false,\n    val blockBottom: Boolean = false,\n    /** 轨道行高倍数 */\n    val lineSpacing: Float = 1.2f\n) {\n    companion object {\n        /** 8.2 验收：中端机 60fps，同屏 200 条无掉帧。 */\n        val DEFAULT = DanmakuRenderParams()\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/backup/BackupCodec.kt","lang":"kt","lines":558,"content":"package com.lanyue.reader.data.backup\n\nimport com.google.gson.JsonArray\nimport com.google.gson.JsonElement\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\n\n/**\n * 备份编解码。\n *\n * 刻意不用 Gson 的对象映射（toJson/fromJson）而是手写字段读写，原因：\n * - Gson 反射反序列化会忽略 Kotlin 默认值，老备份缺字段时得到 null/0 而不是默认值；\n * - 备份是长期契约，字段读写必须显式可控，才能给出\"哪个字段坏了\"的精确告警；\n * - 需要逐字段容错：单条记录损坏不应让整份备份失败。\n */\nobject BackupCodec {\n\n    /** 解码结果。 */\n    sealed class DecodeResult {\n        /** 成功。[warnings] 是逐字段/逐条记录级的容错提示，不影响可用性。 */\n        data class Success(val document: BackupDocument, val warnings: List<String>) : DecodeResult()\n\n        /** 失败，[reason] 是可直接展示给用户的中文原因。 */\n        data class Failure(val reason: String) : DecodeResult()\n    }\n\n    // ============================ 编码 ============================\n\n    /**\n     * 导出为 JSON 文本。\n     * 顺序固定为 meta 在前，便于人工查看与 diff。\n     */\n    fun encode(\n        payload: BackupPayload,\n        exportedAt: Long,\n        appVersion: String = \"\"\n    ): String {\n        val root = JsonObject()\n        val meta = JsonObject()\n        meta.addProperty(\"format\", BackupFormat.FORMAT_ID)\n        meta.addProperty(\"schemaVersion\", BackupFormat.SCHEMA_VERSION)\n        meta.addProperty(\"exportedAt\", exportedAt)\n        meta.addProperty(\"appVersion\", appVersion)\n        meta.addProperty(\"checksum\", checksumOf(payload))\n        root.add(\"meta\", meta)\n\n        val body = JsonObject()\n        body.add(\"books\", arrayOf(payload.books) { b ->\n            obj {\n                str(\"bookUrl\", b.bookUrl)\n                str(\"name\", b.name)\n                strOrNull(\"author\", b.author)\n                strOrNull(\"cover\", b.cover)\n                strOrNull(\"intro\", b.intro)\n                str(\"origin\", b.origin)\n                strOrNull(\"originName\", b.originName)\n                num(\"sourceType\", b.sourceType)\n                str(\"groupName\", b.groupName)\n                strOrNull(\"latestChapter\", b.latestChapter)\n                num(\"totalChapter\", b.totalChapter)\n                num(\"lastReadAt\", b.lastReadAt)\n                num(\"sortOrder\", b.sortOrder)\n            }\n        })\n        body.add(\"bookSources\", arrayOf(payload.bookSources) { s ->\n            obj {\n                str(\"bookSourceUrl\", s.bookSourceUrl)\n                str(\"bookSourceName\", s.bookSourceName)\n                strOrNull(\"bookSourceGroup\", s.bookSourceGroup)\n                num(\"bookSourceType\", s.bookSourceType)\n                bool(\"enabled\", s.enabled)\n                bool(\"enabledExplore\", s.enabledExplore)\n                strOrNull(\"searchUrl\", s.searchUrl)\n                strOrNull(\"ruleSearch\", s.ruleSearch)\n                strOrNull(\"exploreUrl\", s.exploreUrl)\n                strOrNull(\"ruleExplore\", s.ruleExplore)\n                strOrNull(\"ruleToc\", s.ruleToc)\n                strOrNull(\"ruleContent\", s.ruleContent)\n                strOrNull(\"ruleBookInfo\", s.ruleBookInfo)\n                strOrNull(\"header\", s.header)\n                strOrNull(\"loginUrl\", s.loginUrl)\n                strOrNull(\"jsLib\", s.jsLib)\n                num(\"lastUpdateTime\", s.lastUpdateTime)\n                strOrNull(\"userEditedFields\", s.userEditedFields)\n            }\n        })\n        body.add(\"rssSources\", arrayOf(payload.rssSources) { s ->\n            obj {\n                str(\"sourceUrl\", s.sourceUrl)\n                str(\"sourceName\", s.sourceName)\n                strOrNull(\"sourceIcon\", s.sourceIcon)\n                strOrNull(\"sourceGroup\", s.sourceGroup)\n                bool(\"enabled\", s.enabled)\n                strOrNull(\"sortUrl\", s.sortUrl)\n                strOrNull(\"ruleArticles\", s.ruleArticles)\n                strOrNull(\"ruleTitle\", s.ruleTitle)\n                strOrNull(\"ruleLink\", s.ruleLink)\n                strOrNull(\"rulePubDate\", s.rulePubDate)\n                strOrNull(\"ruleContent\", s.ruleContent)\n                num(\"type\", s.type)\n                strOrNull(\"searchUrl\", s.searchUrl)\n                num(\"customOrder\", s.customOrder)\n                num(\"lastUpdateTime\", s.lastUpdateTime)\n            }\n        })\n        body.add(\"videoSites\", arrayOf(payload.videoSites) { s ->\n            obj {\n                str(\"configUrl\", s.configUrl)\n                str(\"siteKey\", s.siteKey)\n                str(\"name\", s.name)\n                num(\"type\", s.type)\n                str(\"api\", s.api)\n                strOrNull(\"ext\", s.ext)\n                bool(\"enabled\", s.enabled)\n                bool(\"searchable\", s.searchable)\n            }\n        })\n        body.add(\"readRecords\", arrayOf(payload.readRecords) { r ->\n            obj {\n                str(\"bookUrl\", r.bookUrl)\n                num(\"chapterIndex\", r.chapterIndex)\n                strOrNull(\"chapterTitle\", r.chapterTitle)\n                strOrNull(\"chapterUrl\", r.chapterUrl)\n                num(\"position\", r.position)\n                num(\"updatedAt\", r.updatedAt)\n            }\n        })\n        body.add(\"playRecords\", arrayOf(payload.playRecords) { r ->\n            obj {\n                str(\"videoKey\", r.videoKey)\n                str(\"title\", r.title)\n                num(\"episodeIndex\", r.episodeIndex)\n                num(\"positionMs\", r.positionMs)\n                num(\"durationMs\", r.durationMs)\n                num(\"updatedAt\", r.updatedAt)\n            }\n        })\n        body.add(\"rssFavorites\", arrayOf(payload.rssFavorites) { f ->\n            obj {\n                str(\"articleUrl\", f.articleUrl)\n                str(\"title\", f.title)\n                str(\"sourceUrl\", f.sourceUrl)\n                strOrNull(\"cover\", f.cover)\n                numOrNull(\"pubDate\", f.pubDate)\n                num(\"savedAt\", f.savedAt)\n            }\n        })\n        body.add(\"videoFavorites\", arrayOf(payload.videoFavorites) { f ->\n            obj {\n                str(\"videoUrl\", f.videoUrl)\n                str(\"title\", f.title)\n                str(\"configUrl\", f.configUrl)\n                str(\"siteKey\", f.siteKey)\n                strOrNull(\"cover\", f.cover)\n                num(\"savedAt\", f.savedAt)\n            }\n        })\n        root.add(\"data\", body)\n        return root.toString()\n    }\n\n    // ============================ 解码 ============================\n\n    /**\n     * 解析 JSON 文本。\n     *\n     * 容错策略：\n     * - 格式标记不符 / 版本过高 -> 整体失败（继续读没有意义）\n     * - 某一块缺失或类型不对 -> 该块当空，记一条告警\n     * - 某条记录主键为空 -> 跳过该条，记一条告警\n     * - checksum 不匹配 -> 仍返回数据，但告警提示\"可能被改过\"\n     */\n    fun decode(raw: String?): DecodeResult {\n        if (raw.isNullOrBlank()) return DecodeResult.Failure(\"备份内容为空\")\n        if (raw.length > BackupFormat.MAX_BYTES) {\n            return DecodeResult.Failure(\"备份文件过大，超过 8 MiB\")\n        }\n\n        val root: JsonElement = try {\n            JsonParser.parseString(raw)\n        } catch (e: Throwable) {\n            return DecodeResult.Failure(\"备份不是合法 JSON：\" + (e.message ?: \"\"))\n        }\n        if (!root.isJsonObject) return DecodeResult.Failure(\"备份根节点不是对象\")\n        val rootObj = root.asJsonObject\n\n        val metaObj = rootObj.get(\"meta\")?.takeIf { it.isJsonObject }?.asJsonObject\n            ?: return DecodeResult.Failure(\"备份缺少 meta 段\")\n        val format = metaObj.stringOrNull(\"format\")\n        if (format != BackupFormat.FORMAT_ID) {\n            return DecodeResult.Failure(\"不是蓝阅的备份文件（格式标记：\" + (format ?: \"无\") + \"）\")\n        }\n        val version = (metaObj.get(\"schemaVersion\")?.takeIf { it.isJsonPrimitive }?.asInt) ?: -1\n        if (version < BackupFormat.MIN_READABLE_VERSION) {\n            return DecodeResult.Failure(\"备份版本过旧（v$version），当前最低支持 v\" +\n                BackupFormat.MIN_READABLE_VERSION)\n        }\n        if (version > BackupFormat.SCHEMA_VERSION) {\n            return DecodeResult.Failure(\n                \"备份版本过新（v$version），请升级应用后再导入\"\n            )\n        }\n\n        val meta = BackupMeta(\n            format = BackupFormat.FORMAT_ID,\n            schemaVersion = version,\n            exportedAt = metaObj.get(\"exportedAt\")?.takeIf { it.isJsonPrimitive }?.asLong ?: 0L,\n            appVersion = metaObj.stringOrNull(\"appVersion\") ?: \"\",\n            checksum = metaObj.stringOrNull(\"checksum\") ?: \"\"\n        )\n\n        val warnings = ArrayList<String>()\n        val data = rootObj.get(\"data\")?.takeIf { it.isJsonObject }?.asJsonObject\n        if (data == null) {\n            warnings.add(\"备份缺少 data 段，导入后将没有任何数据\")\n            return DecodeResult.Success(BackupDocument(meta, BackupPayload()), warnings)\n        }\n\n        fun section(name: String): JsonArray? {\n            val el = data.get(name) ?: return JsonArray()\n            if (!el.isJsonArray) {\n                warnings.add(\"字段 $name 类型错误，已忽略\")\n                return JsonArray()\n            }\n            val arr = el.asJsonArray\n            if (arr.size() > BackupFormat.MAX_ITEMS_PER_SECTION) {\n                warnings.add(\"字段 $name 条目过多，仅读取前 \" + BackupFormat.MAX_ITEMS_PER_SECTION + \" 条\")\n                val cut = JsonArray()\n                for (i in 0 until BackupFormat.MAX_ITEMS_PER_SECTION) cut.add(arr.get(i))\n                return cut\n            }\n            return arr\n        }\n\n        val books = ArrayList<BookBackup>()\n        eachObj(section(\"books\"), \"books\", warnings) { o ->\n            val url = o.stringOrNull(\"bookUrl\").orEmpty()\n            if (url.isBlank()) return@eachObj false\n            books.add(\n                BookBackup(\n                    bookUrl = url,\n                    name = o.stringOrNull(\"name\") ?: \"\",\n                    author = o.stringOrNull(\"author\"),\n                    cover = o.stringOrNull(\"cover\"),\n                    intro = o.stringOrNull(\"intro\"),\n                    origin = o.stringOrNull(\"origin\") ?: \"\",\n                    originName = o.stringOrNull(\"originName\"),\n                    sourceType = o.intOr(\"sourceType\", 0),\n                    groupName = o.stringOrNull(\"groupName\") ?: \"全部\",\n                    latestChapter = o.stringOrNull(\"latestChapter\"),\n                    totalChapter = o.intOr(\"totalChapter\", 0),\n                    lastReadAt = o.longOr(\"lastReadAt\", 0),\n                    sortOrder = o.intOr(\"sortOrder\", 0)\n                )\n            )\n            true\n        }\n\n        val bookSources = ArrayList<BookSourceBackup>()\n        eachObj(section(\"bookSources\"), \"bookSources\", warnings) { o ->\n            val url = o.stringOrNull(\"bookSourceUrl\").orEmpty()\n            if (url.isBlank()) return@eachObj false\n            bookSources.add(\n                BookSourceBackup(\n                    bookSourceUrl = url,\n                    bookSourceName = o.stringOrNull(\"bookSourceName\") ?: \"\",\n                    bookSourceGroup = o.stringOrNull(\"bookSourceGroup\"),\n                    bookSourceType = o.intOr(\"bookSourceType\", 0),\n                    enabled = o.boolOr(\"enabled\", true),\n                    enabledExplore = o.boolOr(\"enabledExplore\", false),\n                    searchUrl = o.stringOrNull(\"searchUrl\"),\n                    ruleSearch = o.stringOrNull(\"ruleSearch\"),\n                    exploreUrl = o.stringOrNull(\"exploreUrl\"),\n                    ruleExplore = o.stringOrNull(\"ruleExplore\"),\n                    ruleToc = o.stringOrNull(\"ruleToc\"),\n                    ruleContent = o.stringOrNull(\"ruleContent\"),\n                    ruleBookInfo = o.stringOrNull(\"ruleBookInfo\"),\n                    header = o.stringOrNull(\"header\"),\n                    loginUrl = o.stringOrNull(\"loginUrl\"),\n                    jsLib = o.stringOrNull(\"jsLib\"),\n                    lastUpdateTime = o.longOr(\"lastUpdateTime\", 0),\n                    userEditedFields = o.stringOrNull(\"userEditedFields\")\n                )\n            )\n            true\n        }\n\n        val rssSources = ArrayList<RssSourceBackup>()\n        eachObj(section(\"rssSources\"), \"rssSources\", warnings) { o ->\n            val url = o.stringOrNull(\"sourceUrl\").orEmpty()\n            if (url.isBlank()) return@eachObj false\n            rssSources.add(\n                RssSourceBackup(\n                    sourceUrl = url,\n                    sourceName = o.stringOrNull(\"sourceName\") ?: \"\",\n                    sourceIcon = o.stringOrNull(\"sourceIcon\"),\n                    sourceGroup = o.stringOrNull(\"sourceGroup\"),\n                    enabled = o.boolOr(\"enabled\", true),\n                    sortUrl = o.stringOrNull(\"sortUrl\"),\n                    ruleArticles = o.stringOrNull(\"ruleArticles\"),\n                    ruleTitle = o.stringOrNull(\"ruleTitle\"),\n                    ruleLink = o.stringOrNull(\"ruleLink\"),\n                    rulePubDate = o.stringOrNull(\"rulePubDate\"),\n                    ruleContent = o.stringOrNull(\"ruleContent\"),\n                    type = o.intOr(\"type\", 0),\n                    searchUrl = o.stringOrNull(\"searchUrl\"),\n                    customOrder = o.intOr(\"customOrder\", 0),\n                    lastUpdateTime = o.longOr(\"lastUpdateTime\", 0)\n                )\n            )\n            true\n        }\n\n        val videoSites = ArrayList<VideoSiteBackup>()\n        eachObj(section(\"videoSites\"), \"videoSites\", warnings) { o ->\n            val config = o.stringOrNull(\"configUrl\").orEmpty()\n            val key = o.stringOrNull(\"siteKey\").orEmpty()\n            if (config.isBlank() || key.isBlank()) return@eachObj false\n            videoSites.add(\n                VideoSiteBackup(\n                    configUrl = config,\n                    siteKey = key,\n                    name = o.stringOrNull(\"name\") ?: \"\",\n                    type = o.intOr(\"type\", 1),\n                    api = o.stringOrNull(\"api\") ?: \"\",\n                    ext = o.stringOrNull(\"ext\"),\n                    enabled = o.boolOr(\"enabled\", true),\n                    searchable = o.boolOr(\"searchable\", true)\n                )\n            )\n            true\n        }\n\n        val readRecords = ArrayList<ReadRecordBackup>()\n        eachObj(section(\"readRecords\"), \"readRecords\", warnings) { o ->\n            val url = o.stringOrNull(\"bookUrl\").orEmpty()\n            if (url.isBlank()) return@eachObj false\n            readRecords.add(\n                ReadRecordBackup(\n                    bookUrl = url,\n                    chapterIndex = o.intOr(\"chapterIndex\", 0),\n                    chapterTitle = o.stringOrNull(\"chapterTitle\"),\n                    chapterUrl = o.stringOrNull(\"chapterUrl\"),\n                    position = o.intOr(\"position\", 0),\n                    updatedAt = o.longOr(\"updatedAt\", 0)\n                )\n            )\n            true\n        }\n\n        val playRecords = ArrayList<PlayRecordBackup>()\n        eachObj(section(\"playRecords\"), \"playRecords\", warnings) { o ->\n            val key = o.stringOrNull(\"videoKey\").orEmpty()\n            if (key.isBlank()) return@eachObj false\n            playRecords.add(\n                PlayRecordBackup(\n                    videoKey = key,\n                    title = o.stringOrNull(\"title\") ?: \"\",\n                    episodeIndex = o.intOr(\"episodeIndex\", 0),\n                    positionMs = o.longOr(\"positionMs\", 0),\n                    durationMs = o.longOr(\"durationMs\", 0),\n                    updatedAt = o.longOr(\"updatedAt\", 0)\n                )\n            )\n            true\n        }\n\n        val rssFavorites = ArrayList<RssFavoriteBackup>()\n        eachObj(section(\"rssFavorites\"), \"rssFavorites\", warnings) { o ->\n            val url = o.stringOrNull(\"articleUrl\").orEmpty()\n            if (url.isBlank()) return@eachObj false\n            rssFavorites.add(\n                RssFavoriteBackup(\n                    articleUrl = url,\n                    title = o.stringOrNull(\"title\") ?: \"\",\n                    sourceUrl = o.stringOrNull(\"sourceUrl\") ?: \"\",\n                    cover = o.stringOrNull(\"cover\"),\n                    pubDate = o.longOrNull(\"pubDate\"),\n                    savedAt = o.longOr(\"savedAt\", 0)\n                )\n            )\n            true\n        }\n\n        val videoFavorites = ArrayList<VideoFavoriteBackup>()\n        eachObj(section(\"videoFavorites\"), \"videoFavorites\", warnings) { o ->\n            val url = o.stringOrNull(\"videoUrl\").orEmpty()\n            if (url.isBlank()) return@eachObj false\n            videoFavorites.add(\n                VideoFavoriteBackup(\n                    videoUrl = url,\n                    title = o.stringOrNull(\"title\") ?: \"\",\n                    configUrl = o.stringOrNull(\"configUrl\") ?: \"\",\n                    siteKey = o.stringOrNull(\"siteKey\") ?: \"\",\n                    cover = o.stringOrNull(\"cover\"),\n                    savedAt = o.longOr(\"savedAt\", 0)\n                )\n            )\n            true\n        }\n\n        val payload = BackupPayload(\n            books = books,\n            bookSources = bookSources,\n            rssSources = rssSources,\n            videoSites = videoSites,\n            readRecords = readRecords,\n            playRecords = playRecords,\n            rssFavorites = rssFavorites,\n            videoFavorites = videoFavorites\n        )\n\n        // 校验和：不匹配不阻断导入（用户可能手工编辑过），但要明确告警\n        if (meta.checksum.isNotBlank() && meta.checksum != checksumOf(payload)) {\n            warnings.add(\"内容摘要与 meta 不一致，备份可能被修改或截断\")\n        }\n        return DecodeResult.Success(BackupDocument(meta, payload), warnings)\n    }\n\n    // ============================ 校验和 ============================\n\n    /**\n     * 内容摘要：对\"各段条目数 + 每段首尾主键\"做 FNV-1a 32 位散列。\n     *\n     * 不逐字节哈希全文是刻意的：备份允许字段顺序/空白差异，\n     * 这里只关心\"结构规模与边界是否一致\"，能发现截断与替换，又不受格式化影响。\n     */\n    fun checksumOf(payload: BackupPayload): String {\n        val sb = StringBuilder()\n        sb.append(payload.books.size).append('|')\n            .append(payload.books.firstOrNull()?.bookUrl.orEmpty()).append('|')\n            .append(payload.books.lastOrNull()?.bookUrl.orEmpty()).append('|')\n        sb.append(payload.bookSources.size).append('|')\n            .append(payload.bookSources.firstOrNull()?.bookSourceUrl.orEmpty()).append('|')\n            .append(payload.bookSources.lastOrNull()?.bookSourceUrl.orEmpty()).append('|')\n        sb.append(payload.rssSources.size).append('|')\n            .append(payload.rssSources.firstOrNull()?.sourceUrl.orEmpty()).append('|')\n            .append(payload.rssSources.lastOrNull()?.sourceUrl.orEmpty()).append('|')\n        sb.append(payload.videoSites.size).append('|')\n            .append(payload.videoSites.firstOrNull()?.siteKey.orEmpty()).append('|')\n            .append(payload.videoSites.lastOrNull()?.siteKey.orEmpty()).append('|')\n        sb.append(payload.readRecords.size).append('|')\n            .append(payload.readRecords.firstOrNull()?.bookUrl.orEmpty()).append('|')\n            .append(payload.readRecords.lastOrNull()?.bookUrl.orEmpty()).append('|')\n        sb.append(payload.playRecords.size).append('|')\n            .append(payload.playRecords.firstOrNull()?.videoKey.orEmpty()).append('|')\n            .append(payload.playRecords.lastOrNull()?.videoKey.orEmpty()).append('|')\n        sb.append(payload.rssFavorites.size).append('|')\n            .append(payload.rssFavorites.firstOrNull()?.articleUrl.orEmpty()).append('|')\n            .append(payload.rssFavorites.lastOrNull()?.articleUrl.orEmpty()).append('|')\n        sb.append(payload.videoFavorites.size).append('|')\n            .append(payload.videoFavorites.firstOrNull()?.videoUrl.orEmpty()).append('|')\n            .append(payload.videoFavorites.lastOrNull()?.videoUrl.orEmpty())\n\n        var hash = 0x811C9DC5.toInt()\n        for (ch in sb.toString()) {\n            hash = hash xor ch.code\n            hash *= 0x01000193\n        }\n        return java.lang.String.format(\"%08x\", hash)\n    }\n\n    // ============================ 内部工具 ============================\n\n    private inline fun obj(block: JsonObject.() -> Unit): JsonObject =\n        JsonObject().apply(block)\n\n    private fun <T> arrayOf(items: List<T>, mapper: (T) -> JsonObject): JsonArray {\n        val arr = JsonArray()\n        items.forEach { arr.add(mapper(it)) }\n        return arr\n    }\n\n    private fun JsonObject.str(key: String, value: String) = addProperty(key, value)\n\n    private fun JsonObject.strOrNull(key: String, value: String?) {\n        if (value == null) add(key, com.google.gson.JsonNull.INSTANCE) else addProperty(key, value)\n    }\n\n    private fun JsonObject.num(key: String, value: Int) = addProperty(key, value)\n\n    private fun JsonObject.num(key: String, value: Long) = addProperty(key, value)\n\n    private fun JsonObject.numOrNull(key: String, value: Long?) {\n        if (value == null) add(key, com.google.gson.JsonNull.INSTANCE) else addProperty(key, value)\n    }\n\n    private fun JsonObject.bool(key: String, value: Boolean) = addProperty(key, value)\n\n    private fun JsonObject.stringOrNull(key: String): String? {\n        val el = get(key) ?: return null\n        if (el.isJsonNull || !el.isJsonPrimitive) return null\n        return try {\n            el.asString\n        } catch (e: Throwable) {\n            null\n        }\n    }\n\n    private fun JsonObject.intOr(key: String, def: Int): Int {\n        val el = get(key) ?: return def\n        if (!el.isJsonPrimitive) return def\n        return try {\n            el.asInt\n        } catch (e: Throwable) {\n            def\n        }\n    }\n\n    private fun JsonObject.longOr(key: String, def: Long): Long {\n        val el = get(key) ?: return def\n        if (!el.isJsonPrimitive) return def\n        return try {\n            el.asLong\n        } catch (e: Throwable) {\n            def\n        }\n    }\n\n    private fun JsonObject.longOrNull(key: String): Long? {\n        val el = get(key) ?: return null\n        if (!el.isJsonPrimitive) return null\n        return try {\n            el.asLong\n        } catch (e: Throwable) {\n            null\n        }\n    }\n\n    private fun JsonObject.boolOr(key: String, def: Boolean): Boolean {\n        val el = get(key) ?: return def\n        if (!el.isJsonPrimitive) return def\n        return try {\n            el.asBoolean\n        } catch (e: Throwable) {\n            def\n        }\n    }\n\n    /** 遍历数组里的对象元素；返回 false 表示该条被跳过（已记告警）。 */\n    private inline fun eachObj(\n        arr: JsonArray?,\n        sectionName: String,\n        warnings: MutableList<String>,\n        handler: (JsonObject) -> Boolean\n    ) {\n        if (arr == null) return\n        var skipped = 0\n        arr.forEach { el ->\n            if (!el.isJsonObject) {\n                skipped++\n                return@forEach\n            }\n            if (!handler(el.asJsonObject)) skipped++\n        }\n        if (skipped > 0) warnings.add(\"$sectionName 中有 $skipped 条缺少主键被跳过\")\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/backup/BackupMerger.kt","lang":"kt","lines":223,"content":"package com.lanyue.reader.data.backup\n\n/**\n * 导入时的冲突处理策略。\n *\n * 三个选项对应设置页里的三条文案，用户不需要理解数据库：\n * - [KEEP_LOCAL]    \"保留本机，只补缺\"：本机没有的才写入。\n * - [OVERWRITE]     \"以备份为准\"：备份有的全部覆盖。\n * - [KEEP_NEWER]    \"按时间取新\"：比较 updatedAt，谁新用谁（默认，最不容易丢进度）。\n */\nenum class MergeMode(val id: String, val label: String) {\n    KEEP_LOCAL(\"keep_local\", \"保留本机，只补缺\"),\n    OVERWRITE(\"overwrite\", \"以备份为准\"),\n    KEEP_NEWER(\"keep_newer\", \"按时间取新\");\n\n    companion object {\n        val Default = KEEP_NEWER\n\n        fun fromId(id: String?): MergeMode =\n            entries.firstOrNull { it.id == id } ?: Default\n    }\n}\n\n/** 合并结果。 */\ndata class MergeOutcome<T>(\n    /** 需要写入数据库的记录（已按主键去重）。 */\n    val toWrite: List<T>,\n    /** 因冲突/策略被跳过的条数。 */\n    val skipped: Int,\n    /** 备份内自身重复而去重的条数。 */\n    val deduped: Int\n) {\n    val written: Int get() = toWrite.size\n    val total: Int get() = toWrite.size + skipped\n}\n\n/** 各段合并统计，供导入结果页展示。 */\ndata class MergeReport(\n    val books: MergeOutcome<BookBackup> = MergeOutcome(emptyList(), 0, 0),\n    val bookSources: MergeOutcome<BookSourceBackup> = MergeOutcome(emptyList(), 0, 0),\n    val rssSources: MergeOutcome<RssSourceBackup> = MergeOutcome(emptyList(), 0, 0),\n    val videoSites: MergeOutcome<VideoSiteBackup> = MergeOutcome(emptyList(), 0, 0),\n    val readRecords: MergeOutcome<ReadRecordBackup> = MergeOutcome(emptyList(), 0, 0),\n    val playRecords: MergeOutcome<PlayRecordBackup> = MergeOutcome(emptyList(), 0, 0),\n    val rssFavorites: MergeOutcome<RssFavoriteBackup> = MergeOutcome(emptyList(), 0, 0),\n    val videoFavorites: MergeOutcome<VideoFavoriteBackup> = MergeOutcome(emptyList(), 0, 0)\n) {\n    val totalWritten: Int\n        get() = books.written + bookSources.written + rssSources.written + videoSites.written +\n            readRecords.written + playRecords.written + rssFavorites.written +\n            videoFavorites.written\n\n    val totalSkipped: Int\n        get() = books.skipped + bookSources.skipped + rssSources.skipped + videoSites.skipped +\n            readRecords.skipped + playRecords.skipped + rssFavorites.skipped +\n            videoFavorites.skipped\n\n    /** 一句话结论，直接放到结果页顶部。 */\n    fun summary(): String = when {\n        totalWritten == 0 && totalSkipped == 0 -> \"备份里没有可导入的数据\"\n        totalWritten == 0 -> \"全部 $totalSkipped 项被跳过，本机数据未变\"\n        totalSkipped == 0 -> \"已导入 $totalWritten 项\"\n        else -> \"已导入 $totalWritten 项，跳过 $totalSkipped 项\"\n    }\n}\n\n/**\n * 备份合并器。\n *\n * 全部是纯函数：不碰数据库、不碰文件，输入\"本机有什么\"和\"备份有什么\"，\n * 输出\"应该写什么\"。这样导入逻辑可以在 JVM 单测里跑完整分支，\n * 也便于将来把\"导入预览\"做成一屏可勾选的差异列表。\n */\nobject BackupMerger {\n\n    /**\n     * 通用合并。\n     *\n     * @param localKeys        本机已有主键 -> 本机记录的 updatedAt（用于比新旧）\n     * @param incoming         备份里的记录\n     * @param keyOf            取主键\n     * @param updatedAtOf      取更新时间；不参与比较的段落传常量 0\n     * @param mode             冲突策略\n     * @param protectedKeys    不允许被覆盖的本机主键（例如用户手工改过的书源）\n     */\n    fun <T> merge(\n        localKeys: Map<String, Long>,\n        incoming: List<T>,\n        keyOf: (T) -> String,\n        updatedAtOf: (T) -> Long,\n        mode: MergeMode = MergeMode.Default,\n        protectedKeys: Set<String> = emptySet()\n    ): MergeOutcome<T> {\n        // 备份内部先按主键去重：同一份文件里重复的条目以后出现的为准\n        val deduped = LinkedHashMap<String, T>()\n        var dupCount = 0\n        incoming.forEach { item ->\n            val key = keyOf(item)\n            if (key.isBlank()) {\n                dupCount++\n                return@forEach\n            }\n            if (deduped.put(key, item) != null) dupCount++\n        }\n\n        val toWrite = ArrayList<T>()\n        var skipped = 0\n        deduped.forEach { (key, item) ->\n            val localUpdatedAt = localKeys[key]\n            if (localUpdatedAt == null) {\n                // 本机没有：任何策略下都写入\n                toWrite.add(item)\n                return@forEach\n            }\n            // 本机已有，进入冲突处理\n            if (key in protectedKeys) {\n                skipped++\n                return@forEach\n            }\n            when (mode) {\n                MergeMode.KEEP_LOCAL -> skipped++\n                MergeMode.OVERWRITE -> toWrite.add(item)\n                MergeMode.KEEP_NEWER -> {\n                    if (updatedAtOf(item) > localUpdatedAt) toWrite.add(item) else skipped++\n                }\n            }\n        }\n        return MergeOutcome(toWrite, skipped, dupCount)\n    }\n\n    /** 合并整份备份。参数是本机现状的轻量快照，避免把 DAO 传进来。 */\n    fun mergeAll(\n        payload: BackupPayload,\n        local: LocalSnapshot,\n        mode: MergeMode = MergeMode.Default\n    ): MergeReport = MergeReport(\n        books = merge(\n            localKeys = local.books,\n            incoming = payload.books,\n            keyOf = { it.bookUrl },\n            updatedAtOf = { it.lastReadAt },\n            mode = mode\n        ),\n        bookSources = merge(\n            localKeys = local.bookSources,\n            incoming = payload.bookSources,\n            keyOf = { it.bookSourceUrl },\n            updatedAtOf = { it.lastUpdateTime },\n            mode = mode,\n            // 用户手工改过的书源不允许被备份覆盖，否则调好的规则会丢\n            protectedKeys = local.userEditedBookSources\n        ),\n        rssSources = merge(\n            localKeys = local.rssSources,\n            incoming = payload.rssSources,\n            keyOf = { it.sourceUrl },\n            updatedAtOf = { it.lastUpdateTime },\n            mode = mode\n        ),\n        videoSites = merge(\n            localKeys = local.videoSites,\n            incoming = payload.videoSites,\n            keyOf = { siteKeyOf(it.configUrl, it.siteKey) },\n            updatedAtOf = { 0L },\n            mode = mode\n        ),\n        readRecords = merge(\n            localKeys = local.readRecords,\n            incoming = payload.readRecords,\n            keyOf = { it.bookUrl },\n            updatedAtOf = { it.updatedAt },\n            mode = mode\n        ),\n        playRecords = merge(\n            localKeys = local.playRecords,\n            incoming = payload.playRecords,\n            keyOf = { it.videoKey },\n            updatedAtOf = { it.updatedAt },\n            mode = mode\n        ),\n        rssFavorites = merge(\n            localKeys = local.rssFavorites,\n            incoming = payload.rssFavorites,\n            keyOf = { it.articleUrl },\n            updatedAtOf = { it.savedAt },\n            mode = mode\n        ),\n        videoFavorites = merge(\n            localKeys = local.videoFavorites,\n            incoming = payload.videoFavorites,\n            keyOf = { it.videoUrl },\n            updatedAtOf = { it.savedAt },\n            mode = mode\n        )\n    )\n\n    /** 影视站点主键是 (configUrl, siteKey) 复合键，用不可见分隔符拼接。 */\n    fun siteKeyOf(configUrl: String, siteKey: String): String = \"$configUrl\\u0001$siteKey\"\n}\n\n/**\n * 本机数据快照：只保留主键与用于比新的时间戳。\n *\n * 专门做成轻量结构而不是直接传实体列表，是为了让合并在纯 JVM 下可测，\n * 也顺手避免了把整个数据库读进内存。\n */\ndata class LocalSnapshot(\n    val books: Map<String, Long> = emptyMap(),\n    val bookSources: Map<String, Long> = emptyMap(),\n    val rssSources: Map<String, Long> = emptyMap(),\n    val videoSites: Map<String, Long> = emptyMap(),\n    val readRecords: Map<String, Long> = emptyMap(),\n    val playRecords: Map<String, Long> = emptyMap(),\n    val rssFavorites: Map<String, Long> = emptyMap(),\n    val videoFavorites: Map<String, Long> = emptyMap(),\n    /** 用户手工编辑过的书源 URL，导入时受保护。 */\n    val userEditedBookSources: Set<String> = emptySet()\n) {\n    val isEmpty: Boolean\n        get() = books.isEmpty() && bookSources.isEmpty() && rssSources.isEmpty() &&\n            videoSites.isEmpty() && readRecords.isEmpty() && playRecords.isEmpty() &&\n            rssFavorites.isEmpty() && videoFavorites.isEmpty()\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/data/backup/BackupModels.kt","lang":"kt","lines":178,"content":"package com.lanyue.reader.data.backup\n\n/**\n * 备份用的传输对象（DTO）。\n *\n * 为什么不直接序列化 Room 实体：\n * 1. 实体带 androidx 注解，纯 JVM 环境无法加载，备份逻辑会变成\"只能上真机验证\"；\n * 2. 备份格式是对外契约，必须比数据库表结构更稳定——加字段、改索引不应该让老备份读不出来；\n * 3. 备份里不应出现只在本机有意义的字段（自增 id、缓存路径、加密后的密文）。\n *\n * 因此这里全部是可变默认值的朴素数据类，字段增删只影响本文件。\n */\n\n/** 书架条目。 */\ndata class BookBackup(\n    val bookUrl: String = \"\",\n    val name: String = \"\",\n    val author: String? = null,\n    val cover: String? = null,\n    val intro: String? = null,\n    val origin: String = \"\",\n    val originName: String? = null,\n    val sourceType: Int = 0,\n    val groupName: String = \"全部\",\n    val latestChapter: String? = null,\n    val totalChapter: Int = 0,\n    val lastReadAt: Long = 0,\n    val sortOrder: Int = 0\n)\n\n/** 书源。 */\ndata class BookSourceBackup(\n    val bookSourceUrl: String = \"\",\n    val bookSourceName: String = \"\",\n    val bookSourceGroup: String? = null,\n    val bookSourceType: Int = 0,\n    val enabled: Boolean = true,\n    val enabledExplore: Boolean = false,\n    val searchUrl: String? = null,\n    val ruleSearch: String? = null,\n    val exploreUrl: String? = null,\n    val ruleExplore: String? = null,\n    val ruleToc: String? = null,\n    val ruleContent: String? = null,\n    val ruleBookInfo: String? = null,\n    val header: String? = null,\n    val loginUrl: String? = null,\n    val jsLib: String? = null,\n    val lastUpdateTime: Long = 0,\n    /** 用户手工改过的字段清单（逗号分隔），用于导入时\"保留本地改动\"。 */\n    val userEditedFields: String? = null\n)\n\n/** 订阅源。 */\ndata class RssSourceBackup(\n    val sourceUrl: String = \"\",\n    val sourceName: String = \"\",\n    val sourceIcon: String? = null,\n    val sourceGroup: String? = null,\n    val enabled: Boolean = true,\n    val sortUrl: String? = null,\n    val ruleArticles: String? = null,\n    val ruleTitle: String? = null,\n    val ruleLink: String? = null,\n    val rulePubDate: String? = null,\n    val ruleContent: String? = null,\n    val type: Int = 0,\n    val searchUrl: String? = null,\n    val customOrder: Int = 0,\n    val lastUpdateTime: Long = 0\n)\n\n/** 影视站点。 */\ndata class VideoSiteBackup(\n    val configUrl: String = \"\",\n    val siteKey: String = \"\",\n    val name: String = \"\",\n    val type: Int = 1,\n    val api: String = \"\",\n    val ext: String? = null,\n    val enabled: Boolean = true,\n    val searchable: Boolean = true\n)\n\n/** 阅读进度。 */\ndata class ReadRecordBackup(\n    val bookUrl: String = \"\",\n    val chapterIndex: Int = 0,\n    val chapterTitle: String? = null,\n    val chapterUrl: String? = null,\n    val position: Int = 0,\n    val updatedAt: Long = 0\n)\n\n/** 播放进度。 */\ndata class PlayRecordBackup(\n    val videoKey: String = \"\",\n    val title: String = \"\",\n    val episodeIndex: Int = 0,\n    val positionMs: Long = 0,\n    val durationMs: Long = 0,\n    val updatedAt: Long = 0\n)\n\n/** 订阅收藏。 */\ndata class RssFavoriteBackup(\n    val articleUrl: String = \"\",\n    val title: String = \"\",\n    val sourceUrl: String = \"\",\n    val cover: String? = null,\n    val pubDate: Long? = null,\n    val savedAt: Long = 0\n)\n\n/** 影视收藏。 */\ndata class VideoFavoriteBackup(\n    val videoUrl: String = \"\",\n    val title: String = \"\",\n    val configUrl: String = \"\",\n    val siteKey: String = \"\",\n    val cover: String? = null,\n    val savedAt: Long = 0\n)\n\n/** 整个备份包的内容。字段全部可空/空列表，缺省即\"这一块不参与恢复\"。 */\ndata class BackupPayload(\n    val books: List<BookBackup> = emptyList(),\n    val bookSources: List<BookSourceBackup> = emptyList(),\n    val rssSources: List<RssSourceBackup> = emptyList(),\n    val videoSites: List<VideoSiteBackup> = emptyList(),\n    val readRecords: List<ReadRecordBackup> = emptyList(),\n    val playRecords: List<PlayRecordBackup> = emptyList(),\n    val rssFavorites: List<RssFavoriteBackup> = emptyList(),\n    val videoFavorites: List<VideoFavoriteBackup> = emptyList()\n) {\n    /** 总条目数，用于界面显示\"共 N 项\"。 */\n    val totalCount: Int\n        get() = books.size + bookSources.size + rssSources.size + videoSites.size +\n            readRecords.size + playRecords.size + rssFavorites.size + videoFavorites.size\n\n    val isEmpty: Boolean get() = totalCount == 0\n}\n\n/** 备份包元信息。 */\ndata class BackupMeta(\n    val format: String = BackupFormat.FORMAT_ID,\n    val schemaVersion: Int = BackupFormat.SCHEMA_
