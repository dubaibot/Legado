 step.status != Status.SKIP) {\n                steps.add(\n                    StepResult(step.stage, Status.SKIP, 0, 0, \"上一步失败，未继续\")\n                )\n            } else {\n                steps.add(step)\n                if (step.status == Status.FAIL) blocked = true\n            }\n        }\n        return PipelineReport(sourceUrl, steps)\n    }\n\n    /** 快速自检：只校验配置字段本身（不发请求），用于书源列表的批量体检。 */\n    fun staticCheck(\n        url: String?,\n        name: String?,\n        searchUrl: String?,\n        ruleSearch: String?,\n        ruleToc: String?,\n        ruleContent: String?,\n        type: Int = 0\n    ): PipelineReport {\n        val report = SourceValidator.validateBook(\n            bookSourceUrl = url,\n            bookSourceName = name,\n            searchUrl = searchUrl,\n            ruleSearch = ruleSearch,\n            exploreUrl = null,\n            enabledExplore = false,\n            ruleToc = ruleToc,\n            ruleContent = ruleContent,\n            loginUrl = null,\n            bookSourceType = type\n        )\n        // 配置层面有错，就没有必要谈运行期四步，直接给一步结论\n        if (report.hasError) {\n            val first = report.errors().first()\n            return PipelineReport(\n                url.orEmpty(),\n                listOf(\n                    StepResult(\n                        Stage.SEARCH, Status.FAIL, 0, 0,\n                        \"配置错误：\" + first.message, \"\"\n                    )\n                )\n            )\n        }\n        return PipelineReport(\n            url.orEmpty(),\n            listOf(\n                StepResult(\n                    Stage.SEARCH, Status.WARN, 0, 0,\n                    \"配置可用（\" + report.summary() + \"），需连网实测\", \"\"\n                )\n            )\n        )\n    }\n\n    /** 统计字符串里的尖括号标签数量（粗略估计，够用于判断是否未清洗）。 */\n    private fun countTags(text: String): Int {\n        var count = 0\n        var i = 0\n        while (i < text.length) {\n            if (text[i] == '<') {\n                val close = text.indexOf('>', i + 1)\n                if (close > i + 1 && close - i < 120) {\n                    count++\n                    i = close + 1\n                    continue\n                }\n            }\n            i++\n        }\n        return count\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/import/SourceImportParser.kt","lang":"kt","lines":405,"content":"package com.lanyue.reader.source.import\n\nimport com.google.gson.JsonElement\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\nimport com.lanyue.reader.source.model.SourceValidator\n\n/**\n * 书源导入解析（纯逻辑，无 Android / 无网络）。\n *\n * 现实中的书源文件远比「一个合法 JSON 数组」复杂：\n * - 用户从网页复制，常带 `//` `/* */` 注释与尾随逗号（JSON5 风格）；\n * - 站点导出的包裹层五花八门：`{\"data\":[...]}` / `{\"sources\":[...]}` / 直接一个对象；\n * - 也有「一行一个订阅链接」的纯文本列表。\n *\n * 因此这里不做「先校验格式再解析」的严格路线，而是先做字符串级清洗，\n * 再递归找出所有「看起来像书源」的对象。单个坏条目只跳过它自己，\n * 不让整份文件失败——用户导入 200 个源时，2 个坏条目不该让 198 个陪葬。\n */\nobject SourceImportParser {\n\n    /** 单份导入文件的体积上限（字节）。 */\n    const val MAX_BYTES = 16 * 1024 * 1024\n\n    /** 单次导入的条目上限，防止恶意超大文件打满内存。 */\n    const val MAX_ITEMS = 20_000\n\n    /** 一个解析成功的书源。 */\n    data class ImportedBookSource(\n        val url: String,\n        val name: String,\n        val group: String?,\n        /** 0 文本 / 1 音频 / 2 图片 / 3 文件。 */\n        val type: Int,\n        /** 原始 JSON 文本，落库时原样保存，避免字段被裁剪。 */\n        val raw: String\n    )\n\n    /** 解析结果。 */\n    data class ImportResult(\n        val accepted: List<ImportedBookSource>,\n        val rejected: List<Rejected>,\n        /** 文件内重复（同一 url 出现多次）的条数。 */\n        val duplicates: Int,\n        /** 识别出的输入形态：json-array / json-object / json-wrapped / text-lines。 */\n        val format: String\n    ) {\n        /** 一条被拒绝的条目。 */\n        data class Rejected(\n            val index: Int,\n            val reason: String,\n            val snippet: String\n        )\n\n        val total: Int get() = accepted.size + rejected.size\n\n        val isEmpty: Boolean get() = accepted.isEmpty()\n\n        /** 一句话结论，直接用于导入结果提示。 */\n        fun summary(): String = when {\n            total == 0 -> \"没有解析到任何书源\"\n            accepted.isEmpty() -> \"全部 \" + rejected.size + \" 条解析失败\"\n            rejected.isEmpty() && duplicates == 0 ->\n                \"已识别 \" + accepted.size + \" 个书源\"\n            rejected.isEmpty() ->\n                \"已识别 \" + accepted.size + \" 个书源（去重 \" + duplicates + \" 条）\"\n            else ->\n                \"已识别 \" + accepted.size + \" 个书源，\" + rejected.size + \" 条失败\"\n        }\n    }\n\n    /** 包裹层里可能出现的数据键，按优先级从上往下找。 */\n    private val WRAPPER_KEYS = listOf(\n        \"data\", \"sources\", \"bookSources\", \"bookSource\", \"list\", \"items\", \"result\", \"results\"\n    )\n\n    /** 书源地址字段别名。 */\n    private val URL_KEYS = listOf(\"bookSourceUrl\", \"sourceUrl\", \"url\", \"bookSourceURL\")\n\n    /** 书源名称字段别名。 */\n    private val NAME_KEYS = listOf(\"bookSourceName\", \"sourceName\", \"name\", \"title\")\n\n    /** 分组字段别名。 */\n    private val GROUP_KEYS = listOf(\"bookSourceGroup\", \"sourceGroup\", \"group\", \"category\")\n\n    /** 类型字段别名。 */\n    private val TYPE_KEYS = listOf(\"bookSourceType\", \"sourceType\", \"type\")\n\n    /**\n     * 解析导入内容。\n     *\n     * 输入可以是 JSON（对象 / 数组 / 带包裹层）或「一行一个链接」的纯文本。\n     * 永远返回 [ImportResult]，不抛异常。\n     */\n    fun parse(raw: String?): ImportResult {\n        if (raw.isNullOrBlank()) {\n            return ImportResult(emptyList(), emptyList(), 0, \"empty\")\n        }\n        if (raw.length > MAX_BYTES) {\n            return ImportResult(\n                emptyList(),\n                listOf(ImportResult.Rejected(0, \"文件超过 16 MiB 上限\", raw.take(80))),\n                0,\n                \"too-large\"\n            )\n        }\n\n        val trimmed = raw.trim()\n        return when {\n            trimmed.startsWith(\"[\") || trimmed.startsWith(\"{\") -> parseJson(trimmed)\n            else -> parseTextLines(trimmed)\n        }\n    }\n\n    // ============================ JSON 路线 ============================\n\n    private fun parseJson(raw: String): ImportResult {\n        val cleaned = stripCommentsAndTrailingCommas(raw)\n        val root: JsonElement = try {\n            JsonParser.parseString(cleaned)\n        } catch (e: Throwable) {\n            // JSON 解析失败时兜底：按文本行再试一次（用户可能贴了混合内容）\n            val fallback = parseTextLines(raw)\n            if (fallback.accepted.isNotEmpty()) return fallback\n            return ImportResult(\n                emptyList(),\n                listOf(\n                    ImportResult.Rejected(\n                        0,\n                        \"不是合法 JSON：\" + (e.message ?: \"解析失败\"),\n                        raw.take(120)\n                    )\n                ),\n                0,\n                \"invalid-json\"\n            )\n        }\n\n        val objects = ArrayList<JsonObject>()\n        // 根节点是数组时，顶层每个对象都是\"候选书源\"：\n        // 即使它缺地址，也要计入拒绝列表告诉用户，而不是静默丢掉。\n        // 嵌套结构无法区分\"缺地址的源\"与\"包裹容器\"，仍走 hasUrlField 启发式。\n        val missingUrlAtTop = ArrayList<JsonObject>()\n        if (root.isJsonArray) {\n            root.asJsonArray.forEach { el ->\n                if (!el.isJsonObject) return@forEach\n                val obj = el.asJsonObject\n                if (hasUrlField(obj)) objects.add(obj) else missingUrlAtTop.add(obj)\n            }\n        } else {\n            collectSourceObjects(root, objects, 0)\n        }\n\n        val format = when {\n            root.isJsonArray -> \"json-array\"\n            objects.size == 1 && hasUrlField(root as JsonObject) -> \"json-object\"\n            else -> \"json-wrapped\"\n        }\n\n        val accepted = ArrayList<ImportedBookSource>()\n        val rejected = ArrayList<ImportResult.Rejected>()\n        val seen = HashMap<String, Int>()\n\n        objects.forEachIndexed { index, obj ->\n            val url = firstString(obj, URL_KEYS)?.trim().orEmpty()\n            if (url.isEmpty()) {\n                rejected.add(\n                    ImportResult.Rejected(index, \"缺少书源地址\", obj.toString().take(120))\n                )\n                return@forEachIndexed\n            }\n            if (!SourceValidator.isHttpUrl(url)) {\n                rejected.add(\n                    ImportResult.Rejected(index, \"书源地址不是 http/https：\" + url, url.take(120))\n                )\n                return@forEachIndexed\n            }\n            val name = firstString(obj, NAME_KEYS)?.trim()?.takeIf { it.isNotEmpty() }\n                ?: hostOf(url)\n            val group = firstString(obj, GROUP_KEYS)?.trim()?.takeIf { it.isNotEmpty() }\n            val type = firstInt(obj, TYPE_KEYS)\n\n            if (seen.containsKey(url)) {\n                // 同文件内重复：只保留第一次出现的，后面的与它合并分组信息\n                seen[url] = seen[url]!! + 1\n                return@forEachIndexed\n            }\n            seen[url] = 0\n            accepted.add(ImportedBookSource(url, name, group, type, obj.toString()))\n        }\n\n        // 顶层数组里缺地址的对象：明确记为拒绝，便于用户定位哪一条是残件\n        missingUrlAtTop.forEach { obj ->\n            rejected.add(\n                ImportResult.Rejected(\n                    rejected.size + accepted.size,\n                    \"缺少书源地址\",\n                    obj.toString().take(120)\n                )\n            )\n        }\n\n        val dup = seen.values.sum()\n\n        if (accepted.isEmpty() && rejected.isEmpty()) {\n            return ImportResult(\n                emptyList(),\n                listOf(ImportResult.Rejected(0, \"JSON 里没有找到书源对象\", raw.take(120))),\n                0,\n                format\n            )\n        }\n        return ImportResult(accepted, rejected, dup, format)\n    }\n\n    /**\n     * 递归收集「像书源」的对象。\n     *\n     * 判定标准是「含有地址字段」，而不是位置或层级——\n     * 这样无论是 `{\"data\":[ {...} ]}`、`[ {...} ]` 还是嵌套两层的包裹都能出来。\n     * 深度上限 8 层，防御异常构造的深层嵌套。\n     */\n    private fun collectSourceObjects(el: JsonElement, out: MutableList<JsonObject>, depth: Int) {\n        if (depth > 8) return\n        if (out.size >= MAX_ITEMS) return\n\n        when {\n            el.isJsonArray -> el.asJsonArray.forEach { child ->\n                collectSourceObjects(child, out, depth + 1)\n            }\n\n            el.isJsonObject -> {\n                val obj = el.asJsonObject\n                if (hasUrlField(obj)) {\n                    out.add(obj)\n                    return\n                }\n                // 先按已知包裹键找，找不到再遍历全部字段（兼容自定义包裹名）\n                var matched = false\n                for (key in WRAPPER_KEYS) {\n                    val child = obj.get(key) ?: continue\n                    if (child.isJsonArray || child.isJsonObject) {\n                        collectSourceObjects(child, out, depth + 1)\n                        matched = true\n                    }\n                }\n                if (!matched) {\n                    obj.entrySet().forEach { e ->\n                        val child = e.value\n                        if (child.isJsonArray || child.isJsonObject) {\n                            collectSourceObjects(child, out, depth + 1)\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    private fun hasUrlField(obj: JsonObject): Boolean =\n        URL_KEYS.any { obj.has(it) && !obj.get(it).isJsonNull }\n\n    private fun firstString(obj: JsonObject, keys: List<String>): String? {\n        for (k in keys) {\n            val el = obj.get(k) ?: continue\n            if (el.isJsonNull || !el.isJsonPrimitive) continue\n            return try {\n                el.asString\n            } catch (e: Throwable) {\n                null\n            }\n        }\n        return null\n    }\n\n    private fun firstInt(obj: JsonObject, keys: List<String>): Int {\n        for (k in keys) {\n            val el = obj.get(k) ?: continue\n            if (el.isJsonNull || !el.isJsonPrimitive) continue\n            val v = try {\n                el.asString\n            } catch (e: Throwable) {\n                continue\n            }\n            v.trim().toIntOrNull()?.let { return it.coerceIn(0, 3) }\n        }\n        return 0\n    }\n\n    /** 名称缺省时用域名兜底，比显示「未命名」更有辨识度。 */\n    private fun hostOf(url: String): String {\n        val authority = url.removePrefix(\"http://\").removePrefix(\"https://\")\n            .substringBefore('/').substringBefore('?').substringBefore('#')\n        val host = authority.substringAfterLast('@').substringBefore(':').trim()\n        return host.ifEmpty { \"未命名书源\" }\n    }\n\n    // ============================ 文本行路线 ============================\n\n    /** 纯文本：每行一个地址，支持 `地址 名称` 与 `地址,分组` 两种写法。 */\n    private fun parseTextLines(raw: String): ImportResult {\n        val accepted = ArrayList<ImportedBookSource>()\n        val rejected = ArrayList<ImportResult.Rejected>()\n        val seen = HashSet<String>()\n        var dup = 0\n\n        raw.lines().forEachIndexed { index, lineRaw ->\n            val line = lineRaw.trim()\n            if (line.isEmpty() || line.startsWith(\"#\")) return@forEachIndexed\n            // 取第一段作为地址，其余可选的当作名称\n            val parts = line.split('\\t', ' ', ',', '|').filter { it.isNotBlank() }\n            val url = parts.firstOrNull().orEmpty()\n            if (!SourceValidator.isHttpUrl(url)) {\n                rejected.add(\n                    ImportResult.Rejected(index, \"不是有效链接\", line.take(120))\n                )\n                return@forEachIndexed\n            }\n            if (!seen.add(url)) {\n                dup++\n                return@forEachIndexed\n            }\n            val name = parts.getOrNull(1)?.takeIf { it.isNotBlank() } ?: hostOf(url)\n            val group = parts.getOrNull(2)?.takeIf { it.isNotBlank() }\n            accepted.add(\n                ImportedBookSource(\n                    url = url,\n                    name = name,\n                    group = group,\n                    type = 0,\n                    raw = \"{\\\"bookSourceUrl\\\":\\\"\" + url + \"\\\",\\\"bookSourceName\\\":\\\"\" + name + \"\\\"}\"\n                )\n            )\n        }\n\n        if (accepted.isEmpty() && rejected.isEmpty()) {\n            return ImportResult(emptyList(), emptyList(), 0, \"text-lines\")\n        }\n        return ImportResult(accepted, rejected, dup, \"text-lines\")\n    }\n\n    // ============================ 清洗 ============================\n\n    /**\n     * 去掉 JSON5 风格的注释与尾随逗号。\n     *\n     * 关键点是**字符串感知**：`https://a.com` 里的 `//` 不是注释，\n     * 盲目正则替换会把所有地址截断成 `https:` —— 这是最容易踩的坑。\n     * 因此这里逐字符扫描并跟踪字符串状态与转义。\n     */\n    fun stripCommentsAndTrailingCommas(src: String): String {\n        val sb = StringBuilder(src.length)\n        var i = 0\n        var inString = false\n        var quote = ' '\n\n        while (i < src.length) {\n            val c = src[i]\n            if (inString) {\n                sb.append(c)\n                if (c == '\\\\' && i + 1 < src.length) {\n                    sb.append(src[i + 1])\n                    i += 2\n                    continue\n                }\n                if (c == quote) inString = false\n                i++\n                continue\n            }\n            when {\n                c == '\"' || c == '\\'' -> {\n                    inString = true\n                    quote = c\n                    sb.append(c)\n                    i++\n                }\n                c == '/' && i + 1 < src.length && src[i + 1] == '/' -> {\n                    while (i < src.length && src[i] != '\\n') i++\n                }\n                c == '/' && i + 1 < src.length && src[i + 1] == '*' -> {\n                    i += 2\n                    while (i + 1 < src.length && !(src[i] == '*' && src[i + 1] == '/')) i++\n                    i += 2\n                }\n                else -> {\n                    sb.append(c)\n                    i++\n                }\n            }\n        }\n\n        // 第二轮：删除 } / ] 前的尾随逗号\n        val s = sb.toString()\n        val out = StringBuilder(s.length)\n        for (idx in s.indices) {\n            val c = s[idx]\n            if (c == ',') {\n                var j = idx + 1\n                while (j < s.length && s[j].isWhitespace()) j++\n                if (j < s.length && (s[j] == '}' || s[j] == ']')) continue\n            }\n            out.append(c)\n        }\n        return out.toString()\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/model/CapabilityResolver.kt","lang":"kt","lines":48,"content":"package com.lanyue.reader.source.model\n\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\n\n/**\n * 1.4.2 能力判定表。\n * SourceRouter 调用前必须先过这里，缺失能力则不调用，避免把不支持的操作\n * 抛到源实现里变成异常。\n */\nobject CapabilityResolver {\n\n    /** 书源能力。 */\n    fun ofBook(e: BookSourceEntity): Set<SourceCapability> = buildSet {\n        // SEARCHABLE：searchUrl 非空 + ruleSearch 存在\n        if (!e.searchUrl.isNullOrBlank() && !e.ruleSearch.isNullOrBlank()) {\n            if (!e.searchDegraded) add(SourceCapability.SEARCHABLE)\n        }\n        // DISCOVERABLE：enabledExplore 且 exploreUrl 非空\n        if (e.enabledExplore && !e.exploreUrl.isNullOrBlank()) add(SourceCapability.DISCOVERABLE)\n        // HAS_CONTENT：ruleContent 非空\n        if (!e.ruleContent.isNullOrBlank()) add(SourceCapability.HAS_CONTENT)\n        if (!e.loginUrl.isNullOrBlank()) add(SourceCapability.HIGH_PRIORITY)\n    }\n\n    /**\n     * 订阅源能力。与书源的差异：\n     * - SEARCHABLE 只看 searchUrl（览阅扩展），无独立搜索规则\n     * - RSS_FALLBACK：ruleArticles 为空\n     */\n    fun ofRss(e: RssSourceEntity): Set<SourceCapability> = buildSet {\n        if (!e.searchUrl.isNullOrBlank() && !e.searchDegraded) add(SourceCapability.SEARCHABLE)\n        // DISCOVERABLE：sortUrl 非空（是否能解析出 ≥1 分类在解析后二次确认）\n        if (!e.sortUrl.isNullOrBlank()) add(SourceCapability.DISCOVERABLE)\n        if (!e.ruleContent.isNullOrBlank()) add(SourceCapability.HAS_CONTENT)\n        if (e.ruleArticles.isNullOrBlank()) add(SourceCapability.RSS_FALLBACK)\n    }\n\n    /**\n     * 影视站点能力。\n     * type 3 仅当 api 以 .js 结尾（drpy）才可用；jar 站点标记 unsupported。\n     */\n    fun ofVideoSite(e: VideoSiteEntity): Set<SourceCapability> = buildSet {\n        if (e.searchable) add(SourceCapability.SEARCHABLE)\n        if (e.filterable) add(SourceCapability.FILTERABLE)\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/model/SourceContracts.kt","lang":"kt","lines":205,"content":"package com.lanyue.reader.source.model\n\nimport com.lanyue.reader.core.engine.RateLimit\n\n/**\n * 1.4.6 四类源统一接口。\n * 本文件是源体系的唯一契约入口，任何源实现都必须满足这里的形状。\n */\n\nenum class SourceType { BOOK, SUBSCRIPTION, VIDEO, DANMAKU }\n\n/** 1.4.2 能力判定 + 4/5 章扩展能力位。 */\nenum class SourceCapability {\n    SEARCHABLE,\n    DISCOVERABLE,\n    HAS_CONTENT,\n    RSS_FALLBACK,\n    FILTERABLE,\n    REAL_DOM,\n    BROWSER_FP,\n    SNIFF,\n    HIGH_PRIORITY\n}\n\ninterface ISource {\n    val sourceId: String\n    val sourceType: SourceType\n    val capabilityFlags: Set<SourceCapability>\n    val concurrentRate: RateLimit?\n}\n\n/** 1.4.6 排序/分类规则，书源与订阅源共用形状。 */\ndata class SortRule(val name: String, val url: String)\n\ndata class SearchBookItem(\n    val name: String,\n    val author: String? = null,\n    val bookUrl: String,\n    val cover: String? = null,\n    val intro: String? = null,\n    val latestChapter: String? = null,\n    val origin: String,\n    val originName: String? = null\n)\n\ndata class BookDetail(\n    val name: String,\n    val author: String? = null,\n    val cover: String? = null,\n    val intro: String? = null,\n    val kind: String? = null,\n    val lastChapter: String? = null,\n    val wordCount: String? = null,\n    val bookUrl: String\n)\n\ndata class TocItem(\n    val title: String,\n    val url: String,\n    val index: Int = 0\n)\n\n/**\n * 1.4.7 音频书源正文结果。\n * bookSourceType=1 时 ruleContent 返回纯 URL 或含 url 字段的 JSON，\n * SourceRouter 识别后直接注入 Media3 AudioPlay，不做 HTML 解析。\n */\nsealed class ContentResult {\n    /** 普通 HTML 正文。 */\n    data class Html(val html: String) : ContentResult()\n\n    /** 音频直链 + 可选请求头（防盗链）。 */\n    data class Audio(val url: String, val headers: Map<String, String> = emptyMap()) : ContentResult()\n\n    /** 无 ruleContent 的订阅源正文：交给 WebView 原样打开。 */\n    data class WebViewFallback(val url: String) : ContentResult()\n}\n\ninterface IBookSource : ISource {\n    suspend fun search(key: String, page: Int): List<SearchBookItem>\n    suspend fun explore(sort: SortRule, page: Int): List<SearchBookItem>\n    suspend fun getDetail(url: String): BookDetail\n    suspend fun getToc(url: String): List<TocItem>\n    /** 返回 HTML（1.4.6 契约）；音频源返回 Audio。 */\n    suspend fun getContent(url: String): ContentResult\n}\n\n/** 1.4.1 type 0 网页 / 1 图片 / 2 视频。 */\nenum class RssContentType { WEB, IMAGE, VIDEO }\n\ndata class SubscriptionItem(\n    val title: String,\n    val url: String,\n    val cover: String? = null,\n    val pubDate: Long? = null,\n    val description: String? = null,\n    val sort: String? = null,\n    val origin: String,\n    val contentType: RssContentType = RssContentType.WEB\n)\n\n/** 1.4.6 / ADR-012：独立接口，无 getToc。 */\ninterface ISubscriptionSource : ISource {\n    suspend fun getSorts(): List<SortRule>\n    suspend fun getArticles(sort: SortRule?, page: Int): List<SubscriptionItem>\n    suspend fun search(key: String, page: Int): List<SubscriptionItem>\n    /** 返回 HTML；无 ruleContent 时走 WebView。 */\n    suspend fun getContent(url: String): ContentResult\n}\n\n// ---------- 影视 ----------\n\ndata class Category(val name: String, val id: String)\n\n/** 7.3 CMS 筛选。ext.filter 结构。 */\ndata class Filter(val key: String, val name: String, val values: List<FilterValue>)\ndata class FilterValue(val name: String, val value: String)\n\ndata class VideoItem(\n    val name: String,\n    val url: String,\n    val cover: String? = null,\n    val remark: String? = null,\n    val siteKey: String,\n    val configUrl: String\n)\n\ndata class VideoEpisode(val name: String, val url: String)\n\n/** 影视线路（>5 条折叠，见 3.5）。 */\ndata class VideoPlayLine(val name: String, val episodes: List<VideoEpisode>)\n\ndata class VideoDetail(\n    val name: String,\n    val cover: String? = null,\n    val intro: String? = null,\n    val actor: String? = null,\n    val director: String? = null,\n    val year: String? = null,\n    val area: String? = null,\n    val remark: String? = null,\n    val lines: List<VideoPlayLine> = emptyList()\n)\n\n/** 7.3 播放解析链结果类型。 */\nenum class PlayKind { DIRECT, PARSE, SNIFF }\n\ndata class DanmakuHint(\n    val title: String,\n    val episode: Int?,\n    val fileName: String? = null,\n    val fileHash: String? = null,\n    val fileSize: Long? = null,\n    val durationMs: Long? = null\n)\n\ndata class PlayResult(\n    val kind: PlayKind,\n    val url: String,\n    val headers: Map<String, String>? = null,\n    val flag: String? = null,\n    val danmakuHint: DanmakuHint? = null\n)\n\ninterface IVideoSource : ISource {\n    suspend fun getCategories(): List<Category>\n    suspend fun explore(category: Category, filter: Filter?, page: Int): List<VideoItem>\n    suspend fun search(key: String, page: Int): List<VideoItem>\n    suspend fun getDetail(url: String): VideoDetail\n    suspend fun getPlay(episode: VideoEpisode): PlayResult\n}\n\n// ---------- 弹幕 ----------\n\ndata class DanmakuMatchRequest(\n    val title: String,\n    val episode: Int?,\n    val fileName: String? = null,\n    val fileHash: String? = null,\n    val fileSize: Long? = null,\n    val durationMs: Long? = null\n)\n\ndata class DanmakuMatch(\n    val episodeId: Long,\n    val animeTitle: String,\n    val episodeTitle: String,\n    val shift: Long = 0,\n    val sourceId: String = \"\"\n)\n\n/** 4.10.8 弹幕事件。mode: 1 滚动 / 2 底部 / 3 顶部。 */\ndata class DanmakuEvent(\n    val timeMs: Long,\n    val mode: Int,\n    val color: Int,\n    val text: String,\n    val source: String? = null\n)\n\ninterface IDanmakuSource : ISource {\n    suspend fun match(req: DanmakuMatchRequest): DanmakuMatch?\n    suspend fun search(key: String): List<DanmakuMatch>\n    suspend fun getComments(match: DanmakuMatch, fromMs: Long, durationMs: Long): List<DanmakuEvent>\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/model/SourceHealth.kt","lang":"kt","lines":70,"content":"package com.lanyue.reader.source.model\n\n/**\n * 4.x 源健康度与失败隔离（纯逻辑，无 Android / 无 IO）。\n *\n * 从 SourceRouter 里抽出来的原因：\n * 1. 原实现共用一个 id -> 计数的 Map，导致书源失败会把同名影视频道一起隔离，\n *    这是真实缺陷（不同源类型的 sourceId 完全可能重复）。\n * 2. 隔离/恢复规则属于业务规则，应当可单测，而不是埋在协程编排里。\n *\n * 语义约定：\n * - 连续失败达到 [failThreshold] 次 -> 隔离，本次会话内不再调用\n * - 任意一次成功 -> 立刻清除该源的失败计数（失败不必连续累积到会话结束）\n * - 隔离不持久化：进程重启即恢复，与「本次会话内降级」的设计一致\n */\nclass SourceHealth(\n    private val failThreshold: Int = DEFAULT_FAIL_THRESHOLD\n) {\n\n    init {\n        require(failThreshold >= 1) { \"failThreshold must be >= 1: $failThreshold\" }\n    }\n\n    /** 按「源类型 + 源 id」分开计数，避免跨类型串味。 */\n    private val failCounts = HashMap<Key, Int>()\n\n    private data class Key(val type: SourceType, val id: String)\n\n    /**\n     * 是否已隔离。\n     * 未知源一律视为未隔离（不能因为没记录就当成坏的）。\n     */\n    fun isIsolated(type: SourceType, sourceId: String): Boolean =\n        (failCounts[Key(type, sourceId)] ?: 0) >= failThreshold\n\n    /**\n     * 记录一次失败，返回该源当前累计失败次数。\n     * 达到阈值时调用方应同时埋点记录「已隔离」。\n     */\n    fun markFail(type: SourceType, sourceId: String): Int {\n        val key = Key(type, sourceId)\n        val next = (failCounts[key] ?: 0) + 1\n        failCounts[key] = next\n        return next\n    }\n\n    /** 记录一次成功：清零该源在**本类型**下的失败计数。 */\n    fun markSuccess(type: SourceType, sourceId: String) {\n        failCounts.remove(Key(type, sourceId))\n    }\n\n    /** 用户手动「重试该源」：清除该源在所有类型下的隔离状态。 */\n    fun reset(sourceId: String) {\n        failCounts.keys.removeAll { it.id == sourceId }\n    }\n\n    /** 当前被隔离的源数量（诊断用）。 */\n    fun isolatedCount(): Int = failCounts.count { it.value >= failThreshold }\n\n    /** 当前失败计数的源数量（诊断用，含未达阈值的）。 */\n    fun trackedCount(): Int = failCounts.size\n\n    /** 清理全部状态（退出登录 / 切换账号时）。 */\n    fun clear() = failCounts.clear()\n\n    companion object {\n        /** 连续失败 3 次才隔离：容忍偶发网络抖动。 */\n        const val DEFAULT_FAIL_THRESHOLD = 3\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/model/SourceValidator.kt","lang":"kt","lines":324,"content":"package com.lanyue.reader.source.model\n\n/**\n * 1.4.2 / 4.12 源配置校验（纯逻辑，无 Android / 无 Room）。\n *\n * 为什么单独一层：\n * - 源导入是最容易出问题的一步（用户手贴 JSON、订阅更新覆盖本地编辑），\n *   错误必须在「保存前」暴露，而不是等用户点开书才报「解析失败」。\n * - 用纯数据入参而不是实体入参，可以与 Room 解耦并直接单测。\n *\n * 分级原则：\n * - ERROR：结构错误，保存后一定不可用（缺少必要 URL、URL 非法、JS 引号不闭合）\n * - WARN ：可用但有隐患（缺搜索规则、缺目录规则、登录源缺 loginUrl）\n */\nobject SourceValidator {\n\n    enum class Level { ERROR, WARN }\n\n    data class Issue(val field: String, val level: Level, val message: String)\n\n    data class Report(val issues: List<Issue>) {\n        val hasError: Boolean get() = issues.any { it.level == Level.ERROR }\n        val isValid: Boolean get() = !hasError\n        fun errors(): List<Issue> = issues.filter { it.level == Level.ERROR }\n        fun warnings(): List<Issue> = issues.filter { it.level == Level.WARN }\n        /** 一句话摘要，供导入结果提示。 */\n        fun summary(): String = when {\n            issues.isEmpty() -> \"配置有效\"\n            hasError -> \"存在 \" + errors().size + \" 处错误：\" + errors().first().message\n            else -> \"可用，\" + warnings().size + \" 处提示\"\n        }\n    }\n\n    /**\n     * 校验书源。\n     *\n     * [bookSourceType] 0 文本 / 1 音频 / 2 图片 / 3 文件；音频源不需要 ruleContent\n     * （正文直接返回直链），因此对 ruleContent 的检查按类型放宽。\n     */\n    fun validateBook(\n        bookSourceUrl: String?,\n        bookSourceName: String?,\n        searchUrl: String?,\n        ruleSearch: String?,\n        exploreUrl: String?,\n        enabledExplore: Boolean,\n        ruleToc: String?,\n        ruleContent: String?,\n        loginUrl: String?,\n        bookSourceType: Int = 0,\n        jsLib: String? = null\n    ): Report {\n        val issues = ArrayList<Issue>()\n\n        if (bookSourceUrl.isNullOrBlank()) {\n            issues.add(Issue(\"bookSourceUrl\", Level.ERROR, \"书源地址为空\"))\n        } else if (!isHttpUrl(bookSourceUrl)) {\n            issues.add(Issue(\"bookSourceUrl\", Level.ERROR, \"书源地址不是 http/https：\" + bookSourceUrl))\n        }\n        if (bookSourceName.isNullOrBlank()) {\n            issues.add(Issue(\"bookSourceName\", Level.WARN, \"书源名称为空，列表里会显示为地址\"))\n        }\n\n        // 搜索：两条同时存在才构成可搜索，只写一半属于配置错误\n        val hasSearchUrl = !searchUrl.isNullOrBlank()\n        val hasRuleSearch = !ruleSearch.isNullOrBlank()\n        if (hasSearchUrl != hasRuleSearch) {\n            issues.add(Issue(\"searchUrl\", Level.WARN, \"搜索地址与搜索规则需成对配置，当前只写了一项\"))\n        }\n\n        // 发现：开了发现页却没有地址\n        if (enabledExplore && exploreUrl.isNullOrBlank()) {\n            issues.add(Issue(\"exploreUrl\", Level.WARN, \"已开启发现但未配置发现地址\"))\n        }\n        if (!enabledExplore && !exploreUrl.isNullOrBlank()) {\n            issues.add(Issue(\"exploreUrl\", Level.WARN, \"配置了发现地址但未开启发现\"))\n        }\n\n        if (ruleToc.isNullOrBlank()) {\n            issues.add(Issue(\"ruleToc\", Level.ERROR, \"缺少目录规则，无法列出章节\"))\n        }\n        // 音频源正文是直链，不需要 ruleContent\n        if (bookSourceType != 1 && ruleContent.isNullOrBlank()) {\n            issues.add(Issue(\"ruleContent\", Level.WARN, \"缺少正文规则，将回落到 WebView 打开\"))\n        }\n        if (!loginUrl.isNullOrBlank() && !isHttpUrl(loginUrl)) {\n            issues.add(Issue(\"loginUrl\", Level.ERROR, \"登录地址非法：\" + loginUrl))\n        }\n\n        checkJs(\"ruleSearch\", ruleSearch, issues)\n        checkJs(\"ruleToc\", ruleToc, issues)\n        checkJs(\"ruleContent\", ruleContent, issues)\n        checkJs(\"jsLib\", jsLib, issues)\n\n        return Report(issues)\n    }\n\n    /** 校验订阅源。订阅源可以完全没有规则（纯 RSS 兜底）。 */\n    fun validateRss(\n        sourceUrl: String?,\n        sourceName: String?,\n        sortUrl: String?,\n        ruleArticles: String?,\n        ruleTitle: String?,\n        ruleLink: String?,\n        searchUrl: String?,\n        type: Int = 0\n    ): Report {\n        val issues = ArrayList<Issue>()\n\n        if (sourceUrl.isNullOrBlank()) {\n            issues.add(Issue(\"sourceUrl\", Level.ERROR, \"订阅源地址为空\"))\n        } else if (!isHttpUrl(sourceUrl)) {\n            issues.add(Issue(\"sourceUrl\", Level.ERROR, \"订阅源地址不是 http/https：\" + sourceUrl))\n        }\n        if (sourceName.isNullOrBlank()) {\n            issues.add(Issue(\"sourceName\", Level.WARN, \"订阅源名称为空\"))\n        }\n        if (type !in 0..2) {\n            issues.add(Issue(\"type\", Level.ERROR, \"内容类型只能是 0/1/2，当前 \" + type))\n        }\n        // 有文章列表规则就必须有标题和链接，否则解析出来是空条目\n        if (!ruleArticles.isNullOrBlank()) {\n            if (ruleTitle.isNullOrBlank()) {\n                issues.add(Issue(\"ruleTitle\", Level.ERROR, \"配置了文章列表规则但缺少标题规则\"))\n            }\n            if (ruleLink.isNullOrBlank()) {\n                issues.add(Issue(\"ruleLink\", Level.ERROR, \"配置了文章列表规则但缺少链接规则\"))\n            }\n        }\n        if (!searchUrl.isNullOrBlank() && !isHttpUrl(searchUrl)) {\n            issues.add(Issue(\"searchUrl\", Level.ERROR, \"搜索地址非法：\" + searchUrl))\n        }\n        if (!sortUrl.isNullOrBlank()) {\n            for ((i, line) in sortUrl.split('\\n').withIndex()) {\n                val t = line.trim()\n                if (t.isEmpty()) continue\n                if (!t.contains(\"::\")) {\n                    issues.add(Issue(\"sortUrl\", Level.WARN, \"第 \" + (i + 1) + \" 行缺少 :: 分隔，应形如 分类名::地址\"))\n                }\n            }\n        }\n\n        checkJs(\"ruleArticles\", ruleArticles, issues)\n        checkJs(\"ruleTitle\", ruleTitle, issues)\n        checkJs(\"ruleLink\", ruleLink, issues)\n\n        return Report(issues)\n    }\n\n    /** 校验影视站点。type 3 的 jar 站点不支持，需明确报错而不是静默失效。 */\n    fun validateVideoSite(\n        configUrl: String?,\n        siteKey: String?,\n        name: String?,\n        type: Int,\n        api: String?,\n        jar: String?,\n        ext: String?\n    ): Report {\n        val issues = ArrayList<Issue>()\n\n        if (configUrl.isNullOrBlank()) {\n            issues.add(Issue(\"configUrl\", Level.ERROR, \"配置地址为空\"))\n        } else if (!isHttpUrl(configUrl)) {\n            issues.add(Issue(\"configUrl\", Level.ERROR, \"配置地址不是 http/https\"))\n        }\n        if (siteKey.isNullOrBlank()) {\n            issues.add(Issue(\"siteKey\", Level.ERROR, \"站点 key 为空\"))\n        }\n        if (name.isNullOrBlank()) {\n            issues.add(Issue(\"name\", Level.WARN, \"站点名称为空\"))\n        }\n        if (api.isNullOrBlank()) {\n            issues.add(Issue(\"api\", Level.ERROR, \"站点 api 为空\"))\n        }\n\n        // 7.3：type 3 仅 drpy（api 以 .js 结尾）可用，jar 站点标记暂不支持\n        if (type == 3) {\n            val isDrpy = api?.trim()?.endsWith(\".js\") == true\n            if (!isDrpy) {\n                if (!jar.isNullOrBlank()) {\n                    issues.add(Issue(\"jar\", Level.ERROR, \"jar 类型解析器暂不支持，该站点将不可用\"))\n                } else {\n                    issues.add(Issue(\"api\", Level.WARN, \"type 3 通常为 drpy，api 建议以 .js 结尾\"))\n                }\n            }\n        }\n        if (type !in 0..3) {\n            issues.add(Issue(\"type\", Level.ERROR, \"站点类型只能是 0/1/3，当前 \" + type))\n        }\n        if (!ext.isNullOrBlank() && !looksLikeJson(ext)) {\n            issues.add(Issue(\"ext\", Level.WARN, \"ext 不是合法 JSON，筛选条件可能失效\"))\n        }\n\n        return Report(issues)\n    }\n\n    // ---------------- 基础判定 ----------------\n\n    /** 是否是 http/https 绝对地址。 */\n    fun isHttpUrl(value: String?): Boolean {\n        val v = value?.trim().orEmpty()\n        if (v.isEmpty()) return false\n        if (!v.startsWith(\"http://\") && !v.startsWith(\"https://\")) return false\n        val authority = v.removePrefix(\"http://\").removePrefix(\"https://\")\n            .substringBefore('/').substringBefore('?').substringBefore('#')\n        // 去掉 userInfo@ 与端口号，只保留主机名做判断\n        val host = authority.substringAfterLast('@')\n            .substringBefore(':')\n            .trim()\n        if (host.isEmpty()) return false\n        if (host == \"localhost\") return true\n        // IPv4 / 域名：必须含点，且不能只有点和数字之外的空白\n        return host.contains('.') && !host.startsWith('.') && !host.endsWith('.')\n    }\n\n    /**\n     * 粗略判断字符串是否是合法 JSON 对象/数组。\n     * 只做括号配平与首字符检查，不追求严格解析（严格校验由 JSON 解析器负责）。\n     */\n    fun looksLikeJson(value: String?): Boolean {\n        val v = value?.trim().orEmpty()\n        if (v.length < 2) return false\n        val first = v.first()\n        val last = v.last()\n        if (!((first == '{' && last == '}') || (first == '[' && last == ']'))) return false\n        var depth = 0\n        var inString = false\n        var escaped = false\n        for (c in v) {\n            when {\n                escaped -> escaped = false\n                c == '\\\\' && inString -> escaped = true\n                c == '\"' -> inString = !inString\n                inString -> Unit\n                c == '{' || c == '[' -> depth++\n                c == '}' || c == ']' -> {\n                    depth--\n                    if (depth < 0) return false\n                }\n            }\n        }\n        return depth == 0\n    }\n\n    /**\n     * 检查规则里的 JS 片段引号/括号是否闭合。\n     *\n     * 只检查 `@js:` 段与 `<js>` 块，普通 CSS/JSONPath 规则不参与，\n     * 避免把 CSS 里的方括号误判成 JS 语法错误。\n     */\n    fun checkJsBalanced(rule: String?): Boolean {\n        val r = rule?.trim().orEmpty()\n        if (r.isEmpty()) return true\n        val jsSegments = ArrayList<String>()\n        var idx = 0\n        while (true) {\n            val at = r.indexOf(\"@js:\", idx)\n            if (at < 0) break\n            val start = at + 4\n            // JS 段到下一个顶层 @ 或规则结尾\n            var end = r.length\n            var depth = 0\n            var inS = false\n            var inD = false\n            var i = start\n            while (i < r.length) {\n                val c = r[i]\n                when {\n                    inS -> if (c == '\\'' && r.getOrNull(i - 1) != '\\\\') inS = false\n                    inD -> if (c == '\"' && r.getOrNull(i - 1) != '\\\\') inD = false\n                    c == '\\'' -> inS = true\n                    c == '\"' -> inD = true\n                    c == '{' || c == '(' || c == '[' -> depth++\n                    c == '}' || c == ')' || c == ']' -> depth--\n                    c == '@' && depth <= 0 -> {\n                        end = i\n                        i = r.length\n                        continue\n                    }\n                }\n                i++\n            }\n            jsSegments.add(r.substring(start, end))\n            idx = end\n        }\n        for (seg in jsSegments) {\n            if (!balanced(seg)) return false\n        }\n        return true\n    }\n\n    /** 判断括号与引号是否配平。 */\n    fun balanced(s: String): Boolean {\n        var depth = 0\n        var inS = false\n        var inD = false\n        var escaped = false\n        for (c in s) {\n            when {\n                escaped -> escaped = false\n                c == '\\\\' && (inS || inD) -> escaped = true\n                inS -> if (c == '\\'') inS = false\n                inD -> if (c == '\"') inD = false\n                c == '\\'' -> inS = true\n                c == '\"' -> inD = true\n                c == '(' || c == '{' || c == '[' -> depth++\n                c == ')' || c == '}' || c == ']' -> {\n                    depth--\n                    if (depth < 0) return false\n                }\n            }\n        }\n        return depth == 0 && !inS && !inD\n    }\n\n    private fun checkJs(field: String, rule: String?, issues: MutableList<Issue>) {\n        if (rule.isNullOrBlank()) return\n        if (!checkJsBalanced(rule)) {\n            issues.add(Issue(field, Level.ERROR, field + \" 中的 JS 片段引号或括号未闭合\"))\n        }\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/repo/SourceRepository.kt","lang":"kt","lines":306,"content":"package com.lanyue.reader.source.repo\n\nimport com.lanyue.reader.source.model.SourceValidator\n\n/**\n * 已安装书源的内存仓库（纯逻辑，无 IO）。\n *\n * 为什么不直接写数据库：\n * 1. 书源的「安装 / 升级 / 分组 / 排序 / 删除分组」是一套有明确冲突语义的业务规则，\n *    把它和 Room 事务混在一起会导致规则无法单测；\n * 2. 导入 200 个源时的合并决策必须可重放、可审查；\n * 3. 上层只需要「给我最终列表」，由它负责一次事务落库，\n *    避免每个条目一次写入造成的 200 次事务。\n *\n * 冲突语义（与 [com.lanyue.reader.data.backup.BackupMerger] 保持一致的手感）：\n * - 本机没有 -> 新增\n * - 本机有且用户手工改过 -> 跳过并记录，绝不覆盖（否则调好的规则会被站点导出冲掉）\n * - 本机有且备份更新 -> 覆盖\n * - 本机有且不更新 -> 保持不变\n */\nclass SourceRepository(initial: List<InstalledSource> = emptyList()) {\n\n    /** 一条已安装的书源。 */\n    data class InstalledSource(\n        val url: String,\n        val name: String,\n        /** 分组名；空即归入「未分组」。 */\n        val group: String = DEFAULT_GROUP,\n        val enabled: Boolean = true,\n        /** 0 文本 / 1 音频 / 2 图片 / 3 文件。 */\n        val type: Int = 0,\n        /** 源本身的版本时间，用于判断是否该升级。 */\n        val updatedAt: Long = 0,\n        /** 用户是否手工编辑过配置字段；为 true 时导入不覆盖。 */\n        val userEdited: Boolean = false,\n        val sortOrder: Int = 0,\n        /** 原始配置文本，落库时原样保存。 */\n        val raw: String = \"\",\n        /** 上一次配置校验的摘要，用于列表页直接展示。 */\n        val validateSummary: String = \"\"\n    )\n\n    /** 安装结果。 */\n    data class InstallReport(\n        val added: List<String> = emptyList(),\n        val updated: List<String> = emptyList(),\n        val unchanged: List<String> = emptyList(),\n        val skippedProtected: List<String> = emptyList(),\n        val skippedInvalid: List<String> = emptyList(),\n        /** 输入里自身重复的条数。 */\n        val dedupedIncoming: Int = 0\n    ) {\n        val inserted: Int get() = added.size\n\n        val isEmpty: Boolean\n            get() = added.isEmpty() && updated.isEmpty() && unchanged.isEmpty() &&\n                skippedProtected.isEmpty() && skippedInvalid.isEmpty()\n\n        /** 一句话结论，直接展示在导入结果条上。 */\n        fun summary(): String {\n            if (isEmpty) return \"没有需要安装的书源\"\n            val parts = ArrayList<String>()\n            if (added.isNotEmpty()) parts.add(\"新增 \" + added.size)\n            if (updated.isNotEmpty()) parts.add(\"更新 \" + updated.size)\n            if (unchanged.isNotEmpty()) parts.add(\"不变 \" + unchanged.size)\n            if (skippedProtected.isNotEmpty()) parts.add(\"保护 \" + skippedProtected.size)\n            if (skippedInvalid.isNotEmpty()) parts.add(\"无效 \" + skippedInvalid.size)\n            return parts.joinToString(\"，\")\n        }\n    }\n\n    /** 仓库概览，供书源管理页顶部显示。 */\n    data class Stats(\n        val total: Int,\n        val enabled: Int,\n        val disabled: Int,\n        val groups: Int,\n        val userEdited: Int\n    )\n\n    /** url -> 记录。用 LinkedHashMap 保留插入顺序。 */\n    private val items = LinkedHashMap<String, InstalledSource>()\n\n    init {\n        initial.forEach { src ->\n            if (src.url.isNotBlank()) items[src.url] = src\n        }\n    }\n\n    // ============================ 查询 ============================\n\n    /** 全部书源，按「排序值 + 名称」稳定排序。 */\n    fun all(): List<InstalledSource> = items.values.sortedWith(\n        compareBy({ it.sortOrder }, { it.name }, { it.url })\n    )\n\n    fun enabled(): List<InstalledSource> = all().filter { it.enabled }\n\n    fun disabled(): List<InstalledSource> = all().filterNot { it.enabled }\n\n    fun size(): Int = items.size\n\n    fun isEmpty(): Boolean = items.isEmpty()\n\n    fun find(url: String): InstalledSource? = items[url]\n\n    fun contains(url: String): Boolean = items.containsKey(url)\n\n    /** 按分组归集，分组名有序（首组固定为「全部」之外的字典序）。 */\n    fun byGroup(): Map<String, List<InstalledSource>> {\n        val map = LinkedHashMap<String, MutableList<InstalledSource>>()\n        all().forEach { src ->\n            map.getOrPut(src.group.ifBlank { DEFAULT_GROUP }) { ArrayList() }.add(src)\n        }\n        return map.mapValues { it.value.toList() }\n    }\n\n    /** 所有分组名（去重、有序）。 */\n    fun groups(): List<String> = byGroup().keys.toList()\n\n    /** 按关键字搜索名称 / 地址 / 分组。 */\n    fun search(keyword: String): List<InstalledSource> {\n        val k = keyword.trim()\n        if (k.isEmpty()) return all()\n        val lower = k.lowercase()\n        return all().filter {\n            it.name.lowercase().contains(lower) ||\n                it.url.lowercase().contains(lower) ||\n                it.group.lowercase().contains(lower)\n        }\n    }\n\n    fun stats(): Stats = Stats(\n        total = items.size,\n        enabled = items.values.count { it.enabled },\n        disabled = items.values.count { !it.enabled },\n        groups = groups().size,\n        userEdited = items.values.count { it.userEdited }\n    )\n\n    // ============================ 安装 / 升级 ============================\n\n    /**\n     * 批量安装（导入的主入口）。\n     *\n     * 单条无效不影响其它条目；整个过程不抛异常。\n     * 新增条的 sortOrder 接在现有最大值之后，保证导入不会打乱用户已有排序。\n     */\n    fun install(incoming: List<InstalledSource>): InstallReport {\n        val added = ArrayList<String>()\n        val updated = ArrayList<String>()\n        val unchanged = ArrayList<String>()\n        val protectedList = ArrayList<String>()\n        val invalid = ArrayList<String>()\n        var deduped = 0\n\n        // 输入内部先去重：同一份文件里重复的 url 以后出现的为准\n        val dedupedInput = LinkedHashMap<String, InstalledSource>()\n        incoming.forEach { src ->\n            if (dedupedInput.put(src.url, src) != null) deduped++\n        }\n\n        var cursor = (items.values.maxOfOrNull { it.sortOrder } ?: 0) + 1\n\n        dedupedInput.forEach { (url, src) ->\n            if (url.isBlank() || !SourceValidator.isHttpUrl(url)) {\n                invalid.add(url.ifBlank { \"(空地址)\" })\n                return@forEach\n            }\n            val existing = items[url]\n            if (existing == null) {\n                items[url] = src.copy(sortOrder = cursor++, url = url)\n                added.add(url)\n                return@forEach\n            }\n            // 用户手工改过的配置受保护，任何升级都不覆盖\n            if (existing.userEdited) {\n                protectedList.add(url)\n                return@forEach\n            }\n            if (src.updatedAt > existing.updatedAt) {\n                items[url] = src.copy(\n                    url = url,\n                    // 保留用户本地的启用状态与排序，升级只换配置内容\n                    enabled = existing.enabled,\n                    sortOrder = existing.sortOrder,\n                    userEdited = false\n                )\n                updated.add(url)\n            } else {\n                unchanged.add(url)\n            }\n        }\n\n        return InstallReport(added, updated, unchanged, protectedList, invalid, deduped)\n    }\n\n    /** 安装单个书源，等价于批量安装一条。 */\n    fun installOne(src: InstalledSource): InstallReport = install(listOf(src))\n\n    // ============================ 增删改 ============================\n\n    /** 删除单个。 */\n    fun remove(url: String): Boolean = items.remove(url) != null\n\n    /** 删除整组，返回删除条数。 */\n    fun removeGroup(group: String): Int {\n        val targets = items.values.filter { it.group == group }.map { it.url }\n        targets.forEach { items.remove(it) }\n        return targets.size\n    }\n\n    /** 启用 / 停用。 */\n    fun setEnabled(url: String, enabled: Boolean): Boolean {\n        val cur = items[url] ?: return false\n        if (cur.enabled == enabled) return false\n        items[url] = cur.copy(enabled = enabled)\n        return true\n    }\n\n    /** 批量启用 / 停用，返回受影响条数。 */\n    fun setEnabled(urls: Collection<String>, enabled: Boolean): Int =\n        urls.count { setEnabled(it, enabled) }\n\n    /** 移动分组。 */\n    fun moveToGroup(url: String, group: String): Boolean {\n        val cur = items[url] ?: return false\n        val target = group.ifBlank { DEFAULT_GROUP }\n        if (cur.group == target) return false\n        items[url] = cur.copy(group = target)\n        return true\n    }\n\n    /** 重命名。改名视为用户手工编辑，后续导入不覆盖。 */\n    fun rename(url: String, name: String): Boolean {\n        val cur = items[url] ?: return false\n        val target = name.trim()\n        if (target.isEmpty() || target == cur.name) return false\n        items[url] = cur.copy(name = target, userEdited = true)\n        return true\n    }\n\n    /** 显式标记为「用户已编辑」，用于设置页保存后调用。 */\n    fun markUserEdited(url: String, edited: Boolean = true): Boolean {\n        val cur = items[url] ?: return false\n        if (cur.userEdited == edited) return false\n        items[url] = cur.copy(userEdited = edited)\n        return true\n    }\n\n    /** 写入校验摘要（不改动 userEdited 状态）。 */\n    fun updateValidateSummary(url: String, summary: String): Boolean {\n        val cur = items[url] ?: return false\n        if (cur.validateSummary == summary) return false\n        items[url] = cur.copy(validateSummary = summary)\n        return true\n    }\n\n    /**\n     * 按给定顺序重排。\n     *\n     * 只接受已在仓库中的地址，未列出的条目保持原有相对顺序排在后面——\n     * 这样界面拖拽某几项时不会意外打乱其它分组。\n     */\n    fun reorder(urls: List<String>): Boolean {\n        val known = urls.filter { items.containsKey(it) }\n        if (known.isEmpty()) return false\n        var cursor = 0\n        known.forEach { url ->\n            val cur = items[url] ?: return@forEach\n            items[url] = cur.copy(sortOrder = cursor++)\n        }\n        val rest = items.values.filter { it.url !in known }.sortedBy { it.sortOrder }\n        rest.forEach { cur ->\n            items[cur.url] = cur.copy(sortOrder = cursor++)\n        }\n        return true\n    }\n\n    /** 导出指定分组（[group] 为 null 时导出全部），按当前排序。 */\n    fun export(group: String? = null): List<InstalledSource> =\n        if (group == null) all() else all().filter { it.group == group }\n\n    /** 用校验器体检单个书源，返回摘要字符串。 */\n    fun validate(url: String): String {\n        val cur = items[url] ?: return \"书源不存在\"\n        val report = SourceValidator.validateBook(\n            bookSourceUrl = cur.url,\n            bookSourceName = cur.name,\n            searchUrl = null,\n            ruleSearch = null,\n            exploreUrl = null,\n            enabledExplore = false,\n            ruleToc = null,\n            ruleContent = null,\n            loginUrl = null,\n            bookSourceType = cur.type\n        )\n        return report.summary()\n    }\n\n    companion object {\n        /** 默认分组名。 */\n        const val DEFAULT_GROUP = \"未分组\"\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rss/LegadoRssSource.kt","lang":"kt","lines":199,"content":"package com.lanyue.reader.source.rss\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.engine.RssFallbackParser\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.source.model.CapabilityResolver\nimport com.lanyue.reader.source.model.ContentResult\nimport com.lanyue.reader.source.model.ISubscriptionSource\nimport com.lanyue.reader.source.model.RssContentType\nimport com.lanyue.reader.source.model.SortRule\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.lanyue.reader.source.model.SubscriptionItem\nimport com.lanyue.reader.source.rule.RuleEngine\nimport com.lanyue.reader.source.rule.SortUrlParser\nimport com.lanyue.reader.source.rule.UrlTemplate\nimport com.google.gson.JsonParser\n\n/**\n * 7.2 订阅源实现（Legado RssSource）。\n *\n * 与书源的结构性差异（1.4.5）：\n * - 无目录层（ADR-012：无 getToc）\n * - 规则是扁平字符串，不是嵌套对象\n * - ruleArticles 为空时走内置 RSS/Atom 兜底（ADR-016）\n * - 搜索为览阅扩展：searchUrl 非空即可搜，结果复用列表规则\n */\nclass LegadoRssSource(\n    private val entity: RssSourceEntity,\n    private val net: NetworkDispatcher,\n    private val rules: RuleEngine,\n    private val sortParser: SortUrlParser,\n    private val rssFallback: RssFallbackParser,\n    private val metrics: LocalMetrics\n) : ISubscriptionSource {\n\n    override val sourceId: String = entity.sourceUrl\n\n    override val sourceType: SourceType = SourceType.SUBSCRIPTION\n\n    override val capabilityFlags: Set<SourceCapability> = CapabilityResolver.ofRss(entity)\n\n    override val concurrentRate: RateLimit? = parseRate(entity.concurrentRate)\n\n    /**\n     * 1.4.4 sortUrl 解析。动态生成失败时降级为无分类。\n     * 1.4.2 DISCOVERABLE 的二次确认：必须真的解析出 ≥1 分类。\n     */\n    override suspend fun getSorts(): List<SortRule> {\n        val result = sortParser.parse(entity.sortUrl, sourceId, sourceId + \":sorts\")\n        return result.sorts\n    }\n\n    override suspend fun getArticles(sort: SortRule?, page: Int): List<SubscriptionItem> {\n        val url = if (sort != null) UrlTemplate.fillPage(sort.url, page) else entity.sourceUrl\n        val html = fetch(url, \"articles\")\n        val ctx = RuleEngine.RuleContext(url, sourceId, sourceId + \":articles\")\n\n        // ADR-016：ruleArticles 为空 -> RSS/Atom 兜底\n        if (entity.ruleArticles.isNullOrBlank()) {\n            val feed = rssFallback.parse(html) ?: return emptyList()\n            return feed.items.map { item ->\n                SubscriptionItem(\n                    title = item.title ?: \"\",\n                    url = item.link ?: \"\",\n                    cover = item.image,\n                    pubDate = parseDate(item.pubDate),\n                    description = item.description,\n                    sort = sort?.name,\n                    origin = sourceId,\n                    contentType = contentTypeOf(entity.type)\n                )\n            }.filter { it.url.isNotEmpty() }\n        }\n\n        return parseListItems(html, ctx, sort?.name)\n    }\n\n    /** 1.4.3 搜索：占位符替换 -> 列表规则解析；失败由上层计数降级。 */\n    override suspend fun search(key: String, page: Int): List<SubscriptionItem> {\n        val searchUrl = entity.searchUrl ?: return emptyList()\n        val url = UrlTemplate.fill(searchUrl, key, page)\n        val html = fetch(url, \"search\")\n        val ctx = RuleEngine.RuleContext(url, sourceId, sourceId + \":search\")\n        return parseListItems(html, ctx, null)\n    }\n\n    override suspend fun getContent(url: String): ContentResult {\n        // 1.4.1 ruleContent 为空 -> WebView 原样打开\n        if (entity.ruleContent.isNullOrBlank()) {\n            return ContentResult.WebViewFallback(url)\n        }\n        val html = fetch(url, \"content\")\n        val ctx = RuleEngine.RuleContext(url, sourceId, sourceId + \":content\")\n        val body = rules.evalString(html, entity.ruleContent, ctx)\n        return if (body.isNullOrBlank()) {\n            ContentResult.WebViewFallback(url)\n        } else {\n            ContentResult.Html(body)\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    private suspend fun fetch(url: String, op: String): String {\n        val traceId = sourceId + \":\" + op\n        val resp = net.execute(\n            HttpRequest(\n                url = url,\n                method = \"GET\",\n                headers = parseHeader(),\n                sourceId = sourceId\n            ),\n            limit = concurrentRate,\n            traceId = traceId\n        )\n        if (!resp.isSuccess) {\n            metrics.failure(traceId, \"rss_source\", \"HTTP_\" + resp.code)\n            throw NetworkException(\"http \" + resp.code + \" for \" + url, resp.code)\n        }\n        return resp.body ?: \"\"\n    }\n\n    private suspend fun parseListItems(\n        html: String,\n        ctx: RuleEngine.RuleContext,\n        sortName: String?\n    ): List<SubscriptionItem> {\n        val articleRule = entity.ruleArticles ?: return emptyList()\n        val titles = rules.evalList(html, articleRule + \"@\" + (entity.ruleTitle ?: \"text\"), ctx)\n        if (titles.isEmpty()) return emptyList()\n\n        val links = rules.evalList(html, articleRule + \"@\" + (entity.ruleLink ?: \"href\"), ctx)\n        val covers = entity.ruleImage?.let { rules.evalList(html, articleRule + \"@\" + it, ctx) }.orEmpty()\n        val dates = entity.rulePubDate?.let { rules.evalList(html, articleRule + \"@\" + it, ctx) }.orEmpty()\n        val descs = entity.ruleDescription?.let { rules.evalList(html, articleRule + \"@\" + it, ctx) }.orEmpty()\n\n        return titles.mapIndexedNotNull { index, title ->\n            val link = links.getOrNull(index)\n            if (link.isNullOrBlank()) return@mapIndexedNotNull null\n            SubscriptionItem(\n                title = title,\n                url = link,\n                cover = covers.getOrNull(index),\n                pubDate = parseDate(dates.getOrNull(index)),\n                description = descs.getOrNull(index),\n                sort = sortName,\n                origin = sourceId,\n                contentType = contentTypeOf(entity.type)\n            )\n        }\n    }\n\n    /** 1.4.1 type：0 网页 / 1 图片 / 2 视频。 */\n    private fun contentTypeOf(type: Int): RssContentType = when (type) {\n        1 -> RssContentType.IMAGE\n        2 -> RssContentType.VIDEO\n        else -> RssContentType.WEB\n    }\n\n    private fun parseDate(raw: String?): Long? {\n        if (raw.isNullOrBlank()) return null\n        val formats = listOf(\n            \"yyyy-MM-dd HH:mm:ss\",\n            \"yyyy-MM-dd'T'HH:mm:ss\",\n            \"EEE, dd MMM yyyy HH:mm:ss Z\",\n            \"yyyy-MM-dd\"\n        )\n        formats.forEach { pattern ->\n            val parsed = runCatching {\n                java.text.SimpleDateFormat(pattern, java.util.Locale.US)\n                    .parse(raw.trim())?.time\n            }.getOrNull()\n            if (parsed != null) return parsed\n        }\n        return raw.toLongOrNull()\n    }\n\n    private fun parseHeader(): Map<String, String> {\n        val raw = entity.header ?: return emptyMap()\n        return runCatching {\n            JsonParser.parseString(raw).asJsonObject.entrySet()\n                .associate { it.key to it.value.asString }\n        }.getOrDefault(emptyMap())\n    }\n\n    private fun parseRate(raw: String?): RateLimit? {\n        if (raw.isNullOrBlank()) return null\n        val parts = raw.split(\"/\", \",\").map { it.trim() }.filter { it.isNotEmpty() }\n        if (parts.size < 2) return null\n        val permits = parts[0].toIntOrNull() ?: return null\n        val period = parts[1].toLongOrNull() ?: return null\n        return RateLimit(permits, period)\n    }\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rule/JsonPath.kt","lang":"kt","lines":334,"content":"package com.lanyue.reader.source.rule\n\nimport com.google.gson.JsonArray\nimport com.google.gson.JsonElement\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\n\n/**\n * 7.1 JSONPath 求值器（纯 Kotlin，无 Android / 无网络）。\n *\n * Legado 书源里 `$.` 开头的规则很常见，早期实现把它当 CSS 处理，必然取不到值。\n * 这里实现一个够用的子集：\n *\n *   $.data.list[*].name         字段 + 通配\n *   $.data.list[0]              下标（负数表示倒数）\n *   $..name                     递归下降\n *   $.list[1:4]                 切片（含头不含尾，支持负数与省略端点）\n *   $.list[?(@.type=='book')]   过滤：字符串 / 数字 / 布尔 / 存在性\n *   $.list[?(@.wordCount>1000)] 比较：> >= < <= != ==\n *   $['weird name']             方括号字符串键\n *\n * 设计取舍：\n * - 不引入第三方 JSONPath 库（体积、反射、不可测），保持纯函数可单测。\n * - 解析失败一律返回空列表而不是抛异常：源配置写错表现为\"取不到\"，不应让整章崩掉。\n */\nobject JsonPath {\n\n    /** 在 JSON 文本上求值；文本非法返回空列表。 */\n    fun selectText(json: String, path: String): List<JsonElement> {\n        val root = runCatching { JsonParser.parseString(json) }.getOrNull() ?: return emptyList()\n        return select(root, path)\n    }\n\n    /** 在已解析的 JsonElement 上求值。 */\n    fun select(root: JsonElement, path: String): List<JsonElement> {\n        val steps = parse(path) ?: return emptyList()\n        var current = listOf(root)\n        for (step in steps) {\n            if (current.isEmpty()) return emptyList()\n            current = current.flatMap { apply(it, step) }\n        }\n        return current.filter { !it.isJsonNull }\n    }\n\n    /** 转字符串：标量取文本，对象/数组保留 JSON 文本。 */\n    fun toStrings(elements: List<JsonElement>): List<String> =\n        elements.map { el -> if (el.isJsonPrimitive) el.asString else el.toString() }\n            .filter { it.isNotEmpty() }\n\n    /** 取第一个非空结果。 */\n    fun firstString(json: String, path: String): String? =\n        toStrings(selectText(json, path)).firstOrNull { it.isNotEmpty() }\n\n    /** 是否像 JSONPath（`$` 开头且后接 `.` 或 `[`）。 */\n    fun looksLikeJsonPath(rule: String): Boolean {\n        val t = rule.trim()\n        return t.startsWith(\"$\") && (t.length == 1 || t[1] == '.' || t[1] == '[')\n    }\n\n    // ---------------- 步骤 / 谓词 ----------------\n\n    sealed interface Step {\n        data class Field(val name: String) : Step\n        data class Index(val index: Int) : Step\n        data object Wildcard : Step\n        data class Slice(val start: Int?, val end: Int?) : Step\n        data class Recursive(val name: String) : Step\n        data class Filter(val predicate: Predicate) : Step\n    }\n\n    sealed interface Predicate {\n        data class Exists(val field: String) : Predicate\n        data class Equals(val field: String, val value: String, val numeric: Boolean) : Predicate\n        data class NotEquals(val field: String, val value: String, val numeric: Boolean) : Predicate\n        data class Compare(val field: String, val op: String, val value: Double) : Predicate\n    }\n\n    // ---------------- 解析 ----------------\n\n    /** 解析成步骤序列；语法非法返回 null。 */\n    fun parse(path: String): List<Step>? {\n        val t = path.trim()\n        if (t.isEmpty()) return null\n        var i = if (t.startsWith(\"$\")) 1 else 0\n        val steps = ArrayList<Step>()\n\n        while (i < t.length) {\n            when {\n                t.startsWith(\"..\", i) -> {\n                    i += 2\n                    val name = readName(t, i) ?: return null\n                    if (name.isEmpty()) return null\n                    steps.add(Step.Recursive(name))\n                    i += name.length\n                }\n                t[i] == '.' -> {\n                    i++\n                    if (i < t.length && t[i] == '*') {\n                        steps.add(Step.Wildcard)\n                        i++\n                    } else {\n                        val name = readName(t, i) ?: return null\n                        if (name.isEmpty()) return null\n                        steps.add(Step.Field(name))\n                        i += name.length\n                    }\n                }\n                t[i] == '[' -> {\n                    val close = matchBracket(t, i)\n                    if (close < 0) return null\n                    val step = parseBracket(t.substring(i + 1, close).trim()) ?: return null\n                    steps.add(step)\n                    i = close + 1\n                }\n                else -> return null\n            }\n        }\n        return steps\n    }\n\n    private fun readName(t: String, from: Int): String? {\n        var i = from\n        while (i < t.length && t[i] != '.' && t[i] != '[') i++\n        val name = t.substring(from, i)\n        // 名字含空白说明路径畸形（避免把 \"a b\" 当字段名静默取空）\n        if (name.any { it.isWhitespace() }) return null\n        return name\n    }\n\n    /** 返回与 [open] 处 `[` 配对的 `]` 下标；不配对返回 -1。 */\n    private fun matchBracket(t: String, open: Int): Int {\n        var depth = 0\n        var inSingle = false\n        var inDouble = false\n        var i = open\n        while (i < t.length) {\n            val c = t[i]\n            when {\n                inSingle -> if (c == '\\'') inSingle = false\n                inDouble -> if (c == '\"') inDouble = false\n                c == '\\'' -> inSingle = true\n                c == '\"' -> inDouble = true\n                c == '[' -> depth++\n                c == ']' -> {\n                    depth--\n                    if (depth == 0) return i\n                }\n            }\n            i++\n        }\n        return -1\n    }\n\n    private fun parseBracket(inner: String): Step? {\n        if (inner.isEmpty()) return null\n        if (inner == \"*\") return Step.Wildcard\n        if (inner.startsWith(\"?\")) return parseFilter(inner)\n\n        if ((inner.startsWith(\"'\") && inner.endsWith(\"'\")) ||\n            (inner.startsWith(\"\\\"\") && inner.endsWith(\"\\\"\"))\n        ) {\n            return Step.Field(inner.substring(1, inner.length - 1))\n        }\n\n        if (inner.contains(\":\")) {\n            val parts = inner.split(\":\")\n            if (parts.size > 2) return null\n            val rawStart = parts.getOrNull(0)?.trim().orEmpty()\n            val rawEnd = parts.getOrNull(1)?.trim().orEmpty()\n            val start = if (rawStart.isEmpty()) null else rawStart.toIntOrNull()\n            val end = if (rawEnd.isEmpty()) null else rawEnd.toIntOrNull()\n            // 写了内容却不是合法整数 -> 语法错误，不当作端点省略\n            if (rawStart.isNotEmpty() && start == null) return null\n            if (rawEnd.isNotEmpty() && end == null) return null\n            return Step.Slice(start, end)\n        }\n\n        val idx = inner.toIntOrNull() ?: return null\n        return Step.Index(idx)\n    }\n\n    private fun parseFilter(inner: String): Step? {\n        var body = inner.removePrefix(\"?\").trim()\n        if (body.startsWith(\"(\") && body.endsWith(\")\")) {\n            body = body.substring(1, body.length - 1).trim()\n        }\n        if (!body.startsWith(\"@\")) return null\n        var expr = body.removePrefix(\"@\").trim()\n        if (expr.startsWith(\".\")) expr = expr.substring(1)\n\n        // 纯存在性：?(@.field)\n        if (expr.none { it in \"=<>!\" }) {\n            return if (expr.isEmpty()) null else Step.Filter(Predicate.Exists(expr))\n        }\n\n        // 先长后短匹配运算符，避免 \">=\" 被 \">\" 抢先\n        val op = listOf(\"==\", \"!=\", \">=\", \"<=\", \">\", \"<\").firstOrNull { expr.contains(it) }\n            ?: return null\n        val at = expr.indexOf(op)\n        val field = expr.substring(0, at).trim()\n        if (field.isEmpty()) return null\n\n        val rawRight = expr.substring(at + op.length).trim()\n        val quoted = rawRight.length >= 2 &&\n            ((rawRight.startsWith(\"'\") && rawRight.endsWith(\"'\")) ||\n                (rawRight.startsWith(\"\\\"\") && rawRight.endsWith(\"\\\"\")))\n        val value = if (quoted) rawRight.substring(1, rawRight.length - 1) else rawRight\n        if (value.isEmpty()) return null\n\n        val numeric = !quoted && value.toDoubleOrNull() != null\n        return when (op) {\n            \"==\" -> Step.Filter(Predicate.Equals(field, value, numeric))\n            \"!=\" -> Step.Filter(Predicate.NotEquals(field, value, numeric))\n            else -> {\n                val num = value.toDoubleOrNull() ?: return null\n                Step.Filter(Predicate.Compare(field, op, num))\n            }\n        }\n    }\n\n    // ---------------- 求值 ----------------\n\n    private fun apply(element: JsonElement, step: Step): List<JsonElement> = when (step) {\n        is Step.Field -> {\n            val obj = if (element.isJsonObject) element.asJsonObject else return emptyList()\n            val v = obj.get(step.name) ?: return emptyList()\n            listOf(v)\n        }\n        is Step.Index -> {\n            val arr = if (element.isJsonArray) element.asJsonArray else return emptyList()\n            val idx = if (step.index < 0) arr.size() + step.index else step.index\n            if (idx !in 0 until arr.size()) emptyList() else listOf(arr.get(idx))\n        }\n        Step.Wildcard -> when {\n            element.isJsonArray -> toList(element.asJsonArray)\n            element.isJsonObject -> element.asJsonObject.entrySet().map { it.value }\n            else -> emptyList()\n        }\n        is Step.Slice -> {\n            val arr = if (element.isJsonArray) element.asJsonArray else return emptyList()\n            val size = arr.size()\n            var s = step.start ?: 0\n            var e = step.end ?: size\n            if (s < 0) s += size\n            if (e < 0) e += size\n            s = s.coerceIn(0, size)\n            e = e.coerceIn(0, size)\n            if (e <= s) emptyList() else toList(arr).subList(s, e)\n        }\n        is Step.Recursive -> {\n            val out = ArrayList<JsonElement>()\n            collectByName(element, step.name, out, 0)\n            out\n        }\n        is Step.Filter -> {\n            val arr = if (element.isJsonArray) element.asJsonArray else return emptyList()\n            toList(arr).filter { matches(it, step.predicate) }\n        }\n    }\n\n    private fun toList(arr: JsonArray): List<JsonElement> = (0 until arr.size()).map { arr.get(it) }\n\n    /** 递归下降；深度设上限，防止畸形深层 JSON 栈溢出。 */\n    private fun collectByName(\n        element: JsonElement,\n        name: String,\n        out: MutableList<JsonElement>,\n        depth: Int\n    ) {\n        if (depth > MAX_DEPTH) return\n        when {\n            element.isJsonObject -> {\n                for ((k, v) in element.asJsonObject.entrySet()) {\n                    if (k == name) out.add(v)\n                    collectByName(v, name, out, depth + 1)\n                }\n            }\n            element.isJsonArray -> {\n                for (child in toList(element.asJsonArray)) collectByName(child, name, out, depth + 1)\n            }\n        }\n    }\n\n    private fun matches(candidate: JsonElement, predicate: Predicate): Boolean {\n        if (!candidate.isJsonObject) return false\n        val obj = candidate.asJsonObject\n        return when (predicate) {\n            is Predicate.Exists -> {\n                val v = obj.get(predicate.field)\n                v != null && !v.isJsonNull\n            }\n            is Predicate.Equals ->\n                equality(obj, predicate.field, predicate.value, predicate.numeric, wantEqual = true)\n            is Predicate.NotEquals ->\n                equality(obj, predicate.field, predicate.value, predicate.numeric, wantEqual = false)\n            is Predicate.Compare -> {\n                val v = obj.get(predicate.field) ?: return false\n                if (!v.isJsonPrimitive || !v.asJsonPrimitive.isNumber) return false\n                val actual = v.asDouble\n                when (predicate.op) {\n                    \">\" -> actual > predicate.value\n                    \">=\" -> actual >= predicate.value\n                    \"<\" -> actual < predicate.value\n                    \"<=\" -> actual <= predicate.value\n                    else -> false\n                }\n            }\n        }\n    }\n\n    private fun equality(\n        obj: JsonObject,\n        field: String,\n        expected: String,\n        numeric: Boolean,\n        wantEqual: Boolean\n    ): Boolean {\n        val v = obj.get(field)\n        // 字段缺失时：!= 视为满足，== 视为不满足\n        if (v == null || v.isJsonNull) return !wantEqual\n        val hit = when {\n            numeric -> {\n                val isNum = v.isJsonPrimitive && v.asJsonPrimitive.isNumber\n                isNum && expected.toDoubleOrNull() != null && v.asDouble == expected.toDouble()\n            }\n            v.isJsonPrimitive && v.asJsonPrimitive.isBoolean -> v.asBoolean == expected.toBoolean()\n            v.isJsonPrimitive -> v.asString == expected\n            else -> false\n        }\n        return if (wantEqual) hit else !hit\n    }\n\n    private const val MAX_DEPTH = 64\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rule/RuleChain.kt","lang":"kt","lines":120,"content":"package com.lanyue.reader.source.rule\n\n/**\n * 7.1 规则编排层（纯函数，无 Android / 无 IO / 无 jsoup）。\n *\n * 把一条规则字符串拆成\"可执行步骤树\"，真正取数据的动作留给 RuleEngine。\n * 这样拆解顺序、优先级、空值语义都能在 JVM 单测里锁死。\n *\n * 支持的语法（自外向内依次生效）：\n *   A || B            备选：A 有结果就用 A，否则用 B\n *   A && B            并列：两段结果合并成一个列表\n *   sel##正则##替换     取数后做正则替换（替换段可含 $1）\n *   @put:{k:v} @get:{k} 变量写入 / 读取\n *   {{ 表达式 }}        结果模板拼接\n */\nobject RuleChain {\n\n    /** 一个最小可执行单元。 */\n    data class Segment(\n        /** 去掉变量指令与替换段之后的纯净规则。 */\n        val rule: String,\n        /** 待应用的正则替换（可能为 null）。 */\n        val replacement: RuleSyntax.RegexReplacement?,\n        /** 本段要写入的变量：key -> 规则。 */\n        val puts: List<Pair<String, String>>,\n        /** 本段依赖读取的变量名。 */\n        val gets: List<String>\n    )\n\n    /** 一组并列取数单元（`&&` 连接），结果按顺序合并。 */\n    data class Alternative(val segments: List<Segment>) {\n        val isEmpty: Boolean get() = segments.isEmpty() || segments.all { it.rule.isBlank() }\n    }\n\n    /** 完整规则计划：[alternatives] 之间是 `||` 备选关系。 */\n    data class Plan(val alternatives: List<Alternative>) {\n        val isEmpty: Boolean get() = alternatives.isEmpty() || alternatives.all { it.isEmpty }\n\n        /** 本计划声明的全部变量写入。 */\n        fun allPuts(): List<Pair<String, String>> = alternatives.flatMap { alt ->\n            alt.segments.flatMap { it.puts }\n        }\n\n        /** 本计划声明的全部变量读取。 */\n        fun allGets(): List<String> = alternatives.flatMap { alt ->\n            alt.segments.flatMap { it.gets }\n        }.distinct()\n    }\n\n    val Empty = Plan(emptyList())\n\n    /**\n     * 解析整条规则。\n     *\n     * 空规则返回 [Empty]，不抛异常——源配置里字段缺失是常态。\n     */\n    fun parse(rule: String?): Plan {\n        if (rule.isNullOrBlank()) return Empty\n\n        // 1. 先按 || 切备选。必须在最外层，保证 \"a||b##c\" 是 (a) || (b##c)\n        val altTexts = RuleSyntax.splitTopLevel(rule, SEP_OR)\n            .map { it.trim() }\n            .filter { it.isNotEmpty() }\n        if (altTexts.isEmpty()) return Empty\n\n        val alternatives = altTexts.map { altText ->\n            // 2. 再按 && 切并列段\n            val segTexts = RuleSyntax.splitTopLevel(altText, SEP_AND)\n                .map { it.trim() }\n                .filter { it.isNotEmpty() }\n            Alternative(segTexts.map { compileSegment(it) })\n        }\n        return Plan(alternatives)\n    }\n\n    /**\n     * 单段编译：变量指令 -> 正则替换 -> 剩余规则。\n     *\n     * 顺序不能反：`@put:{k:sel##a##b}` 里的 `##` 属于 put 的 value，\n     * 必须先把指令整块摘掉，再对剩下的主体做替换解析。\n     */\n    fun compileSegment(raw: String): Segment {\n        val vars = RuleSyntax.parseVarDirectives(raw)\n        val (base, replacement) = RuleSyntax.parseRegexReplacement(vars.rule)\n        return Segment(\n            rule = base.trim(),\n            replacement = replacement,\n            puts = vars.puts,\n            gets = vars.gets\n        )\n    }\n\n    /**\n     * 判断一个备选是否\"应该被采用\"：有任意非空结果。\n     *\n     * 单列抽出来是为了让 `||` 的短路语义可测，\n     * 也避免实现里出现 `result.isNotEmpty()` 与 `result.any{}` 两套标准。\n     */\n    fun shouldAccept(values: List<String>): Boolean = values.any { it.isNotEmpty() }\n\n    /**\n     * 应用替换并清理：替换后可能产生空串或纯空白，需要再过滤。\n     */\n    fun finish(values: List<String>, replacements: List<RuleSyntax.RegexReplacement?>): List<String> {\n        val repl = replacements.firstOrNull { it != null }\n        val mapped = if (repl == null) {\n            values\n        } else {\n            values.map { RuleSyntax.applyReplacement(it, repl) }\n        }\n        return mapped.map { it.trim() }.filter { it.isNotEmpty() }\n    }\n\n    /** 合并 `&&` 各段结果，保持段间顺序，段内顺序也保持。 */\n    fun merge(valuesPerSegment: List<List<String>>): List<String> =\n        valuesPerSegment.flatMap { seg -> seg.filter { it.isNotEmpty() } }\n\n    const val SEP_OR = \"||\"\n    const val SEP_AND = \"&&\"\n}\n"},{"path":"app/src/main/java/com/lanyue/reader/source/rule/RuleEngine.kt","lang":"kt","lines":428,"content":"package com.lanyue.reader.source.rule\n\nimport com.lanyue.reader.core.engine.DomParser\nimport com.lanyue.reader.core.engine.EngineErrorCode\nimport com.lanyue.reader.core.engine.EngineException\nimport com.lanyue.reader.core.engine.JsExecMode\nimport com.lanyue.reader.core.engine.JsRuntime\nimport com.lanyue.reader.core.engine.PoolTier\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.google.gson.JsonParser\nimport org.jsoup.nodes.Document\nimport org.jsoup.nodes.Element\nimport org.jsoup.select.Elements\n\n/**\n * 7.1 规则预处理 + 4.2 数据流分发。\n *\n * 规则形态（Legado 惯例）：\n *   class.xxx@tag.a@text            -> CSS 链式\n *   //div[@class=\"x\"]/a/text()      -> XPath（降级为 CSS 近似）\n *   $.data.list[*]                  -> JSONPath（简化实现）\n *   <js>...</js> 或 @js:...         -> 交 JsRuntime\n *   ## 正则替换                      -> replaceRegex\n *\n * 统一收敛在这里，源实现只声明规则字符串，不自己发明语法。\n */\nclass RuleEngine(\n    private val js: JsRuntime,\n    private val dom: DomParser,\n    private val metrics: LocalMetrics\n) {\n\n    /** 一条规则的解析上下文。 */\n    data class RuleContext(\n        val baseUrl: String,\n        val sourceId: String,\n        val traceId: String,\n        val variables: Map<String, String> = emptyMap()\n    )\n\n    /**\n     * 在一段 HTML 上执行规则，返回字符串列表。\n     *\n     * 整条规则交给 [RuleChain] 拆解：`||` 备选短路、`&&` 并列合并、\n     * `##` 正则替换、`@put/@get` 变量、`{{ }}` 模板。\n     * [rule] 为 null/空时返回空列表，不抛异常（源字段常为空）。\n     */\n    suspend fun evalList(\n        html: String,\n        rule: String?,\n        ctx: RuleContext,\n        needsRealDom: Boolean = false\n    ): List<String> {\n        val plan = RuleChain.parse(rule)\n        if (plan.isEmpty) return emptyList()\n\n        val vars = HashMap<String, String>()\n        plan.allGets().forEach { key -> ctx.variables[key]?.let { vars[key] = it } }\n\n        for (alt in plan.alternatives) {\n            if (alt.isEmpty) continue\n            val perSegment = ArrayList<List<String>>(alt.segments.size)\n            for (seg in alt.segments) {\n                val scope = ctx.copy(variables = vars.toMap())\n                val values = evalSegment(html, seg.rule, seg.replacement, scope, needsRealDom)\n                perSegment.add(values)\n                applyPuts(html, seg, vars, values, scope, needsRealDom)\n            }\n            val merged = RuleChain.merge(perSegment)\n            // 短路：第一个有结果的备选胜出，后面的不再请求（省远端流量）\n            if (RuleChain.shouldAccept(merged)) return merged\n        }\n        return emptyList()\n    }\n\n    /** 单值规则：取第一个。 */\n    suspend fun evalString(\n        html: String,\n        rule: String?,\n        ctx: RuleContext,\n        needsRealDom: Boolean = false\n    ): String? = evalList(html, rule, ctx, needsRealDom).firstOrNull()\n\n    /**\n     * 执行 `@put` 写入。\n     *\n     * value 自身是一条独立规则；为空或与主体规则相同时回落到本段结果，\n     * 这样 `sel@text@put:{title:}` 这种简写也能用。\n     */\n    private suspend fun applyPuts(\n        html: String,\n        seg: RuleChain.Segment,\n        vars: HashMap<String, String>,\n        values: List<String>,\n        ctx: RuleContext,\n        needsRealDom: Boolean\n    ) {\n        if (seg.puts.isEmpty()) return\n        seg.puts.forEach { (key, valueRule) ->\n            val trimmed = valueRule.trim()\n            val value = if (trimmed.isEmpty() || trimmed == seg.rule.trim()) {\n                values.firstOrNull()\n            } else {\n                val sub = RuleChain.compileSegment(trimmed)\n                evalSegment(html, sub.rule, sub.replacement, ctx, needsRealDom).firstOrNull()\n            }\n            if (!value.isNullOrEmpty()) vars[key] = value\n        }\n    }\n\n    /** 执行一个已拆解好的取数单元（变量指令已剥离）。 */\n    private suspend fun evalSegment(\n        html: String,\n        rawRule: String,\n        replacement: RuleSyntax.RegexReplacement?,\n        ctx: RuleContext,\n        needsRealDom: Boolean\n    ): List<String> {\n        val rule = resolveTemplate(rawRule, ctx)\n        // 纯 @put 段没有主体规则：返回空，puts 走「回落到本段结果」分支\n        if (rule.isBlank()) return emptyList()\n\n        val values: List<String> = when {\n            isJsRule(rule) -> runJsList(unwrapJs(rule), html, ctx)\n\n            // JSONPath：$.a.b / $..name / [?(@.x=='y')]\n            JsonPath.looksLikeJsonPath(rule) -> runJsonPath(html, rule)\n\n            // XPath：//div[@class='x']/a/text()  -> 翻译成 CSS 后复用选择器逻辑\n            XPathLite.looksLikeXPath(rule) -> runXPath(html, rule, ctx, needsRealDom)\n\n            else -> {\n                val doc = parseDomOrThrow(html, ctx, needsRealDom)\n                val split = splitJsTail(rule)\n                var selected = selectCss(doc, split.first, ctx.baseUrl)\n                val jsTail = split.second\n                if (jsTail != null) {\n                    selected = selected.map { v -> runJsString(jsTail, v, ctx) }\n                }\n                selected\n            }\n        }\n        return RuleChain.finish(values, listOf(replacement))\n    }\n\n    /**\n     * 替换 `{{ }}`：先查变量，再查内置名。无法求值时保留原样，\n     * 避免把整条规则打穿成空串而静默失败。\n     */\n    private fun resolveTemplate(rule: String, ctx: RuleContext): String {\n        if (!rule.contains(\"{{\")) return rule\n        return RuleSyntax.resolveTemplate(rule) { expr ->\n            when (expr) {\n                \"baseUrl\" -> ctx.baseUrl\n                \"sourceId\" -> ctx.sourceId\n                else -> ctx.variables[expr]\n            }\n        }\n    }\n\n    /** 显式取值指令。 */\n    private val EXPLICIT_DIRECTIVES = setOf(\"text\", \"textnodes\", \"ownhtml\", \"html\", \"all\", \"content\")\n\n    /** 可按属性名直接取值的高频 HTML 属性。 */\n    private val COMMON_ATTRS = setOf(\n        \"href\", \"src\", \"value\", \"alt\", \"title\", \"datetime\", \"poster\",\n        \"srcset\", \"id\", \"class\", \"style\", \"name\", \"type\", \"placeholder\"\n    )\n\n    /** 解析 DOM；失败统一转成带错误码的引擎异常。 */\n    private suspend fun parseDomOrThrow(html: String, ctx: RuleContext, needsRealDom: Boolean): Document {\n        val parseResult = dom.parse(html, ctx.baseUrl, needsRealDom, ctx.traceId)\n        return when (parseResult) {\n            is DomParser.ParseResult.Ok -> parseResult.document\n            is DomParser.ParseResult.Failed -> throw EngineException(\n                EngineErrorCode.SCRIPT_EXCEPTION,\n                \"dom parse failed: \" + parseResult.reason\n            )\n        }\n    }\n\n    /**\n     * JSONPath 求值。\n     *\n     * 非 JSON 响应直接判空而不是抛异常：同一字段在个别源上可能返回 HTML，\n     * 这属于\"取不到\"而不是\"程序错误\"，抛异常会让整章失败。\n     */\n
