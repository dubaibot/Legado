end fun getToc(url: String): List<TocItem> {\n        val html = fetchHtml(url, \"toc\")\n        val ctx = ruleContext(url, \"toc\")\n\n        val toc = runCatching { JsonParser.parseString(entity.ruleToc ?: \"{}\").asJsonObject }\n            .getOrElse { JsonObject() }\n\n        // chapterList 选中章节元素集合，再从中取名字与链接\n        val chapterListRule = toc.get(\"chapterList\")?.asString\n        if (chapterListRule.isNullOrBlank()) return emptyList()\n\n        val nameRule = toc.get(\"chapterName\")?.asString ?: \"text\"\n        val urlRule = toc.get(\"chapterUrl\")?.asString ?: \"href\"\n\n        val names = rules.evalList(html, chapterListRule + \"@\" + nameRule, ctx)\n        val links = rules.evalList(html, chapterListRule + \"@\" + urlRule, ctx)\n\n        return names.mapIndexed { index, name ->\n            TocItem(\n                title = name,\n                url = links.getOrNull(index) ?: url,\n                index = index\n            )\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    private suspend fun fetchHtml(url: String, op: String): String {\n        val traceId = sourceId + \":\" + op\n        val response = net.execute(\n            HttpRequest(\n                url = url,\n                method = \"GET\",\n                headers = parseHeader(),\n                sourceId = sourceId\n            ),\n            limit = concurrentRate,\n            traceId = traceId\n        )\n        if (!response.isSuccess) {\n            metrics.failure(traceId, \"book_source\", \"HTTP_\" + response.code)\n            throw NetworkException(\"http \" + response.code + \" for \" + url, response.code)\n        }\n        return response.body ?: \"\"\n    }\n\n    private suspend fun parseBookItems(\n        html: String,\n        listRule: String?,\n        ctx: RuleEngine.RuleContext\n    ): List<SearchBookItem> {\n        if (listRule.isNullOrBlank()) return emptyList()\n\n        val names = rules.evalList(html, listRule, ctx)\n        if (names.isEmpty()) return emptyList()\n\n        val links = rules.evalList(html, listRule + \"@attr:href\", ctx)\n        return names.mapIndexedNotNull { index, name ->\n            val link = links.getOrNull(index)\n            if (link.isNullOrBlank()) return@mapIndexedNotNull null\n            SearchBookItem(\n                name = name,\n                bookUrl = link,\n                origin = sourceId,\n                originName = entity.bookSourceName\n            )\n        }\n    }\n\n    /** ruleSearch 嵌套对象里的 bookList。 */\n    private fun searchBookListRule(): String? {\n        val raw = entity.ruleSearch ?: return null\n        if (!raw.trimStart().startsWith(\"{\")) return raw\n        return runCatching {\n            JsonParser.parseString(raw).asJsonObject.get(\"bookList\")?.asString\n        }.getOrNull()\n    }\n\n    /** 1.4.7 音频 URL 解析：纯 URL，或 JSON 含 url 字段，或 ,{headers JSON} 后缀。 */\n    private fun parseAudioResult(raw: String): ContentResult {\n        var url = raw.trim()\n        var headers: Map<String, String> = emptyMap()\n\n        // Legado 惯例：URL 后缀 ,{headers JSON} 注入请求头（防盗链必需）\n        val commaIdx = url.lastIndexOf(\",{\")\n        if (commaIdx > 0 && url.endsWith(\"}\")) {\n            val jsonPart = url.substring(commaIdx + 1)\n            val parsed = runCatching {\n                JsonParser.parseString(jsonPart).asJsonObject.entrySet()\n                    .associate { it.key to it.value.asString }\n            }.getOrNull()\n            if (parsed != null) {\n                headers = parsed\n                url = url.substring(0, commaIdx)\n            }\n        }\n\n        // JSON 形态：{\"url\": \"...\"}\n        if (url.startsWith(\"{\")) {\n            val objUrl = runCatching {\n                JsonParser.parseString(url).asJsonObject.get(\"url\")?.asString\n            }.getOrNull()\n            if (objUrl != null) return ContentResult.Audio(objUrl, headers)\n        }\n\n        return ContentResult.Audio(url, headers)\n    }\n\n    private fun ruleContext(url: String, op: String) = RuleEngine.RuleContext(\n        baseUrl = url,\n        sourceId = sourceId,\n        traceId = sourceId + \":\" + op\n    )\n\n    /** 源 header 字段：JSON 对象字符串。 */\n    private fun parseHeader(): Map<String, String> {\n        val raw = entity.header ?: return emptyMap()\n        return runCatching {\n            JsonParser.parseString(raw).asJsonObject.entrySet()\n                .associate { it.key to it.value.asString }\n        }.getOrDefault(emptyMap())\n    }\n\n    /** concurrentRate 字符串 \"permits/periodMs\" 或 \"permits,periodMs\"。 */\n    private fun parseRate(raw: String?): RateLimit? {\n        if (raw.isNullOrBlank()) return null\n        val parts = raw.split(\"/\", \",\")\n            .map { it.trim() }\n            .filter { it.isNotEmpty() }\n        if (parts.size < 2) return null\n        val permits = parts[0].toIntOrNull() ?: return null\n        val period = parts[1].toLongOrNull() ?: return null\n        return RateLimit(permits, period)\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/danmaku/DandanplaySource.kt", "lang": "kt", "lines": 245, "content": "package com.lanyue.reader.source.danmaku\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport com.lanyue.reader.source.model.DanmakuMatch\nimport com.lanyue.reader.source.model.DanmakuMatchRequest\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\nimport java.net.URLEncoder\n\n/**\n * 7.5 弹幕源（dandanplay v2 兼容 REST）。\n *\n * 端点：\n * - POST /api/v2/match          {fileName, fileHash, fileSize, videoDuration, matchMode}\n * - GET  /api/v2/search/episodes?anime=&episode=\n * - GET  /api/v2/comment/{episodeId}?withRelated=true&chConvert=1&from={ms}&duration={ms}\n *\n * 官方源签名：X-AppId / X-Timestamp / X-Signature\n *   签名算法以官方开放平台文档为准（社区常见 SHA256(appId + timestamp + appSecret)，\n *   实现前须核对 —— TODO-DEV-4）\n */\nclass DandanplaySource(\n    private val entity: DanmakuSourceEntity,\n    private val net: NetworkDispatcher,\n    private val metrics: LocalMetrics,\n    private val secretProvider: (String) -> String?\n) : IDanmakuSource {\n\n    override val sourceId: String = entity.id\n\n    override val sourceType: SourceType = SourceType.DANMAKU\n\n    /** 5.5 弹幕源：无 JS（REST），GET + POST（仅 dandanplay v2 端点）。 */\n    override val capabilityFlags: Set<SourceCapability> =\n        setOf(SourceCapability.SEARCHABLE, SourceCapability.HAS_CONTENT, SourceCapability.HIGH_PRIORITY)\n\n    override val concurrentRate: RateLimit? = RateLimit(5, 1000)\n\n    private val base: String get() = entity.apiBase.trimEnd('/')\n\n    override suspend fun match(req: DanmakuMatchRequest): DanmakuMatch? {\n        // 7.5 / 4.10.3 本地文件：POST /api/v2/match\n        val payload = JsonObject().apply {\n            addProperty(\"fileName\", req.fileName ?: req.title)\n            addProperty(\"fileHash\", req.fileHash ?: \"\")\n            addProperty(\"fileSize\", req.fileSize ?: 0L)\n            addProperty(\"videoDuration\", req.durationMs ?: 0L)\n            addProperty(\"matchMode\", \"hashAndFileName\")\n        }.toString()\n\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(\n                    url = base + \"/api/v2/match\",\n                    method = \"POST\",\n                    headers = signedHeaders(),\n                    body = payload.toByteArray(),\n                    sourceId = sourceId\n                ),\n                limit = concurrentRate,\n                traceId = sourceId + \":match\"\n            )\n        }.getOrNull() ?: return null\n\n        if (!resp.isSuccess) return null\n        val json = runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: return null\n\n        if (json.get(\"isMatched\")?.asBoolean == true) {\n            val matches = json.getAsJsonArray(\"matches\") ?: return null\n            return pickBest(matches.map { it.asJsonObject }, req.title, req.episode)\n        }\n        return null\n    }\n\n    override suspend fun search(key: String): List<DanmakuMatch> {\n        return searchEpisodes(key, null)\n    }\n\n    /** 4.10.3 在线影视：GET /api/v2/search/episodes?anime=&episode= */\n    suspend fun searchEpisodes(anime: String, episode: Int?): List<DanmakuMatch> {\n        val sb = StringBuilder(base)\n        sb.append(\"/api/v2/search/episodes?anime=\").append(URLEncoder.encode(anime, \"UTF-8\"))\n        if (episode != null) sb.append(\"&episode=\").append(episode)\n\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(\n                    url = sb.toString(),\n                    method = \"GET\",\n                    headers = signedHeaders(),\n                    sourceId = sourceId\n                ),\n                limit = concurrentRate,\n                traceId = sourceId + \":search\"\n            )\n        }.getOrNull() ?: return emptyList()\n\n        if (!resp.isSuccess) return emptyList()\n        val json = runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: return emptyList()\n\n        // 响应结构：{ success, animes: [ { animeTitle, episodes: [ {episodeId, episodeTitle} ] } ] }\n        val animes = json.getAsJsonArray(\"animes\") ?: return emptyList()\n        val out = mutableListOf<DanmakuMatch>()\n        animes.forEach { animeEl ->\n            val animeObj = runCatching { animeEl.asJsonObject }.getOrNull() ?: return@forEach\n            val animeTitle = animeObj.get(\"animeTitle\")?.asString ?: \"\"\n            animeObj.getAsJsonArray(\"episodes\")?.forEach { epEl ->\n                val epObj = runCatching { epEl.asJsonObject }.getOrNull() ?: return@forEach\n                val id = epObj.get(\"episodeId\")?.asLong ?: return@forEach\n                out += DanmakuMatch(\n                    episodeId = id,\n                    animeTitle = animeTitle,\n                    episodeTitle = epObj.get(\"episodeTitle\")?.asString ?: \"\",\n                    shift = epObj.get(\"shift\")?.asLong ?: 0L,\n                    sourceId = sourceId\n                )\n            }\n        }\n        return out\n    }\n\n    override suspend fun getComments(match: DanmakuMatch, fromMs: Long, durationMs: Long): List<DanmakuEvent> {\n        // 4.10.4 拉取：from/duration 为自建兼容源扩展参数（TODO-DEV-4 核对官方参数集）\n        val url = base + \"/api/v2/comment/\" + match.episodeId +\n            \"?withRelated=true&chConvert=1&from=\" + fromMs + \"&duration=\" + durationMs\n\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(url = url, method = \"GET\", headers = signedHeaders(), sourceId = sourceId),\n                limit = concurrentRate,\n                traceId = sourceId + \":comments\"\n            )\n        }.getOrNull() ?: return emptyList()\n\n        if (!resp.isSuccess) return emptyList()\n        val json = runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: return emptyList()\n\n        val comments = json.getAsJsonArray(\"comments\") ?: return emptyList()\n        return comments.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val p = obj.get(\"p\")?.asString ?: return@mapNotNull null\n            val text = obj.get(\"m\")?.asString ?: return@mapNotNull null\n            parseP(p, text)\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    /**\n     * 4.10.8 p 格式：出现时间(秒,浮点),弹幕模式,颜色,[来源]用户ID\n     * 模式 1=滚动 2=底部 3=顶部\n     */\n    private fun parseP(p: String, text: String): DanmakuEvent? {\n        val parts = p.split(\",\")\n        if (parts.size < 3) return null\n        val timeSec = parts[0].toDoubleOrNull() ?: return null\n        val mode = parts[1].toIntOrNull() ?: 1\n        val color = parts[2].toLongOrNull()?.toInt() ?: 0xFFFFFF\n        return DanmakuEvent(\n            timeMs = (timeSec * 1000).toLong(),\n            mode = mode,\n            color = color,\n            text = text,\n            source = sourceId\n        )\n    }\n\n    /**\n     * 4.10.3 多结果选取策略（策略单点定义，match 与 search 共用）：\n     * 1. 标题完全一致 > 2. 集数一致 > 3. 第一个结果\n     */\n    fun pickBest(candidates: List<JsonObject>, title: String, episode: Int?): DanmakuMatch? {\n        if (candidates.isEmpty()) return null\n\n        val mapped = candidates.mapNotNull { obj ->\n            val id = obj.get(\"episodeId\")?.asLong ?: return@mapNotNull null\n            DanmakuMatch(\n                episodeId = id,\n                animeTitle = obj.get(\"animeTitle\")?.asString ?: \"\",\n                episodeTitle = obj.get(\"episodeTitle\")?.asString ?: \"\",\n                shift = obj.get(\"shift\")?.asLong ?: 0L,\n                sourceId = sourceId\n            )\n        }\n        if (mapped.isEmpty()) return null\n\n        // 1. 标题完全一致\n        mapped.firstOrNull { it.animeTitle.equals(title, ignoreCase = true) }?.let { return it }\n\n        // 2. 集数一致\n        if (episode != null) {\n            mapped.firstOrNull { it.episodeTitle.contains(episode.toString()) }?.let { return it }\n        }\n\n        // 3. 第一个结果\n        return mapped.first()\n    }\n\n    /**\n     * 7.5 官方源签名。仅当配置了 appId + appSecret 时添加。\n     * 自建兼容源不填则直接可用。\n     */\n    private fun signedHeaders(): Map<String, String> {\n        val appId = entity.appId ?: return emptyMap()\n        val secret = secretProvider(entity.id) ?: return emptyMap()\n        val timestamp = (System.currentTimeMillis() / 1000).toString()\n        val signature = sha256Hex(appId + timestamp + secret)\n        return mapOf(\n            \"X-AppId\" to appId,\n            \"X-Timestamp\" to timestamp,\n            \"X-Signature\" to signature,\n            \"Content-Type\" to \"application/json\"\n        )\n    }\n\n    private fun sha256Hex(input: String): String {\n        val digest = java.security.MessageDigest.getInstance(\"SHA-256\")\n            .digest(input.toByteArray())\n        return digest.joinToString(\"\") { \"%02x\".format(it) }\n    }\n\n    /** 4.10.1 保存时探活校验。 */\n    suspend fun probe(): Boolean {\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(url = base + \"/api/v2/search/episodes?anime=test\", method = \"GET\", sourceId = sourceId),\n                limit = concurrentRate,\n                traceId = sourceId + \":probe\"\n            )\n        }.getOrNull()\n        return resp?.isSuccess == true\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/model/CapabilityResolver.kt", "lang": "kt", "lines": 48, "content": "package com.lanyue.reader.source.model\n\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\n\n/**\n * 1.4.2 能力判定表。\n * SourceRouter 调用前必须先过这里，缺失能力则不调用，避免把不支持的操作\n * 抛到源实现里变成异常。\n */\nobject CapabilityResolver {\n\n    /** 书源能力。 */\n    fun ofBook(e: BookSourceEntity): Set<SourceCapability> = buildSet {\n        // SEARCHABLE：searchUrl 非空 + ruleSearch 存在\n        if (!e.searchUrl.isNullOrBlank() && !e.ruleSearch.isNullOrBlank()) {\n            if (!e.searchDegraded) add(SourceCapability.SEARCHABLE)\n        }\n        // DISCOVERABLE：enabledExplore 且 exploreUrl 非空\n        if (e.enabledExplore && !e.exploreUrl.isNullOrBlank()) add(SourceCapability.DISCOVERABLE)\n        // HAS_CONTENT：ruleContent 非空\n        if (!e.ruleContent.isNullOrBlank()) add(SourceCapability.HAS_CONTENT)\n        if (!e.loginUrl.isNullOrBlank()) add(SourceCapability.HIGH_PRIORITY)\n    }\n\n    /**\n     * 订阅源能力。与书源的差异：\n     * - SEARCHABLE 只看 searchUrl（览阅扩展），无独立搜索规则\n     * - RSS_FALLBACK：ruleArticles 为空\n     */\n    fun ofRss(e: RssSourceEntity): Set<SourceCapability> = buildSet {\n        if (!e.searchUrl.isNullOrBlank() && !e.searchDegraded) add(SourceCapability.SEARCHABLE)\n        // DISCOVERABLE：sortUrl 非空（是否能解析出 ≥1 分类在解析后二次确认）\n        if (!e.sortUrl.isNullOrBlank()) add(SourceCapability.DISCOVERABLE)\n        if (!e.ruleContent.isNullOrBlank()) add(SourceCapability.HAS_CONTENT)\n        if (e.ruleArticles.isNullOrBlank()) add(SourceCapability.RSS_FALLBACK)\n    }\n\n    /**\n     * 影视站点能力。\n     * type 3 仅当 api 以 .js 结尾（drpy）才可用；jar 站点标记 unsupported。\n     */\n    fun ofVideoSite(e: VideoSiteEntity): Set<SourceCapability> = buildSet {\n        if (e.searchable) add(SourceCapability.SEARCHABLE)\n        if (e.filterable) add(SourceCapability.FILTERABLE)\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/model/SourceContracts.kt", "lang": "kt", "lines": 205, "content": "package com.lanyue.reader.source.model\n\nimport com.lanyue.reader.core.engine.RateLimit\n\n/**\n * 1.4.6 四类源统一接口。\n * 本文件是源体系的唯一契约入口，任何源实现都必须满足这里的形状。\n */\n\nenum class SourceType { BOOK, SUBSCRIPTION, VIDEO, DANMAKU }\n\n/** 1.4.2 能力判定 + 4/5 章扩展能力位。 */\nenum class SourceCapability {\n    SEARCHABLE,\n    DISCOVERABLE,\n    HAS_CONTENT,\n    RSS_FALLBACK,\n    FILTERABLE,\n    REAL_DOM,\n    BROWSER_FP,\n    SNIFF,\n    HIGH_PRIORITY\n}\n\ninterface ISource {\n    val sourceId: String\n    val sourceType: SourceType\n    val capabilityFlags: Set<SourceCapability>\n    val concurrentRate: RateLimit?\n}\n\n/** 1.4.6 排序/分类规则，书源与订阅源共用形状。 */\ndata class SortRule(val name: String, val url: String)\n\ndata class SearchBookItem(\n    val name: String,\n    val author: String? = null,\n    val bookUrl: String,\n    val cover: String? = null,\n    val intro: String? = null,\n    val latestChapter: String? = null,\n    val origin: String,\n    val originName: String? = null\n)\n\ndata class BookDetail(\n    val name: String,\n    val author: String? = null,\n    val cover: String? = null,\n    val intro: String? = null,\n    val kind: String? = null,\n    val lastChapter: String? = null,\n    val wordCount: String? = null,\n    val bookUrl: String\n)\n\ndata class TocItem(\n    val title: String,\n    val url: String,\n    val index: Int = 0\n)\n\n/**\n * 1.4.7 音频书源正文结果。\n * bookSourceType=1 时 ruleContent 返回纯 URL 或含 url 字段的 JSON，\n * SourceRouter 识别后直接注入 Media3 AudioPlay，不做 HTML 解析。\n */\nsealed class ContentResult {\n    /** 普通 HTML 正文。 */\n    data class Html(val html: String) : ContentResult()\n\n    /** 音频直链 + 可选请求头（防盗链）。 */\n    data class Audio(val url: String, val headers: Map<String, String> = emptyMap()) : ContentResult()\n\n    /** 无 ruleContent 的订阅源正文：交给 WebView 原样打开。 */\n    data class WebViewFallback(val url: String) : ContentResult()\n}\n\ninterface IBookSource : ISource {\n    suspend fun search(key: String, page: Int): List<SearchBookItem>\n    suspend fun explore(sort: SortRule, page: Int): List<SearchBookItem>\n    suspend fun getDetail(url: String): BookDetail\n    suspend fun getToc(url: String): List<TocItem>\n    /** 返回 HTML（1.4.6 契约）；音频源返回 Audio。 */\n    suspend fun getContent(url: String): ContentResult\n}\n\n/** 1.4.1 type 0 网页 / 1 图片 / 2 视频。 */\nenum class RssContentType { WEB, IMAGE, VIDEO }\n\ndata class SubscriptionItem(\n    val title: String,\n    val url: String,\n    val cover: String? = null,\n    val pubDate: Long? = null,\n    val description: String? = null,\n    val sort: String? = null,\n    val origin: String,\n    val contentType: RssContentType = RssContentType.WEB\n)\n\n/** 1.4.6 / ADR-012：独立接口，无 getToc。 */\ninterface ISubscriptionSource : ISource {\n    suspend fun getSorts(): List<SortRule>\n    suspend fun getArticles(sort: SortRule?, page: Int): List<SubscriptionItem>\n    suspend fun search(key: String, page: Int): List<SubscriptionItem>\n    /** 返回 HTML；无 ruleContent 时走 WebView。 */\n    suspend fun getContent(url: String): ContentResult\n}\n\n// ---------- 影视 ----------\n\ndata class Category(val name: String, val id: String)\n\n/** 7.3 CMS 筛选。ext.filter 结构。 */\ndata class Filter(val key: String, val name: String, val values: List<FilterValue>)\ndata class FilterValue(val name: String, val value: String)\n\ndata class VideoItem(\n    val name: String,\n    val url: String,\n    val cover: String? = null,\n    val remark: String? = null,\n    val siteKey: String,\n    val configUrl: String\n)\n\ndata class VideoEpisode(val name: String, val url: String)\n\n/** 影视线路（>5 条折叠，见 3.5）。 */\ndata class VideoPlayLine(val name: String, val episodes: List<VideoEpisode>)\n\ndata class VideoDetail(\n    val name: String,\n    val cover: String? = null,\n    val intro: String? = null,\n    val actor: String? = null,\n    val director: String? = null,\n    val year: String? = null,\n    val area: String? = null,\n    val remark: String? = null,\n    val lines: List<VideoPlayLine> = emptyList()\n)\n\n/** 7.3 播放解析链结果类型。 */\nenum class PlayKind { DIRECT, PARSE, SNIFF }\n\ndata class DanmakuHint(\n    val title: String,\n    val episode: Int?,\n    val fileName: String? = null,\n    val fileHash: String? = null,\n    val fileSize: Long? = null,\n    val durationMs: Long? = null\n)\n\ndata class PlayResult(\n    val kind: PlayKind,\n    val url: String,\n    val headers: Map<String, String>? = null,\n    val flag: String? = null,\n    val danmakuHint: DanmakuHint? = null\n)\n\ninterface IVideoSource : ISource {\n    suspend fun getCategories(): List<Category>\n    suspend fun explore(category: Category, filter: Filter?, page: Int): List<VideoItem>\n    suspend fun search(key: String, page: Int): List<VideoItem>\n    suspend fun getDetail(url: String): VideoDetail\n    suspend fun getPlay(episode: VideoEpisode): PlayResult\n}\n\n// ---------- 弹幕 ----------\n\ndata class DanmakuMatchRequest(\n    val title: String,\n    val episode: Int?,\n    val fileName: String? = null,\n    val fileHash: String? = null,\n    val fileSize: Long? = null,\n    val durationMs: Long? = null\n)\n\ndata class DanmakuMatch(\n    val episodeId: Long,\n    val animeTitle: String,\n    val episodeTitle: String,\n    val shift: Long = 0,\n    val sourceId: String = \"\"\n)\n\n/** 4.10.8 弹幕事件。mode: 1 滚动 / 2 底部 / 3 顶部。 */\ndata class DanmakuEvent(\n    val timeMs: Long,\n    val mode: Int,\n    val color: Int,\n    val text: String,\n    val source: String? = null\n)\n\ninterface IDanmakuSource : ISource {\n    suspend fun match(req: DanmakuMatchRequest): DanmakuMatch?\n    suspend fun search(key: String): List<DanmakuMatch>\n    suspend fun getComments(match: DanmakuMatch, fromMs: Long, durationMs: Long): List<DanmakuEvent>\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rss/LegadoRssSource.kt", "lang": "kt", "lines": 199, "content": "package com.lanyue.reader.source.rss\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.engine.RssFallbackParser\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.source.model.CapabilityResolver\nimport com.lanyue.reader.source.model.ContentResult\nimport com.lanyue.reader.source.model.ISubscriptionSource\nimport com.lanyue.reader.source.model.RssContentType\nimport com.lanyue.reader.source.model.SortRule\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.lanyue.reader.source.model.SubscriptionItem\nimport com.lanyue.reader.source.rule.RuleEngine\nimport com.lanyue.reader.source.rule.SortUrlParser\nimport com.lanyue.reader.source.rule.UrlTemplate\nimport com.google.gson.JsonParser\n\n/**\n * 7.2 订阅源实现（Legado RssSource）。\n *\n * 与书源的结构性差异（1.4.5）：\n * - 无目录层（ADR-012：无 getToc）\n * - 规则是扁平字符串，不是嵌套对象\n * - ruleArticles 为空时走内置 RSS/Atom 兜底（ADR-016）\n * - 搜索为览阅扩展：searchUrl 非空即可搜，结果复用列表规则\n */\nclass LegadoRssSource(\n    private val entity: RssSourceEntity,\n    private val net: NetworkDispatcher,\n    private val rules: RuleEngine,\n    private val sortParser: SortUrlParser,\n    private val rssFallback: RssFallbackParser,\n    private val metrics: LocalMetrics\n) : ISubscriptionSource {\n\n    override val sourceId: String = entity.sourceUrl\n\n    override val sourceType: SourceType = SourceType.SUBSCRIPTION\n\n    override val capabilityFlags: Set<SourceCapability> = CapabilityResolver.ofRss(entity)\n\n    override val concurrentRate: RateLimit? = parseRate(entity.concurrentRate)\n\n    /**\n     * 1.4.4 sortUrl 解析。动态生成失败时降级为无分类。\n     * 1.4.2 DISCOVERABLE 的二次确认：必须真的解析出 ≥1 分类。\n     */\n    override suspend fun getSorts(): List<SortRule> {\n        val result = sortParser.parse(entity.sortUrl, sourceId, sourceId + \":sorts\")\n        return result.sorts\n    }\n\n    override suspend fun getArticles(sort: SortRule?, page: Int): List<SubscriptionItem> {\n        val url = if (sort != null) UrlTemplate.fillPage(sort.url, page) else entity.sourceUrl\n        val html = fetch(url, \"articles\")\n        val ctx = RuleEngine.RuleContext(url, sourceId, sourceId + \":articles\")\n\n        // ADR-016：ruleArticles 为空 -> RSS/Atom 兜底\n        if (entity.ruleArticles.isNullOrBlank()) {\n            val feed = rssFallback.parse(html) ?: return emptyList()\n            return feed.items.map { item ->\n                SubscriptionItem(\n                    title = item.title ?: \"\",\n                    url = item.link ?: \"\",\n                    cover = item.image,\n                    pubDate = parseDate(item.pubDate),\n                    description = item.description,\n                    sort = sort?.name,\n                    origin = sourceId,\n                    contentType = contentTypeOf(entity.type)\n                )\n            }.filter { it.url.isNotEmpty() }\n        }\n\n        return parseListItems(html, ctx, sort?.name)\n    }\n\n    /** 1.4.3 搜索：占位符替换 -> 列表规则解析；失败由上层计数降级。 */\n    override suspend fun search(key: String, page: Int): List<SubscriptionItem> {\n        val searchUrl = entity.searchUrl ?: return emptyList()\n        val url = UrlTemplate.fill(searchUrl, key, page)\n        val html = fetch(url, \"search\")\n        val ctx = RuleEngine.RuleContext(url, sourceId, sourceId + \":search\")\n        return parseListItems(html, ctx, null)\n    }\n\n    override suspend fun getContent(url: String): ContentResult {\n        // 1.4.1 ruleContent 为空 -> WebView 原样打开\n        if (entity.ruleContent.isNullOrBlank()) {\n            return ContentResult.WebViewFallback(url)\n        }\n        val html = fetch(url, \"content\")\n        val ctx = RuleEngine.RuleContext(url, sourceId, sourceId + \":content\")\n        val body = rules.evalString(html, entity.ruleContent, ctx)\n        return if (body.isNullOrBlank()) {\n            ContentResult.WebViewFallback(url)\n        } else {\n            ContentResult.Html(body)\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    private suspend fun fetch(url: String, op: String): String {\n        val traceId = sourceId + \":\" + op\n        val resp = net.execute(\n            HttpRequest(\n                url = url,\n                method = \"GET\",\n                headers = parseHeader(),\n                sourceId = sourceId\n            ),\n            limit = concurrentRate,\n            traceId = traceId\n        )\n        if (!resp.isSuccess) {\n            metrics.failure(traceId, \"rss_source\", \"HTTP_\" + resp.code)\n            throw NetworkException(\"http \" + resp.code + \" for \" + url, resp.code)\n        }\n        return resp.body ?: \"\"\n    }\n\n    private suspend fun parseListItems(\n        html: String,\n        ctx: RuleEngine.RuleContext,\n        sortName: String?\n    ): List<SubscriptionItem> {\n        val articleRule = entity.ruleArticles ?: return emptyList()\n        val titles = rules.evalList(html, articleRule + \"@\" + (entity.ruleTitle ?: \"text\"), ctx)\n        if (titles.isEmpty()) return emptyList()\n\n        val links = rules.evalList(html, articleRule + \"@\" + (entity.ruleLink ?: \"href\"), ctx)\n        val covers = entity.ruleImage?.let { rules.evalList(html, articleRule + \"@\" + it, ctx) }.orEmpty()\n        val dates = entity.rulePubDate?.let { rules.evalList(html, articleRule + \"@\" + it, ctx) }.orEmpty()\n        val descs = entity.ruleDescription?.let { rules.evalList(html, articleRule + \"@\" + it, ctx) }.orEmpty()\n\n        return titles.mapIndexedNotNull { index, title ->\n            val link = links.getOrNull(index)\n            if (link.isNullOrBlank()) return@mapIndexedNotNull null\n            SubscriptionItem(\n                title = title,\n                url = link,\n                cover = covers.getOrNull(index),\n                pubDate = parseDate(dates.getOrNull(index)),\n                description = descs.getOrNull(index),\n                sort = sortName,\n                origin = sourceId,\n                contentType = contentTypeOf(entity.type)\n            )\n        }\n    }\n\n    /** 1.4.1 type：0 网页 / 1 图片 / 2 视频。 */\n    private fun contentTypeOf(type: Int): RssContentType = when (type) {\n        1 -> RssContentType.IMAGE\n        2 -> RssContentType.VIDEO\n        else -> RssContentType.WEB\n    }\n\n    private fun parseDate(raw: String?): Long? {\n        if (raw.isNullOrBlank()) return null\n        val formats = listOf(\n            \"yyyy-MM-dd HH:mm:ss\",\n            \"yyyy-MM-dd'T'HH:mm:ss\",\n            \"EEE, dd MMM yyyy HH:mm:ss Z\",\n            \"yyyy-MM-dd\"\n        )\n        formats.forEach { pattern ->\n            val parsed = runCatching {\n                java.text.SimpleDateFormat(pattern, java.util.Locale.US)\n                    .parse(raw.trim())?.time\n            }.getOrNull()\n            if (parsed != null) return parsed\n        }\n        return raw.toLongOrNull()\n    }\n\n    private fun parseHeader(): Map<String, String> {\n        val raw = entity.header ?: return emptyMap()\n        return runCatching {\n            JsonParser.parseString(raw).asJsonObject.entrySet()\n                .associate { it.key to it.value.asString }\n        }.getOrDefault(emptyMap())\n    }\n\n    private fun parseRate(raw: String?): RateLimit? {\n        if (raw.isNullOrBlank()) return null\n        val parts = raw.split(\"/\", \",\").map { it.trim() }.filter { it.isNotEmpty() }\n        if (parts.size < 2) return null\n        val permits = parts[0].toIntOrNull() ?: return null\n        val period = parts[1].toLongOrNull() ?: return null\n        return RateLimit(permits, period)\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rule/JsonPath.kt", "lang": "kt", "lines": 334, "content": "package com.lanyue.reader.source.rule\n\nimport com.google.gson.JsonArray\nimport com.google.gson.JsonElement\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\n\n/**\n * 7.1 JSONPath 求值器（纯 Kotlin，无 Android / 无网络）。\n *\n * Legado 书源里 `$.` 开头的规则很常见，早期实现把它当 CSS 处理，必然取不到值。\n * 这里实现一个够用的子集：\n *\n *   $.data.list[*].name         字段 + 通配\n *   $.data.list[0]              下标（负数表示倒数）\n *   $..name                     递归下降\n *   $.list[1:4]                 切片（含头不含尾，支持负数与省略端点）\n *   $.list[?(@.type=='book')]   过滤：字符串 / 数字 / 布尔 / 存在性\n *   $.list[?(@.wordCount>1000)] 比较：> >= < <= != ==\n *   $['weird name']             方括号字符串键\n *\n * 设计取舍：\n * - 不引入第三方 JSONPath 库（体积、反射、不可测），保持纯函数可单测。\n * - 解析失败一律返回空列表而不是抛异常：源配置写错表现为\"取不到\"，不应让整章崩掉。\n */\nobject JsonPath {\n\n    /** 在 JSON 文本上求值；文本非法返回空列表。 */\n    fun selectText(json: String, path: String): List<JsonElement> {\n        val root = runCatching { JsonParser.parseString(json) }.getOrNull() ?: return emptyList()\n        return select(root, path)\n    }\n\n    /** 在已解析的 JsonElement 上求值。 */\n    fun select(root: JsonElement, path: String): List<JsonElement> {\n        val steps = parse(path) ?: return emptyList()\n        var current = listOf(root)\n        for (step in steps) {\n            if (current.isEmpty()) return emptyList()\n            current = current.flatMap { apply(it, step) }\n        }\n        return current.filter { !it.isJsonNull }\n    }\n\n    /** 转字符串：标量取文本，对象/数组保留 JSON 文本。 */\n    fun toStrings(elements: List<JsonElement>): List<String> =\n        elements.map { el -> if (el.isJsonPrimitive) el.asString else el.toString() }\n            .filter { it.isNotEmpty() }\n\n    /** 取第一个非空结果。 */\n    fun firstString(json: String, path: String): String? =\n        toStrings(selectText(json, path)).firstOrNull { it.isNotEmpty() }\n\n    /** 是否像 JSONPath（`$` 开头且后接 `.` 或 `[`）。 */\n    fun looksLikeJsonPath(rule: String): Boolean {\n        val t = rule.trim()\n        return t.startsWith(\"$\") && (t.length == 1 || t[1] == '.' || t[1] == '[')\n    }\n\n    // ---------------- 步骤 / 谓词 ----------------\n\n    sealed interface Step {\n        data class Field(val name: String) : Step\n        data class Index(val index: Int) : Step\n        data object Wildcard : Step\n        data class Slice(val start: Int?, val end: Int?) : Step\n        data class Recursive(val name: String) : Step\n        data class Filter(val predicate: Predicate) : Step\n    }\n\n    sealed interface Predicate {\n        data class Exists(val field: String) : Predicate\n        data class Equals(val field: String, val value: String, val numeric: Boolean) : Predicate\n        data class NotEquals(val field: String, val value: String, val numeric: Boolean) : Predicate\n        data class Compare(val field: String, val op: String, val value: Double) : Predicate\n    }\n\n    // ---------------- 解析 ----------------\n\n    /** 解析成步骤序列；语法非法返回 null。 */\n    fun parse(path: String): List<Step>? {\n        val t = path.trim()\n        if (t.isEmpty()) return null\n        var i = if (t.startsWith(\"$\")) 1 else 0\n        val steps = ArrayList<Step>()\n\n        while (i < t.length) {\n            when {\n                t.startsWith(\"..\", i) -> {\n                    i += 2\n                    val name = readName(t, i) ?: return null\n                    if (name.isEmpty()) return null\n                    steps.add(Step.Recursive(name))\n                    i += name.length\n                }\n                t[i] == '.' -> {\n                    i++\n                    if (i < t.length && t[i] == '*') {\n                        steps.add(Step.Wildcard)\n                        i++\n                    } else {\n                        val name = readName(t, i) ?: return null\n                        if (name.isEmpty()) return null\n                        steps.add(Step.Field(name))\n                        i += name.length\n                    }\n                }\n                t[i] == '[' -> {\n                    val close = matchBracket(t, i)\n                    if (close < 0) return null\n                    val step = parseBracket(t.substring(i + 1, close).trim()) ?: return null\n                    steps.add(step)\n                    i = close + 1\n                }\n                else -> return null\n            }\n        }\n        return steps\n    }\n\n    private fun readName(t: String, from: Int): String? {\n        var i = from\n        while (i < t.length && t[i] != '.' && t[i] != '[') i++\n        val name = t.substring(from, i)\n        // 名字含空白说明路径畸形（避免把 \"a b\" 当字段名静默取空）\n        if (name.any { it.isWhitespace() }) return null\n        return name\n    }\n\n    /** 返回与 [open] 处 `[` 配对的 `]` 下标；不配对返回 -1。 */\n    private fun matchBracket(t: String, open: Int): Int {\n        var depth = 0\n        var inSingle = false\n        var inDouble = false\n        var i = open\n        while (i < t.length) {\n            val c = t[i]\n            when {\n                inSingle -> if (c == '\\'') inSingle = false\n                inDouble -> if (c == '\"') inDouble = false\n                c == '\\'' -> inSingle = true\n                c == '\"' -> inDouble = true\n                c == '[' -> depth++\n                c == ']' -> {\n                    depth--\n                    if (depth == 0) return i\n                }\n            }\n            i++\n        }\n        return -1\n    }\n\n    private fun parseBracket(inner: String): Step? {\n        if (inner.isEmpty()) return null\n        if (inner == \"*\") return Step.Wildcard\n        if (inner.startsWith(\"?\")) return parseFilter(inner)\n\n        if ((inner.startsWith(\"'\") && inner.endsWith(\"'\")) ||\n            (inner.startsWith(\"\\\"\") && inner.endsWith(\"\\\"\"))\n        ) {\n            return Step.Field(inner.substring(1, inner.length - 1))\n        }\n\n        if (inner.contains(\":\")) {\n            val parts = inner.split(\":\")\n            if (parts.size > 2) return null\n            val rawStart = parts.getOrNull(0)?.trim().orEmpty()\n            val rawEnd = parts.getOrNull(1)?.trim().orEmpty()\n            val start = if (rawStart.isEmpty()) null else rawStart.toIntOrNull()\n            val end = if (rawEnd.isEmpty()) null else rawEnd.toIntOrNull()\n            // 写了内容却不是合法整数 -> 语法错误，不当作端点省略\n            if (rawStart.isNotEmpty() && start == null) return null\n            if (rawEnd.isNotEmpty() && end == null) return null\n            return Step.Slice(start, end)\n        }\n\n        val idx = inner.toIntOrNull() ?: return null\n        return Step.Index(idx)\n    }\n\n    private fun parseFilter(inner: String): Step? {\n        var body = inner.removePrefix(\"?\").trim()\n        if (body.startsWith(\"(\") && body.endsWith(\")\")) {\n            body = body.substring(1, body.length - 1).trim()\n        }\n        if (!body.startsWith(\"@\")) return null\n        var expr = body.removePrefix(\"@\").trim()\n        if (expr.startsWith(\".\")) expr = expr.substring(1)\n\n        // 纯存在性：?(@.field)\n        if (expr.none { it in \"=<>!\" }) {\n            return if (expr.isEmpty()) null else Step.Filter(Predicate.Exists(expr))\n        }\n\n        // 先长后短匹配运算符，避免 \">=\" 被 \">\" 抢先\n        val op = listOf(\"==\", \"!=\", \">=\", \"<=\", \">\", \"<\").firstOrNull { expr.contains(it) }\n            ?: return null\n        val at = expr.indexOf(op)\n        val field = expr.substring(0, at).trim()\n        if (field.isEmpty()) return null\n\n        val rawRight = expr.substring(at + op.length).trim()\n        val quoted = rawRight.length >= 2 &&\n            ((rawRight.startsWith(\"'\") && rawRight.endsWith(\"'\")) ||\n                (rawRight.startsWith(\"\\\"\") && rawRight.endsWith(\"\\\"\")))\n        val value = if (quoted) rawRight.substring(1, rawRight.length - 1) else rawRight\n        if (value.isEmpty()) return null\n\n        val numeric = !quoted && value.toDoubleOrNull() != null\n        return when (op) {\n            \"==\" -> Step.Filter(Predicate.Equals(field, value, numeric))\n            \"!=\" -> Step.Filter(Predicate.NotEquals(field, value, numeric))\n            else -> {\n                val num = value.toDoubleOrNull() ?: return null\n                Step.Filter(Predicate.Compare(field, op, num))\n            }\n        }\n    }\n\n    // ---------------- 求值 ----------------\n\n    private fun apply(element: JsonElement, step: Step): List<JsonElement> = when (step) {\n        is Step.Field -> {\n            val obj = if (element.isJsonObject) element.asJsonObject else return emptyList()\n            val v = obj.get(step.name) ?: return emptyList()\n            listOf(v)\n        }\n        is Step.Index -> {\n            val arr = if (element.isJsonArray) element.asJsonArray else return emptyList()\n            val idx = if (step.index < 0) arr.size() + step.index else step.index\n            if (idx !in 0 until arr.size()) emptyList() else listOf(arr.get(idx))\n        }\n        Step.Wildcard -> when {\n            element.isJsonArray -> toList(element.asJsonArray)\n            element.isJsonObject -> element.asJsonObject.entrySet().map { it.value }\n            else -> emptyList()\n        }\n        is Step.Slice -> {\n            val arr = if (element.isJsonArray) element.asJsonArray else return emptyList()\n            val size = arr.size()\n            var s = step.start ?: 0\n            var e = step.end ?: size\n            if (s < 0) s += size\n            if (e < 0) e += size\n            s = s.coerceIn(0, size)\n            e = e.coerceIn(0, size)\n            if (e <= s) emptyList() else toList(arr).subList(s, e)\n        }\n        is Step.Recursive -> {\n            val out = ArrayList<JsonElement>()\n            collectByName(element, step.name, out, 0)\n            out\n        }\n        is Step.Filter -> {\n            val arr = if (element.isJsonArray) element.asJsonArray else return emptyList()\n            toList(arr).filter { matches(it, step.predicate) }\n        }\n    }\n\n    private fun toList(arr: JsonArray): List<JsonElement> = (0 until arr.size()).map { arr.get(it) }\n\n    /** 递归下降；深度设上限，防止畸形深层 JSON 栈溢出。 */\n    private fun collectByName(\n        element: JsonElement,\n        name: String,\n        out: MutableList<JsonElement>,\n        depth: Int\n    ) {\n        if (depth > MAX_DEPTH) return\n        when {\n            element.isJsonObject -> {\n                for ((k, v) in element.asJsonObject.entrySet()) {\n                    if (k == name) out.add(v)\n                    collectByName(v, name, out, depth + 1)\n                }\n            }\n            element.isJsonArray -> {\n                for (child in toList(element.asJsonArray)) collectByName(child, name, out, depth + 1)\n            }\n        }\n    }\n\n    private fun matches(candidate: JsonElement, predicate: Predicate): Boolean {\n        if (!candidate.isJsonObject) return false\n        val obj = candidate.asJsonObject\n        return when (predicate) {\n            is Predicate.Exists -> {\n                val v = obj.get(predicate.field)\n                v != null && !v.isJsonNull\n            }\n            is Predicate.Equals ->\n                equality(obj, predicate.field, predicate.value, predicate.numeric, wantEqual = true)\n            is Predicate.NotEquals ->\n                equality(obj, predicate.field, predicate.value, predicate.numeric, wantEqual = false)\n            is Predicate.Compare -> {\n                val v = obj.get(predicate.field) ?: return false\n                if (!v.isJsonPrimitive || !v.asJsonPrimitive.isNumber) return false\n                val actual = v.asDouble\n                when (predicate.op) {\n                    \">\" -> actual > predicate.value\n                    \">=\" -> actual >= predicate.value\n                    \"<\" -> actual < predicate.value\n                    \"<=\" -> actual <= predicate.value\n                    else -> false\n                }\n            }\n        }\n    }\n\n    private fun equality(\n        obj: JsonObject,\n        field: String,\n        expected: String,\n        numeric: Boolean,\n        wantEqual: Boolean\n    ): Boolean {\n        val v = obj.get(field)\n        // 字段缺失时：!= 视为满足，== 视为不满足\n        if (v == null || v.isJsonNull) return !wantEqual\n        val hit = when {\n            numeric -> {\n                val isNum = v.isJsonPrimitive && v.asJsonPrimitive.isNumber\n                isNum && expected.toDoubleOrNull() != null && v.asDouble == expected.toDouble()\n            }\n            v.isJsonPrimitive && v.asJsonPrimitive.isBoolean -> v.asBoolean == expected.toBoolean()\n            v.isJsonPrimitive -> v.asString == expected\n            else -> false\n        }\n        return if (wantEqual) hit else !hit\n    }\n\n    private const val MAX_DEPTH = 64\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rule/RuleChain.kt", "lang": "kt", "lines": 120, "content": "package com.lanyue.reader.source.rule\n\n/**\n * 7.1 规则编排层（纯函数，无 Android / 无 IO / 无 jsoup）。\n *\n * 把一条规则字符串拆成\"可执行步骤树\"，真正取数据的动作留给 RuleEngine。\n * 这样拆解顺序、优先级、空值语义都能在 JVM 单测里锁死。\n *\n * 支持的语法（自外向内依次生效）：\n *   A || B            备选：A 有结果就用 A，否则用 B\n *   A && B            并列：两段结果合并成一个列表\n *   sel##正则##替换     取数后做正则替换（替换段可含 $1）\n *   @put:{k:v} @get:{k} 变量写入 / 读取\n *   {{ 表达式 }}        结果模板拼接\n */\nobject RuleChain {\n\n    /** 一个最小可执行单元。 */\n    data class Segment(\n        /** 去掉变量指令与替换段之后的纯净规则。 */\n        val rule: String,\n        /** 待应用的正则替换（可能为 null）。 */\n        val replacement: RuleSyntax.RegexReplacement?,\n        /** 本段要写入的变量：key -> 规则。 */\n        val puts: List<Pair<String, String>>,\n        /** 本段依赖读取的变量名。 */\n        val gets: List<String>\n    )\n\n    /** 一组并列取数单元（`&&` 连接），结果按顺序合并。 */\n    data class Alternative(val segments: List<Segment>) {\n        val isEmpty: Boolean get() = segments.isEmpty() || segments.all { it.rule.isBlank() }\n    }\n\n    /** 完整规则计划：[alternatives] 之间是 `||` 备选关系。 */\n    data class Plan(val alternatives: List<Alternative>) {\n        val isEmpty: Boolean get() = alternatives.isEmpty() || alternatives.all { it.isEmpty }\n\n        /** 本计划声明的全部变量写入。 */\n        fun allPuts(): List<Pair<String, String>> = alternatives.flatMap { alt ->\n            alt.segments.flatMap { it.puts }\n        }\n\n        /** 本计划声明的全部变量读取。 */\n        fun allGets(): List<String> = alternatives.flatMap { alt ->\n            alt.segments.flatMap { it.gets }\n        }.distinct()\n    }\n\n    val Empty = Plan(emptyList())\n\n    /**\n     * 解析整条规则。\n     *\n     * 空规则返回 [Empty]，不抛异常——源配置里字段缺失是常态。\n     */\n    fun parse(rule: String?): Plan {\n        if (rule.isNullOrBlank()) return Empty\n\n        // 1. 先按 || 切备选。必须在最外层，保证 \"a||b##c\" 是 (a) || (b##c)\n        val altTexts = RuleSyntax.splitTopLevel(rule, SEP_OR)\n            .map { it.trim() }\n            .filter { it.isNotEmpty() }\n        if (altTexts.isEmpty()) return Empty\n\n        val alternatives = altTexts.map { altText ->\n            // 2. 再按 && 切并列段\n            val segTexts = RuleSyntax.splitTopLevel(altText, SEP_AND)\n                .map { it.trim() }\n                .filter { it.isNotEmpty() }\n            Alternative(segTexts.map { compileSegment(it) })\n        }\n        return Plan(alternatives)\n    }\n\n    /**\n     * 单段编译：变量指令 -> 正则替换 -> 剩余规则。\n     *\n     * 顺序不能反：`@put:{k:sel##a##b}` 里的 `##` 属于 put 的 value，\n     * 必须先把指令整块摘掉，再对剩下的主体做替换解析。\n     */\n    fun compileSegment(raw: String): Segment {\n        val vars = RuleSyntax.parseVarDirectives(raw)\n        val (base, replacement) = RuleSyntax.parseRegexReplacement(vars.rule)\n        return Segment(\n            rule = base.trim(),\n            replacement = replacement,\n            puts = vars.puts,\n            gets = vars.gets\n        )\n    }\n\n    /**\n     * 判断一个备选是否\"应该被采用\"：有任意非空结果。\n     *\n     * 单列抽出来是为了让 `||` 的短路语义可测，\n     * 也避免实现里出现 `result.isNotEmpty()` 与 `result.any{}` 两套标准。\n     */\n    fun shouldAccept(values: List<String>): Boolean = values.any { it.isNotEmpty() }\n\n    /**\n     * 应用替换并清理：替换后可能产生空串或纯空白，需要再过滤。\n     */\n    fun finish(values: List<String>, replacements: List<RuleSyntax.RegexReplacement?>): List<String> {\n        val repl = replacements.firstOrNull { it != null }\n        val mapped = if (repl == null) {\n            values\n        } else {\n            values.map { RuleSyntax.applyReplacement(it, repl) }\n        }\n        return mapped.map { it.trim() }.filter { it.isNotEmpty() }\n    }\n\n    /** 合并 `&&` 各段结果，保持段间顺序，段内顺序也保持。 */\n    fun merge(valuesPerSegment: List<List<String>>): List<String> =\n        valuesPerSegment.flatMap { seg -> seg.filter { it.isNotEmpty() } }\n\n    const val SEP_OR = \"||\"\n    const val SEP_AND = \"&&\"\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rule/RuleEngine.kt", "lang": "kt", "lines": 428, "content": "package com.lanyue.reader.source.rule\n\nimport com.lanyue.reader.core.engine.DomParser\nimport com.lanyue.reader.core.engine.EngineErrorCode\nimport com.lanyue.reader.core.engine.EngineException\nimport com.lanyue.reader.core.engine.JsExecMode\nimport com.lanyue.reader.core.engine.JsRuntime\nimport com.lanyue.reader.core.engine.PoolTier\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.google.gson.JsonParser\nimport org.jsoup.nodes.Document\nimport org.jsoup.nodes.Element\nimport org.jsoup.select.Elements\n\n/**\n * 7.1 规则预处理 + 4.2 数据流分发。\n *\n * 规则形态（Legado 惯例）：\n *   class.xxx@tag.a@text            -> CSS 链式\n *   //div[@class=\"x\"]/a/text()      -> XPath（降级为 CSS 近似）\n *   $.data.list[*]                  -> JSONPath（简化实现）\n *   <js>...<\/js> 或 @js:...         -> 交 JsRuntime\n *   ## 正则替换                      -> replaceRegex\n *\n * 统一收敛在这里，源实现只声明规则字符串，不自己发明语法。\n */\nclass RuleEngine(\n    private val js: JsRuntime,\n    private val dom: DomParser,\n    private val metrics: LocalMetrics\n) {\n\n    /** 一条规则的解析上下文。 */\n    data class RuleContext(\n        val baseUrl: String,\n        val sourceId: String,\n        val traceId: String,\n        val variables: Map<String, String> = emptyMap()\n    )\n\n    /**\n     * 在一段 HTML 上执行规则，返回字符串列表。\n     *\n     * 整条规则交给 [RuleChain] 拆解：`||` 备选短路、`&&` 并列合并、\n     * `##` 正则替换、`@put/@get` 变量、`{{ }}` 模板。\n     * [rule] 为 null/空时返回空列表，不抛异常（源字段常为空）。\n     */\n    suspend fun evalList(\n        html: String,\n        rule: String?,\n        ctx: RuleContext,\n        needsRealDom: Boolean = false\n    ): List<String> {\n        val plan = RuleChain.parse(rule)\n        if (plan.isEmpty) return emptyList()\n\n        val vars = HashMap<String, String>()\n        plan.allGets().forEach { key -> ctx.variables[key]?.let { vars[key] = it } }\n\n        for (alt in plan.alternatives) {\n            if (alt.isEmpty) continue\n            val perSegment = ArrayList<List<String>>(alt.segments.size)\n            for (seg in alt.segments) {\n                val scope = ctx.copy(variables = vars.toMap())\n                val values = evalSegment(html, seg.rule, seg.replacement, scope, needsRealDom)\n                perSegment.add(values)\n                applyPuts(html, seg, vars, values, scope, needsRealDom)\n            }\n            val merged = RuleChain.merge(perSegment)\n            // 短路：第一个有结果的备选胜出，后面的不再请求（省远端流量）\n            if (RuleChain.shouldAccept(merged)) return merged\n        }\n        return emptyList()\n    }\n\n    /** 单值规则：取第一个。 */\n    suspend fun evalString(\n        html: String,\n        rule: String?,\n        ctx: RuleContext,\n        needsRealDom: Boolean = false\n    ): String? = evalList(html, rule, ctx, needsRealDom).firstOrNull()\n\n    /**\n     * 执行 `@put` 写入。\n     *\n     * value 自身是一条独立规则；为空或与主体规则相同时回落到本段结果，\n     * 这样 `sel@text@put:{title:}` 这种简写也能用。\n     */\n    private suspend fun applyPuts(\n        html: String,\n        seg: RuleChain.Segment,\n        vars: HashMap<String, String>,\n        values: List<String>,\n        ctx: RuleContext,\n        needsRealDom: Boolean\n    ) {\n        if (seg.puts.isEmpty()) return\n        seg.puts.forEach { (key, valueRule) ->\n            val trimmed = valueRule.trim()\n            val value = if (trimmed.isEmpty() || trimmed == seg.rule.trim()) {\n                values.firstOrNull()\n            } else {\n                val sub = RuleChain.compileSegment(trimmed)\n                evalSegment(html, sub.rule, sub.replacement, ctx, needsRealDom).firstOrNull()\n            }\n            if (!value.isNullOrEmpty()) vars[key] = value\n        }\n    }\n\n    /** 执行一个已拆解好的取数单元（变量指令已剥离）。 */\n    private suspend fun evalSegment(\n        html: String,\n        rawRule: String,\n        replacement: RuleSyntax.RegexReplacement?,\n        ctx: RuleContext,\n        needsRealDom: Boolean\n    ): List<String> {\n        val rule = resolveTemplate(rawRule, ctx)\n        // 纯 @put 段没有主体规则：返回空，puts 走「回落到本段结果」分支\n        if (rule.isBlank()) return emptyList()\n\n        val values: List<String> = when {\n            isJsRule(rule) -> runJsList(unwrapJs(rule), html, ctx)\n\n            // JSONPath：$.a.b / $..name / [?(@.x=='y')]\n            JsonPath.looksLikeJsonPath(rule) -> runJsonPath(html, rule)\n\n            // XPath：//div[@class='x']/a/text()  -> 翻译成 CSS 后复用选择器逻辑\n            XPathLite.looksLikeXPath(rule) -> runXPath(html, rule, ctx, needsRealDom)\n\n            else -> {\n                val doc = parseDomOrThrow(html, ctx, needsRealDom)\n                val split = splitJsTail(rule)\n                var selected = selectCss(doc, split.first, ctx.baseUrl)\n                val jsTail = split.second\n                if (jsTail != null) {\n                    selected = selected.map { v -> runJsString(jsTail, v, ctx) }\n                }\n                selected\n            }\n        }\n        return RuleChain.finish(values, listOf(replacement))\n    }\n\n    /**\n     * 替换 `{{ }}`：先查变量，再查内置名。无法求值时保留原样，\n     * 避免把整条规则打穿成空串而静默失败。\n     */\n    private fun resolveTemplate(rule: String, ctx: RuleContext): String {\n        if (!rule.contains(\"{{\")) return rule\n        return RuleSyntax.resolveTemplate(rule) { expr ->\n            when (expr) {\n                \"baseUrl\" -> ctx.baseUrl\n                \"sourceId\" -> ctx.sourceId\n                else -> ctx.variables[expr]\n            }\n        }\n    }\n\n    /** 显式取值指令。 */\n    private val EXPLICIT_DIRECTIVES = setOf(\"text\", \"textnodes\", \"ownhtml\", \"html\", \"all\", \"content\")\n\n    /** 可按属性名直接取值的高频 HTML 属性。 */\n    private val COMMON_ATTRS = setOf(\n        \"href\", \"src\", \"value\", \"alt\", \"title\", \"datetime\", \"poster\",\n        \"srcset\", \"id\", \"class\", \"style\", \"name\", \"type\", \"placeholder\"\n    )\n\n    /** 解析 DOM；失败统一转成带错误码的引擎异常。 */\n    private suspend fun parseDomOrThrow(html: String, ctx: RuleContext, needsRealDom: Boolean): Document {\n        val parseResult = dom.parse(html, ctx.baseUrl, needsRealDom, ctx.traceId)\n        return when (parseResult) {\n            is DomParser.ParseResult.Ok -> parseResult.document\n            is DomParser.ParseResult.Failed -> throw EngineException(\n                EngineErrorCode.SCRIPT_EXCEPTION,\n                \"dom parse failed: \" + parseResult.reason\n            )\n        }\n    }\n\n    /**\n     * JSONPath 求值。\n     *\n     * 非 JSON 响应直接判空而不是抛异常：同一字段在个别源上可能返回 HTML，\n     * 这属于\"取不到\"而不是\"程序错误\"，抛异常会让整章失败。\n     */\n    private fun runJsonPath(html: String, rule: String): List<String> {\n        val elements = JsonPath.selectText(html, rule)\n        if (elements.isEmpty()) return emptyList()\n        return JsonPath.toStrings(elements).filter { it.isNotEmpty() }\n    }\n\n    /**\n     * XPath 求值：先翻译成 CSS，再复用选择器取值。\n     *\n     * 不支持的结构（轴 / and / or / 未知函数）会抛明确的规则错误，\n     * 让用户知道是规则写法问题，而不是静默返回空。\n     */\n    private suspend fun runXPath(\n        html: String,\n        rule: String,\n        ctx: RuleContext,\n        needsRealDom: Boolean\n    ): List<String> {\n        val converted = XPathLite.toCss(rule) ?: throw EngineException(\n            EngineErrorCode.SCRIPT_EXCEPTION,\n            \"unsupported xpath: \" + rule\n        )\n        val doc = parseDomOrThrow(html, ctx, needsRealDom)\n        val directive = converted.directive\n        val composed = if (directive == null) converted.css else converted.css + \"@\" + directive\n        return selectCss(doc, composed, ctx.baseUrl)\n    }\n\n    /**\n     * CSS 选择器求值。支持 class./tag./id. 前缀与 @attr、@text、@html 后缀。\n     */\n    private fun selectCss(doc: Document, rawRule: String, baseUrl: String? = null): List<String> {\n        val parts = rawRule.split(\"@\").filter { it.isNotBlank() }\n        if (parts.isEmpty()) return emptyList()\n\n        val lastIsDirective = isExtractDirective(parts.last())\n        val selectorParts = if (lastIsDirective) parts.dropLast(1) else parts\n        val directive = if (lastIsDirective) parts.last().lowercase() else null\n\n        if (selectorParts.isEmpty()) return emptyList()\n\n        var els: Elements = Elements()\n        selectorParts.forEachIndexed { index, raw ->\n            val (sel, pickAt) = splitIndexSuffix(raw)\n            els = if (index == 0) {\n                doc.select(sel)\n            } else {\n                val nested = Elements()\n                els.forEach { el -> nested.addAll(el.select(sel)) }\n                nested\n            }\n            // 尾部 .N 表示只取第 N 个（负数代表倒数），越界则判空，不静默取到错的元素\n            if (pickAt != null) {\n                val idx = if (pickAt < 0) els.size + pickAt else pickAt\n                val picked = els.getOrNull(idx)\n                els = if (picked == null) Elements() else Elements(picked)\n            }\n        }\n\n        return els.map { extract(it, directive, baseUrl) }.filter { it.isNotEmpty() }\n    }\n\n    /**\n     * 判定 `@` 之后那一段是不是取值指令。\n     *\n     * Legado 里 `class.a@href` 是最常见写法，早期实现只认 text/html/attr:，\n     * 于是 \"href\" 被当成第二段 CSS 选择器（找 <href> 标签），永远取不到值。\n     * 这里补齐常见属性名，并支持 @attr: 与 @abs: 两种前缀。\n     */\n    private fun isExtractDirective(part: String): Boolean {\n        val lower = part.lowercase()\n        if (lower in EXPLICIT_DIRECTIVES) return true\n        if (lower.startsWith(\"attr:\") || lower.startsWith(\"abs:\")) return true\n        if (lower in COMMON_ATTRS) return true\n        // data-* / aria-* 是自定义属性，按指令处理\n        if (lower.startsWith(\"data-\") || lower.startsWith(\"aria-\")) return true\n        return false\n    }\n\n    /**\n     * 从元素取值。\n     *\n     * 属性不存在时返回空串（由上层过滤掉），不回落到文本——\n     * 回落会把\"取不到 href\"变成\"取到一段标题文字\"，产生看起来对但实际错的数据。\n     */\n    private fun extract(el: Element, directive: String?, baseUrl: String?): String {\n        if (directive == null) return el.text()\n        return when {\n            directive == \"text\" || directive == \"textnodes\" ->\n                el.text()\n            directive == \"html\" || directive == \"ownhtml\" || directive == \"all\" ->\n                el.html()\n            directive == \"content\" ->\n                if (el.hasAttr(\"content\")) el.attr(\"content\") else el.text()\n            directive.startsWith(\"abs:\") ->\n                absolutize(el.attr(directive.removePrefix(\"abs:\")), baseUrl)\n            directive.startsWith(\"attr:\") ->\n                el.attr(directive.removePrefix(\"attr:\"))\n            else ->\n                el.attr(directive)\n        }\n    }\n\n    /**\n     * 把相对地址补成绝对地址（@abs:href 用）。\n     *\n     * 只做常见形态，不引入 URI 解析开销：\n     *   //host/a   -> 继承 baseUrl 的 scheme\n     *   /a         -> 继承 origin\n     *   a/b        -> 拼在 baseUrl 目录后\n     *   已是绝对地址则原样返回\n     */\n    private fun absolutize(value: String, baseUrl: String?): String {\n        val v = value.trim()\n        if (v.isEmpty()) return \"\"\n        if (v.startsWith(\"http://\") || v.startsWith(\"https://\")) return v\n        val base = baseUrl?.trim().orEmpty()\n        if (base.isEmpty()) return v\n        val schemeEnd = base.indexOf(\"://\")\n        val scheme = if (schemeEnd > 0) base.substring(0, schemeEnd) else \"https\"\n        if (v.startsWith(\"//\")) return scheme + \":\" + v\n        val originEnd = base.indexOf('/', schemeEnd + 3)\n        val origin = if (originEnd > 0) base.substring(0, originEnd) else base\n        if (v.startsWith(\"/\")) return origin + v\n        val dir = if (originEnd > 0) base.substring(0, base.lastIndexOf('/') + 1) else base + \"/\"\n        return dir + v\n    }\n\n    /**\n     * 拆出 `class.item.1` 这类尾部索引。\n     *\n     * 返回 (去索引后的选择器, 索引或 null)。\n     * 只认最后一段是纯整数的情况，避免把 `.col-2` 之类的类名误当索引。\n     */\n    private fun splitIndexSuffix(raw: String): Pair<String, Int?> {\n        val t = raw.trim()\n        val dot = t.lastIndexOf('.')\n        if (dot <= 0 || dot == t.lastIndex) return normalizeSelector(t) to null\n        val tail = t.substring(dot + 1)\n        val num = tail.toIntOrNull() ?: return normalizeSelector(t) to null\n        val head = t.substring(0, dot)\n        // head 为空（如 \".1\"）时无法构成选择器，按索引无选择器处理\n        if (head.isBlank()) return normalizeSelector(t) to null\n        return normalizeSelector(head) to num\n    }\n\n    /** class.xxx -> .xxx；tag.a -> a；id.x -> #x。 */\n    private fun normalizeSelector(raw: String): String {\n        val t = raw.trim()\n        return when {\n            t.startsWith(\"class.\") -> \".\" + t.removePrefix(\"class.\")\n            t.startsWith(\"id.\") -> \"#\" + t.removePrefix(\"id.\")\n            t.startsWith(\"tag.\") -> t.removePrefix(\"tag.\")\n            else -> t\n        }\n    }\n\n    /** 规则尾部 @js: / <js> 拆出。 */\n    private fun splitJsTail(rule: String): Pair<String, String?> {\n        val jsIndex = rule.indexOf(\"@js:\")\n        if (jsIndex >= 0) {\n            return rule.substring(0, jsIndex) to rule.substring(jsIndex + 4)\n        }\n        return rule to null\n    }\n\n    fun isJsRule(rule: String): Boolean {\n        val t = rule.trimStart()\n        if (t.startsWith(\"<js>\")) return true\n        if (t.startsWith(\"@js:\")) return true\n        return false\n    }\n\n    private fun unwrapJs(rule: String): String {\n        val t = rule.trim()\n        return when {\n            t.startsWith(\"<js>\") -> t.removePrefix(\"<js>\").substringBefore(\"<\/js>\")\n            t.startsWith(\"@js:\") -> t.removePrefix(\"@js:\")\n            else -> t\n        }\n    }\n\n    private suspend fun runJsList(script: String, html: String, ctx: RuleContext): List<String> {\n        val wrapped = buildJsWithContext(script, html, ctx)\n        val raw = js.eval(\n            script = wrapped,\n            mode = JsExecMode.MAIN,\n            tier = PoolTier.NORMAL,\n            traceId = ctx.traceId\n        ) { _, _ -> true }\n        // JS 结果可能是 JSON 数组，也可能是单值\n        val asArray = runCatching {\n            JsonParser.parseString(raw).asJsonArray.map { it.asString }\n        }.getOrNull()\n        return (asArray ?: listOf(raw)).filter { it.isNotEmpty() }\n    }\n\n    private suspend fun runJsString(script: String, input: String, ctx: RuleContext): String {\n        val wrapped = buildJsWithContext(script, input, ctx)\n        return js.eval(wrapped, JsExecMode.MAIN, PoolTier.NORMAL, ctx.traceId) { _, _ -> true }\n    }\n\n    /** 注入 result / baseUrl / variables（Legado 惯例变量名）。 */\n    private fun buildJsWithContext(script: String, result: String, ctx: RuleContext): String {\n        val vars = ctx.variables.entries.joinToString(\",\") { (k, v) ->\n            quoteLiteral(k) + \":\" + quoteLiteral(v)\n        }\n        val sb = StringBuilder()\n        sb.append(\"(function(){\\n\")\n        sb.append(\"  var result = \").append(quoteLiteral(result)).append(\";\\n\")\n        sb.append(\"  var baseUrl = \").append(quoteLiteral(ctx.baseUrl)).append(\";\\n\")\n        sb.append(\"  var sourceId = \").append(quoteLiteral(ctx.sourceId)).append(\";\\n\")\n        sb.append(\"  var variables = {\").append(vars).append(\"};\\n\")\n        sb.append(\"  try {\\n\")\n        sb.append(\"    var out = (function(){ \").append(script).append(\" })();\\n\")\n        sb.append(\"    if (out === undefined || out === null) return '';\\n\")\n        sb.append(\"    return typeof out === 'string' ? out : JSON.stringify(out);\\n\")\n        sb.append(\"  } catch (e) {\\n\")\n        sb.append(\"    return '__JS_ERROR__' + e;\\n\")\n        sb.append(\"  }\\n\")\n        sb.append(\"})()\")\n        return sb.toString()\n    }\n\n    /** JSON 安全字符串字面量。 */\n    private fun quoteLiteral(raw: String): String {\n        val sb = StringBuilder(\"\\\"\")\n        for (ch in raw) {\n            when (ch) {\n                '\\\\' -> sb.append(\"\\\\\\\\\")\n                '\"' -> sb.append(\"\\\\\\\"\")\n                '\\n' -> sb.append(\"\\\\n\")\n                '\\r' -> sb.append(\"\\\\r\")\n                '\\t' -> sb.append(\"\\\\t\")\n                else -> sb.append(ch)\n            }\n        }\n        sb.append(\"\\\"\")\n        return sb.toString()\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rule/RuleSyntax.kt", "lang": "kt", "lines": 206, "content": "package com.lanyue.reader.source.rule\n\n/**\n * 7.1 规则语法层（纯函数，无 Android / 无 IO，可直接单测）。\n *\n * 只做「文本层面」的拆解，不做任何取数据动作：\n * - 顶层分隔符切分（`||` 备选、`&&` 合并）\n * - `##正则##替换` 提取\n * - `@put:{k:v}` / `@get:{k}` 变量指令提取\n * - `{{ 表达式 }}` 模板定位与替换\n *\n * 这样做的好处：解析规则的正确性可以用 JVM 单测覆盖，\n * 不必依赖 WebView / jsoup，避免「语法错了但看起来能跑」。\n */\nobject RuleSyntax {\n\n    private const val REGEX_SEP = \"##\"\n\n    // ---------------- 顶层切分 ----------------\n\n    /**\n     * 按分隔符切分，但忽略 `{}` 内部与引号内部的同名字符。\n     *\n     * 例：`$.a||$.b`          -> [\"$.a\", \"$.b\"]\n     *     `@js:a||b == 1`     -> 不切（引号内）\n     *     `@put:{k:a||b}`     -> 不切（花括号内）\n     */\n    fun splitTopLevel(rule: String, sep: String): List<String> {\n        require(sep.isNotEmpty()) { \"separator must not be empty\" }\n        val out = ArrayList<String>()\n        val sb = StringBuilder()\n        var brace = 0\n        var quote = 0.toChar()\n        var i = 0\n        while (i < rule.length) {\n            val c = rule[i]\n            when {\n                quote != 0.toChar() -> {\n                    sb.append(c)\n                    if (c == quote && (i == 0 || rule[i - 1] != '\\\\')) quote = 0.toChar()\n                    i++\n                }\n                c == '\"' || c == '\\'' || c == '`' -> {\n                    quote = c\n                    sb.append(c)\n                    i++\n                }\n                c == '{' -> {\n                    brace++\n                    sb.append(c)\n                    i++\n                }\n                c == '}' -> {\n                    if (brace > 0) brace--\n                    sb.append(c)\n                    i++\n                }\n                brace == 0 && rule.startsWith(sep, i) -> {\n                    out.add(sb.toString())\n                    sb.setLength(0)\n                    i += sep.length\n                }\n                else -> {\n                    sb.append(c)\n                    i++\n                }\n            }\n        }\n        out.add(sb.toString())\n        return out\n    }\n\n    // ---------------- ## 正则替换 ----------------\n\n    /** 一条已编译的正则替换。 */\n    data class RegexReplacement(val pattern: Regex, val replacement: String)\n\n    /**\n     * 拆出 `##正则##替换`。\n     *\n     * - 返回 first 为去掉替换段后的规则，second 为替换描述（无则 null）\n     * - 正则编译失败时整体按原规则返回，不抛异常（坏规则不能拖垮整条链）\n     */\n    fun parseRegexReplacement(rule: String): Pair<String, RegexReplacement?> {\n        val first = rule.indexOf(REGEX_SEP)\n        if (first < 0) return rule to null\n\n        val patternStart = first + REGEX_SEP.length\n        val second = rule.indexOf(REGEX_SEP, patternStart)\n        if (second < 0) {\n            // 只有 ##正则，没有替换段：视为删除匹配内容\n            val pattern = rule.substring(patternStart)\n            return rule.substring(0, first) to compileOrNull(pattern, \"\")\n        }\n\n        val base = rule.substring(0, first)\n        val pattern = rule.substring(patternStart, second)\n        val replacement = rule.substring(second + REGEX_SEP.length)\n        return base to compileOrNull(pattern, replacement)\n    }\n\n    private fun compileOrNull(pattern: String, replacement: String): RegexReplacement? {\n        if (pattern.isEmpty()) return null\n        return runCatching { RegexReplacement(Regex(pattern), replacement) }.getOrNull()\n    }\n\n    /**\n     * 应用替换。replacement 支持 `$1`、`${name}` 反向引用。\n     * 正则无效（构造时已置空）时调用方不会拿到本对象，故这里可安全执行。\n     */\n    fun applyReplacement(value: String, repl: RegexReplacement): String =\n        runCatching { repl.pattern.replace(value, repl.replacement) }.getOrDefault(value)\n\n    // ---------------- put / get 变量指令 ----------------\n\n    data class VarDirectives(\n        val rule: String,\n        val puts: List<Pair<String, String>>,\n        val gets: List<String>\n    )\n\n    private val PUT_REGEX = Regex(\"\"\"@put:\\{([^}]*)}\"\"\")\n    private val GET_REGEX = Regex(\"\"\"@get:\\{([^}]*)}\"\"\")\n\n    /**\n     * 提取并移除 `@put:{key:rule}`、`@get:{key}`。\n     *\n     * put 的 value 本身可能含 `:`（如 `@css:xxx`），因此只按第一个 `:` 切分。\n     */\n    fun parseVarDirectives(rule: String): VarDirectives {\n        val puts = ArrayList<Pair<String, String>>()\n        PUT_REGEX.findAll(rule).forEach { m ->\n            val body = m.groupValues[1]\n            val idx = body.indexOf(':')\n            if (idx > 0) {\n                val key = body.substring(0, idx).trim()\n                val value = body.substring(idx + 1).trim()\n                if (key.isNotEmpty()) puts.add(key to value)\n            }\n        }\n\n        val gets = ArrayList<String>()\n        GET_REGEX.findAll(rule).forEach { m ->\n            m.groupValues[1].split(',', ';')\n                .map { it.trim() }\n                .filter { it.isNotEmpty() }\n                .forEach { gets.add(it) }\n        }\n\n        val stripped = PUT_REGEX.replace(rule, \"\").let { GET_REGEX.replace(it, \"\") }.trim()\n        return VarDirectives(stripped, puts, gets)\n    }\n\n    // ---------------- {{ }} 模板 ----------------\n\n    private val TEMPLATE_REGEX = Regex(\"\"\"\\{\\{([^}]*)\\}\\}\"\"\")\n\n    /** 列出所有模板表达式内容（去空白），供调用方决定如何求值。 */\n    fun findTemplateExpressions(rule: String): List<String> =\n        TEMPLATE_REGEX.findAll(rule).map { it.groupValues[1].trim() }.toList()\n\n    /**\n     * 替换 `{{ }}`。求值失败时保留原样，避免把规则打穿成空串。\n     */\n    fun resolveTemplate(template: String, resolve: (String) -> String?): String =\n        TEMPLATE_REGEX.replace(template) { m ->\n            val expr = m.groupValues[1].trim()\n            resolve(expr) ?: m.value\n        }\n\n    // ---------------- @ 链索引 ----------------\n\n    /**\n     * Legado 的 `class.item.1@tag.a` 中 `.1` 表示取第 2 个元素。\n     * 独立成函数便于单测覆盖负数 / 越界。\n     */\n    fun isIndexSegment(segment: String): Boolean {\n        val t = segment.trim()\n        if (t.length < 2 || t[0] != '.') return false\n        return t.substring(1).toIntOrNull() != null\n    }\n\n    fun indexOfSegment(segment: String): Int? =\n        if (!isIndexSegment(segment)) null else segment.trim().substring(1).toIntOrNull()\n\n    /** 安全取第 index 个（支持负数代表倒数）。越界返回 null。 */\n    fun pickIndex(values: List<String>, index: Int): String? {\n        if (values.isEmpty()) return null\n        val real = if (index < 0) values.size + index else index\n        return values.getOrNull(real)\n    }\n\n    // ---------------- 规则类型判定 ----------------\n\n    fun isJsRule(rule: String): Boolean {\n        val t = rule.trimStart()\n        return t.startsWith(\"<js>\") || t.startsWith(\"@js:\")\n    }\n\n    fun isJsonPathRule(rule: String): Boolean = rule.trimStart().startsWith(\"$\")\n\n    fun isXPathRule(rule: String): Boolean {\n        val t = rule.trimStart()\n        return t.startsWith(\"//\") || t.startsWith(\"/html\")\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rule/SortUrlParser.kt", "lang": "kt", "lines": 87, "content": "package com.lanyue.reader.source.rule\n\nimport com.lanyue.reader.core.engine.JsExecMode\nimport com.lanyue.reader.core.engine.JsRuntime\nimport com.lanyue.reader.core.engine.PoolTier\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.source.model.SortRule\n\n/**\n * 1.4.4 sortUrl 动态生成。\n *\n * - 静态多行：按「分类名::url」解析，行分隔符支持换行与 &&\n * - 含 @js: / <js><\/js>：走 JsRuntime 主上下文 IIFE 生成\n * - 失败降级为「无分类」，只显示列表态\n * - 分类数量上限 100，超出截断并埋点\n */\nclass SortUrlParser(\n    private val js: JsRuntime,\n    private val metrics: LocalMetrics\n) {\n\n    companion object {\n        const val MAX_SORTS = 100\n        private const val LINE_SEP = \"\\n\"\n        private const val ALT_SEP = \"&&\"\n    }\n\n    data class Result(\n        val sorts: List<SortRule>,\n        val truncated: Boolean,\n        val degraded: Boolean\n    )\n\n    suspend fun parse(sortUrl: String?, sourceId: String, traceId: String): Result {\n        if (sortUrl.isNullOrBlank()) return Result(emptyList(), truncated = false, degraded = false)\n\n        // 1.4.4 动态生成：@js: 或 <js><\/js>\n        val isDynamic = sortUrl.contains(\"@js:\") || sortUrl.contains(\"<js>\")\n        if (isDynamic) {\n            val script = if (sortUrl.contains(\"@js:\")) {\n                sortUrl.substringAfter(\"@js:\")\n            } else {\n                sortUrl.substringAfter(\"<js>\").substringBefore(\"<\/js>\")\n            }\n            val raw = runCatching {\n                js.eval(\n                    script = \"(function(){ \" + script + \" })()\",\n                    mode = JsExecMode.MAIN,\n                    tier = PoolTier.NORMAL,\n                    traceId = traceId\n                ) { _, _ -> true }\n            }.getOrNull()\n\n            if (raw.isNullOrBlank()) {\n                // 1.4.4 失败降级为「无分类」\n                metrics.degradation(traceId, \"sort_url_js_failed\")\n                return Result(emptyList(), truncated = false, degraded = true)\n            }\n            return clamp(parseStatic(raw), traceId)\n        }\n\n        return clamp(parseStatic(sortUrl), traceId)\n    }\n\n    private fun clamp(parsed: List<SortRule>, traceId: String): Result {\n        val truncated = parsed.size > MAX_SORTS\n        if (truncated) {\n            metrics.degradation(traceId, \"sort_url_truncated_at_\" + MAX_SORTS)\n        }\n        return Result(parsed.take(MAX_SORTS), truncated, degraded = false)\n    }\n\n    /** 静态解析：「名::url」，一行一个，也支持 && 串联。 */\n    fun parseStatic(raw: String): List<SortRule> {\n        val lines = raw.split(LINE_SEP, ALT_SEP)\n            .map { it.trim() }\n            .filter { it.isNotEmpty() }\n\n        return lines.mapNotNull { line ->\n            val idx = line.indexOf(\"::\")\n            if (idx <= 0) return@mapNotNull null\n            val name = line.substring(0, idx).trim()\n            val url = line.substring(idx + 2).trim()\n            if (name.isEmpty() || url.isEmpty()) null else SortRule(name, url)\n        }\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rule/UrlTemplate.kt", "lang": "kt", "lines": 32, "content": "package com.lanyue.reader.source.rule\n\n/**\n * 1.4.3 searchUrl 占位符替换。\n *\n * 明确约束：\n * - 支持 {{key}} / {{page}}\n * - 无占位符时默认原样请求，不自动追加 ?q={key}\n *   （Legado AnalyzeUrl 无此行为，自动追加属猜测，见 TODO-DEV-3）\n */\nobject UrlTemplate {\n\n    fun fillKey(template: String, key: String): String {\n        val encoded = java.net.URLEncoder.encode(key, \"UTF-8\")\n        return template.replace(\"{{key}}\", encoded)\n            .replace(\"{{key_raw}}\", key)\n    }\n\n    fun fillPage(template: String, page: Int): String =\n        template.replace(\"{{page}}\", page.toString())\n\n    fun fill(template: String, key: String?, page: Int): String {\n        var out = fillPage(template, page)\n        if (key != null) out = fillKey(out, key)\n        return out\n    }\n\n    /** 是否含占位符。无占位符的 searchUrl 原样请求。 */\n    fun hasKeyPlaceholder(template: String): Boolean = template.contains(\"{{key}}\")\n\n    fun hasPagePlaceholder(template: String): Boolean = template.contains(\"{{page}}\")\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/rule/XPathLite.kt", "lang": "kt", "lines": 291, "content": "package com.lanyue.reader.source.rule\n\n/**\n * 7.1 XPath → CSS 转换（纯 Kotlin，无 Android）。\n *\n * Legado 书源大量使用 XPath 风格规则，早期实现把 `//div/a` 直接塞给 jsoup，\n * 必然匹配不到。这里把常见子集翻译成 jsoup 能执行的 CSS：\n *\n *   //div[@class='x']/a/text()      -> div.x > a  + 取文本\n *   //div[@id='y']//span            -> div#y span\n *   //ul/li[2]                      -> ul > li:nth-child(2)\n *   //a[@href]/@href                -> a[href]   + 取属性 href\n *   //div[contains(@class,'box')]   -> div[class*=box]\n *   //p[last()]                     -> p:last-child\n *   /html/body/div[1]              -> html > body > div:nth-child(1)\n *\n * 明确不支持的（返回 null，由调用方降级）：\n *   - 轴（ancestor:: / following-sibling::）\n *   - 函数（text() 之外的 normalize-space 等）\n *   - 复杂布尔表达式（and / or）\n *\n * 取舍理由：宁可在不支持时明确降级，也不要生成一个语义错误的 CSS\n * 把无关节点取回来——后者会造成\"看起来有数据但全是错的\"。\n */\nobject XPathLite {\n\n    /** 转换结果：可执行的 CSS 选择器 + 取值方式。 */\n    data class Converted(val css: String, val directive: String?)\n\n    /**\n     * 判断是否像 XPath。以 `/` 或 `//` 开头，且不是协议相对 URL（`//host/path`）。\n     */\n    fun looksLikeXPath(rule: String): Boolean {\n        val t = rule.trim()\n        if (!t.startsWith(\"/\") && !t.startsWith(\"(//\") && !t.startsWith(\"(./\")) return false\n        // //example.com/a 这种更像 URL 尾巴，不当 XPath\n        if (t.startsWith(\"//\")) {\n            val firstSeg = t.trimStart('/').substringBefore('/')\n            if (firstSeg.contains('.') && !firstSeg.contains('[') && !firstSeg.contains('@')) {\n                return false\n            }\n        }\n        return true\n    }\n\n    /**\n     * 执行转换。无法转换返回 null。\n     *\n     * [xpath] 允许外层带括号，如 `(//div/a)[1]` 会剥离外层括号后处理。\n     */\n    fun toCss(xpath: String): Converted? {\n        var expr = xpath.trim()\n        if (expr.startsWith(\"(\") && expr.endsWith(\")\")) {\n            expr = expr.substring(1, expr.length - 1).trim()\n        }\n        if (!expr.startsWith(\"/\")) return null\n        if (expr.contains(\"::\")) return null\n        // 不支持布尔组合，避免把 a and b 翻成错误的选择器\n        if (Regex(\"\\\\b(and|or)\\\\b\").containsMatchIn(expr)) return null\n\n        var directive: String? = null\n\n        // 尾部 /text() 或 /@attr\n        val textIdx = expr.lastIndexOf(\"/text()\")\n        if (textIdx >= 0 && textIdx == expr.length - \"/text()\".length) {\n            directive = \"text\"\n            expr = expr.substring(0, textIdx)\n        } else {\n            val attrMatch = Regex(\"/@([A-Za-z_:][-A-Za-z0-9_:.]*)$\").find(expr)\n            if (attrMatch != null) {\n                directive = \"attr:\" + attrMatch.groupValues[1].lowercase()\n                expr = expr.substring(0, attrMatch.range.first)\n            }\n        }\n\n        if (!expr.startsWith(\"/\")) return null\n\n        // 切段：'//' 是后代组合，'/' 是直接子元素\n        val tokens = ArrayList<Pair<Boolean, String>>() // (是否后代, 段文本)\n        var i = 0\n        var pendingDescendant = true // 以 '//' 开头时第一段是后代\n        if (expr.startsWith(\"//\")) {\n            i = 2\n            pendingDescendant = true\n        } else {\n            i = 1\n            pendingDescendant = false\n        }\n\n        val sb = StringBuilder()\n        while (i <= expr.length) {\n            val segStart = i\n            var depth = 0\n            var inSingle = false\n            var inDouble = false\n            while (i < expr.length) {\n                val c = expr[i]\n                when {\n                    inSingle -> if (c == '\\'') inSingle = false\n                    inDouble -> if (c == '\"') inDouble = false\n                    c == '\\'' -> inSingle = true\n                    c == '\"' -> inDouble = true\n                    c == '[' -> depth++\n                    c == ']' -> depth--\n                    c == '/' && depth == 0 -> break\n                }\n                i++\n            }\n            val raw = expr.substring(segStart, i).trim()\n            if (raw.isNotEmpty()) tokens.add(pendingDescendant to raw)\n\n            // 看下一个分隔符是 '/' 还是 '//'\n            if (i < expr.length && expr[i] == '/') {\n                if (i + 1 < expr.length && expr[i + 1] == '/') {\n                    pendingDescendant = true\n                    i += 2\n                } else {\n                    pendingDescendant = false\n                    i += 1\n                }\n            } else {\n                break\n            }\n        }\n\n        if (tokens.isEmpty()) return null\n\n        tokens.forEachIndexed { index, (descendant, raw) ->\n            val part = convertSegment(raw) ?: return null\n            if (index == 0) {\n                sb.append(part)\n            } else {\n                sb.
