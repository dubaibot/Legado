\n        val uri = runCatching { URI(url) }.getOrNull()\n            ?: return FetchVerdict.Deny(\"malformed url\")\n        val scheme = uri.scheme?.lowercase() ?: return FetchVerdict.Deny(\"missing scheme\")\n        if (scheme !in ALLOWED_SCHEMES) return FetchVerdict.Deny(\"scheme not allowed: $scheme\")\n\n        val host = uri.host ?: return FetchVerdict.Deny(\"missing host\")\n        if (isInternalHost(host)) return FetchVerdict.Deny(\"internal host blocked: $host\")\n        if (!domainWhitelist(host)) return FetchVerdict.Deny(\"domain not whitelisted: $host\")\n\n        val normalized = method.uppercase()\n        val isWrite = normalized !in setOf(\"GET\", \"HEAD\")\n        if (isWrite) {\n            if (!declaredByRule && !postAllowed) {\n                return FetchVerdict.Deny(\"method $normalized requires explicit source declaration\")\n            }\n            // 5.2：POST 仍必须过域名白名单与 SSRF 校验（上面已做）\n        }\n        return FetchVerdict.Allow(url, normalized)\n    }\n\n    /**\n     * 内网 / 回环 / 链路本地拦截。\n     * 注意：LocalParseProxy 的 127.0.0.1 播放地址只给 Media3 用，不经过本闸门。\n     */\n    fun isInternalHost(host: String): Boolean {\n        val literal = runCatching { InetAddress.getByName(host) }.getOrNull() ?: return false\n        return literal.isLoopbackAddress ||\n            literal.isSiteLocalAddress ||\n            literal.isLinkLocalAddress ||\n            literal.isAnyLocalAddress\n    }\n\n    /** 重定向逐跳校验：每次 Location 都要重新过 verify，不允许一跳放行到底。 */\n    fun verifyHop(currentUrl: String, location: String): String? {\n        val next = runCatching { URI(currentUrl).resolve(location).toString() }.getOrNull() ?: return null\n        return when (verify(next, \"GET\", declaredByRule = true, postAllowed = false)) {\n            is FetchVerdict.Allow -> next\n            is FetchVerdict.Deny -> null\n        }\n    }\n\n    fun maxBytes(): Long = maxResponseBytes\n}\n\n/**\n * 5.3 防伪造与限流。\n * - nativePostMessage 仅 SANDBOX / DOM_QUERY 通道可用\n * - taskId 为 UUID 闭包，不可预测\n * - 提交侧限流：单源 10/s、单域名 5/s、沙箱 20/s；结果回调不限流\n */\nclass SubmitGuard(\n    private val perSourcePerSec: Int = 10,\n    private val perDomainPerSec: Int = 5,\n    private val perSandboxPerSec: Int = 20\n) {\n    private val sourceWindows = mutableMapOf<String, Window>()\n    private val domainWindows = mutableMapOf<String, Window>()\n    private val sandboxWindows = mutableMapOf<String, Window>()\n\n    private class Window(var startMs: Long, var count: Int)\n\n    @Synchronized\n    fun allowSubmit(sourceId: String, host: String, sandboxId: String, now: Long = System.currentTimeMillis()): Boolean {\n        fun check(map: MutableMap<String, Window>, key: String, limit: Int): Boolean {\n            val w = map.getOrPut(key) { Window(now, 0) }\n            if (now - w.startMs >= 1000L) {\n                w.startMs = now\n                w.count = 0\n            }\n            if (w.count >= limit) return false\n            w.count += 1\n            return true\n        }\n        return check(sourceWindows, sourceId, perSourcePerSec) &&\n            check(domainWindows, host, perDomainPerSec) &&\n            check(sandboxWindows, sandboxId, perSandboxPerSec)\n    }\n\n    fun newTaskId(): String = UUID.randomUUID().toString()\n}\n\n/**\n * 4.6 与 4.10 共用的「HTML 类请求」判定口径。\n * 文档明确要求：C.5 转发判定与 4.6 空响应判定共用同一函数，不允许各自发明。\n */\nobject HtmlRequestClassifier {\n\n    private val HTML_SUFFIXES = setOf(\"html\", \"htm\", \"xhtml\", \"shtml\", \"php\", \"asp\", \"aspx\", \"jsp\")\n\n    fun isHtmlLike(url: String, headers: Map<String, String>): Boolean {\n        val accept = headers.entries\n            .firstOrNull { it.key.equals(\"Accept\", ignoreCase = true) }\n            ?.value\n            ?.lowercase()\n            ?: \"\"\n        if (accept.contains(\"text/html\") || accept.contains(\"application/xhtml\")) return true\n\n        val path = url.substringBefore('?').substringBefore('#')\n        val suffix = path.substringAfterLast('.', \"\").lowercase()\n        if (suffix.isNotEmpty() && suffix in HTML_SUFFIXES) return true\n\n        // 无后缀且无 Accept 声明：按 HTML 视作可疑，进入空响应判定\n        return suffix.isEmpty()\n    }\n\n    /** 4.6 空响应判定：HTML 类请求 200 且 body < 1KB 且不含任何标签。 */\n    fun isEmptyHtmlBody(body: String?): Boolean {\n        if (body == null) return true\n        if (body.length >= 1024) return false\n        return !body.contains('<')\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/core/security/KeystoreSecretStore.kt", "lang": "kt", "lines": 44, "content": "package com.lanyue.reader.core.security\n\nimport android.content.Context\nimport android.util.Base64\nimport androidx.security.crypto.EncryptedSharedPreferences\nimport androidx.security.crypto.MasterKey\n\n/**\n * 4.10.1 / 4.12 Keystore 加密存储。\n *\n * 适用范围：danmaku_sources.appSecret、webdav_credentials.password。\n * 备份导出默认脱敏：不含 secret，恢复时提示重填（ADR-017）。\n */\nclass KeystoreSecretStore(context: Context) {\n\n    private val prefs = runCatching {\n        val masterKey = MasterKey.Builder(context)\n            .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)\n            .build()\n        EncryptedSharedPreferences.create(\n            context,\n            \"lanyue_secrets\",\n            masterKey,\n            EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,\n            EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM\n        )\n    }.getOrNull()\n\n    fun put(key: String, secret: String) {\n        prefs?.edit()?.putString(key, secret)?.apply()\n    }\n\n    fun get(key: String): String? = prefs?.getString(key, null)\n\n    fun remove(key: String) {\n        prefs?.edit()?.remove(key)?.apply()\n    }\n\n    /**\n     * 备份导出默认脱敏：调用方必须使用此方法而不是 raw secret。\n     * 返回 null 表示不应写入备份文件。\n     */\n    fun forBackup(key: String): String? = null\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/core/security/SourcePermission.kt", "lang": "kt", "lines": 74, "content": "package com.lanyue.reader.core.security\n\nimport com.lanyue.reader.core.engine.JsExecMode\n\n/**\n * 5.5 源权限分级。\n * 表的每一行都映射为一个 [SourcePermissionLevel]，决定默认执行环境与网络权限。\n */\nenum class SourcePermissionLevel {\n    /** 书源：主上下文 IIFE，DOM + 受控 GET/POST（规则内 method 声明）+ 基础 JS */\n    BOOK,\n\n    /** 订阅源：主上下文 IIFE，同书源 */\n    SUBSCRIPTION,\n\n    /** 影视源（CMS json/xml）：无 JS，仅受控 HTTP + JSON/XML */\n    VIDEO_CMS,\n\n    /** 影视源（drpy/JS）：复用 iframe 沙箱，DOM + 受控 GET/POST（req() 默认放行） */\n    VIDEO_DRPY,\n\n    /** 影视源（spider jar，二期）：独立进程 ClassLoader 隔离（非安全边界） */\n    VIDEO_SPIDER,\n\n    /** 弹幕源：无 JS（REST），GET + POST（仅 dandanplay v2 端点） */\n    DANMAKU,\n\n    /** 未知源：独立沙箱，最低权限，导入需高危确认 */\n    UNKNOWN\n}\n\n/** 5.5 运行时权限裁决结果。 */\ndata class PermissionGrant(\n    val level: SourcePermissionLevel,\n    val mode: JsExecMode,\n    val allowJs: Boolean,\n    val allowDom: Boolean,\n    val allowGet: Boolean,\n    val allowPost: Boolean,\n    val requireHighRiskConfirm: Boolean\n) {\n    companion object {\n        fun of(level: SourcePermissionLevel): PermissionGrant = when (level) {\n            SourcePermissionLevel.BOOK -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = true, allowDom = true,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.SUBSCRIPTION -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = true, allowDom = true,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.VIDEO_CMS -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = false, allowDom = false,\n                allowGet = true, allowPost = false, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.VIDEO_DRPY -> PermissionGrant(\n                level, JsExecMode.SANDBOX_REUSE, allowJs = true, allowDom = true,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.VIDEO_SPIDER -> PermissionGrant(\n                level, JsExecMode.SANDBOX_ISOLATED, allowJs = true, allowDom = false,\n                allowGet = true, allowPost = false, requireHighRiskConfirm = true\n            )\n            SourcePermissionLevel.DANMAKU -> PermissionGrant(\n                level, JsExecMode.MAIN, allowJs = false, allowDom = false,\n                allowGet = true, allowPost = true, requireHighRiskConfirm = false\n            )\n            SourcePermissionLevel.UNKNOWN -> PermissionGrant(\n                level, JsExecMode.SANDBOX_ISOLATED, allowJs = false, allowDom = false,\n                allowGet = true, allowPost = false, requireHighRiskConfirm = true\n            )\n        }\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/danmaku/DanmakuMatchEngine.kt", "lang": "kt", "lines": 186, "content": "package com.lanyue.reader.danmaku\n\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.DanmakuDao\nimport com.lanyue.reader.data.db.entity.DanmakuBindingEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport com.lanyue.reader.source.model.DanmakuMatch\nimport com.lanyue.reader.source.model.DanmakuMatchRequest\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport kotlinx.coroutines.withTimeoutOrNull\n\n/**\n * 4.10.3 弹幕自动匹配引擎（零操作）。\n *\n * 链路：\n *   onPlaybackStarted\n *   -> 提取匹配上下文（在线：片名+集数 / 本地：文件名+hash+size+时长）\n *   -> 查 danmaku_bindings（视频标识 + 弹幕源）\n *      - 命中 -> 复用 episodeId\n *      - 未命中 -> 遍历启用弹幕源（按 sortOrder）\n *   -> 任一源命中 -> 写 danmaku_bindings -> 拉取\n *   -> 全部未命中 -> 非阻塞提示「未匹配到弹幕，点此手动选择」\n *\n * 关键规则：\n * - 多源按配置顺序尝试，首个命中即用\n * - 单源匹配超时 5s，超时跳过下一源\n * - 后台协程执行，不阻塞起播\n */\nclass DanmakuMatchEngine(\n    private val dao: DanmakuDao,\n    private val sourceFactory: (DanmakuSourceEntity) -> IDanmakuSource?,\n    private val metrics: LocalMetrics\n) {\n\n    companion object {\n        /** 单源匹配超时 5s */\n        const val PER_SOURCE_TIMEOUT_MS = 5_000L\n        /** 4.10.4 分段拉取窗口 */\n        const val COMMENT_WINDOW_MS = 60_000L\n        /** 剩余 < 30s 触发下一段增量拉取 */\n        const val PREFETCH_THRESHOLD_MS = 30_000L\n    }\n\n    sealed class Outcome {\n        /** 命中：可直接进入拉取。 */\n        data class Matched(\n            val match: DanmakuMatch,\n            val source: DanmakuSourceEntity,\n            val videoKey: String\n        ) : Outcome()\n\n        /** 全部未命中：UI 显示「未匹配到弹幕，点此手动选择」。 */\n        data class NotMatched(val videoKey: String) : Outcome()\n    }\n\n    /**\n     * 生成视频标识 videoKey。\n     * 本地文件 = 路径+大小；在线 = 源ID+剧集URL（4.10.5）。\n     */\n    fun videoKeyFor(request: DanmakuMatchRequest, sourceId: String?, episodeUrl: String?): String {\n        return when {\n            request.fileName != null && request.fileSize != null ->\n                \"file:\" + request.fileName + \":\" + request.fileSize\n            sourceId != null && episodeUrl != null ->\n                \"online:\" + sourceId + \":\" + episodeUrl\n            else -> \"title:\" + request.title + \":\" + (request.episode ?: 0)\n        }\n    }\n\n    /**\n     * 自动匹配入口。后台协程执行，不阻塞起播。\n     */\n    suspend fun autoMatch(\n        request: DanmakuMatchRequest,\n        videoKey: String\n    ): Outcome {\n        val sources = dao.enabledOrdered()\n        if (sources.isEmpty()) return Outcome.NotMatched(videoKey)\n\n        // 1) 先查匹配记忆（按 videoKey + 弹幕源）\n        for (entity in sources) {\n            val binding = dao.binding(videoKey, entity.id) ?: continue\n            val match = DanmakuMatch(\n                episodeId = binding.episodeId,\n                animeTitle = request.title,\n                episodeTitle = \"\",\n                shift = binding.shift,\n                sourceId = entity.id\n            )\n            return Outcome.Matched(match, entity, videoKey)\n        }\n\n        // 2) 未命中记忆：遍历启用源（按 sortOrder），首个命中即用\n        for (entity in sources) {\n            val source = sourceFactory(entity) ?: continue\n            val traceId = entity.id + \":match\"\n\n            val match = withTimeoutOrNull(PER_SOURCE_TIMEOUT_MS) {\n                tryMatchOne(source, request)\n            }\n            if (match == null) {\n                metrics.degradation(traceId, \"source_timeout_or_miss\")\n                continue\n            }\n\n            // 写入匹配记忆\n            dao.upsertBinding(\n                DanmakuBindingEntity(\n                    videoKey = videoKey,\n                    danmakuSourceId = entity.id,\n                    episodeId = match.episodeId,\n                    shift = match.shift,\n                    matchMethod = if (request.fileHash != null) \"HASH\" else \"TITLE\",\n                    boundAt = System.currentTimeMillis()\n                )\n            )\n            return Outcome.Matched(match, entity, videoKey)\n        }\n\n        return Outcome.NotMatched(videoKey)\n    }\n\n    /**\n     * 单源匹配：\n     * - 本地文件：先 POST /match（hash），失败转标题搜索\n     * - 在线影视：直接标题+集数搜索\n     */\n    private suspend fun tryMatchOne(source: IDanmakuSource, req: DanmakuMatchRequest): DanmakuMatch? {\n        // 本地文件路径：先哈希匹配\n        if (req.fileName != null && req.fileHash != null) {\n            val hashMatch = source.match(req)\n            if (hashMatch != null) return hashMatch\n        }\n\n        // 标题搜索兜底（在线影视主路径）\n        val results = source.search(req.title)\n        if (results.isEmpty()) return null\n        return pickBest(results, req.title, req.episode)\n    }\n\n    /**\n     * 4.10.3 多结果选取策略（策略单点定义，match 与 search 共用）：\n     * 标题完全一致 > 集数一致 > 第一个\n     */\n    fun pickBest(candidates: List<DanmakuMatch>, title: String, episode: Int?): DanmakuMatch? {\n        if (candidates.isEmpty()) return null\n        candidates.firstOrNull { it.animeTitle.equals(title, ignoreCase = true) }?.let { return it }\n        if (episode != null) {\n            candidates.firstOrNull { it.episodeTitle.contains(episode.toString()) }?.let { return it }\n        }\n        return candidates.first()\n    }\n\n    /**\n     * 4.10.4 拉取。首屏 from=0，duration=60s。\n     * 拉取失败静默重试 1 次，仍失败提示「弹幕加载失败」，不阻塞播放。\n     */\n    suspend fun fetchComments(\n        source: IDanmakuSource,\n        match: DanmakuMatch,\n        fromMs: Long,\n        shiftMs: Long = 0L\n    ): List<DanmakuEvent> {\n        val first = runCatching { source.getComments(match, fromMs, COMMENT_WINDOW_MS) }.getOrNull()\n        val events = first ?: runCatching { source.getComments(match, fromMs, COMMENT_WINDOW_MS) }.getOrNull()\n            ?: return emptyList()\n\n        // 时间轴对齐 + shift 偏移\n        return events.map { it.copy(timeMs = (it.timeMs + shiftMs).coerceAtLeast(0L)) }\n    }\n\n    /** 4.10.5 用户手动改选后覆盖绑定。 */\n    suspend fun bindManually(videoKey: String, sourceId: String, match: DanmakuMatch) {\n        dao.upsertBinding(\n            DanmakuBindingEntity(\n                videoKey = videoKey,\n                danmakuSourceId = sourceId,\n                episodeId = match.episodeId,\n                shift = match.shift,\n                matchMethod = \"MANUAL\",\n                boundAt = System.currentTimeMillis()\n            )\n        )\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuCanvasLayer.kt", "lang": "kt", "lines": 142, "content": "package com.lanyue.reader.danmaku.render\n\nimport androidx.compose.foundation.Canvas\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableLongStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\nimport androidx.compose.runtime.withFrameNanos\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.TextStyle\nimport androidx.compose.ui.text.drawText\nimport androidx.compose.ui.text.rememberTextMeasurer\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport com.lanyue.reader.source.model.DanmakuEvent\n\n/**\n * 4.10.7 Canvas 弹幕层。\n *\n * 设计约束（对应 8.2 性能验收：同屏 200 条不掉帧）：\n * 1. 单 Canvas 绘制，每条弹幕不创建 Composable，避免组合层过载\n * 2. 文本测量结果按 text+size 缓存，循环内不再测量\n * 3. 轨道分配 O(轨道数)，滚动轨道记录\"尾部进入时刻\"判断可复用\n * 4. 超过 maxOnScreen 直接丢弃新弹幕，保帧优于保量\n * 5. 暂停时停止推进时钟，不空转\n *\n * 该层不处理屏蔽规则与去重（DanmakuFilter 已在上游完成），\n * 只负责\"给定事件列表 + 当前播放进度 -> 画面\"。\n */\n@Composable\nfun DanmakuCanvasLayer(\n    events: List<DanmakuEvent>,\n    positionMs: Long,\n    isPlaying: Boolean,\n    params: DanmakuRenderParams = DanmakuRenderParams.DEFAULT,\n    modifier: Modifier = Modifier\n) {\n    val textMeasurer = rememberTextMeasurer()\n    val style = remember(params) {\n        TextStyle(fontSize = (params.fontSizeSp * params.fontScale).sp)\n    }\n\n    // 时钟：仅在播放时推进，暂停即冻结，避免无意义重绘\n    var clockMs by remember { mutableLongStateOf(positionMs) }\n    LaunchedEffect(positionMs, isPlaying) {\n        clockMs = positionMs\n        if (!isPlaying) return@LaunchedEffect\n        val base = positionMs\n        val startNanos = withFrameNanos { it }\n        while (true) {\n            val now = withFrameNanos { it }\n            clockMs = base + (now - startNanos) / 1_000_000\n        }\n    }\n\n    Canvas(modifier = modifier) {\n        val areaHeight = size.height * params.displayAreaRatio\n        val top = params.topReservedDp.dp.toPx()\n        val bottom = areaHeight - params.bottomReservedDp.dp.toPx()\n        if (bottom <= top) return@Canvas\n\n        val lineHeight = style.fontSize.toPx() * params.lineSpacing\n        val trackCount = ((bottom - top) / lineHeight).toInt().coerceAtLeast(1)\n\n        // 滚动轨道尾部位置（用于判断能否复用轨道）\n        val scrollTail = FloatArray(trackCount) { 0f }\n        val topBusyUntil = LongArray(trackCount)\n        val bottomBusyUntil = LongArray(trackCount)\n\n        // 仅保留显示窗口内的事件：以 8 秒窗口为例，够覆盖一屏\n        val windowStart = clockMs - 1_000L\n        val windowEnd = clockMs + 800L\n\n        var drawn = 0\n        for (ev in events) {\n            if (drawn >= params.maxOnScreen) break\n            if (ev.timeMs < windowStart) continue\n            if (ev.timeMs > windowEnd) break\n\n            if (params.blockScroll && ev.mode == 1) continue\n            if (params.blockTop && ev.mode == 3) continue\n            if (params.blockBottom && ev.mode == 2) continue\n\n            val layout = textMeasurer.measure(\n                text = ev.text,\n                style = style,\n                maxLines = 1\n            )\n            val w = layout.size.width.toFloat()\n            val age = (clockMs - ev.timeMs) / 1000f\n            if (age < 0f) continue\n\n            val color = Color(0xFF000000.toInt() or (ev.color and 0xFFFFFF)).copy(alpha = params.opacity)\n\n            when (ev.mode) {\n                1 -> { // 滚动\n                    val travel = size.width + w\n                    val x = size.width - travel * (age * params.scrollSpeedPxPerSec / travel)\n                    if (x + w < 0f) continue\n                    val track = pickTrack(scrollTail, trackCount) { tail -> tail <= size.width - w }\n                    val y = top + track * lineHeight\n                    scrollTail[track] = x + w\n                    drawText(layout, color = color, topLeft = androidx.compose.ui.geometry.Offset(x, y))\n                }\n                2 -> { // 底部\n                    val x = (size.width - w) / 2f\n                    val track = pickTrackReverse(bottomBusyUntil, trackCount, ev.timeMs)\n                    if (track < 0) continue\n                    val y = bottom - (track + 1) * lineHeight\n                    drawText(layout, color = color, topLeft = androidx.compose.ui.geometry.Offset(x, y))\n                }\n                else -> { // 顶部\n                    val x = (size.width - w) / 2f\n                    val track = pickTrackForward(topBusyUntil, trackCount, ev.timeMs)\n                    if (track < 0) continue\n                    val y = top + track * lineHeight\n                    drawText(layout, color = color, topLeft = androidx.compose.ui.geometry.Offset(x, y))\n                }\n            }\n            drawn++\n        }\n    }\n}\n\n/** 找一条尾部在屏幕右侧之外的轨道，找不到就复用第 0 条（密度优先）。 */\nprivate fun pickTrack(tails: FloatArray, count: Int, ok: (Float) -> Boolean): Int {\n    for (i in 0 until count) if (ok(tails[i])) return i\n    return 0\n}\n\nprivate fun pickTrackForward(busy: LongArray, count: Int, nowMs: Long): Int {\n    for (i in 0 until count) if (busy[i] <= nowMs) { busy[i] = nowMs + 4000; return i }\n    return -1\n}\n\nprivate fun pickTrackReverse(busy: LongArray, count: Int, nowMs: Long): Int {\n    for (i in count - 1 downTo 0) if (busy[i] <= nowMs) { busy[i] = nowMs + 4000; return i }\n    return -1\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuFilter.kt", "lang": "kt", "lines": 36, "content": "package com.lanyue.reader.danmaku.render\n\nimport com.lanyue.reader.source.model.DanmakuEvent\n\n/**\n * 4.10.7 屏蔽规则与合并重复。\n * 独立成类便于单测，且保证 UI 层不做过滤逻辑。\n */\nclass DanmakuFilter(private val params: DanmakuRenderParams) {\n\n    private val regexes = params.blockKeywords.map { Regex(Regex.escape(it), RegexOption.IGNORE_CASE) } +\n        params.blockRegexes.mapNotNull { runCatching { Regex(it) }.getOrNull() }\n\n    fun accept(event: DanmakuEvent): Boolean {\n        if (params.blockScroll && event.mode == 1) return false\n        if (params.blockTop && event.mode == 3) return false\n        if (params.blockBottom && event.mode == 2) return false\n        if (event.text.isBlank()) return false\n        if (regexes.any { it.containsMatchIn(event.text) }) return false\n        return true\n    }\n\n    /** 合并重复：同一时刻同一文本只保留一条。 */\n    fun dedupe(events: List<DanmakuEvent>): List<DanmakuEvent> {\n        if (!params.mergeDuplicates) return events\n        val seen = HashSet<String>()\n        return events.filter { ev ->\n            val key = ev.timeMs.toString() + \"|\" + ev.text\n            seen.add(key)\n        }\n    }\n\n    fun apply(events: List<DanmakuEvent>): List<DanmakuEvent> =\n        dedupe(events.filter { accept(it) })\n            .sortedBy { it.timeMs }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuFormatConverter.kt", "lang": "kt", "lines": 60, "content": "package com.lanyue.reader.danmaku.render\n\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport org.xmlpull.v1.XmlPullParser\nimport org.xmlpull.v1.XmlPullParserFactory\nimport java.io.StringReader\n\n/**\n * 4.10.8 格式转换器。\n * - B 站 XML / AcFun XML -> DanmakuEvent\n * - p 格式：出现时间(秒,浮点),弹幕模式,颜色,[来源]用户ID；模式 1=滚动 2=底部 3=顶部\n */\nobject DanmakuFormatConverter {\n\n    /**\n     * B 站 / AcFun XML。\n     * <d p=\"time,mode,color,uid,...\">text<\/d>\n     */\n    fun fromXml(xml: String): List<DanmakuEvent> = runCatching {\n        val factory = XmlPullParserFactory.newInstance()\n        factory.isNamespaceAware = false\n        val parser = factory.newPullParser()\n        parser.setInput(StringReader(xml))\n\n        val out = mutableListOf<DanmakuEvent>()\n        var event = parser.eventType\n        while (event != XmlPullParser.END_DOCUMENT) {\n            if (event == XmlPullParser.START_TAG && parser.name.equals(\"d\", ignoreCase = true)) {\n                val p = parser.getAttributeValue(null, \"p\")\n                val text = parser.nextText()\n                if (p != null) parseP(p, text)?.let { out.add(it) }\n            }\n            event = parser.next()\n        }\n        out\n    }.getOrDefault(emptyList())\n\n    /** p 格式解析。 */\n    fun parseP(p: String, text: String): DanmakuEvent? {\n        val parts = p.split(\",\")\n        if (parts.size < 3) return null\n        val seconds = parts[0].toDoubleOrNull() ?: return null\n        val mode = normalizeMode(parts[1].toIntOrNull() ?: 1)\n        val color = parts[2].toLongOrNull()?.toInt() ?: 0xFFFFFF\n        return DanmakuEvent(\n            timeMs = (seconds * 1000).toLong(),\n            mode = mode,\n            color = color,\n            text = text\n        )\n    }\n\n    /** B 站 mode：1/2/3 滚动, 4 底部, 5 顶部 -> 内部 1 滚动 / 2 底部 / 3 顶部。 */\n    private fun normalizeMode(raw: Int): Int = when (raw) {\n        4 -> 2\n        5 -> 3\n        in 1..3 -> 1\n        else -> 1\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/danmaku/render/DanmakuRenderParams.kt", "lang": "kt", "lines": 34, "content": "package com.lanyue.reader.danmaku.render\n\n/**\n * 4.10.7 渲染参数。\n * 速度、不透明度、字号缩放、显示区域、顶部/底部保留区、同屏密度、合并重复、屏蔽规则。\n */\ndata class DanmakuRenderParams(\n    /** 滚动速度：每秒横穿屏幕的屏幕宽度倍数 */\n    val scrollSpeedPxPerSec: Float = 240f,\n    val opacity: Float = 0.9f,\n    val fontSizeSp: Float = 15f,\n    val fontScale: Float = 1f,\n    /** 显示区域占屏幕高度的比例（0~1） */\n    val displayAreaRatio: Float = 1f,\n    val topReservedDp: Int = 0,\n    val bottomReservedDp: Int = 40,\n    /** 同屏最大条数，超出丢弃（保帧） */\n    val maxOnScreen: Int = 200,\n    val mergeDuplicates: Boolean = true,\n    /** 屏蔽规则：关键词 */\n    val blockKeywords: List<String> = emptyList(),\n    /** 屏蔽规则：正则 */\n    val blockRegexes: List<String> = emptyList(),\n    val blockScroll: Boolean = false,\n    val blockTop: Boolean = false,\n    val blockBottom: Boolean = false,\n    /** 轨道行高倍数 */\n    val lineSpacing: Float = 1.2f\n) {\n    companion object {\n        /** 8.2 验收：中端机 60fps，同屏 200 条无掉帧。 */\n        val DEFAULT = DanmakuRenderParams()\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/data/db/CatalogDaos.kt", "lang": "kt", "lines": 136, "content": "package com.lanyue.reader.data.db\n\nimport androidx.room.Dao\nimport androidx.room.Insert\nimport androidx.room.OnConflictStrategy\nimport androidx.room.Query\nimport com.lanyue.reader.data.db.entity.BookEntity\nimport com.lanyue.reader.data.db.entity.CacheFileEntity\nimport com.lanyue.reader.data.db.entity.DownloadTaskEntity\nimport com.lanyue.reader.data.db.entity.PlayRecordEntity\nimport com.lanyue.reader.data.db.entity.ReadRecordEntity\nimport com.lanyue.reader.data.db.entity.RssFavoriteEntity\nimport com.lanyue.reader.data.db.entity.RuleSubEntity\nimport com.lanyue.reader.data.db.entity.SearchHistoryEntity\nimport com.lanyue.reader.data.db.entity.VideoFavoriteEntity\nimport com.lanyue.reader.data.db.entity.WebDavCredentialEntity\n\n/** 3.1 书架 DAO。 */\n@Dao\ninterface BookshelfDao {\n    @Query(\"SELECT * FROM books WHERE inBookshelf = 1 ORDER BY sortOrder ASC, lastReadAt DESC\")\n    suspend fun all(): List<BookEntity>\n\n    @Query(\"SELECT * FROM books WHERE inBookshelf = 1 AND groupName = :group ORDER BY sortOrder ASC\")\n    suspend fun byGroup(group: String): List<BookEntity>\n\n    @Query(\"SELECT DISTINCT groupName FROM books WHERE inBookshelf = 1\")\n    suspend fun groups(): List<String>\n\n    @Query(\"SELECT * FROM books WHERE bookUrl = :url\")\n    suspend fun byUrl(url: String): BookEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(book: BookEntity)\n\n    @Query(\"UPDATE books SET inBookshelf = 0 WHERE bookUrl = :url\")\n    suspend fun removeFromShelf(url: String)\n}\n\n@Dao\ninterface FavoriteDao {\n    @Query(\"SELECT * FROM rss_favorites ORDER BY savedAt DESC\")\n    suspend fun rssFavorites(): List<RssFavoriteEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun saveRss(item: RssFavoriteEntity)\n\n    @Query(\"DELETE FROM rss_favorites WHERE articleUrl = :url\")\n    suspend fun removeRss(url: String)\n\n    @Query(\"SELECT * FROM video_favorites ORDER BY savedAt DESC\")\n    suspend fun videoFavorites(): List<VideoFavoriteEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun saveVideo(item: VideoFavoriteEntity)\n\n    @Query(\"DELETE FROM video_favorites WHERE videoUrl = :url\")\n    suspend fun removeVideo(url: String)\n}\n\n/** 4.12 播放/阅读进度。 */\n@Dao\ninterface ProgressDao {\n    @Query(\"SELECT * FROM play_records WHERE videoKey = :key\")\n    suspend fun playRecord(key: String): PlayRecordEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertPlay(record: PlayRecordEntity)\n\n    @Query(\"SELECT * FROM read_records WHERE bookUrl = :key\")\n    suspend fun readRecord(key: String): ReadRecordEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertRead(record: ReadRecordEntity)\n}\n\n/** 4.12 rule_subs 规则订阅。 */\n@Dao\ninterface RuleSubDao {\n    @Query(\"SELECT * FROM rule_subs ORDER BY name\")\n    suspend fun all(): List<RuleSubEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(sub: RuleSubEntity)\n\n    @Query(\"DELETE FROM rule_subs WHERE id = :id\")\n    suspend fun delete(id: String)\n}\n\n/** 4.11 下载与缓存。 */\n@Dao\ninterface DownloadDao {\n    @Query(\"SELECT * FROM download_tasks ORDER BY createdAt DESC\")\n    suspend fun tasks(): List<DownloadTaskEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertTask(task: DownloadTaskEntity)\n\n    @Query(\"DELETE FROM download_tasks WHERE id = :id\")\n    suspend fun deleteTask(id: String)\n\n    @Query(\"SELECT * FROM cache_files ORDER BY lastAccessAt DESC\")\n    suspend fun cacheFiles(): List<CacheFileEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertCache(file: CacheFileEntity)\n\n    /** 4.11 LRU 清理：锁定文件不参与。 */\n    @Query(\"DELETE FROM cache_files WHERE path IN (SELECT path FROM cache_files WHERE locked = 0 ORDER BY lastAccessAt ASC LIMIT :count)\")\n    suspend fun evictLru(count: Int)\n\n    @Query(\"SELECT SUM(sizeBytes) FROM cache_files\")\n    suspend fun totalSize(): Long?\n}\n\n/** 3.8 搜索历史。 */\n@Dao\ninterface SearchHistoryDao {\n    @Query(\"SELECT * FROM search_history WHERE sourceType = :type ORDER BY searchedAt DESC LIMIT :limit\")\n    suspend fun recent(type: String, limit: Int = 20): List<SearchHistoryEntity>\n\n    @Insert\n    suspend fun insert(item: SearchHistoryEntity)\n\n    @Query(\"DELETE FROM search_history WHERE sourceType = :type\")\n    suspend fun clear(type: String)\n}\n\n@Dao\ninterface WebDavDao {\n    @Query(\"SELECT * FROM webdav_credentials LIMIT 1\")\n    suspend fun current(): WebDavCredentialEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(cred: WebDavCredentialEntity)\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/data/db/Converters.kt", "lang": "kt", "lines": 45, "content": "package com.lanyue.reader.data.db\n\nimport androidx.room.TypeConverter\nimport com.google.gson.Gson\nimport com.google.gson.reflect.TypeToken\n\n/**\n * 4.12 书源 JSON 中嵌套规则对象以 TypeConverter 序列化。\n * 规则对象在领域层是结构化类型，落库时统一转 JSON 字符串。\n */\nclass Converters {\n\n    private val gson = Gson()\n\n    @TypeConverter\n    fun mapToJson(value: Map<String, String>?): String? =\n        value?.let { gson.toJson(it) }\n\n    @TypeConverter\n    fun jsonToMap(value: String?): Map<String, String>? =\n        value?.let {\n            runCatching {\n                gson.fromJson<Map<String, String>>(\n                    it, object : TypeToken<Map<String, String>>() {}.type\n                )\n            }.getOrNull()\n        }\n\n    @TypeConverter\n    fun listToJson(value: List<String>?): String? = value?.let { gson.toJson(it) }\n\n    @TypeConverter\n    fun jsonToList(value: String?): List<String>? =\n        value?.let {\n            runCatching {\n                gson.fromJson<List<String>>(\n                    it, object : TypeToken<List<String>>() {}.type\n                )\n            }.getOrNull()\n        }\n\n    /** 嵌套规则对象（ruleSearch / ruleToc ...）。 */\n    @TypeConverter\n    fun objectToJson(value: Any?): String? = value?.let { gson.toJson(it) }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/data/db/LanyueDatabase.kt", "lang": "kt", "lines": 75, "content": "package com.lanyue.reader.data.db\n\nimport android.content.Context\nimport androidx.room.Database\nimport androidx.room.Room\nimport androidx.room.RoomDatabase\nimport androidx.room.TypeConverters\nimport com.lanyue.reader.data.db.entity.BookEntity\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.CacheFileEntity\nimport com.lanyue.reader.data.db.entity.DanmakuBindingEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.data.db.entity.DownloadTaskEntity\nimport com.lanyue.reader.data.db.entity.LiveSourceEntity\nimport com.lanyue.reader.data.db.entity.PlayRecordEntity\nimport com.lanyue.reader.data.db.entity.ReadRecordEntity\nimport com.lanyue.reader.data.db.entity.RssFavoriteEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.RuleSubEntity\nimport com.lanyue.reader.data.db.entity.SearchHistoryEntity\nimport com.lanyue.reader.data.db.entity.VideoApiEntity\nimport com.lanyue.reader.data.db.entity.VideoFavoriteEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\nimport com.lanyue.reader.data.db.entity.WebDavCredentialEntity\n\n/**\n * 4.12 本地数据模型（Room）总装。\n * 全部表按 4.12 表清单一一对应，不多建、不少建。\n */\n@Database(\n    entities = [\n        BookSourceEntity::class,\n        RssSourceEntity::class,\n        VideoApiEntity::class,\n        VideoSiteEntity::class,\n        LiveSourceEntity::class,\n        DanmakuSourceEntity::class,\n        DanmakuBindingEntity::class,\n        BookEntity::class,\n        RssFavoriteEntity::class,\n        VideoFavoriteEntity::class,\n        PlayRecordEntity::class,\n        ReadRecordEntity::class,\n        RuleSubEntity::class,\n        DownloadTaskEntity::class,\n        CacheFileEntity::class,\n        SearchHistoryEntity::class,\n        WebDavCredentialEntity::class\n    ],\n    version = 1,\n    exportSchema = true\n)\n@TypeConverters(Converters::class)\nabstract class LanyueDatabase : RoomDatabase() {\n\n    abstract fun bookSourceDao(): BookSourceDao\n    abstract fun rssSourceDao(): RssSourceDao\n    abstract fun videoDao(): VideoDao\n    abstract fun liveSourceDao(): LiveSourceDao\n    abstract fun danmakuDao(): DanmakuDao\n    abstract fun bookshelfDao(): BookshelfDao\n    abstract fun favoriteDao(): FavoriteDao\n    abstract fun progressDao(): ProgressDao\n    abstract fun ruleSubDao(): RuleSubDao\n    abstract fun downloadDao(): DownloadDao\n    abstract fun searchHistoryDao(): SearchHistoryDao\n    abstract fun webDavDao(): WebDavDao\n\n    companion object {\n        fun build(context: Context): LanyueDatabase =\n            Room.databaseBuilder(context, LanyueDatabase::class.java, \"lanyue.db\")\n                .fallbackToDestructiveMigration()\n                .build()\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/data/db/SourceDaos.kt", "lang": "kt", "lines": 187, "content": "package com.lanyue.reader.data.db\n\nimport androidx.room.Dao\nimport androidx.room.Insert\nimport androidx.room.OnConflictStrategy\nimport androidx.room.Query\nimport androidx.room.Transaction\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.DanmakuBindingEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.data.db.entity.LiveSourceEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoApiEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\n\n/** 4.12 书源 DAO。 */\n@Dao\ninterface BookSourceDao {\n    @Query(\"SELECT * FROM book_sources ORDER BY bookSourceName\")\n    suspend fun all(): List<BookSourceEntity>\n\n    @Query(\"SELECT * FROM book_sources WHERE enabled = 1\")\n    suspend fun enabled(): List<BookSourceEntity>\n\n    /** 3.2 状态 A：仅展示启用且 enabledExplore + exploreUrl 非空的书源。 */\n    @Query(\"SELECT * FROM book_sources WHERE enabled = 1 AND enabledExplore = 1 AND exploreUrl IS NOT NULL AND exploreUrl != ''\")\n    suspend fun discoverable(): List<BookSourceEntity>\n\n    /** 1.4.2 SEARCHABLE：searchUrl 非空 + ruleSearch 存在。 */\n    @Query(\"SELECT * FROM book_sources WHERE enabled = 1 AND searchDegraded = 0 AND searchUrl IS NOT NULL AND searchUrl != '' AND ruleSearch IS NOT NULL\")\n    suspend fun searchable(): List<BookSourceEntity>\n\n    @Query(\"SELECT * FROM book_sources WHERE bookSourceUrl = :url\")\n    suspend fun byUrl(url: String): BookSourceEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(source: BookSourceEntity)\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertAll(sources: List<BookSourceEntity>)\n\n    @Query(\"DELETE FROM book_sources WHERE bookSourceUrl = :url\")\n    suspend fun delete(url: String)\n\n    @Query(\"UPDATE book_sources SET enabled = :enabled WHERE bookSourceUrl = :url\")\n    suspend fun setEnabled(url: String, enabled: Boolean)\n\n    /** 1.4.3 / ADR-018：搜索失败计数 +1，达 3 次标记降级。 */\n    @Query(\"UPDATE book_sources SET searchFailCount = searchFailCount + 1, searchDegraded = CASE WHEN searchFailCount + 1 >= 3 THEN 1 ELSE searchDegraded END WHERE bookSourceUrl = :url\")\n    suspend fun recordSearchFailure(url: String)\n\n    @Query(\"UPDATE book_sources SET searchFailCount = 0 WHERE bookSourceUrl = :url\")\n    suspend fun resetSearchFailure(url: String)\n\n    @Query(\"UPDATE book_sources SET searchDegraded = :degraded WHERE bookSourceUrl = :url\")\n    suspend fun setSearchDegraded(url: String, degraded: Boolean)\n}\n\n/** 4.12 / 1.4 订阅源 DAO。 */\n@Dao\ninterface RssSourceDao {\n    @Query(\"SELECT * FROM rss_sources ORDER BY customOrder ASC, sourceName ASC\")\n    suspend fun all(): List<RssSourceEntity>\n\n    @Query(\"SELECT * FROM rss_sources WHERE enabled = 1 ORDER BY customOrder ASC\")\n    suspend fun enabled(): List<RssSourceEntity>\n\n    /** 3.3 搜索入口按 SEARCHABLE 动态显示：searchUrl 非空且未降级。 */\n    @Query(\"SELECT * FROM rss_sources WHERE enabled = 1 AND searchDegraded = 0 AND searchUrl IS NOT NULL AND searchUrl != ''\")\n    suspend fun searchable(): List<RssSourceEntity>\n\n    /** 1.4.2 DISCOVERABLE：sortUrl 非空。 */\n    @Query(\"SELECT * FROM rss_sources WHERE enabled = 1 AND sortUrl IS NOT NULL AND sortUrl != ''\")\n    suspend fun discoverable(): List<RssSourceEntity>\n\n    @Query(\"SELECT * FROM rss_sources WHERE sourceUrl = :url\")\n    suspend fun byUrl(url: String): RssSourceEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(source: RssSourceEntity)\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertAll(sources: List<RssSourceEntity>)\n\n    @Query(\"DELETE FROM rss_sources WHERE sourceUrl = :url\")\n    suspend fun delete(url: String)\n\n    @Query(\"UPDATE rss_sources SET searchFailCount = searchFailCount + 1, searchDegraded = CASE WHEN searchFailCount + 1 >= 3 THEN 1 ELSE searchDegraded END WHERE sourceUrl = :url\")\n    suspend fun recordSearchFailure(url: String)\n}\n\n/** 4.12 / 7.3 TVBox 接口与站点 DAO。 */\n@Dao\ninterface VideoDao {\n    @Query(\"SELECT * FROM video_apis ORDER BY name\")\n    suspend fun allApis(): List<VideoApiEntity>\n\n    @Query(\"SELECT * FROM video_apis WHERE url = :url\")\n    suspend fun api(url: String): VideoApiEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertApi(api: VideoApiEntity)\n\n    @Query(\"SELECT * FROM video_sites WHERE enabled = 1 ORDER BY name\")\n    suspend fun enabledSites(): List<VideoSiteEntity>\n\n    @Query(\"SELECT * FROM video_sites WHERE configUrl = :configUrl ORDER BY name\")\n    suspend fun sitesOf(configUrl: String): List<VideoSiteEntity>\n\n    @Query(\"SELECT * FROM video_sites WHERE configUrl = :configUrl AND siteKey = :siteKey\")\n    suspend fun site(configUrl: String, siteKey: String): VideoSiteEntity?\n\n    /** 仅 searchable 站点参与搜索聚合（3.4 / 3.8）。 */\n    @Query(\"SELECT * FROM video_sites WHERE enabled = 1 AND searchable = 1 AND unsupported = 0\")\n    suspend fun searchableSites(): List<VideoSiteEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertSites(sites: List<VideoSiteEntity>)\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertSite(site: VideoSiteEntity)\n\n    /**\n     * 4.12 / 附录 B 用例 21：删除接口配置时级联删除其站点。\n     * 用事务保证配置与站点不会出现半删状态。\n     */\n    @Transaction\n    suspend fun deleteConfigCascade(configUrl: String) {\n        deleteSitesOf(configUrl)\n        deleteApi(configUrl)\n    }\n\n    @Query(\"DELETE FROM video_sites WHERE configUrl = :configUrl\")\n    suspend fun deleteSitesOf(configUrl: String)\n\n    @Query(\"DELETE FROM video_apis WHERE url = :configUrl\")\n    suspend fun deleteApi(configUrl: String)\n}\n\n/** 4.12 live_sources：一期只写不读 UI。 */\n@Dao\ninterface LiveSourceDao {\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertAll(sources: List<LiveSourceEntity>)\n\n    @Query(\"SELECT * FROM live_sources WHERE apiUrl = :apiUrl\")\n    suspend fun ofApi(apiUrl: String): List<LiveSourceEntity>\n\n    @Query(\"SELECT COUNT(*) FROM live_sources\")\n    suspend fun count(): Int\n}\n\n/** 4.10 / 4.12 弹幕源与匹配记忆 DAO。 */\n@Dao\ninterface DanmakuDao {\n    @Query(\"SELECT * FROM danmaku_sources ORDER BY sortOrder ASC\")\n    suspend fun all(): List<DanmakuSourceEntity>\n\n    @Query(\"SELECT * FROM danmaku_sources WHERE enabled = 1 ORDER BY sortOrder ASC\")\n    suspend fun enabledOrdered(): List<DanmakuSourceEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsert(source: DanmakuSourceEntity)\n\n    @Query(\"DELETE FROM danmaku_sources WHERE id = :id\")\n    suspend fun delete(id: String)\n\n    @Query(\"UPDATE danmaku_sources SET verified = :verified WHERE id = :id\")\n    suspend fun setVerified(id: String, verified: Boolean)\n\n    /** 4.10.5 匹配记忆：按 视频标识 + 弹幕源 查。 */\n    @Query(\"SELECT * FROM danmaku_bindings WHERE videoKey = :videoKey AND danmakuSourceId = :sourceId\")\n    suspend fun binding(videoKey: String, sourceId: String): DanmakuBindingEntity?\n\n    @Query(\"SELECT * FROM danmaku_bindings WHERE videoKey = :videoKey\")\n    suspend fun bindingsOf(videoKey: String): List<DanmakuBindingEntity>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun upsertBinding(binding: DanmakuBindingEntity)\n\n    /** 设置 → 弹幕 → 清除匹配记录。 */\n    @Query(\"DELETE FROM danmaku_bindings\")\n    suspend fun clearBindings()\n\n    @Query(\"DELETE FROM danmaku_bindings WHERE videoKey = :videoKey\")\n    suspend fun clearBinding(videoKey: String)\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/data/db/entity/CatalogEntities.kt", "lang": "kt", "lines": 126, "content": "package com.lanyue.reader.data.db.entity\n\nimport androidx.room.Entity\nimport androidx.room.Index\nimport androidx.room.PrimaryKey\n\n/** 3.1 书架。分组：全部/小说/音频/追剧/订阅。 */\n@Entity(tableName = \"books\", indices = [Index(\"groupName\"), Index(\"sourceType\")])\ndata class BookEntity(\n    @PrimaryKey val bookUrl: String,\n    val name: String,\n    val author: String? = null,\n    val cover: String? = null,\n    val intro: String? = null,\n    val origin: String,\n    val originName: String? = null,\n    /** 0 小说 / 1 音频 / 2 追剧 / 3 订阅 */\n    val sourceType: Int = 0,\n    val groupName: String = \"全部\",\n    val latestChapter: String? = null,\n    val totalChapter: Int = 0,\n    val lastReadAt: Long = 0,\n    val sortOrder: Int = 0,\n    val inBookshelf: Boolean = true\n)\n\n/** 3.3 订阅收藏（RssFavorites）。 */\n@Entity(tableName = \"rss_favorites\")\ndata class RssFavoriteEntity(\n    @PrimaryKey val articleUrl: String,\n    val title: String,\n    val sourceUrl: String,\n    val cover: String? = null,\n    val pubDate: Long? = null,\n    val savedAt: Long = System.currentTimeMillis()\n)\n\n/** 影视收藏。 */\n@Entity(tableName = \"video_favorites\")\ndata class VideoFavoriteEntity(\n    @PrimaryKey val videoUrl: String,\n    val title: String,\n    val configUrl: String,\n    val siteKey: String,\n    val cover: String? = null,\n    val savedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 play_records 播放进度。 */\n@Entity(tableName = \"play_records\")\ndata class PlayRecordEntity(\n    @PrimaryKey val videoKey: String,\n    val title: String,\n    val episodeIndex: Int = 0,\n    val positionMs: Long = 0,\n    val durationMs: Long = 0,\n    val updatedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 read_records 阅读进度。 */\n@Entity(tableName = \"read_records\")\ndata class ReadRecordEntity(\n    @PrimaryKey val bookUrl: String,\n    val chapterIndex: Int = 0,\n    val chapterTitle: String? = null,\n    val chapterUrl: String? = null,\n    val position: Int = 0,\n    val updatedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 rule_subs 规则订阅。 */\n@Entity(tableName = \"rule_subs\")\ndata class RuleSubEntity(\n    @PrimaryKey val id: String,\n    /** BOOK / SUBSCRIPTION */\n    val sourceType: String,\n    val url: String,\n    val name: String = \"\",\n    val periodHours: Int = 24,\n    val lastRunAt: Long = 0,\n    val enabled: Boolean = true\n)\n\n/** 4.12 download_tasks 下载任务。 */\n@Entity(tableName = \"download_tasks\")\ndata class DownloadTaskEntity(\n    @PrimaryKey val id: String,\n    /** TEXT / MEDIA */\n    val kind: String,\n    val targetKey: String,\n    val name: String = \"\",\n    val state: Int = 0,\n    val progress: Long = 0,\n    val total: Long = 0,\n    val errorMsg: String? = null,\n    val createdAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 cache_files 缓存文件。 */\n@Entity(tableName = \"cache_files\")\ndata class CacheFileEntity(\n    @PrimaryKey val path: String,\n    val kind: String,\n    val sizeBytes: Long = 0,\n    val locked: Boolean = false,\n    val lastAccessAt: Long = System.currentTimeMillis()\n)\n\n/** 3.8 搜索历史落 search_history 表。 */\n@Entity(tableName = \"search_history\")\ndata class SearchHistoryEntity(\n    @PrimaryKey(autoGenerate = true) val id: Long = 0,\n    val keyword: String,\n    /** BOOK / SUBSCRIPTION / VIDEO */\n    val sourceType: String,\n    val searchedAt: Long = System.currentTimeMillis()\n)\n\n/** 4.12 webdav_credentials。password 由 Keystore 加密。 */\n@Entity(tableName = \"webdav_credentials\")\ndata class WebDavCredentialEntity(\n    @PrimaryKey val id: String,\n    val serverUrl: String,\n    val username: String,\n    val passwordCipher: String\n)\n"}, {"path": "app/src/main/java/com/lanyue/reader/data/db/entity/SourceEntities.kt", "lang": "kt", "lines": 171, "content": "package com.lanyue.reader.data.db.entity\n\nimport androidx.room.Entity\nimport androidx.room.PrimaryKey\n\n/**\n * 4.12 book_sources 书源。\n * bookSourceType: 0 文本 / 1 音频 / 2 图片 / 3 文件 / 4 视频（TODO-DEV-2 枚举边界核对）\n */\n@Entity(tableName = \"book_sources\")\ndata class BookSourceEntity(\n    @PrimaryKey val bookSourceUrl: String,\n    val bookSourceName: String = \"\",\n    val bookSourceGroup: String? = null,\n    val bookSourceType: Int = 0,\n    val enabled: Boolean = true,\n    val enabledExplore: Boolean = false,\n    val searchUrl: String? = null,\n    /** 嵌套规则对象以 JSON 序列化（4.12 TypeConverter）。 */\n    val ruleSearch: String? = null,\n    val exploreUrl: String? = null,\n    val ruleExplore: String? = null,\n    val ruleToc: String? = null,\n    val ruleContent: String? = null,\n    val ruleBookInfo: String? = null,\n    val header: String? = null,\n    val loginUrl: String? = null,\n    val loginUi: String? = null,\n    val loginCheckJs: String? = null,\n    val jsLib: String? = null,\n    val concurrentRate: String? = null,\n    val lastUpdateTime: Long = 0,\n    /** ADR-019：规则订阅更新时这些字段不覆盖。 */\n    val userEditedFields: String? = null,\n    /** 1.4.3 搜索失败降级本地标记。 */\n    val searchDegraded: Boolean = false,\n    val searchFailCount: Int = 0\n)\n\n/**\n * 4.12 rss_sources 订阅源（Legado RssSource）。\n * 1.4.1 字段按真实实体对齐。\n */\n@Entity(tableName = \"rss_sources\")\ndata class RssSourceEntity(\n    @PrimaryKey val sourceUrl: String,\n    val sourceName: String = \"\",\n    val sourceIcon: String? = null,\n    val sourceGroup: String? = null,\n    val sourceComment: String? = null,\n    val enabled: Boolean = true,\n    val enabledCookieJar: Boolean = false,\n    val enableJs: Boolean = true,\n    val loadWithBaseUrl: Boolean = false,\n    val singleUrl: Boolean = false,\n    val header: String? = null,\n    val concurrentRate: String? = null,\n    val loginUrl: String? = null,\n    val loginUi: String? = null,\n    val loginCheckJs: String? = null,\n    /** \"分类名::url\" 多行或 && 分隔；支持 @js: / <js><\/js> 动态生成。 */\n    val sortUrl: String? = null,\n    val ruleArticles: String? = null,\n    val ruleNextPage: String? = null,\n    val ruleTitle: String? = null,\n    val rulePubDate: String? = null,\n    val ruleImage: String? = null,\n    val ruleLink: String? = null,\n    val ruleDescription: String? = null,\n    val ruleContent: String? = null,\n    val style: String? = null,\n    val injectJs: String? = null,\n    val preloadJs: String? = null,\n    val startHtml: String? = null,\n    val showWebLog: Boolean = false,\n    val shouldOverrideUrlLoading: String? = null,\n    val contentWhitelist: String? = null,\n    val contentBlacklist: String? = null,\n    /** 1.4.1 type：0 网页 / 1 图片 / 2 视频 */\n    val type: Int = 0,\n    val articleStyle: Int = 0,\n    val coverDecodeJs: String? = null,\n    /** 览阅扩展：停更前最后新增字段，原版无 UI。 */\n    val searchUrl: String? = null,\n    val jsLib: String? = null,\n    val variables: String? = null,\n    val variableComment: String? = null,\n    val customOrder: Int = 0,\n    val lastUpdateTime: Long = 0,\n    val preload: Boolean = false,\n    val cacheFirst: Boolean = false,\n    val searchDegraded: Boolean = false,\n    val searchFailCount: Int = 0,\n    val userEditedFields: String? = null\n)\n\n/** 4.12 video_apis TVBox 接口配置。 */\n@Entity(tableName = \"video_apis\")\ndata class VideoApiEntity(\n    @PrimaryKey val url: String,\n    val name: String? = null,\n    val spider: String? = null,\n    val lastUpdate: Long = 0,\n    /** 原始 JSON 全量留存（hotSearch 已在解析时裁剪，不写入）。 */\n    val rawJson: String = \"\"\n)\n\n/**\n * 4.12 video_sites 影视站点。\n * PK = (configUrl, siteKey)；删除接口配置时级联删除（见 Dao）。\n */\n@Entity(tableName = \"video_sites\", primaryKeys = [\"configUrl\", \"siteKey\"])\ndata class VideoSiteEntity(\n    val configUrl: String,\n    val siteKey: String,\n    val name: String = \"\",\n    /** 0 XML(MacCMS V9) / 1 JSON(MacCMS10) / 2 JSON 扩展 / 3 Spider或drpy / 4 JSON扩展1(hipy t4) */\n    val type: Int = 1,\n    val api: String? = null,\n    val searchable: Boolean = true,\n    val quickSearch: Boolean = true,\n    val filterable: Boolean = false,\n    val ext: String? = null,\n    val jar: String? = null,\n    val timeout: Long = 0,\n    val enabled: Boolean = true,\n    /** 7.3 type 3 非 drpy 的 jar 站点标记「暂不支持」。 */\n    val unsupported: Boolean = false\n)\n\n/** 4.12 live_sources 直播源：一期持久化，不暴露 UI。 */\n@Entity(tableName = \"live_sources\")\ndata class LiveSourceEntity(\n    @PrimaryKey val id: String,\n    val apiUrl: String,\n    val name: String = \"\",\n    val type: String = \"txt\",\n    val url: String = \"\",\n    val epg: String? = null,\n    val logo: String? = null\n)\n\n/** 4.12 danmaku_sources 弹幕源。appSecret 由 Keystore 加密后存此列。 */\n@Entity(tableName = \"danmaku_sources\")\ndata class DanmakuSourceEntity(\n    @PrimaryKey val id: String,\n    val name: String,\n    val apiBase: String,\n    val appId: String? = null,\n    /** 4.10.1 Keystore 加密存储；备份导出默认脱敏。 */\n    val appSecretCipher: String? = null,\n    val enabled: Boolean = true,\n    val sortOrder: Int = 0,\n    /** 4.10.6 探活失败标记「未验证」，允许保存。 */\n    val verified: Boolean = false\n)\n\n/**\n * 4.12 / 4.10.5 danmaku_bindings 匹配记忆。\n * videoKey：本地文件=路径+大小；在线=源ID+剧集URL。\n */\n@Entity(tableName = \"danmaku_bindings\", primaryKeys = [\"videoKey\", \"danmakuSourceId\"])\ndata class DanmakuBindingEntity(\n    val videoKey: String,\n    val danmakuSourceId: String,\n    val episodeId: Long,\n    val shift: Long = 0,\n    /** HASH / TITLE / MANUAL */\n    val matchMethod: String = \"TITLE\",\n    val boundAt: Long = System.currentTimeMillis()\n)\n"}, {"path": "app/src/main/java/com/lanyue/reader/player/AudioPlaybackService.kt", "lang": "kt", "lines": 124, "content": "package com.lanyue.reader.player\n\nimport android.app.Notification\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.app.PendingIntent\nimport android.content.Context\nimport android.content.Intent\nimport androidx.lifecycle.LifecycleService\nimport androidx.media3.session.MediaSession\n\n/**\n * 4.9 音频书源后台播放（foregroundServiceType=mediaPlayback）。\n *\n * 约束：\n * - 音频书源（bookSourceType=1）正文结果是直链，不解析 HTML，直接注入 ExoPlayer\n * - 通知栏提供 播放/暂停 + 上一章/下一章，锁屏同样可见\n * - 无播放任务时立即 stopSelf，不常驻\n *\n * 注意：本项目不在后台做网络抓取，正文 URL 由前台 UI 解析后传入。\n */\nclass AudioPlaybackService : LifecycleService() {\n\n    companion object {\n        private const val CHANNEL_ID = \"lanyue_audio_playback\"\n        private const val NOTIFICATION_ID = 1001\n\n        const val ACTION_PLAY = \"com.lanyue.reader.action.AUDIO_PLAY\"\n        const val ACTION_PAUSE = \"com.lanyue.reader.action.AUDIO_PAUSE\"\n        const val ACTION_STOP = \"com.lanyue.reader.action.AUDIO_STOP\"\n\n        /** 4.9：外部只能通过 startForegroundService 启动，且必须带 url。 */\n        fun start(context: Context, url: String, headers: Map<String, String> = emptyMap()) {\n            val intent = Intent(context, AudioPlaybackService::class.java).apply {\n                action = ACTION_PLAY\n                putExtra(\"url\", url)\n                headers.forEach { (k, v) -> putExtra(\"h_$k\", v) }\n            }\n            context.startForegroundService(intent)\n        }\n    }\n\n    private var session: MediaSession? = null\n\n    override fun onCreate() {\n        super.onCreate()\n        createChannel()\n    }\n\n    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n        super.onStartCommand(intent, flags, startId)\n\n        when (intent?.action) {\n            ACTION_PAUSE -> {\n                startForeground(NOTIFICATION_ID, buildNotification(paused = true))\n                return START_NOT_STICKY\n            }\n            ACTION_STOP -> {\n                stopSelf()\n                return START_NOT_STICKY\n            }\n            ACTION_PLAY -> {\n                val url = intent.getStringExtra(\"url\")\n                if (url.isNullOrBlank()) {\n                    // 无有效任务：不常驻，避免被判为滥用前台服务\n                    stopSelf()\n                    return START_NOT_STICKY\n                }\n                startForeground(NOTIFICATION_ID, buildNotification(paused = false))\n                return START_STICKY\n            }\n        }\n        return START_NOT_STICKY\n    }\n\n    private fun createChannel() {\n        val nm = getSystemService(NotificationManager::class.java)\n        if (nm.getNotificationChannel(CHANNEL_ID) == null) {\n            val channel = NotificationChannel(\n                CHANNEL_ID,\n                \"音频播放\",\n                NotificationManager.IMPORTANCE_LOW\n            ).apply {\n                description = \"音频书源后台播放控制\"\n                setShowBadge(false)\n            }\n            nm.createNotificationChannel(channel)\n        }\n    }\n\n    private fun buildNotification(paused: Boolean): Notification {\n        val open = PendingIntent.getActivity(\n            this,\n            0,\n            Intent(this, Class.forName(\"com.lanyue.reader.ui.MainActivity\")),\n            PendingIntent.FLAG_IMMUTABLE\n        )\n        return Notification.Builder(this, CHANNEL_ID)\n            .setContentTitle(\"蓝阅 · 音频播放\")\n            .setContentText(if (paused) \"已暂停\" else \"正在播放\")\n            .setSmallIcon(android.R.drawable.ic_media_play)\n            .setContentIntent(open)\n            .setOngoing(true)\n            .addAction(\n                if (paused) android.R.drawable.ic_media_play else android.R.drawable.ic_media_pause,\n                if (paused) \"播放\" else \"暂停\",\n                PendingIntent.getService(\n                    this,\n                    1,\n                    Intent(this, AudioPlaybackService::class.java).apply {\n                        action = if (paused) ACTION_PLAY else ACTION_PAUSE\n                    },\n                    PendingIntent.FLAG_IMMUTABLE\n                )\n            )\n            .build()\n    }\n\n    override fun onDestroy() {\n        session?.release()\n        session = null\n        super.onDestroy()\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/player/MediaDownloadService.kt", "lang": "kt", "lines": 149, "content": "package com.lanyue.reader.player\n\nimport android.app.Notification\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.content.Context\nimport android.content.Intent\nimport androidx.lifecycle.LifecycleService\nimport kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport kotlinx.coroutines.launch\nimport java.io.File\nimport java.util.concurrent.atomic.AtomicLong\n\n/**\n * 4.11 媒体下载退后台续传（foregroundServiceType=dataSync）。\n *\n * 约束（必须遵守，否则被系统清理或审核拒绝）：\n * - 必须是 dataSync 类型；开始后 10 秒内必须真正开始传输\n * - 用 Range 续传，落盘先写 .part 再原子重命名\n * - 用户暂停/取消时立即 stopForeground，不虚占前台\n * - 单任务串行，不做多任务并发（前台服务不能做后台批量抓取）\n *\n * 明确不做：不下载受版权保护的付费内容；仅对用户已获得的直链做离线缓存。\n */\nclass MediaDownloadService : LifecycleService() {\n\n    companion object {\n        private const val CHANNEL_ID = \"lanyue_media_download\"\n        private const val NOTIFICATION_ID = 1002\n        private const val BUFFER = 64 * 1024\n\n        const val ACTION_START = \"com.lanyue.reader.action.DOWNLOAD_START\"\n        const val ACTION_CANCEL = \"com.lanyue.reader.action.DOWNLOAD_CANCEL\"\n\n        fun start(context: Context, url: String, targetPath: String) {\n            val intent = Intent(context, MediaDownloadService::class.java).apply {\n                action = ACTION_START\n                putExtra(\"url\", url)\n                putExtra(\"target\", targetPath)\n            }\n            context.startForegroundService(intent)\n        }\n    }\n\n    private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)\n    private var job: Job? = null\n    private val downloaded = AtomicLong(0)\n\n    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n        super.onStartCommand(intent, flags, startId)\n        when (intent?.action) {\n            ACTION_CANCEL -> {\n                job?.cancel()\n                stopSelf()\n                return START_NOT_STICKY\n            }\n            ACTION_START -> {\n                val url = intent.getStringExtra(\"url\")\n                val target = intent.getStringExtra(\"target\")\n                if (url.isNullOrBlank() || target.isNullOrBlank()) {\n                    stopSelf()\n                    return START_NOT_STICKY\n                }\n                // 先起前台通知，再开始传输（满足 10 秒内开始传输的判定）\n                startForeground(NOTIFICATION_ID, buildNotification(0, 0))\n                job?.cancel()\n                job = scope.launch { download(url, File(target)) }\n                return START_STICKY\n            }\n        }\n        return START_NOT_STICKY\n    }\n\n    private fun download(url: String, target: File) {\n        val part = File(target.absolutePath + \".part\")\n        target.parentFile?.mkdirs()\n\n        val resumeFrom = if (part.exists()) part.length() else 0L\n        downloaded.set(resumeFrom)\n\n        runCatching {\n            val conn = java.net.URL(url).openConnection() as java.net.HttpURLConnection\n            conn.connectTimeout = 15_000\n            conn.readTimeout = 30_000\n            if (resumeFrom > 0) conn.setRequestProperty(\"Range\", \"bytes=$resumeFrom-\")\n            conn.connect()\n\n            val total = conn.contentLengthLong + resumeFrom\n            conn.inputStream.use { input ->\n                java.io.FileOutputStream(part, true).use { out ->\n                    val buf = ByteArray(BUFFER)\n                    while (true) {\n                        if (!isActive()) return@runCatching\n                        val n = input.read(buf)\n                        if (n <= 0) break\n                        out.write(buf, 0, n)\n                        val done = downloaded.addAndGet(n.toLong())\n                        notifyProgress(done, total)\n                    }\n                    out.flush()\n                }\n            }\n            // 原子落盘\n            if (!part.renameTo(target)) {\n                part.copyTo(target, overwrite = true)\n                part.delete()\n            }\n        }.onFailure {\n            // 失败保留 .part，下次续传\n        }\n\n        stopForeground(STOP_FOREGROUND_REMOVE)\n        stopSelf()\n    }\n\n    private fun isActive(): Boolean = job?.isActive ?: false\n\n    private fun notifyProgress(done: Long, total: Long) {\n        getSystemService(NotificationManager::class.java)\n            .notify(NOTIFICATION_ID, buildNotification(done, total))\n    }\n\n    private fun buildNotification(done: Long, total: Long): Notification {\n        val nm = getSystemService(NotificationManager::class.java)\n        if (nm.getNotificationChannel(CHANNEL_ID) == null) {\n            nm.createNotificationChannel(\n                NotificationChannel(CHANNEL_ID, \"媒体下载\", NotificationManager.IMPORTANCE_LOW)\n                    .apply { description = \"离线缓存进度\" }\n            )\n        }\n        val pct = if (total > 0) ((done * 100) / total).toInt() else 0\n        return Notification.Builder(this, CHANNEL_ID)\n            .setContentTitle(\"蓝阅 · 离线缓存\")\n            .setContentText(if (total > 0) \"$pct%\" else \"准备中\")\n            .setSmallIcon(android.R.drawable.stat_sys_download)\n            .setProgress(100, pct, total <= 0)\n            .setOngoing(true)\n            .build()\n    }\n\n    override fun onDestroy() {\n        scope.cancel()\n        super.onDestroy()\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/player/PlayerManager.kt", "lang": "kt", "lines": 119, "content": "package com.lanyue.reader.player\n\nimport android.content.Context\nimport androidx.media3.common.MediaItem\nimport androidx.media3.common.PlaybackException\nimport androidx.media3.common.Player\nimport androidx.media3.datasource.DefaultDataSource\nimport androidx.media3.datasource.okhttp.OkHttpDataSource\nimport androidx.media3.exoplayer.ExoPlayer\nimport androidx.media3.exoplayer.hls.HlsMediaSource\nimport androidx.media3.exoplayer.dash.DashMediaSource\nimport androidx.media3.exoplayer.source.ProgressiveMediaSource\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport okhttp3.OkHttpClient\n\n/**\n * 4.9 播放器架构（Media3 / ExoPlayer）。\n *\n * - HLS / DASH / MP4 / TS / FLV\n * - 硬解优先软解兜底（由 Media3 RenderersFactory 默认行为提供，这里只暴露开关）\n * - 与 Sniffer 衔接：Sniffer -> PlayResult -> Media3 MediaItem\n * - 音频书源复用同一 ExoPlayer（AudioPlay 模式）\n */\nclass PlayerManager(\n    private val context: Context,\n    private val metrics: LocalMetrics\n) {\n\n    companion object {\n        /** 4.9 播放失败提示口径。 */\n        const val MSG_PARSE_FAILED = \"影片解析失败，请切换线路或稍后重试\"\n        const val MSG_DECODE_ERROR = \"视频解码失败，请尝试切换解码器\"\n        const val MSG_403 = \"直链 403，建议启用增强解析\"\n    }\n\n    private val httpClient = OkHttpClient()\n\n    var player: ExoPlayer? = null\n        private set\n\n    /** 硬解优先，失败回落软解。 */\n    private var preferHardware = true\n\n    fun setPreferHardware(enabled: Boolean) {\n        preferHardware = enabled\n    }\n\n    fun ensurePlayer(): ExoPlayer {\n        player?.let { return it }\n        val exo = ExoPlayer.Builder(context).build()\n        exo.addListener(object : Player.Listener {\n            override fun onPlayerError(error: PlaybackException) {\n                // 4.9 / 4.3 DECODE_ERROR\n                val code = when (error.errorCode) {\n                    PlaybackException.ERROR_CODE_DECODER_INIT_FAILED,\n                    PlaybackException.ERROR_CODE_DECODING_FAILED -> \"DECODE_ERROR\"\n                    else -> \"PARSE_FAILED\"\n                }\n                metrics.failure(\"player\", \"playback\", code)\n            }\n        })\n        player = exo\n        return exo\n    }\n\n    /**\n     * 装载播放源。[headers] 用于防盗链直链。\n     * URL 形如 127.0.0.1:{port}/{token}/... 时同样走本方法（LocalParseProxy）。\n     */\n    fun load(url: String, headers: Map<String, String> = emptyMap(), startPositionMs: Long = 0L) {\n        val exo = ensurePlayer()\n        val dataSourceFactory = DefaultDataSource.Factory(\n            context,\n            OkHttpDataSource.Factory(httpClient).apply {\n                headers.forEach { (k, v) -> setDefaultRequestProperties(mapOf(k to v)) }\n            }\n        )\n\n        val mediaItem = MediaItem.fromUri(url)\n        val source = when {\n            url.contains(\".m3u8\", ignoreCase = true) ->\n                HlsMediaSource.Factory(dataSourceFactory).createMediaSource(mediaItem)\n            url.contains(\".mpd\", ignoreCase = true) ->\n                DashMediaSource.Factory(dataSourceFactory).createMediaSource(mediaItem)\n            else ->\n                ProgressiveMediaSource.Factory(dataSourceFactory).createMediaSource(mediaItem)\n        }\n\n        exo.setMediaSource(source)\n        exo.prepare()\n        if (startPositionMs > 0) exo.seekTo(startPositionMs)\n        exo.playWhenReady = true\n    }\n\n    /** 音频书源：复用同一播放器，切音频属性。 */\n    fun loadAudio(url: String, headers: Map<String, String> = emptyMap()) {\n        load(url, headers)\n    }\n\n    fun setSpeed(speed: Float) {\n        player?.setPlaybackSpeed(speed)\n    }\n\n    /** 4.9 字幕：SRT / ASS 外挂。 */\n    fun addSubtitle(url: String, mimeType: String = \"text/x-ssa\") {\n        // Media3 字幕由 MediaItem.SubtitleConfiguration 提供，装载前注入\n    }\n\n    fun pause() = player?.pause()\n\n    fun resume() = player?.play()\n\n    fun seekTo(positionMs: Long) = player?.seekTo(positionMs)\n\n    fun release() {\n        player?.release()\n        player = null\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/SourceRegistry.kt", "lang": "kt", "lines": 45, "content": "package com.lanyue.reader.source\n\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.data.db.entity.DanmakuSourceEntity\nimport com.lanyue.reader.data.db.entity.RssSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport com.lanyue.reader.source.model.IBookSource\nimport com.lanyue.reader.source.model.ISubscriptionSource\nimport com.lanyue.reader.source.model.IVideoSource\n\n/**\n * 源实例工厂入口。\n *\n * SourceRegistry 只负责「实体 -> 源实现」的装配，不做调度决策；\n * 调度（能力判定、失败隔离、降级顺序）全部在 SourceRouter。\n *\n * 这样保证：\n * 1. 源实现构造函数里不出现数据库/DAO，便于单测\n * 2. 关闭某类源时（enabled=false）在装配阶段直接过滤，路由层看不到它\n */\nclass SourceRegistry(\n    private val bookFactory: (BookSourceEntity) -> IBookSource?,\n    private val rssFactory: (RssSourceEntity) -> ISubscriptionSource?,\n    private val videoFactory: (VideoSiteEntity) -> IVideoSource?,\n    private val danmakuFactory: (DanmakuSourceEntity) -> IDanmakuSource?\n) {\n\n    fun book(entity: BookSourceEntity): IBookSource? =\n        if (entity.enabled) bookFactory(entity) else null\n\n    fun rss(entity: RssSourceEntity): ISubscriptionSource? =\n        if (entity.enabled) rssFactory(entity) else null\n\n    /**\n     * 影视站点：enabled + 非 unsupported。\n     * 7.3 type 3 非 drpy 的 jar 站点在 CapabilityResolver 之前就被挡掉，\n     * UI 上以「暂不支持」呈现，不进入路由候选集。\n     */\n    fun video(entity: VideoSiteEntity): IVideoSource? =\n        if (entity.enabled && !entity.unsupported) videoFactory(entity) else null\n\n    fun danmaku(entity: DanmakuSourceEntity): IDanmakuSource? =\n        if (entity.enabled) danmakuFactory(entity) else null\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/SourceRouter.kt", "lang": "kt", "lines": 217, "content": "package com.lanyue.reader.source\n\nimport com.lanyue.reader.core.engine.ProductErrorCode\nimport com.lanyue.reader.core.engine.ProductException\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.source.model.ContentResult\nimport com.lanyue.reader.source.model.DanmakuEvent\nimport com.lanyue.reader.source.model.DanmakuMatch\nimport com.lanyue.reader.source.model.DanmakuMatchRequest\nimport com.lanyue.reader.source.model.IDanmakuSource\nimport com.lanyue.reader.source.model.IBookSource\nimport com.lanyue.reader.source.model.ISubscriptionSource\nimport com.lanyue.reader.source.model.IVideoSource\nimport com.lanyue.reader.source.model.PlayResult\nimport com.lanyue.reader.source.model.SearchBookItem\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.VideoEpisode\nimport kotlinx.coroutines.async\nimport kotlinx.coroutines.coroutineScope\nimport kotlinx.coroutines.withTimeoutOrNull\n\n/**\n * 4.x 源调度层（唯一调用入口）。\n *\n * 职责边界：\n * - 能力判定前置：不具备能力就不调用（1.4.2），避免源内部抛异常\n * - 并发编排：多源搜索并行、结果按源顺序合并、单源失败不影响其它源\n * - 失败隔离：连续失败达阈值后本次会话内降级（不写库，写库由 DAO 负责）\n * - 内容形态分流：ContentResult.Audio 直连播放器，不做 HTML 解析\n * - 弹幕匹配：无匹配时抛 DANMAKU_NOT_MATCHED，UI 显示「未匹配到弹幕」\n *\n * 明确不做：\n * - 不实现解析规则（规则引擎在内核）\n * - 不实现播放（PlayerManager）\n * - 不做 UI 提示文案（只给错误码，文案在 strings.xml）\n */\nclass SourceRouter(\n    private val metrics: LocalMetrics,\n    /** 单源搜索超时，超时源视为本次失败但不影响其它源。 */\n    private val perSourceTimeoutMs: Long = 12_000L,\n    /** 连续失败阈值：达到后本次会话内不再调用该源。 */\n    private val failThreshold: Int = 3\n) {\n\n    private val bookFailCount = HashMap<String, Int>()\n    private val videoFailCount = HashMap<String, Int>()\n\n    // ---------------- 书源 ----------------\n\n    /**\n     * 多源并行搜索。返回顺序保持 sources 顺序（用户可见稳定），\n     * 不按耗时排序，避免每次结果顺序抖动。\n     */\n    suspend fun searchBooks(\n        sources: List<IBookSource>,\n        key: String,\n        page: Int,\n        traceId: String\n    ): List<SearchBookItem> = coroutineScope {\n        val usable = sources.filter { it.capabilityFlags.contains(SourceCapability.SEARCHABLE) && !isIsolated(it.sourceId) }\n\n        val deferred = usable.map { source ->\n            source to async {\n                withTimeoutOrNull(perSourceTimeoutMs) {\n                    runCatching { source.search(key, page) }\n                        .onSuccess { markSuccess(source.sourceId) }\n                        .onFailure {\n                            markFail(source.sourceId)\n                            metrics.failure(traceId, \"search\", \"SOURCE_INVALID\")\n                        }\n                        .getOrDefault(emptyList())\n                } ?: run {\n                    markFail(source.sourceId)\n                    metrics.failure(traceId, \"search\", \"TIMEOUT\")\n                    emptyList()\n                }\n            }\n        }\n        deferred.flatMap { it.second.await() }\n    }\n\n    /**\n     * 正文获取。核心分流点：\n     * - Audio：音频书源，直接交给播放器（1.4.7）\n     * - WebViewFallback：无 ruleContent（含订阅源），原样打开\n     * - Html：正常阅读器渲染\n     */\n    suspend fun getContent(source: IBookSource, url: String, traceId: String): ContentResult {\n        if (!source.capabilityFlags.contains(SourceCapability.HAS_CONTENT)) {\n            // 能力缺失不是错误：走 WebView 兜底\n            return ContentResult.WebViewFallback(url)\n        }\n        return runCatching { source.getContent(url) }\n            .onSuccess { metrics.success(traceId, \"content\", 0L) }\n            .onFailure {\n                metrics.failure(traceId, \"content\", \"PARSE_FAILED\")\n                throw ProductException(ProductErrorCode.PARSE_FAILED, \"正文解析失败\")\n            }\n            .getOrThrow()\n    }\n\n    // ---------------- 订阅源 ----------------\n\n    /**\n     * 订阅搜索。与书源差异：无 HAS_CONTENT 也必须可读\n     * （RSS_FALLBACK 源正文走 WebView，见 ADR-016）。\n     */\n    suspend fun searchSubscriptions(\n        sources: List<ISubscriptionSource>,\n        key: String,\n        page: Int,\n        traceId: String\n    ): List<com.lanyue.reader.source.model.SubscriptionItem> = coroutineScope {\n        sources\n            .filter { it.capabilityFlags.contains(SourceCapability.SEARCHABLE) }\n            .map { source ->\n                source to async {\n                    withTimeoutOrNull(perSourceTimeoutMs) {\n                        runCatching { source.search(key, page) }.getOrDefault(emptyList())\n                    } ?: emptyList()\n                }\n            }\n            .flatMap { it.second.await() }\n    }\n\n    // ---------------- 影视 ----------------\n\n    suspend fun searchVideos(\n        sources: List<IVideoSource>,\n        key: String,\n        page: Int,\n        traceId: String\n    ): List<com.lanyue.reader.source.model.VideoItem> = coroutineScope {\n        val usable = sources.filter {\n            it.capabilityFlags.contains(SourceCapability.SEARCHABLE) && !isIsolated(it.sourceId)\n        }\n        usable.map { source ->\n            source to async {\n                withTimeoutOrNull(perSourceTimeoutMs) {\n                    runCatching { source.search(key, page) }\n                        .onSuccess { markSuccess(source.sourceId) }\n                        .onFailure {\n                            markFail(source.sourceId)\n                            metrics.failure(traceId, \"vsearch\", \"SOURCE_INVALID\")\n                        }\n                        .getOrDefault(emptyList())\n                } ?: run {\n                    markFail(source.sourceId)\n                    emptyList()\n                }\n            }\n        }.flatMap { it.second.await() }\n    }\n\n    /**\n     * 播放地址。失败一律映射为 PARSE_FAILED / DECODE_ERROR，\n     * UI 只按 4.9 口径提示，不暴露源内部细节。\n     */\n    suspend fun getPlay(source: IVideoSource, episode: VideoEpisode, traceId: String): PlayResult =\n        runCatching { source.getPlay(episode) }\n            .onFailure {\n                markFail(source.sourceId)\n                metrics.failure(traceId, \"play\", \"PARSE_FAILED\")\n                throw ProductException(ProductErrorCode.PARSE_FAILED, \"影片解析失败\")\n            }\n            .getOrThrow()\n\n    // ---------------- 弹幕 ----------------\n\n    /**\n     * 按源顺序尝试匹配，首个成功即返回。\n     * 全部失败抛 DANMAKU_NOT_MATCHED（不视为播放失败）。\n     */\n    suspend fun matchDanmaku(\n        sources: List<IDanmakuSource>,\n        req: DanmakuMatchRequest,\n        traceId: String\n    ): DanmakuMatch {\n        for (source in sources) {\n            val hit = runCatching { source.match(req) }.getOrNull()\n            if (hit != null) return hit\n        }\n        metrics.failure(traceId, \"danmaku\", \"DANMAKU_NOT_MATCHED\")\n        throw ProductException(ProductErrorCode.DANMAKU_NOT_MATCHED, \"未匹配到弹幕\")\n    }\n\n    suspend fun loadDanmaku(\n        source: IDanmakuSource,\n        match: DanmakuMatch,\n        fromMs: Long,\n        durationMs: Long\n    ): List<DanmakuEvent> =\n        runCatching { source.getComments(match, fromMs, durationMs) }.getOrDefault(emptyList())\n\n    // ---------------- 失败隔离 ----------------\n\n    /** 本次会话内是否已隔离（不持久化，重启即恢复）。 */\n    private fun isIsolated(sourceId: String): Boolean =\n        (bookFailCount[sourceId] ?: 0) >= failThreshold ||\n            (videoFailCount[sourceId] ?: 0) >= failThreshold\n\n    private fun markFail(sourceId: String) {\n        bookFailCount[sourceId] = (bookFailCount[sourceId] ?: 0) + 1\n        videoFailCount[sourceId] = (videoFailCount[sourceId] ?: 0) + 1\n    }\n\n    private fun markSuccess(sourceId: String) {\n        bookFailCount.remove(sourceId)\n        videoFailCount.remove(sourceId)\n    }\n\n    /** 供设置页「重试该源」使用：清除隔离。 */\n    fun resetIsolation(sourceId: String) {\n        bookFailCount.remove(sourceId)\n        videoFailCount.remove(sourceId)\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/book/LegadoBookSource.kt", "lang": "kt", "lines": 240, "content": "package com.lanyue.reader.source.book\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.BookSourceEntity\nimport com.lanyue.reader.source.model.BookDetail\nimport com.lanyue.reader.source.model.CapabilityResolver\nimport com.lanyue.reader.source.model.ContentResult\nimport com.lanyue.reader.source.model.IBookSource\nimport com.lanyue.reader.source.model.SearchBookItem\nimport com.lanyue.reader.source.model.SortRule\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.lanyue.reader.source.model.TocItem\nimport com.lanyue.reader.source.rule.RuleEngine\nimport com.lanyue.reader.source.rule.UrlTemplate\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\n\n/**\n * 7.1 书源实现。\n *\n * 链路：searchUrl -> NetworkDispatcher -> 规则解析 -> 格式化回传。\n * 特殊链路：bookSourceType=1 音频源正文直接返回 Audio；登录源走 loginCheckJs。\n */\nclass LegadoBookSource(\n    private val entity: BookSourceEntity,\n    private val net: NetworkDispatcher,\n    private val rules: RuleEngine,\n    private val metrics: LocalMetrics\n) : IBookSource {\n\n    override val sourceId: String = entity.bookSourceUrl\n\n    override val sourceType: SourceType = SourceType.BOOK\n\n    override val capabilityFlags: Set<SourceCapability> = CapabilityResolver.ofBook(entity)\n\n    override val concurrentRate: RateLimit? = parseRate(entity.concurrentRate)\n\n    /** 1.4.2 HAS_CONTENT：无 ruleContent 时正文只能走 WebView。 */\n    override suspend fun getContent(url: String): ContentResult {\n        val ctx = ruleContext(url, \"content\")\n\n        if (!capabilityFlags.contains(SourceCapability.HAS_CONTENT)) {\n            return ContentResult.WebViewFallback(url)\n        }\n\n        val html = fetchHtml(url, \"content\")\n\n        // 1.4.7 bookSourceType=1：不解析 HTML，直接取音频地址\n        if (entity.bookSourceType == 1) {\n            val raw = rules.evalString(html, entity.ruleContent, ctx, needsRealDom = false)\n                ?: return ContentResult.WebViewFallback(url)\n            return parseAudioResult(raw)\n        }\n\n        return ContentResult.Html(html)\n    }\n\n    override suspend fun search(key: String, page: Int): List<SearchBookItem> {\n        val searchUrl = entity.searchUrl ?: return emptyList()\n        // 1.4.3 占位符替换；无占位符时原样请求（不自动追加 ?q=）\n        val url = UrlTemplate.fill(searchUrl, key, page)\n        val html = fetchHtml(url, \"search\")\n        val ctx = ruleContext(url, \"search\")\n        return parseBookItems(html, searchBookListRule(), ctx)\n    }\n\n    override suspend fun explore(sort: SortRule, page: Int): List<SearchBookItem> {\n        val url = UrlTemplate.fillPage(sort.url, page)\n        val html = fetchHtml(url, \"explore\")\n        val ctx = ruleContext(url, \"explore\")\n        return parseBookItems(html, entity.ruleExplore, ctx)\n    }\n\n    override suspend fun getDetail(url: String): BookDetail {\n        val html = fetchHtml(url, \"detail\")\n        val ctx = ruleContext(url, \"detail\")\n\n        // ruleBookInfo 是嵌套对象，按 JSON 取 name/author/cover/intro 等字段\n        val info = runCatching { JsonParser.parseString(entity.ruleBookInfo ?: \"{}\").asJsonObject }\n            .getOrElse { JsonObject() }\n\n        suspend fun field(key: String): String? {\n            if (!info.has(key)) return null\n            return rules.evalString(html, info.get(key).asString, ctx)\n        }\n\n        return BookDetail(\n            name = field(\"name\") ?: \"\",\n            author = field(\"author\"),\n            cover = field(\"cover\"),\n            intro = field(\"intro\"),\n            kind = field(\"kind\"),\n            lastChapter = field(\"lastChapter\"),\n            wordCount = field(\"wordCount\"),\n            bookUrl = url\n        )\n    }\n\n    override susp
