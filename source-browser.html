append(if (descendant) \" \" else \" > \").append(part)\n            }\n        }\n\n        val css = sb.toString().trim()\n        if (css.isEmpty()) return null\n        return Converted(css, directive)\n    }\n\n    /**\n     * 转换单个路径段，如 `div[@class='x'][2]`。\n     * 返回 css 片段；无法转换返回 null。\n     */\n    private fun convertSegment(raw: String): String? {\n        val t = raw.trim()\n        if (t.isEmpty()) return null\n\n        // 纯通配\n        if (t == \"*\") return \"*\"\n\n        val nameEnd = t.indexOfFirst { it == '[' || it == '*' }\n        var name = if (nameEnd < 0) t else t.substring(0, nameEnd).trim()\n        if (name.isEmpty()) name = \"*\"\n        if (name == \".\" || name == \"..\") return null\n        if (!Regex(\"^[A-Za-z_][-A-Za-z0-9_.:]*$|^\\\\*$\").matches(name)) return null\n\n        val css = StringBuilder(name)\n        var i = if (nameEnd < 0) t.length else nameEnd\n        // 跳过可能紧跟的名字后缀 '*'，如 div*（极少见，直接拒绝更安全）\n        if (nameEnd >= 0 && nameEnd < t.length && t[nameEnd] == '*') return null\n\n        while (i < t.length) {\n            if (t[i] != '[') return null\n            var depth = 0\n            var inSingle = false\n            var inDouble = false\n            val start = i\n            while (i < t.length) {\n                val c = t[i]\n                when {\n                    inSingle -> if (c == '\\'') inSingle = false\n                    inDouble -> if (c == '\"') inDouble = false\n                    c == '\\'' -> inSingle = true\n                    c == '\"' -> inDouble = true\n                    c == '[' -> depth++\n                    c == ']' -> {\n                        depth--\n                        if (depth == 0) {\n                            i++\n                            break\n                        }\n                    }\n                }\n                i++\n            }\n            if (depth != 0) return null\n            val pred = t.substring(start + 1, i - 1).trim()\n            val converted = convertPredicate(pred) ?: return null\n            css.append(converted)\n        }\n\n        return css.toString()\n    }\n\n    /**\n     * 转换谓词，如 `@class='x'`、`2`、`last()`、`contains(@class,'box')`。\n     */\n    private fun convertPredicate(pred: String): String? {\n        if (pred.isEmpty()) return null\n\n        // 位置：[2] -> :nth-child(2)\n        val pos = pred.toIntOrNull()\n        if (pos != null) {\n            if (pos == 0) return null // XPath 位置从 1 开始，0 非法\n            if (pos < 0) return \":nth-last-child(${-pos})\"\n            return \":nth-child($pos)\"\n        }\n        if (pred == \"last()\") return \":last-child\"\n\n        // contains(@attr,'v') -> [attr*=v]\n        val containsCall = Regex(\"^contains\\\\s*\\\\(\").find(pred)\n        if (containsCall != null) {\n            val inner = pred.substring(containsCall.range.last + 1).trimEnd(')').trim()\n            val comma = findTopLevelComma(inner) ?: return null\n            val attrPart = inner.substring(0, comma).trim()\n            val valuePart = inner.substring(comma + 1).trim()\n            val attr = attrPart.removePrefix(\"@\").trim().lowercase()\n            if (!isValidAttr(attr)) return null\n            val value = unquoteValue(valuePart) ?: return null\n            return \"[$attr*=\" + quoteCss(value) + \"]\"\n        }\n\n        // 存在性：[@href] -> [href]\n        val exists = Regex(\"^@([-A-Za-z0-9_:]+)$\").find(pred)\n        if (exists != null) return \"[\" + exists.groupValues[1].lowercase() + \"]\"\n\n        // 相等 / 不等：手工解析，允许值里出现另一种引号（如 'a\"b'）\n        val opIndex = findCompareOp(pred) ?: return null\n        val op = opIndex.second\n        val attr = pred.substring(0, opIndex.first).trim().removePrefix(\"@\").trim().lowercase()\n        if (!isValidAttr(attr)) return null\n        val value = unquoteValue(pred.substring(opIndex.first + op.length).trim()) ?: return null\n        return when (op) {\n            \"=\" -> \"[\" + attr + \"=\" + quoteCss(value) + \"]\"\n            \"!=\" -> \":not([\" + attr + \"=\" + quoteCss(value) + \"])\"\n            else -> null\n        }\n    }\n\n    /** 校验属性名合法，避免把奇怪字符拼进选择器。 */\n    private fun isValidAttr(attr: String): Boolean =\n        attr.isNotEmpty() && Regex(\"^[a-z_][-a-z0-9_:.]*$\").matches(attr)\n\n    /** 找到谓词里的比较运算符（先长后短），返回 (下标, 运算符)。 */\n    private fun findCompareOp(pred: String): Pair<Int, String>? {\n        for (op in listOf(\"!=\", \"=\")) {\n            val at = pred.indexOf(op)\n            if (at > 0) return at to op\n        }\n        return null\n    }\n\n    /** 去掉值的引号；单引号包裹时内部允许双引号，反之亦然。 */\n    private fun unquoteValue(raw: String): String? {\n        if (raw.length < 2) return null\n        val first = raw.first()\n        val last = raw.last()\n        if ((first == '\\'' && last == '\\'') || (first == '\"' && last == '\"')) {\n            val body = raw.substring(1, raw.length - 1)\n            // 内部不能出现同种引号（出现说明表达式畸形）\n            if (body.contains(first)) return null\n            return body\n        }\n        return null\n    }\n\n    /** 找参数里的顶层逗号（不位于引号内）。 */\n    private fun findTopLevelComma(s: String): Int? {\n        var inSingle = false\n        var inDouble = false\n        for (i in s.indices) {\n            val c = s[i]\n            when {\n                inSingle -> if (c == '\\'') inSingle = false\n                inDouble -> if (c == '\"') inDouble = false\n                c == '\\'' -> inSingle = true\n                c == '\"' -> inDouble = true\n                c == ',' -> return i\n            }\n        }\n        return null\n    }\n\n    /** CSS 属性值引号：统一双引号并转义内部双引号与反斜杠。 */\n    private fun quoteCss(value: String): String {\n        val escaped = value.replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\", \"\\\\\\\"\")\n        return \"\\\"\" + escaped + \"\\\"\"\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/video/CmsVideoSource.kt", "lang": "kt", "lines": 191, "content": "package com.lanyue.reader.source.video\n\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.engine.NetworkException\nimport com.lanyue.reader.core.engine.RateLimit\nimport com.lanyue.reader.core.net.HttpRequest\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\nimport com.lanyue.reader.source.model.CapabilityResolver\nimport com.lanyue.reader.source.model.Category\nimport com.lanyue.reader.source.model.Filter\nimport com.lanyue.reader.source.model.IVideoSource\nimport com.lanyue.reader.source.model.PlayKind\nimport com.lanyue.reader.source.model.PlayResult\nimport com.lanyue.reader.source.model.SourceCapability\nimport com.lanyue.reader.source.model.SourceType\nimport com.lanyue.reader.source.model.VideoDetail\nimport com.lanyue.reader.source.model.VideoEpisode\nimport com.lanyue.reader.source.model.VideoItem\nimport com.lanyue.reader.source.model.VideoPlayLine\nimport java.net.URLEncoder\n\n/**\n * 7.3 CMS 影视源（type 0 XML / 1 JSON / 2 JSON 扩展 / 4 JSON 扩展1）。\n *\n * CMS 协议要点：\n * - 分类：api?ac=list\n * - 详情：api?ac=videolist&ids=\n * - 搜索：api?wd=key&pg=n\n * - 筛选：ext.filter\n *\n * 播放解析链：选集 url -> flags 匹配 -> 直链 / parses 分发（见 LocalParseProxy）\n */\nclass CmsVideoSource(\n    private val entity: VideoSiteEntity,\n    private val net: NetworkDispatcher,\n    private val metrics: LocalMetrics,\n    private val parses: List<TvBoxParser.ParseRule>,\n    private val flags: List<String>\n) : IVideoSource {\n\n    override val sourceId: String = entity.configUrl + \"#\" + entity.siteKey\n\n    override val sourceType: SourceType = SourceType.VIDEO\n\n    override val capabilityFlags: Set<SourceCapability> = CapabilityResolver.ofVideoSite(entity)\n\n    override val concurrentRate: RateLimit? = null\n\n    private val apiBase: String get() = entity.api ?: \"\"\n\n    override suspend fun getCategories(): List<Category> {\n        val url = apiBase + \"?ac=list\"\n        val json = fetchJson(url, \"categories\")\n        val classes = json.getAsJsonObject(\"class\")\n            ?.let { runCatching { it.asJsonArray }.getOrNull() }\n            ?: return emptyList()\n\n        return classes.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val id = obj.str(\"type_id\") ?: return@mapNotNull null\n            Category(name = obj.str(\"type_name\") ?: id, id = id)\n        }\n    }\n\n    override suspend fun explore(category: Category, filter: Filter?, page: Int): List<VideoItem> {\n        val sb = StringBuilder(apiBase)\n        sb.append(\"?ac=detail&t=\").append(category.id).append(\"&pg=\").append(page)\n        // 7.3 筛选：ext.filter\n        if (filter != null) {\n            sb.append(\"&f=\").append(URLEncoder.encode(filter.key + \"=\" + filter.value(), \"UTF-8\"))\n        }\n        val json = fetchJson(sb.toString(), \"explore\")\n        return parseVideoList(json)\n    }\n\n    override suspend fun search(key: String, page: Int): List<VideoItem> {\n        val url = apiBase + \"?wd=\" + URLEncoder.encode(key, \"UTF-8\") + \"&pg=\" + page\n        val json = fetchJson(url, \"search\")\n        return parseVideoList(json)\n    }\n\n    override suspend fun getDetail(url: String): VideoDetail {\n        // url 形如 api?ac=detail&ids=xxx\n        val json = fetchJson(url, \"detail\")\n        val list = json.getAsJsonArray(\"list\") ?: return VideoDetail(name = \"\")\n        val obj = runCatching { list.first().asJsonObject }.getOrNull() ?: return VideoDetail(name = \"\")\n\n        return VideoDetail(\n            name = obj.str(\"vod_name\") ?: \"\",\n            cover = obj.str(\"vod_pic\"),\n            intro = obj.str(\"vod_content\")?.let { stripHtml(it) },\n            actor = obj.str(\"vod_actor\"),\n            director = obj.str(\"vod_director\"),\n            year = obj.str(\"vod_year\"),\n            area = obj.str(\"vod_area\"),\n            remark = obj.str(\"vod_remarks\"),\n            lines = parsePlayLines(obj)\n        )\n    }\n\n    override suspend fun getPlay(episode: VideoEpisode): PlayResult {\n        val url = episode.url\n\n        // 7.3 播放解析链第一跳：直链（m3u8/mp4 等）直接播放\n        if (isDirectMedia(url)) {\n            return PlayResult(PlayKind.DIRECT, url)\n        }\n\n        // 命中 flags -> parses 选取\n        val matchedFlag = flags.firstOrNull { url.contains(it, ignoreCase = true) }\n        val parseRule = pickParseRule()\n        return when {\n            parseRule == null -> PlayResult(PlayKind.SNIFF, url)\n            parseRule.type == 3 -> PlayResult(PlayKind.SNIFF, url, flag = matchedFlag)\n            else -> PlayResult(PlayKind.PARSE, url, flag = matchedFlag)\n        }\n    }\n\n    // ---------- 内部 ----------\n\n    private suspend fun fetchJson(url: String, op: String): JsonObject {\n        val traceId = sourceId + \":\" + op\n        val resp = net.execute(\n            HttpRequest(url = url, method = \"GET\", sourceId = sourceId, timeoutMs = entity.timeout.takeIf { it > 0 } ?: 20_000L),\n            limit = concurrentRate,\n            traceId = traceId\n        )\n        if (!resp.isSuccess) {\n            metrics.failure(traceId, \"cms\", \"HTTP_\" + resp.code)\n            throw NetworkException(\"cms http \" + resp.code, resp.code)\n        }\n        return runCatching { JsonParser.parseString(resp.body ?: \"\").asJsonObject }.getOrNull()\n            ?: throw NetworkException(\"cms response is not json\")\n    }\n\n    private fun parseVideoList(json: JsonObject): List<VideoItem> {\n        val list = json.getAsJsonArray(\"list\") ?: return emptyList()\n        return list.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val id = obj.str(\"vod_id\") ?: return@mapNotNull null\n            VideoItem(\n                name = obj.str(\"vod_name\") ?: \"\",\n                url = apiBase + \"?ac=detail&ids=\" + id,\n                cover = obj.str(\"vod_pic\"),\n                remark = obj.str(\"vod_remarks\"),\n                siteKey = entity.siteKey,\n                configUrl = entity.configUrl\n            )\n        }\n    }\n\n    /** vod_play_from 与 vod_play_url 按 ### 分隔，多条线路按 $$$ 分隔。 */\n    private fun parsePlayLines(obj: JsonObject): List<VideoPlayLine> {\n        val fromRaw = obj.str(\"vod_play_from\") ?: return emptyList()\n        val urlRaw = obj.str(\"vod_play_url\") ?: return emptyList()\n\n        val names = fromRaw.split(\"$$$\")\n        val groups = urlRaw.split(\"$$$\")\n\n        return names.mapIndexedNotNull { index, lineName ->\n            val group = groups.getOrNull(index) ?: return@mapIndexedNotNull null\n            val episodes = group.split(\"#\").mapNotNull { seg ->\n                val parts = seg.split(\"$\")\n                if (parts.size < 2) null\n                else VideoEpisode(name = parts[0].trim(), url = parts[1].trim())\n            }\n            if (episodes.isEmpty()) null else VideoPlayLine(lineName.trim(), episodes)\n        }\n    }\n\n    private fun pickParseRule(): TvBoxParser.ParseRule? =\n        parses.firstOrNull { it.type in 0..3 }\n\n    private fun isDirectMedia(url: String): Boolean {\n        val lower = url.lowercase()\n        return lower.contains(\".m3u8\") || lower.contains(\".mp4\") ||\n            lower.contains(\".flv\") || lower.contains(\".mpd\") || lower.contains(\".ts\")\n    }\n\n    private fun stripHtml(raw: String): String =\n        raw.replace(Regex(\"<[^>]*>\"), \"\").trim()\n\n    private fun Filter.value(): String =\n        values.firstOrNull()?.value ?: \"\"\n\n    private fun JsonObject.str(key: String): String? =\n        get(key)?.takeIf { !it.isJsonNull }?.asString\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/video/LocalParseProxy.kt", "lang": "kt", "lines": 332, "content": "package com.lanyue.reader.source.video\n\nimport com.lanyue.reader.core.engine.NetworkDispatcher\nimport com.lanyue.reader.core.net.HttpRequest\nimport kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport kotlinx.coroutines.channels.Channel\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withTimeoutOrNull\nimport java.io.BufferedInputStream\nimport java.net.InetAddress\nimport java.net.ServerSocket\nimport java.net.Socket\nimport java.net.URLDecoder\nimport java.net.URLEncoder\nimport java.security.SecureRandom\n\n/**\n * 7.3 LocalParseProxy —— 本地 HTTP 解析代理。\n *\n * 硬约束（文档明确）：\n * - 独立模块，本地 HTTP 服务\n * - 启动时随机分配空闲端口；生命周期与应用进程一致；崩溃自恢复重启\n * - Media3 拿到的播放 URL 形如 http://127.0.0.1:{port}/{token}/...\n * - Token 每次播放会话随机生成；会话内 retry/seek 保持有效；播放结束失效\n * - 上游请求统一走 NetworkDispatcher（继承通道、限速、Cookie、SSRF 校验）\n * - 仅绑定 127.0.0.1；token 校验请求来源为应用自身；不接受外部请求\n *\n * 实现要点：\n * - 连接处理走协程而不是「每连接一线程」，在低端机上不会因并发连接打爆线程。\n * - 会话有 TTL 与总量上限，避免播放器异常退出后 token 无限堆积。\n * - 上游解析带超时，且同一 URL 的并发请求会合并，防止播放器频繁 seek 打爆解析接口。\n */\nclass LocalParseProxy(\n    private val net: NetworkDispatcher,\n    private val parses: List<TvBoxParser.ParseRule>,\n    private val sessionTtlMs: Long = DEFAULT_SESSION_TTL_MS,\n    private val maxSessions: Int = DEFAULT_MAX_SESSIONS,\n    private val now: () -> Long = System::currentTimeMillis\n) {\n\n    private var serverSocket: ServerSocket? = null\n    @Volatile private var running = false\n    @Volatile var port: Int = 0\n        private set\n\n    /** 协程作用域：IO 调度执行阻塞读写，Supervisor 保证单连接异常不影响服务。 */\n    private var scope: CoroutineScope? = null\n\n    /** 会话表：token -> 会话。容量有界，超限按最久未用淘汰。 */\n    private val sessions = object : LinkedHashMap<String, Session>(16, 0.75f, true) {\n        override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, Session>?): Boolean =\n            size > maxSessions\n    }\n\n    private class Session(val episodeUrl: String, val createdAt: Long) {\n        @Volatile var lastAccessAt: Long = createdAt\n    }\n\n    /** 同一上游 URL 的在途解析（请求合并，避免 seek 风暴）。 */\n    private val inflight = java.util.concurrent.ConcurrentHashMap<String, kotlinx.coroutines.Deferred<String?>>()\n\n    /** 启动服务；端口随机分配空闲端口。重复调用幂等。 */\n    @Synchronized\n    fun start() {\n        if (running) return\n        val socket = ServerSocket(0, BACKLOG, InetAddress.getByName(LOOPBACK))\n        serverSocket = socket\n        port = socket.localPort\n        running = true\n        val s = CoroutineScope(SupervisorJob() + Dispatchers.IO)\n        scope = s\n        s.launch { acceptLoop(socket, s) }\n    }\n\n    /** 崩溃自恢复重启：先关旧 socket 与协程再重开。 */\n    @Synchronized\n    fun restart() {\n        stop()\n        start()\n    }\n\n    @Synchronized\n    fun stop() {\n        running = false\n        runCatching { serverSocket?.close() }\n        serverSocket = null\n        runCatching { scope?.cancel() }\n        scope = null\n        synchronized(sessions) { sessions.clear() }\n        inflight.clear()\n    }\n\n    /**\n     * 为一次播放会话签发播放地址。\n     * 返回 http://127.0.0.1:{port}/{token}/{encodedUrl}\n     */\n    fun createPlayUrl(episodeUrl: String): String {\n        if (!running) start()\n        evictExpired()\n        val token = randomToken()\n        synchronized(sessions) { sessions[token] = Session(episodeUrl, now()) }\n        val encoded = URLEncoder.encode(episodeUrl, \"UTF-8\")\n        return \"http://$LOOPBACK:$port/$token/$encoded\"\n    }\n\n    /** 播放结束 token 失效。 */\n    fun releasePlayUrl(token: String) {\n        synchronized(sessions) { sessions.remove(token) }\n    }\n\n    /** 当前有效会话数（诊断用）。 */\n    fun sessionCount(): Int = synchronized(sessions) { sessions.size }\n\n    private fun evictExpired() {\n        val deadline = now() - sessionTtlMs\n        synchronized(sessions) {\n            sessions.entries.removeIf { it.value.lastAccessAt < deadline }\n        }\n    }\n\n    private fun randomToken(): String {\n        val bytes = ByteArray(16)\n        SecureRandom().nextBytes(bytes)\n        return bytes.joinToString(\"\") { \"%02x\".format(it) }\n    }\n\n    private suspend fun acceptLoop(socket: ServerSocket, s: CoroutineScope) {\n        // 连接数上限：超出时快速拒绝，而不是无限堆积协程\n        val permits = Channel<Unit>(MAX_CONNECTIONS)\n        repeat(MAX_CONNECTIONS) { permits.trySend(Unit) }\n\n        while (running) {\n            val client = runCatching { socket.accept() }.getOrNull() ?: break\n            permits.tryReceive()\n            s.launch {\n                try {\n                    handle(client)\n                } catch (_: Throwable) {\n                    runCatching { writeSimple(client, 500, \"Internal Error\") }\n                } finally {\n                    runCatching { client.close() }\n                    permits.trySend(Unit)\n                }\n            }\n        }\n    }\n\n    private suspend fun handle(client: Socket) {\n        client.use { conn ->\n            runCatching { conn.soTimeout = SOCKET_TIMEOUT_MS }\n\n            // 7.3 安全：只接受来自本机的连接，外部 IP 一律拒绝（不依赖绑定地址这一层）\n            val remote = runCatching { conn.inetAddress }.getOrNull()\n            if (remote == null || !remote.isLoopbackAddress) {\n                writeSimple(conn, 403, \"Forbidden\")\n                return\n            }\n\n            val input = BufferedInputStream(conn.inputStream)\n            val requestLine = readLine(input) ?: return\n            // 追加读掉请求头，直到空行；否则客户端会因未读完而 RST\n            drainHeaders(input)\n\n            val parts = requestLine.split(\" \")\n            if (parts.size < 2 || parts[0] != \"GET\") {\n                writeSimple(conn, 405, \"Method Not Allowed\")\n                return\n            }\n\n            val path = parts[1].substringBefore('?')\n            val segments = path.trimStart('/').split(\"/\", limit = 2)\n            val token = segments.getOrNull(0).orEmpty()\n            val encoded = segments.getOrNull(1).orEmpty()\n\n            // 7.3 安全：token 校验请求来源为应用自身；未知 token 直接拒绝\n            val session = synchronized(sessions) {\n                sessions[token]?.also { it.lastAccessAt = now() }\n            }\n            if (session == null || isExpired(session)) {\n                writeSimple(conn, 403, \"Forbidden\")\n                return\n            }\n\n            val upstreamUrl = session.episodeUrl.ifBlank {\n                runCatching { URLDecoder.decode(encoded, \"UTF-8\") }.getOrDefault(\"\")\n            }\n            if (upstreamUrl.isBlank()) {\n                writeSimple(conn, 400, \"Bad Request\")\n                return\n            }\n\n            // 7.3 上游统一走 NetworkDispatcher，并带超时\n            val resolved = resolveShared(upstreamUrl)\n            if (resolved.isNullOrBlank()) {\n                writeSimple(conn, 502, \"Parse Failed\")\n                return\n            }\n            writeRedirect(conn, resolved)\n        }\n    }\n\n    private fun isExpired(session: Session): Boolean = now() - session.lastAccessAt > sessionTtlMs\n\n    /**\n     * 合并同一 URL 的在途解析。\n     *\n     * 播放器 seek/重试会在极短时间内重复请求同一集，如果每次都打上游解析接口\n     * 很快会被限流甚至封禁，因此共享同一个 Deferred。\n     */\n    private suspend fun resolveShared(episodeUrl: String): String? {\n        val existing = inflight[episodeUrl]\n        if (existing != null) return runCatching { existing.await() }.getOrNull()\n\n        val s = scope\n        val deferred = if (s != null) {\n            kotlinx.coroutines.CompletableDeferred<String?>()\n        } else {\n            kotlinx.coroutines.CompletableDeferred<String?>()\n        }\n        val prior = inflight.putIfAbsent(episodeUrl, deferred)\n        if (prior != null) return runCatching { prior.await() }.getOrNull()\n\n        val result = runCatching {\n            withTimeoutOrNull(RESOLVE_TIMEOUT_MS) { resolveUpstream(episodeUrl) }\n        }.getOrNull()\n        deferred.complete(result)\n        inflight.remove(episodeUrl, deferred)\n        return result\n    }\n\n    /** 按 parses 配置依次尝试上游解析接口，取第一个可用结果。 */\n    private suspend fun resolveUpstream(episodeUrl: String): String? {\n        for (rule in parses.sortedBy { it.type }) {\n            val candidate = when (rule.type) {\n                0, 1, 2 -> queryJsonParse(rule, episodeUrl)\n                else -> null // type 3 走 Sniffer 池，不在本地代理内\n            }\n            if (!candidate.isNullOrBlank()) return candidate\n        }\n        return null\n    }\n\n    private suspend fun queryJsonParse(rule: TvBoxParser.ParseRule, episodeUrl: String): String? {\n        val url = rule.url + URLEncoder.encode(episodeUrl, \"UTF-8\")\n        val resp = runCatching {\n            net.execute(\n                HttpRequest(url = url, method = \"GET\", sourceId = \"local-parse-proxy\"),\n                traceId = \"local-parse-\" + rule.name\n            )\n        }.getOrNull() ?: return null\n        if (!resp.isSuccess) return null\n        val body = resp.body ?: return null\n        return runCatching {\n            val obj = com.google.gson.JsonParser.parseString(body).asJsonObject\n            obj.get(\"url\")?.takeIf { !it.isJsonNull }?.asString\n        }.getOrNull()\n    }\n\n    /** 读一行（CRLF 或 LF 结尾），超长则截断，避免被恶意长行拖死。 */\n    private fun readLine(input: BufferedInputStream): String? {\n        val sb = StringBuilder()\n        var prev = -1\n        while (true) {\n            val b = input.read()\n            if (b == -1) return if (sb.isEmpty()) null else sb.toString()\n            if (b == '\\n'.code) {\n                if (prev == '\\r'.code) sb.setLength(sb.length - 1)\n                return sb.toString()\n            }\n            sb.append(b.toChar())\n            prev = b\n            if (sb.length > MAX_LINE) return sb.toString()\n        }\n    }\n\n    private fun drainHeaders(input: BufferedInputStream) {\n        var guard = 0\n        while (guard++ < MAX_HEADERS) {\n            val line = readLine(input) ?: return\n            if (line.isEmpty()) return\n        }\n    }\n\n    private fun writeSimple(socket: Socket, code: Int, text: String) {\n        val body = text.toByteArray()\n        val header = \"HTTP/1.1 \" + code + \" \" + text + CRLF +\n            \"Content-Length: \" + body.size + CRLF +\n            \"Content-Type: text/plain; charset=utf-8\" + CRLF +\n            \"Connection: close\" + CRLF + CRLF\n        runCatching {\n            val out = socket.getOutputStream()\n            out.write(header.toByteArray())\n            out.write(body)\n            out.flush()\n        }\n    }\n\n    /**\n     * 标准响应：302 重定向到上游直链，Media3 会自行跟随。\n     *\n     * 上游地址必须过滤 CR/LF，否则可被上游构造出响应头注入。\n     */\n    private fun writeRedirect(socket: Socket, upstream: String) {\n        val safe = upstream.replace(\"\\r\", \"\").replace(\"\\n\", \"\")\n        val header = \"HTTP/1.1 302 Found\" + CRLF +\n            \"Location: \" + safe + CRLF +\n            \"Content-Length: 0\" + CRLF +\n            \"Cache-Control: no-store\" + CRLF +\n            \"Connection: close\" + CRLF + CRLF\n        runCatching {\n            val out = socket.getOutputStream()\n            out.write(header.toByteArray())\n            out.flush()\n        }\n    }\n\n    private companion object {\n        const val LOOPBACK = \"127.0.0.1\"\n        const val CRLF = \"\\r\\n\"\n        const val BACKLOG = 16\n        const val MAX_CONNECTIONS = 8\n        const val SOCKET_TIMEOUT_MS = 15_000\n        const val RESOLVE_TIMEOUT_MS = 12_000L\n        const val MAX_LINE = 8192\n        const val MAX_HEADERS = 64\n        const val DEFAULT_SESSION_TTL_MS = 6L * 60 * 60 * 1000\n        const val DEFAULT_MAX_SESSIONS = 16\n    }\n}\n"}, {"path": "app/src/main/java/com/lanyue/reader/source/video/TvBoxParser.kt", "lang": "kt", "lines": 144, "content": "package com.lanyue.reader.source.video\n\nimport com.google.gson.JsonObject\nimport com.google.gson.JsonParser\nimport com.lanyue.reader.data.db.entity.LiveSourceEntity\nimport com.lanyue.reader.data.db.entity.VideoApiEntity\nimport com.lanyue.reader.data.db.entity.VideoSiteEntity\n\n/**\n * 7.3 TVBox 配置解析。\n *\n * 关键约束：\n * - 一条配置展开为多站点源\n * - 重新导入按同一接口配置内 site.key 去重合并\n * - hotSearch 字段一期有意裁剪：不解析、不存储（符合零分发红线，属主动裁剪）\n * - type 3 且 api 非 .js（即 spider jar）标记「暂不支持」，不崩溃\n * - lives 解析后持久化，一期不暴露 UI\n */\nclass TvBoxParser {\n\n    data class ParsedConfig(\n        val api: VideoApiEntity,\n        val sites: List<VideoSiteEntity>,\n        val lives: List<LiveSourceEntity>,\n        val dropsJarSites: Int,\n        /** 7.3 / ADR-014：parses 链，供播放解析使用。 */\n        val parses: List<ParseRule>,\n        val flags: List<String>\n    )\n\n    /** 7.3 parses 项。type 0/1 JSON 解析，type 2 聚合，type 3 网页嗅探。 */\n    data class ParseRule(\n        val name: String,\n        val type: Int,\n        val url: String,\n        val ext: String? = null\n    )\n\n    sealed class Result {\n        data class Ok(val config: ParsedConfig) : Result()\n        data class Invalid(val reason: String) : Result()\n    }\n\n    fun parse(configUrl: String, json: String): Result {\n        val root = runCatching { JsonParser.parseString(json).asJsonObject }.getOrNull()\n            ?: return Result.Invalid(\"config is not a JSON object\")\n\n        // 7.3 sites 必须存在，否则这条配置无意义\n        val sitesArray = root.getAsJsonArray(\"sites\") ?: return Result.Invalid(\"missing sites\")\n\n        val spider = root.get(\"spider\")?.takeIf { !it.isJsonNull }?.asString\n        val api = VideoApiEntity(\n            url = configUrl,\n            name = root.get(\"name\")?.takeIf { !it.isJsonNull }?.asString,\n            spider = spider,\n            lastUpdate = System.currentTimeMillis(),\n            rawJson = json\n        )\n\n        var jarDrops = 0\n        val sites = sitesArray.mapNotNull { element ->\n            val obj = runCatching { element.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val key = obj.str(\"key\") ?: return@mapNotNull null\n            val siteApi = obj.str(\"api\")\n            val type = obj.int(\"type\", 1)\n\n            // 7.3 type 3：api 以 .js 结尾是 drpy（一期支持）；否则是 spider jar（二期）\n            val isDrpy = type == 3 && siteApi?.endsWith(\".js\") == true\n            val unsupported = type == 3 && !isDrpy\n\n            if (unsupported) jarDrops += 1\n\n            VideoSiteEntity(\n                configUrl = configUrl,\n                siteKey = key,\n                name = obj.str(\"name\") ?: key,\n                type = type,\n                api = siteApi,\n                searchable = obj.bool(\"searchable\", true),\n                quickSearch = obj.bool(\"quickSearch\", true),\n                filterable = obj.bool(\"filterable\", false),\n                ext = obj.get(\"ext\")?.takeIf { !it.isJsonNull }?.toString(),\n                jar = obj.str(\"jar\"),\n                timeout = obj.long(\"timeout\", 0L),\n                enabled = !unsupported,\n                unsupported = unsupported\n            )\n        }\n\n        // 7.3 parses 解析链\n        val parses = root.getAsJsonArray(\"parses\")?.mapNotNull { el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapNotNull null\n            val url = obj.str(\"url\") ?: return@mapNotNull null\n            ParseRule(\n                name = obj.str(\"name\") ?: \"\",\n                type = obj.int(\"type\", 0),\n                url = url,\n                ext = obj.get(\"ext\")?.takeIf { !it.isJsonNull }?.toString()\n            )\n        }.orEmpty()\n\n        val flags = root.getAsJsonArray(\"flags\")?.mapNotNull { it.asString }.orEmpty()\n\n        // 4.12 live_sources：一期解析并持久化，UI 不暴露\n        val lives = root.getAsJsonArray(\"lives\")?.mapIndexedNotNull { index, el ->\n            val obj = runCatching { el.asJsonObject }.getOrNull() ?: return@mapIndexedNotNull null\n            val url = obj.str(\"url\") ?: return@mapIndexedNotNull null\n            LiveSourceEntity(\n                id = configUrl + \"#live#\" + index,\n                apiUrl = configUrl,\n                name = obj.str(\"name\") ?: \"\",\n                type = obj.str(\"type\") ?: \"txt\",\n                url = url,\n                epg = obj.str(\"epg\"),\n                logo = obj.str(\"logo\")\n            )\n        }.orEmpty()\n\n        // hotSearch 有意裁剪：此处不读取、不写入（见 6.3 / ADR-014）\n\n        return Result.Ok(\n            ParsedConfig(\n                api = api,\n                sites = sites,\n                lives = lives,\n                dropsJarSites = jarDrops,\n                parses = parses,\n                flags = flags\n            )\n        )\n    }\n\n    private fun JsonObject.str(key: String): String? =\n        get(key)?.takeIf { !it.isJsonNull }?.asString\n\n    private fun JsonObject.int(key: String, default: Int): Int =\n        runCatching { get(key)?.asInt ?: default }.getOrDefault(default)\n\n    private fun JsonObject.long(key: String, default: Long): Long =\n        runCatching { get(key)?.asLong ?: default }.getOrDefault(default)\n\n    private fun JsonObject.bool(key: String, default: Boolean): Boolean =\n        runCatching { get(key)?.asBoolean ?: default }.getOrDefault(default)\n}\n"}, {"path": "app/src/main/res/values/strings.xml", "lang": "xml", "lines": 36, "content": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">览阅<\/string>\n\n    <!-- 6.2.5 首次导入免责声明（原文，CI 校验存在性） -->\n    <string name=\"disclaimer_import\">本产品不提供任何源，源由用户自行导入，内容合规性由使用者自行负责<\/string>\n\n    <!-- 首启引导：只讲「如何导入」，不出现任何源或接口指引 -->\n    <string name=\"onboarding_title\">开始使用<\/string>\n    <string name=\"onboarding_step_1\">1. 在任一源 Tab 点击「导入」<\/string>\n    <string name=\"onboarding_step_2\">2. 选择本地文件、剪贴板或 URL Scheme 粘贴源<\/string>\n    <string name=\"onboarding_step_3\">3. 导入后在发现页浏览内容<\/string>\n    <string name=\"onboarding_note\">本应用不含任何内置源与内容入口。<\/string>\n\n    <!-- 4.3 内核错误码用户提示 -->\n    <string name=\"err_parse_failed_generic\">网页解析失败，可能是不支持的网页类型，请检查网页或稍后重试<\/string>\n    <string name=\"err_timeout\">加载超时，请检查网络后重试<\/string>\n    <string name=\"err_busy\">系统繁忙，请稍后重试<\/string>\n    <string name=\"err_render_gone\">页面已崩溃，已自动恢复<\/string>\n    <string name=\"err_shutdown\">应用正在关闭，请稍后重试<\/string>\n    <string name=\"err_sandbox_timeout\">页面解析超时，请重试<\/string>\n\n    <!-- 产品级错误码 -->\n    <string name=\"err_content_empty\">内容为空，源可能已失效，可尝试换源<\/string>\n    <string name=\"err_parse_failed\">影片解析失败，请切换线路或稍后重试<\/string>\n    <string name=\"err_decode\">视频解码失败，请尝试切换解码器<\/string>\n    <string name=\"err_danmaku_not_matched\">未匹配到弹幕，点击手动选择<\/string>\n    <string name=\"err_login_required\">该源需要登录后使用<\/string>\n    <string name=\"err_source_invalid\">源格式不合法，导入失败<\/string>\n\n    <!-- 合规门禁：免责声明与版权声明（tools/check_disclaimer.py 校验） -->\n    <string name=\"disclaimer_title\">免责声明<\/string>\n    <string name=\"disclaimer_body\">本应用不提供、不存储、不分发任何内容，所有内容均来自用户自行导入的第三方源；内容的合法性与准确性由第三方源及使用者自行负责，使用风险由用户自行承担。<\/string>\n    <string name=\"disclaimer_copyright\">本应用的解析结果均来自第三方源，版权归原作者及原站点所有；本应用不存储任何内容副本，仅供个人学习与阅读使用。如权利人认为内容侵权，可通过下方通道反馈，我们将在核实后提供源屏蔽指引。<\/string>\n    <string name=\"disclaimer_report\">侵权/违规内容举报：请在「设置 - 关于 - 反馈」提交具体源地址与条目链接，我们会记录并协助屏蔽。<\/string>\n<\/resources>\n"}, {"path": "app/src/main/res/values/themes.xml", "lang": "xml", "lines": 4, "content": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <style name=\"Theme.Lanyue\" parent=\"android:Theme.Material.Light.NoActionBar\" />\n<\/resources>\n"}, {"path": "build.gradle.kts", "lang": "kts", "lines": 5, "content": "plugins {\n    id(\"com.android.application\") version \"8.5.2\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"2.0.20\" apply false\n    id(\"com.google.devtools.ksp\") version \"2.0.20-1.0.25\" apply false\n}\n"}, {"path": "gradle.properties", "lang": "properties", "lines": 4, "content": "org.gradle.jvmargs=-Xmx4g\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n"}, {"path": "settings.gradle.kts", "lang": "kts", "lines": 9, "content": "pluginManagement {\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = \"lanyue\"\ninclude(\":app\")\n"}, {"path": "tests/JsonXpathTest.kt", "lang": "kt", "lines": 163, "content": "import com.lanyue.reader.source.rule.JsonPath\nimport com.lanyue.reader.source.rule.XPathLite\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\nprivate const val DOC = \"\"\"\n{\n  \"code\": 0,\n  \"data\": {\n    \"total\": 3,\n    \"list\": [\n      {\"name\":\"三体\",\"type\":\"book\",\"words\":880000,\"author\":\"刘慈欣\"},\n      {\"name\":\"活着\",\"type\":\"book\",\"words\":120000,\"author\":\"余华\"},\n      {\"name\":\"某漫画\",\"type\":\"comic\",\"words\":0,\"author\":null}\n    ]\n  },\n  \"meta\": {\"nested\": {\"name\":\"深层\"}}\n}\n\"\"\"\n\nfun main() {\n    // ---------------- 基础字段 ----------------\n    eq(\"根字段\", JsonPath.firstString(DOC, \"$.code\"), \"0\")\n    eq(\"两级字段\", JsonPath.firstString(DOC, \"$.data.total\"), \"3\")\n    eq(\"字符串字段\", JsonPath.firstString(DOC, \"$.data.list[0].name\"), \"三体\")\n    eq(\"负索引\", JsonPath.firstString(DOC, \"$.data.list[-1].name\"), \"某漫画\")\n    eq(\"越界索引\", JsonPath.selectText(DOC, \"$.data.list[99].name\").size, 0)\n\n    // ---------------- 通配 ----------------\n    eq(\"数组通配\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[*].name\")),\n        listOf(\"三体\", \"活着\", \"某漫画\"))\n    eq(\"对象通配\", JsonPath.selectText(DOC, \"$.data.*\").size, 2)\n    check(\"通配后取字段\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[*].author\")).contains(\"刘慈欣\"))\n\n    // ---------------- 递归下降 ----------------\n    val recursive = JsonPath.toStrings(JsonPath.selectText(DOC, \"$..name\"))\n    check(\"递归下降取到 4 个 name\", recursive.size == 4, \"got=$recursive\")\n    check(\"递归含深层值\", recursive.contains(\"深层\"))\n\n    // ---------------- 切片 ----------------\n    eq(\"切片 0:2\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[0:2].name\")),\n        listOf(\"三体\", \"活着\"))\n    eq(\"切片省略尾\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[1:].name\")),\n        listOf(\"活着\", \"某漫画\"))\n    eq(\"切片负端点\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[-2:].name\")),\n        listOf(\"活着\", \"某漫画\"))\n    eq(\"切片空区间\", JsonPath.selectText(DOC, \"$.data.list[2:1].name\").size, 0)\n\n    // ---------------- 方括号字符串键 ----------------\n    val weird = \"\"\"{\"a b\":{\"c-d\":1}}\"\"\"\n    eq(\"方括号字符串键\", JsonPath.firstString(weird, \"${'$'}['a b']['c-d']\"), \"1\")\n    eq(\"双引号方括号键\", JsonPath.firstString(weird, \"${'$'}[\\\"a b\\\"][\\\"c-d\\\"]\"), \"1\")\n\n    // ---------------- 过滤：相等 ----------------\n    eq(\"按字符串相等过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.type=='book')].name\")),\n        listOf(\"三体\", \"活着\"))\n    eq(\"按数字相等过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words==880000)].name\")),\n        listOf(\"三体\"))\n\n    // ---------------- 过滤：不等 ----------------\n    eq(\"按不等过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.type!='book')].name\")),\n        listOf(\"某漫画\"))\n\n    // ---------------- 过滤：比较 ----------------\n    eq(\"大于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words>500000)].name\")),\n        listOf(\"三体\"))\n    eq(\"大于等于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words>=120000)].name\")),\n        listOf(\"三体\", \"活着\"))\n    eq(\"小于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words<1000)].name\")),\n        listOf(\"某漫画\"))\n    eq(\"小于等于\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.words<=120000)].name\")),\n        listOf(\"活着\", \"某漫画\"))\n\n    // ---------------- 过滤：存在性 ----------------\n    eq(\"存在性过滤\", JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.author)].name\")),\n        listOf(\"三体\", \"活着\"))\n    // null 值不算存在\n    check(\"null 不算存在\", !JsonPath.toStrings(JsonPath.selectText(DOC, \"$.data.list[?(@.author)].name\")).contains(\"某漫画\"))\n\n    // ---------------- 非法输入 ----------------\n    eq(\"非法 JSON\", JsonPath.selectText(\"{oops\", \"$.a\").size, 0)\n    eq(\"空路径\", JsonPath.selectText(DOC, \"\").size, 0)\n    eq(\"非法路径\", JsonPath.selectText(DOC, \"$.a[?]\").size, 0)\n    eq(\"未闭合方括号\", JsonPath.selectText(DOC, \"$.a[0\").size, 0)\n    eq(\"含空白的名字判非法\", JsonPath.selectText(DOC, \"$.a b\").size, 0)\n    eq(\"空 JSON 对象取字段\", JsonPath.selectText(\"{}\", \"$.a\").size, 0)\n    eq(\"数组取字段判空\", JsonPath.selectText(\"[1,2]\", \"$.a\").size, 0)\n    eq(\"对象取索引判空\", JsonPath.selectText(DOC, \"$.code[0]\").size, 0)\n\n    // ---------------- 结果形态 ----------------\n    val objs = JsonPath.selectText(DOC, \"$.data.list[*]\")\n    eq(\"对象结果保留结构\", objs.size, 3)\n    check(\"对象转字符串是 JSON\", JsonPath.toStrings(objs).first().startsWith(\"{\"))\n    eq(\"null 被过滤\", JsonPath.selectText(DOC, \"$.data.list[2].author\").size, 0)\n\n    // ---------------- looksLikeJsonPath ----------------\n    eq(\"识别 $.\", JsonPath.looksLikeJsonPath(\"$.a\"), true)\n    eq(\"识别 $[\", JsonPath.looksLikeJsonPath(\"$[0]\"), true)\n    eq(\"CSS 不算\", JsonPath.looksLikeJsonPath(\"class.a@text\"), false)\n    eq(\"XPath 不算\", JsonPath.looksLikeJsonPath(\"//div/a\"), false)\n    eq(\"单 $ 算\", JsonPath.looksLikeJsonPath(\"$\"), true)\n\n    // ================= XPathLite =================\n    eq(\"识别 XPath //\", XPathLite.looksLikeXPath(\"//div/a\"), true)\n    eq(\"识别 XPath /\", XPathLite.looksLikeXPath(\"/html/body\"), true)\n    eq(\"协议相对 URL 不算\", XPathLite.looksLikeXPath(\"//example.com/a\"), false)\n    eq(\"CSS 不算 XPath\", XPathLite.looksLikeXPath(\"class.a\"), false)\n\n    // 基本转换\n    eq(\"后代 + 取文本\", XPathLite.toCss(\"//div[@class='x']/a/text()\"),\n        XPathLite.Converted(\"div[class=\\\"x\\\"] > a\", \"text\"))\n    eq(\"class 谓词(全等)\", XPathLite.toCss(\"//div[@class='x']\")?.css, \"div[class=\\\"x\\\"]\")\n    eq(\"id 谓词(全等)\", XPathLite.toCss(\"//div[@id='y']//span\")?.css, \"div[id=\\\"y\\\"] span\")\n    eq(\"位置谓词\", XPathLite.toCss(\"//ul/li[2]\")?.css, \"ul > li:nth-child(2)\")\n    eq(\"last()\", XPathLite.toCss(\"//p[last()]\")?.css, \"p:last-child\")\n    eq(\"属性取值\", XPathLite.toCss(\"//a[@href]/@href\")?.directive, \"attr:href\")\n    eq(\"属性取值的 css\", XPathLite.toCss(\"//a[@href]/@href\")?.css, \"a[href]\")\n    eq(\"contains\", XPathLite.toCss(\"//div[contains(@class,'box')]\")?.css, \"div[class*=\\\"box\\\"]\")\n    eq(\"绝对路径\", XPathLite.toCss(\"/html/body/div[1]\")?.css, \"html > body > div:nth-child(1)\")\n    eq(\"通配段\", XPathLite.toCss(\"//div/*/a\")?.css, \"div > * > a\")\n\n    // 不等谓词 -> :not()\n    eq(\"不等谓词\", XPathLite.toCss(\"//div[@class!='x']\")?.css, \"div:not([class=\\\"x\\\"])\")\n\n    // 无取值指令\n    eq(\"无指令\", XPathLite.toCss(\"//div/a\")?.directive, null)\n\n    // 明确不支持的\n    eq(\"轴不支持\", XPathLite.toCss(\"//div/ancestor::span\"), null)\n    eq(\"and 不支持\", XPathLite.toCss(\"//div[@a and @b]\"), null)\n    eq(\"or 不支持\", XPathLite.toCss(\"//div[@a or @b]\"), null)\n    eq(\"非 / 开头\", XPathLite.toCss(\"div/a\"), null)\n    eq(\"未知函数\", XPathLite.toCss(\"//div[normalize-space(@class)]\"), null)\n    eq(\"位置 0 非法\", XPathLite.toCss(\"//li[0]\"), null)\n\n    // 引号转义\n    val q = XPathLite.toCss(\"//div[@class='a\\\"b']\")\n    check(\"引号被转义\", q != null && q.css.contains(\"\\\\\\\"\"), \"css=${q?.css}\")\n\n    println(\"================ JSONPath / XPathLite 单测 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"}, {"path": "tests/RuleEngineDispatchTest.kt", "lang": "kt", "lines": 171, "content": "import com.lanyue.reader.core.engine.DomParser\nimport com.lanyue.reader.core.engine.JsExecMode\nimport com.lanyue.reader.core.engine.JsRuntime\nimport com.lanyue.reader.core.engine.PoolTier\nimport com.lanyue.reader.core.observability.LocalMetrics\nimport com.lanyue.reader.core.engine.EngineException\nimport com.lanyue.reader.source.rule.RuleEngine\nimport com.lanyue.reader.source.rule.RuleEngine.RuleContext\nimport kotlinx.coroutines.runBlocking\nimport java.io.File\n\nprivate var pass = 0\nprivate var fail = 0\nprivate val failures = ArrayList<String>()\n\nprivate fun eq(name: String, actual: Any?, expected: Any?) {\n    if (actual == expected) pass++ else {\n        fail++\n        failures.add(\"$name -> actual=$actual expected=$expected\")\n    }\n}\n\nprivate fun check(name: String, cond: Boolean, detail: String = \"\") {\n    if (cond) pass++ else {\n        fail++\n        failures.add(\"$name -> $detail\")\n    }\n}\n\n/** 假 JS 运行时：只回传固定值，用于验证引擎的 JS 分发路径不依赖真 WebView。 */\nprivate class FakeJs(private val reply: String) : JsRuntime {\n    var lastScript: String = \"\"\n    override suspend fun eval(\n        script: String,\n        mode: JsExecMode,\n        tier: PoolTier,\n        traceId: String,\n        dispatch: (String, String) -> Boolean\n    ): String {\n        lastScript = script\n        dispatch(\"task-1\", script)\n        return reply\n    }\n    override fun onRenderProcessGone(error: Throwable) {}\n    override suspend fun drainPending(): Int = 0\n}\n\nprivate const val HTML = \"\"\"\n<html><head><title>书城<\/title><\/head><body>\n<div class=\"book-list\">\n  <div class=\"item\"><a class=\"name\" href=\"/book/1\">三体<\/a><span class=\"author\">刘慈欣<\/span><img src=\"//img.a.com/1.jpg\"><\/div>\n  <div class=\"item\"><a class=\"name\" href=\"/book/2\">活着<\/a><span class=\"author\">余华<\/span><img src=\"//img.a.com/2.jpg\"><\/div>\n  <div class=\"item\"><a class=\"name\" href=\"https://x.com/b3\">围城<\/a><\/div>\n<\/div>\n<div id=\"meta\" data-cid=\"42\">元信息<\/div>\n<a href=\"rel/path\">相对链接<\/a>\n<\/body><\/html>\n\"\"\"\n\nprivate const val JSON = \"\"\"\n{\"code\":0,\"data\":{\"list\":[\n  {\"name\":\"三体\",\"type\":\"book\",\"words\":880000},\n  {\"name\":\"某漫画\",\"type\":\"comic\",\"words\":0}\n]}}\n\"\"\"\n\nfun main() = runBlocking {\n    val metrics = LocalMetrics(File(\"/tmp/metrics\"))\n    val dom = DomParser(null, metrics) // realDom = null，走 jsoup 降级\n    val js = FakeJs(\"js-ok\")\n    val engine = RuleEngine(js, dom, metrics)\n\n    // ---------------- CSS 基础 ----------------\n    eq(\"CSS 取文本\", engine.evalList(HTML, \"class.name@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"CSS 标签前缀\", engine.evalList(HTML, \"tag.span@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"刘慈欣\", \"余华\"))\n    eq(\"CSS id 前缀\", engine.evalList(HTML, \"id.meta@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"元信息\"))\n\n    // ---------------- @href / @src（本轮修复的核心缺陷） ----------------\n    eq(\"CSS 取 href\", engine.evalList(HTML, \"class.name@href\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"/book/1\", \"/book/2\", \"https://x.com/b3\"))\n    eq(\"CSS 取 img src\", engine.evalList(HTML, \"tag.img@src\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"//img.a.com/1.jpg\", \"//img.a.com/2.jpg\"))\n    eq(\"CSS 取 data-* 属性\", engine.evalList(HTML, \"id.meta@data-cid\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"42\"))\n    eq(\"attr: 前缀\", engine.evalList(HTML, \"class.name@attr:href\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"/book/1\", \"/book/2\", \"https://x.com/b3\"))\n\n    // ---------------- @abs: 绝对化 ----------------\n    eq(\"abs: 站点根相对\", engine.evalList(HTML, \"class.name@abs:href\", RuleContext(baseUrl = \"https://a.com/list\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"https://a.com/book/1\", \"https://a.com/book/2\", \"https://x.com/b3\"))\n    eq(\"abs: 协议相对\", engine.evalList(HTML, \"tag.img@abs:src\", RuleContext(baseUrl = \"https://a.com/list\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"https://img.a.com/1.jpg\", \"https://img.a.com/2.jpg\"))\n    // tag.a 会选中全部 <a>，因此结果含 4 条；最后一条验证\"目录相对\"拼接\n    val absAll = engine.evalList(HTML, \"tag.a@abs:href\",\n        RuleContext(baseUrl = \"https://a.com/dir/page\", sourceId = \"src-1\", traceId = \"trace-1\"))\n    eq(\"abs: 全量链接数\", absAll.size, 4)\n    eq(\"abs: 目录相对\", absAll.last(), \"https://a.com/dir/rel/path\")\n\n    // ---------------- 链式选择器 + 尾部索引 ----------------\n    eq(\"链式嵌套\", engine.evalList(HTML, \"class.book-list@class.name@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"尾部索引取第 2 个\", engine.evalList(HTML, \"class.name.1@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"活着\"))\n    eq(\"尾部负索引\", engine.evalList(HTML, \"class.name.-1@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"围城\"))\n\n    // ---------------- XPath ----------------\n    eq(\"XPath 取文本\", engine.evalList(HTML, \"//div[@class='book-list']//a/text()\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"XPath 取属性\", engine.evalList(HTML, \"//a[@class='name']/@href\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"/book/1\", \"/book/2\", \"https://x.com/b3\"))\n    eq(\"XPath 位置\", engine.evalList(HTML, \"//div[@class='item'][2]//span/text()\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"余华\"))\n    // 不支持的结构必须明确报错，不能静默空\n    try {\n        engine.evalList(HTML, \"//div/ancestor::span\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\"))\n        fail++; failures.add(\"XPath 轴应报错却成功\")\n    } catch (e: EngineException) {\n        check(\"XPath 轴报错信息含 unsupported\", e.message?.contains(\"unsupported\") == true, \"msg=${e.message}\")\n    }\n\n    // ---------------- JSONPath ----------------\n    eq(\"JSONPath 字段\", engine.evalList(JSON, \"$.data.list[*].name\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"某漫画\"))\n    eq(\"JSONPath 过滤\", engine.evalList(JSON, \"$.data.list[?(@.type=='book')].name\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\"))\n    eq(\"JSONPath 比较\", engine.evalList(JSON, \"$.data.list[?(@.words>1000)].name\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\"))\n    // JSON 响应套 CSS 规则 -> 取不到，不应崩\n    eq(\"HTML 上跑 JSONPath 判空\", engine.evalList(HTML, \"$.data.list\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        emptyList<String>())\n\n    // ---------------- JS 分发 ----------------\n    eq(\"JS 规则走运行时\", engine.evalList(HTML, \"@js:1+1\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"js-ok\"))\n    check(\"JS 脚本注入了 result\", js.lastScript.contains(\"var result =\"))\n\n    // ---------------- 正则替换 ----------------\n    eq(\"## 替换\", engine.evalList(HTML, \"class.name@text##第(\\\\d+)章##$1\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n\n    // ---------------- || 短路 ----------------\n    eq(\"|| 第一备选命中\", engine.evalList(HTML, \"class.name@text||class.author@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"三体\", \"活着\", \"围城\"))\n    eq(\"|| 第一备选失败回落\", engine.evalList(HTML, \"class.nope@text||class.author@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"刘慈欣\", \"余华\"))\n\n    // ---------------- && 合并 ----------------\n    eq(\"&& 合并两段\", engine.evalList(HTML, \"class.author@text&&id.meta@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")),\n        listOf(\"刘慈欣\", \"余华\", \"元信息\"))\n\n    // ---------------- 空规则 ----------------\n    eq(\"null 规则\", engine.evalList(HTML, null, RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), emptyList<String>())\n    eq(\"空串规则\", engine.evalList(HTML, \"  \", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), emptyList<String>())\n    eq(\"选择器无匹配\", engine.evalList(HTML, \"class.none@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), emptyList<String>())\n\n    // ---------------- evalString ----------------\n    eq(\"evalString 取首个\", engine.evalString(HTML, \"class.name@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), \"三体\")\n    eq(\"evalString 无匹配\", engine.evalString(HTML, \"class.none@text\", RuleContext(baseUrl = \"https://a.com\", sourceId = \"src-1\", traceId = \"trace-1\")), null)\n\n    println(\"================ RuleEngine 分发集成测试 ================\")\n    println(\"PASS = $pass   FAIL = $fail\")\n    if (failures.isNotEmpty()) {\n        println(\"---- failures ----\")\n        failures.forEach { println(\"  \" + it) }\n    }\n    if (fail > 0) kotlin.system.exitProcess(1)\n}\n"}, {"path": "tools/check_contracts.py", "lang": "py", "lines": 57, "content": "#!/usr/bin/env python3\n\"\"\"架构门禁（轻量静态检查）。\n\n1. EngineException 不得继承 CancellationException（4.3 强制约束）\n2. 源实现（source/）不得直接引用 UI 层\n3. LocalParseProxy 只允许绑定 127.0.0.1\n4. 关键 TODO 必须带编号（TODO-DEV-*），便于评审追踪\n\"\"\"\nimport re\nimport sys\nfrom pathlib import Path\n\nMAIN = Path(\"app/src/main/java\")\n\n\ndef read_all(path: Path):\n    return [(f, f.read_text(encoding=\"utf-8\")) for f in path.rglob(\"*.kt\")]\n\n\ndef main() -> int:\n    problems = []\n\n    engine = MAIN / \"com/lanyue/reader/core/engine/Engine.kt\"\n    if engine.exists():\n        text = engine.read_text(encoding=\"utf-8\")\n        m = re.search(r\"class EngineException\\([^)]*\\)\\s*:\\s*([A-Za-z0-9_.]+)\", text, re.S)\n        if m and \"CancellationException\" in m.group(1):\n            problems.append(\"Engine.kt: EngineException 不得继承 CancellationException\")\n    else:\n        problems.append(\"缺少 Engine.kt\")\n\n    for f, text in read_all(MAIN / \"com/lanyue/reader/source\"):\n        if re.search(r\"import com\\.lanyue\\.reader\\.ui\", text):\n            problems.append(f\"{f}: 源层不得依赖 UI 层\")\n\n    proxy = MAIN / \"com/lanyue/reader/source/video/LocalParseProxy.kt\"\n    if proxy.exists():\n        text = proxy.read_text(encoding=\"utf-8\")\n        if \"0.0.0.0\" in text:\n            problems.append(\"LocalParseProxy.kt: 禁止绑定 0.0.0.0\")\n\n    for f, text in read_all(MAIN):\n        for m in re.finditer(r\"TODO(?!-DEV-)[^ \\n]*\", text):\n            problems.append(f\"{f}: TODO 未带编号 -> {m.group(0)}\")\n\n    if problems:\n        print(\"[FAIL] 架构门禁：\")\n        for p in problems:\n            print(\"  -\", p)\n        return 1\n\n    print(\"[OK] 架构契约门禁通过\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "tools/check_disclaimer.py", "lang": "py", "lines": 48, "content": "#!/usr/bin/env python3\n\"\"\"合规门禁：免责声明与版权声明必须存在于 strings.xml。\n\n要求（见产品合规章节）：\n1. 免责声明明确\"内容来自第三方源，App 不存储、不分发\"\n2. 明确\"用户自行承担使用风险\"与\"举报/下架通道\"\n\"\"\"\nimport sys\nfrom pathlib import Path\nfrom xml.etree import ElementTree as ET\n\nTARGET = Path(\"app/src/main/res/values/strings.xml\")\n\nREQUIRED_KEYS = {\n    \"disclaimer_title\",\n    \"disclaimer_body\",\n    \"disclaimer_copyright\",\n    \"disclaimer_report\",\n}\n\nREQUIRED_PHRASES = [\"第三方\", \"不存储\"]\n\n\ndef main() -> int:\n    if not TARGET.exists():\n        print(f\"[FAIL] strings.xml 不存在: {TARGET}\")\n        return 1\n\n    root = ET.parse(TARGET).getroot()\n    values = {el.get(\"name\"): (el.text or \"\") for el in root if el.tag == \"string\"}\n\n    missing = REQUIRED_KEYS - set(values)\n    if missing:\n        print(\"[FAIL] 缺少免责声明条目：\", sorted(missing))\n        return 1\n\n    body = values[\"disclaimer_body\"] + values[\"disclaimer_copyright\"]\n    for phrase in REQUIRED_PHRASES:\n        if phrase not in body:\n            print(f\"[FAIL] 免责声明缺少关键表述：{phrase}\")\n            return 1\n\n    print(\"[OK] 免责声明门禁通过\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "tools/check_no_telemetry.py", "lang": "py", "lines": 55, "content": "#!/usr/bin/env python3\n\"\"\"合规门禁：本地埋点不得有网络出口。\n\n第八章要求：埋点只落本地文件（LocalMetrics -> 本地环形日志），\n禁止上报、禁止初始化第三方统计 SDK、禁止向远端发请求。\n\"\"\"\nimport re\nimport sys\nfrom pathlib import Path\n\nSRC = Path(\"app/src/main/java\")\nMETRICS_DIR = SRC / \"com/lanyue/reader/core/observability\"\n\nNET_HINTS = re.compile(\n    r\"HttpURLConnection|OkHttpClient|openConnection\\(|Retrofit|\"\n    r\"firebase|umeng|appsflyer|sensorsdata|bugly\",\n    re.I,\n)\n\nTHIRD_PARTY_SDK = re.compile(\n    r\"com\\.google\\.firebase|com\\.umeng|com\\.bugly|com\\.appsflyer|\"\n    r\"com\\.sensorsdata|cn\\.jpush|com\\.tencent\\.bugly\",\n)\n\n\ndef main() -> int:\n    problems = []\n\n    if METRICS_DIR.exists():\n        for f in METRICS_DIR.rglob(\"*.kt\"):\n            text = f.read_text(encoding=\"utf-8\")\n            for m in NET_HINTS.finditer(text):\n                problems.append(f\"{f}: 埋点模块出现网络/SDK 特征 {m.group(0)}\")\n\n    build = Path(\"app/build.gradle.kts\")\n    if build.exists():\n        for line in build.read_text(encoding=\"utf-8\").splitlines():\n            s = line.strip()\n            if s.startswith(\"//\") or not s.startswith(\"implementation(\"):\n                continue\n            if THIRD_PARTY_SDK.search(s):\n                problems.append(f\"build.gradle.kts: 引入第三方统计 SDK -> {s}\")\n\n    if problems:\n        print(\"[FAIL] 存在数据上报风险：\")\n        for p in problems:\n            print(\"  -\", p)\n        return 1\n\n    print(\"[OK] 无遥测出口门禁通过\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "tools/check_permissions.py", "lang": "py", "lines": 76, "content": "#!/usr/bin/env python3\n\"\"\"第六章 6.2.4 权限最小化门禁。\n\n校验 AndroidManifest.xml 的 uses-permission 只能是白名单集合。\n白名单是\"允许集\"，不代表都是非危险级；POST_NOTIFICATIONS 属 dangerous，\n必须运行时请求（见 ui 层 requestPermission）。\n\"\"\"\nimport re\nimport sys\nfrom pathlib import Path\n\nALLOWED = {\n    \"android.permission.INTERNET\",\n    \"android.permission.ACCESS_NETWORK_STATE\",\n    \"android.permission.POST_NOTIFICATIONS\",\n    \"android.permission.FOREGROUND_SERVICE\",\n    \"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\",\n    \"android.permission.FOREGROUND_SERVICE_DATA_SYNC\",\n    \"android.permission.CHANGE_WIFI_MULTICAST_STATE\",\n    \"android.permission.WAKE_LOCK\",\n}\n\nFORBIDDEN_HINTS = (\n    \"READ_PHONE_STATE\",\n    \"READ_SMS\",\n    \"READ_EXTERNAL_STORAGE\",\n    \"QUERY_ALL_PACKAGES\",\n    \"MANAGE_EXTERNAL_STORAGE\",\n    \"ACCESS_FINE_LOCATION\",\n    \"READ_CONTACTS\",\n    \"RECORD_AUDIO\",\n    \"CAMERA\",\n)\n\nMANIFEST = Path(\"app/src/main/AndroidManifest.xml\")\n\n\ndef main() -> int:\n    if not MANIFEST.exists():\n        print(f\"[FAIL] manifest not found: {MANIFEST}\")\n        return 1\n\n    text = MANIFEST.read_text(encoding=\"utf-8\")\n    declared = set(re.findall(r'android:name=\"(android\\.permission\\.[A-Z_]+)\"', text))\n\n    extra = declared - ALLOWED\n    if extra:\n        print(\"[FAIL] 超出权限白名单：\")\n        for p in sorted(extra):\n            print(f\"  - {p}\")\n        return 1\n\n    bad = [p for p in declared if any(h in p for h in FORBIDDEN_HINTS)]\n    if bad:\n        print(\"[FAIL] 命中禁止清单：\", bad)\n        return 1\n\n    # 前台服务类型必须与代码用途一致\n    for svc, need in (\n        (\"MediaDownloadService\", \"dataSync\"),\n        (\"AudioPlaybackService\", \"mediaPlayback\"),\n    ):\n        m = re.search(r'android:name=\"\\.player\\.' + svc + r'\"(.*?)/>', text, re.S)\n        if not m:\n            print(f\"[FAIL] 未声明服务 {svc}\")\n            return 1\n        if need not in m.group(1):\n            print(f\"[FAIL] {svc} foregroundServiceType 应为 {need}\")\n            return 1\n\n    print(f\"[OK] 权限门禁通过，已声明 {len(declared)} 项，均在白名单内\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "tools/ci.sh", "lang": "sh", "lines": 17, "content": "#!/usr/bin/env bash\n# 合规 + 架构门禁总入口。CI 与本地提交前均执行。\nset -euo pipefail\ncd \"$(dirname \"$0\")/..\"\n\nfail=0\nfor script in tools/check_permissions.py tools/check_disclaimer.py \\\n              tools/check_no_telemetry.py tools/check_contracts.py; do\n    echo \"== $script\"\n    python3 \"$script\" || fail=1\ndone\n\nif [ \"$fail\" -ne 0 ]; then\n    echo \"合规门禁未通过，禁止合并\"\n    exit 1\nfi\necho \"全部门禁通过\"\n"}]</script>

<script>
(function(){
  var FILES = JSON.parse(document.getElementById('srcData').textContent);
  var tree = document.getElementById('tree');
  var codePane = document.getElementById('codePane');
  var pathEl = document.getElementById('path');
  var fileStats = document.getElementById('fileStats');
  var resultsEl = document.getElementById('results');
  var searchMeta = document.getElementById('searchMeta');
  var searchInput = document.getElementById('search');
  var toastEl = document.getElementById('toast');
  var current = null;

  document.getElementById('statFiles').textContent = FILES.length;
  document.getElementById('statKt').textContent = FILES.filter(function(f){return f.lang==='kt';}).length;
  document.getElementById('statLines').textContent =
    FILES.reduce(function(a,f){return a+f.lines;},0).toLocaleString();

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var KW = /\b(package|import|fun|val|var|class|object|interface|data|enum|sealed|abstract|override|private|public|internal|protected|suspend|return|if|else|when|for|while|try|catch|finally|throw|is|as|in|out|null|true|false|this|super|const|companion|init|by|where|typealias|lateinit)\b/g;

  function highlight(src){
    var out = esc(src);
    out = out.replace(/(\/\/[^\n]*)/g, '<span style="color:var(--com)">$1</span>');
    out = out.replace(/(&quot;[^&]*?&quot;)/g, '<span style="color:var(--str)">$1</span>');
    out = out.replace(KW, '<span style="color:var(--kw)">$1</span>');
    out = out.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span style="color:var(--num)">$1</span>');
    return out;
  }

  function renderTree(){
    var html = '', lastDir = '';
    FILES.forEach(function(f){
      var dir = f.path.indexOf('/') >= 0 ? f.path.slice(0, f.path.lastIndexOf('/')) : '.';
      if (dir !== lastDir){ html += '<div class="dir">'+esc(dir)+'</div>'; lastDir = dir; }
      var name = f.path.slice(f.path.lastIndexOf('/')+1);
      html += '<div class="file" data-path="'+esc(f.path)+'">'+esc(name)+'</div>';
    });
    tree.innerHTML = html;
  }

  function show(file){
    current = file;
    pathEl.textContent = file.path;
    fileStats.textContent = file.lines + ' 行 · ' + file.lang;
    codePane.innerHTML = highlight(file.content);
    codePane.scrollTop = 0;
    resultsEl.classList.add('hidden');
    searchMeta.classList.add('hidden');
    codePane.classList.remove('hidden');
    Array.prototype.forEach.call(tree.querySelectorAll('.file'), function(el){
      el.classList.toggle('active', el.getAttribute('data-path') === file.path);
    });
  }

  tree.addEventListener('click', function(e){
    var el = e.target.closest('.file');
    if (!el) return;
    var p = el.getAttribute('data-path');
    var f = FILES.filter(function(x){return x.path===p;})[0];
    if (f) show(f);
  });

  var timer = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(timer); timer = setTimeout(runSearch, 160);
  });

  function runSearch(){
    var q = searchInput.value.trim();
    if (!q){ show(current || FILES[0]); return; }
    var lower = q.toLowerCase(), hits = [];
    FILES.forEach(function(f){
      f.content.split('\n').forEach(function(line, i){
        if (line.toLowerCase().indexOf(lower) >= 0){
          hits.push({path:f.path, line:i+1, text:line.trim().slice(0,200)});
        }
      });
      if (f.path.toLowerCase().indexOf(lower) >= 0){
        hits.push({path:f.path, line:0, text:'（文件名匹配）'});
      }
    });
    codePane.classList.add('hidden');
    resultsEl.classList.remove('hidden');
    searchMeta.classList.remove('hidden');
    searchMeta.textContent = hits.length + ' 处匹配';
    var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    resultsEl.innerHTML = hits.slice(0,400).map(function(h){
      var t = esc(h.text).replace(re, '<mark>$1</mark>');
      return '<div class="hit" data-path="'+esc(h.path)+'"><div class="hit-path">'
        + esc(h.path) + ' : ' + h.line + '</div><div class="hit-line">' + t + '</div></div>';
    }).join('');
  }

  resultsEl.addEventListener('click', function(e){
    var el = e.target.closest('.hit');
    if (!el) return;
    var p = el.getAttribute('data-path');
    var f = FILES.filter(function(x){return x.path===p;})[0];
    if (f) { searchInput.value=''; show(f); }
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    if (!current) return;
    var t = document.createElement('textarea');
    t.value = current.content;
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('已复制 ' + current.path); }
    catch(e){ toast('复制失败'); }
    document.body.removeChild(t);
  });

  document.getElementById('dlBtn').addEventListener('click', function(){
    var b64 = document.getElementById('zipData').textContent.trim();
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], {type:'application/zip'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lanyue-android-src.zip';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('ZIP 下载已开始');
  });

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  renderTree();
  if (FILES.length) show(FILES[0]);
})();
</script>
</body>
</html>
