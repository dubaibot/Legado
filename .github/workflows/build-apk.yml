name: Build ReadingD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_STORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/myreader.jks

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleAppRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC" \
            -Dorg.gradle.workers.max=2 -Pkotlin.compiler.execution.strategy=in-process \
            -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/myreader.jks \
            -PRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readingD-apk
          path: app/build/outputs/apk/app/release/*.apk
